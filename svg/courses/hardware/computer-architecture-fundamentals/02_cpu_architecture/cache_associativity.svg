<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="18.8889" y="44" font-size="26.4444" font-weight="bold" fill="var(--text)">Direct-mapped (1-way)</text>
  <text x="18.8889" y="80" font-size="22.6667" fill="var(--text-muted)">Each address maps to exactly one cache slot</text>
  <text x="18.8889" y="140" font-size="22.6667" fill="var(--text-muted)">Slots:</text>
  <rect x="94.4444" y="110" width="94.4444" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="141.6667" y="150" text-anchor="middle" font-size="24.5556" fill="var(--text)">0</text>
  <rect x="188.8889" y="110" width="94.4444" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="236.1111" y="150" text-anchor="middle" font-size="24.5556" fill="var(--text)">1</text>
  <rect x="283.3333" y="110" width="94.4444" height="60" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="330.5555" y="150" text-anchor="middle" font-size="24.5556" fill="var(--text)">2</text>
  <rect x="377.7778" y="110" width="94.4444" height="60" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="425" y="150" text-anchor="middle" font-size="24.5556" fill="var(--text)">3</text>
  <rect x="472.2222" y="110" width="94.4444" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="519.4444" y="150" text-anchor="middle" font-size="24.5556" fill="var(--text)">4</text>
  <rect x="566.6666" y="110" width="94.4444" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="613.8889" y="150" text-anchor="middle" font-size="24.5556" fill="var(--text)">5</text>
  <rect x="661.1111" y="110" width="94.4444" height="60" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="708.3333" y="150" text-anchor="middle" font-size="24.5556" fill="var(--text)">6</text>
  <rect x="755.5555" y="110" width="94.4444" height="60" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="802.7777" y="150" text-anchor="middle" font-size="24.5556" fill="var(--text)">7</text>
  <text x="18.8889" y="224" font-size="22.6667" fill="var(--text-muted)">Address 0x100 → always slot 0  (conflict if 0x200 also maps here)</text>
  <line x1="18.8889" y1="260" x2="1189.9999" y2="260" stroke="var(--border)" stroke-width="1.8889" />
  <text x="18.8889" y="304" font-size="26.4444" font-weight="bold" fill="var(--text)">Fully Associative</text>
  <text x="18.8889" y="340" font-size="22.6667" fill="var(--text-muted)">Any address can go in any slot – most flexible but expensive to search.</text>
  <line x1="18.8889" y1="372" x2="1189.9999" y2="372" stroke="var(--border)" stroke-width="1.8889" />
  <text x="18.8889" y="416" font-size="26.4444" font-weight="bold" fill="var(--text)">N-way Set Associative</text>
  <text x="18.8889" y="451.9999" font-size="22.6667" fill="var(--text-muted)">Each address maps to a SET of N slots (ways).</text>
  <rect x="56.6667" y="480" width="321.1111" height="110" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="217.2222" y="519.9999" text-anchor="middle" font-size="24.5556" font-weight="bold" fill="var(--text)">Set 0</text>
  <text x="217.2222" y="565.9999" text-anchor="middle" font-size="22.6667" fill="var(--text-muted)">Way0  Way1 … WayN</text>
  <rect x="434.4444" y="480" width="321.1111" height="110" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="595" y="519.9999" text-anchor="middle" font-size="24.5556" font-weight="bold" fill="var(--text)">Set 1</text>
  <text x="595" y="565.9999" text-anchor="middle" font-size="22.6667" fill="var(--text-muted)">Way0  Way1 … WayN</text>
  <rect x="812.2222" y="480" width="321.1111" height="110" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="972.7777" y="519.9999" text-anchor="middle" font-size="24.5556" font-weight="bold" fill="var(--text)">Set 2</text>
  <text x="972.7777" y="565.9999" text-anchor="middle" font-size="22.6667" fill="var(--text-muted)">Way0  Way1 … WayN</text>
  <text x="18.8889" y="640" font-size="22.6667" fill="var(--text-muted)">Modern L1: 8–12 way   L2: 8–16 way   L3: 12–20 way</text>
</svg>
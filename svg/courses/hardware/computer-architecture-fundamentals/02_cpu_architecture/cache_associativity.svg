<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <text x="20" y="46.5882" font-size="28" font-weight="bold" fill="#222222">Direct-mapped (1-way)</text>
  <text x="20" y="84.7059" font-size="24" fill="#555">Each address maps to exactly one cache slot</text>
  <text x="20" y="148.2353" font-size="24" fill="#555">Slots:</text>
  <rect x="100" y="116.4706" width="100" height="63.5294" rx="4" fill="#bbdefb" stroke="#333333" stroke-width="3" />
  <text x="150" y="158.8235" text-anchor="middle" font-size="26" fill="#222222">0</text>
  <rect x="200" y="116.4706" width="100" height="63.5294" rx="4" fill="#c8e6c9" stroke="#333333" stroke-width="3" />
  <text x="250" y="158.8235" text-anchor="middle" font-size="26" fill="#222222">1</text>
  <rect x="300" y="116.4706" width="100" height="63.5294" rx="4" fill="#ffe0b2" stroke="#333333" stroke-width="3" />
  <text x="350" y="158.8235" text-anchor="middle" font-size="26" fill="#222222">2</text>
  <rect x="400" y="116.4706" width="100" height="63.5294" rx="4" fill="#fce4ec" stroke="#333333" stroke-width="3" />
  <text x="450" y="158.8235" text-anchor="middle" font-size="26" fill="#222222">3</text>
  <rect x="500" y="116.4706" width="100" height="63.5294" rx="4" fill="#bbdefb" stroke="#333333" stroke-width="3" />
  <text x="550" y="158.8235" text-anchor="middle" font-size="26" fill="#222222">4</text>
  <rect x="600" y="116.4706" width="100" height="63.5294" rx="4" fill="#c8e6c9" stroke="#333333" stroke-width="3" />
  <text x="650" y="158.8235" text-anchor="middle" font-size="26" fill="#222222">5</text>
  <rect x="700" y="116.4706" width="100" height="63.5294" rx="4" fill="#ffe0b2" stroke="#333333" stroke-width="3" />
  <text x="750" y="158.8235" text-anchor="middle" font-size="26" fill="#222222">6</text>
  <rect x="800" y="116.4706" width="100" height="63.5294" rx="4" fill="#fce4ec" stroke="#333333" stroke-width="3" />
  <text x="850" y="158.8235" text-anchor="middle" font-size="26" fill="#222222">7</text>
  <text x="20" y="237.1765" font-size="24" fill="#555">Address 0x100 → always slot 0  (conflict if 0x200 also maps here)</text>
  <line x1="20" y1="275.2941" x2="1260" y2="275.2941" stroke="#ccc" stroke-width="2" />
  <text x="20" y="321.8824" font-size="28" font-weight="bold" fill="#222222">Fully Associative</text>
  <text x="20" y="360" font-size="24" fill="#555">Any address can go in any slot – most flexible but expensive to search.</text>
  <line x1="20" y1="393.8824" x2="1260" y2="393.8824" stroke="#ccc" stroke-width="2" />
  <text x="20" y="440.4706" font-size="28" font-weight="bold" fill="#222222">N-way Set Associative</text>
  <text x="20" y="478.5882" font-size="24" fill="#555">Each address maps to a SET of N slots (ways).</text>
  <rect x="60" y="508.2353" width="340" height="116.4706" rx="8" fill="#e3f2fd" stroke="#333333" stroke-width="3" />
  <text x="230" y="550.5882" text-anchor="middle" font-size="26" font-weight="bold" fill="#222222">Set 0</text>
  <text x="230" y="599.2941" text-anchor="middle" font-size="24" fill="#555">Way0  Way1 … WayN</text>
  <rect x="460" y="508.2353" width="340" height="116.4706" rx="8" fill="#e8f5e9" stroke="#333333" stroke-width="3" />
  <text x="630" y="550.5882" text-anchor="middle" font-size="26" font-weight="bold" fill="#222222">Set 1</text>
  <text x="630" y="599.2941" text-anchor="middle" font-size="24" fill="#555">Way0  Way1 … WayN</text>
  <rect x="860" y="508.2353" width="340" height="116.4706" rx="8" fill="#fff3e0" stroke="#333333" stroke-width="3" />
  <text x="1030" y="550.5882" text-anchor="middle" font-size="26" font-weight="bold" fill="#222222">Set 2</text>
  <text x="1030" y="599.2941" text-anchor="middle" font-size="24" fill="#555">Way0  Way1 … WayN</text>
  <text x="20" y="677.6471" font-size="24" fill="#555">Modern L1: 8–12 way   L2: 8–16 way   L3: 12–20 way</text>
</svg>
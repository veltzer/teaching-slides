<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="18.8889" y="44" font-size="26.4444" font-weight="bold" fill="#222222">Direct-mapped (1-way)</ns0:text>
  <ns0:text x="18.8889" y="80" font-size="22.6667" fill="#555">Each address maps to exactly one cache slot</ns0:text>
  <ns0:text x="18.8889" y="140" font-size="22.6667" fill="#555">Slots:</ns0:text>
  <ns0:rect x="94.4444" y="110" width="94.4444" height="60" rx="3.7778" fill="#bbdefb" stroke="#333333" stroke-width="2.8333" />
  <ns0:text x="141.6667" y="150" text-anchor="middle" font-size="24.5556" fill="#222222">0</ns0:text>
  <ns0:rect x="188.8889" y="110" width="94.4444" height="60" rx="3.7778" fill="#c8e6c9" stroke="#333333" stroke-width="2.8333" />
  <ns0:text x="236.1111" y="150" text-anchor="middle" font-size="24.5556" fill="#222222">1</ns0:text>
  <ns0:rect x="283.3333" y="110" width="94.4444" height="60" rx="3.7778" fill="#ffe0b2" stroke="#333333" stroke-width="2.8333" />
  <ns0:text x="330.5555" y="150" text-anchor="middle" font-size="24.5556" fill="#222222">2</ns0:text>
  <ns0:rect x="377.7778" y="110" width="94.4444" height="60" rx="3.7778" fill="#fce4ec" stroke="#333333" stroke-width="2.8333" />
  <ns0:text x="425" y="150" text-anchor="middle" font-size="24.5556" fill="#222222">3</ns0:text>
  <ns0:rect x="472.2222" y="110" width="94.4444" height="60" rx="3.7778" fill="#bbdefb" stroke="#333333" stroke-width="2.8333" />
  <ns0:text x="519.4444" y="150" text-anchor="middle" font-size="24.5556" fill="#222222">4</ns0:text>
  <ns0:rect x="566.6666" y="110" width="94.4444" height="60" rx="3.7778" fill="#c8e6c9" stroke="#333333" stroke-width="2.8333" />
  <ns0:text x="613.8889" y="150" text-anchor="middle" font-size="24.5556" fill="#222222">5</ns0:text>
  <ns0:rect x="661.1111" y="110" width="94.4444" height="60" rx="3.7778" fill="#ffe0b2" stroke="#333333" stroke-width="2.8333" />
  <ns0:text x="708.3333" y="150" text-anchor="middle" font-size="24.5556" fill="#222222">6</ns0:text>
  <ns0:rect x="755.5555" y="110" width="94.4444" height="60" rx="3.7778" fill="#fce4ec" stroke="#333333" stroke-width="2.8333" />
  <ns0:text x="802.7777" y="150" text-anchor="middle" font-size="24.5556" fill="#222222">7</ns0:text>
  <ns0:text x="18.8889" y="224" font-size="22.6667" fill="#555">Address 0x100 → always slot 0  (conflict if 0x200 also maps here)</ns0:text>
  <ns0:line x1="18.8889" y1="260" x2="1189.9999" y2="260" stroke="#ccc" stroke-width="1.8889" />
  <ns0:text x="18.8889" y="304" font-size="26.4444" font-weight="bold" fill="#222222">Fully Associative</ns0:text>
  <ns0:text x="18.8889" y="340" font-size="22.6667" fill="#555">Any address can go in any slot – most flexible but expensive to search.</ns0:text>
  <ns0:line x1="18.8889" y1="372" x2="1189.9999" y2="372" stroke="#ccc" stroke-width="1.8889" />
  <ns0:text x="18.8889" y="416" font-size="26.4444" font-weight="bold" fill="#222222">N-way Set Associative</ns0:text>
  <ns0:text x="18.8889" y="451.9999" font-size="22.6667" fill="#555">Each address maps to a SET of N slots (ways).</ns0:text>
  <ns0:rect x="56.6667" y="480" width="321.1111" height="110" rx="7.5556" fill="#e3f2fd" stroke="#333333" stroke-width="2.8333" />
  <ns0:text x="217.2222" y="519.9999" text-anchor="middle" font-size="24.5556" font-weight="bold" fill="#222222">Set 0</ns0:text>
  <ns0:text x="217.2222" y="565.9999" text-anchor="middle" font-size="22.6667" fill="#555">Way0  Way1 … WayN</ns0:text>
  <ns0:rect x="434.4444" y="480" width="321.1111" height="110" rx="7.5556" fill="#e8f5e9" stroke="#333333" stroke-width="2.8333" />
  <ns0:text x="595" y="519.9999" text-anchor="middle" font-size="24.5556" font-weight="bold" fill="#222222">Set 1</ns0:text>
  <ns0:text x="595" y="565.9999" text-anchor="middle" font-size="22.6667" fill="#555">Way0  Way1 … WayN</ns0:text>
  <ns0:rect x="812.2222" y="480" width="321.1111" height="110" rx="7.5556" fill="#fff3e0" stroke="#333333" stroke-width="2.8333" />
  <ns0:text x="972.7777" y="519.9999" text-anchor="middle" font-size="24.5556" font-weight="bold" fill="#222222">Set 2</ns0:text>
  <ns0:text x="972.7777" y="565.9999" text-anchor="middle" font-size="22.6667" fill="#555">Way0  Way1 … WayN</ns0:text>
  <ns0:text x="18.8889" y="640" font-size="22.6667" fill="#555">Modern L1: 8–12 way   L2: 8–16 way   L3: 12–20 way</ns0:text>
</ns0:svg>
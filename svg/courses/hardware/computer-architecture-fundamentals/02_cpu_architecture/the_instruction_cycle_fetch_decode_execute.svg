<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="228.5714" height="375.2941" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="154.2857" y="125.2941" text-anchor="middle" font-size="26.4443" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">FETCH</text>
  <text x="154.2857" y="203.7648" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)" font-family="Arial, sans-serif">Read instr</text>
  <text x="154.2857" y="261.7647" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)" font-family="Arial, sans-serif">from</text>
  <text x="154.2857" y="319.7647" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)" font-family="Arial, sans-serif">memory</text>
  <rect x="354.2857" y="40" width="228.5714" height="375.2941" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="468.5714" y="125.2941" text-anchor="middle" font-size="26.4443" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DECODE</text>
  <text x="468.5714" y="203.7648" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)" font-family="Arial, sans-serif">Identify</text>
  <text x="468.5714" y="261.7647" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)" font-family="Arial, sans-serif">opcode &amp;</text>
  <text x="468.5714" y="319.7647" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)" font-family="Arial, sans-serif">operands</text>
  <rect x="668.5714" y="40" width="228.5714" height="375.2941" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="782.8572" y="125.2941" text-anchor="middle" font-size="26.4443" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">EXECUTE</text>
  <text x="782.8572" y="203.7648" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)" font-family="Arial, sans-serif">Perform</text>
  <text x="782.8572" y="261.7647" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)" font-family="Arial, sans-serif">operation</text>
  <text x="782.8572" y="319.7647" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)" font-family="Arial, sans-serif">in ALU</text>
  <rect x="982.8572" y="40" width="257.1428" height="375.2941" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.4763" y="125.2941" text-anchor="middle" font-size="24.5554" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">WRITE-BACK</text>
  <text x="1110.4763" y="203.7648" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)" font-family="Arial, sans-serif">Store result</text>
  <text x="1110.4763" y="261.7647" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)" font-family="Arial, sans-serif">in register</text>
  <text x="1110.4763" y="319.7647" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)" font-family="Arial, sans-serif">or memory</text>
  <line x1="268.5714" y1="227.6471" x2="354.2857" y2="227.6471" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="582.8572" y1="227.6471" x2="668.5714" y2="227.6471" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="897.1429" y1="227.6471" x2="982.8572" y2="227.6471" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1110.4763" y1="415.2941" x2="1110.4763" y2="551.7646" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="1110.4763" y1="551.7646" x2="154.2857" y2="551.7646" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="154.2857" y1="551.7646" x2="154.2857" y2="415.2941" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="630.4762" y="620" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)" font-family="Arial, sans-serif">(next instruction)</text>
</svg>

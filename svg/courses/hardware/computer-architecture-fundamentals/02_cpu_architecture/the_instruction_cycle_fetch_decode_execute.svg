<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 20.5714 L 15.0588 10.2857 Z" fill="#555" />
    </marker>
    <marker id="arr5r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 15.0588 0 L 15.0588 20.5714 L 0 10.2857 Z" fill="#555" />
    </marker>
  </defs>
  <rect x="18.4933" y="67.3684" width="221.9195" height="370.5263" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="129.453" y="151.5789" text-anchor="middle" font-size="25.8906" font-weight="bold" fill="var(--text)">FETCH</text>
  <text x="129.453" y="229.0527" text-anchor="middle" font-size="22.1919" fill="var(--text-muted)">Read instr</text>
  <text x="129.453" y="286.3158" text-anchor="middle" font-size="22.1919" fill="var(--text-muted)">from</text>
  <text x="129.453" y="343.5789" text-anchor="middle" font-size="22.1919" fill="var(--text-muted)">memory</text>
  <rect x="323.6326" y="67.3684" width="221.9195" height="370.5263" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="434.5923" y="151.5789" text-anchor="middle" font-size="25.8906" font-weight="bold" fill="var(--text)">DECODE</text>
  <text x="434.5923" y="229.0527" text-anchor="middle" font-size="22.1919" fill="var(--text-muted)">Identify</text>
  <text x="434.5923" y="286.3158" text-anchor="middle" font-size="22.1919" fill="var(--text-muted)">opcode &amp;</text>
  <text x="434.5923" y="343.5789" text-anchor="middle" font-size="22.1919" fill="var(--text-muted)">operands</text>
  <rect x="628.7719" y="67.3684" width="221.9195" height="370.5263" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="739.7317" y="151.5789" text-anchor="middle" font-size="25.8906" font-weight="bold" fill="var(--text)">EXECUTE</text>
  <text x="739.7317" y="229.0527" text-anchor="middle" font-size="22.1919" fill="var(--text-muted)">Perform</text>
  <text x="739.7317" y="286.3158" text-anchor="middle" font-size="22.1919" fill="var(--text-muted)">operation</text>
  <text x="739.7317" y="343.5789" text-anchor="middle" font-size="22.1919" fill="var(--text-muted)">in ALU</text>
  <rect x="933.9112" y="67.3684" width="249.6594" height="370.5263" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1057.8163" y="151.5789" text-anchor="middle" font-size="24.0413" font-weight="bold" fill="var(--text)">WRITE-BACK</text>
  <text x="1057.8163" y="229.0527" text-anchor="middle" font-size="22.1919" fill="var(--text-muted)">Store result</text>
  <text x="1057.8163" y="286.3158" text-anchor="middle" font-size="22.1919" fill="var(--text-muted)">in register</text>
  <text x="1057.8163" y="343.5789" text-anchor="middle" font-size="22.1919" fill="var(--text-muted)">or memory</text>
  <line x1="240.4128" y1="252.6316" x2="323.6326" y2="252.6316" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr5)" />
  <line x1="545.5521" y1="252.6316" x2="628.7719" y2="252.6316" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr5)" />
  <line x1="850.6914" y1="252.6316" x2="933.9112" y2="252.6316" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr5)" />
  <line x1="1057.8163" y1="437.8947" x2="1057.8163" y2="572.6315" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="1057.8163" y1="572.6315" x2="129.453" y2="572.6315" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="129.453" y1="572.6315" x2="129.453" y2="437.8947" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr5)" />
  <text x="591.7853" y="640" text-anchor="middle" font-size="22.1919" fill="var(--text-muted)">(next instruction)</text>
</svg>
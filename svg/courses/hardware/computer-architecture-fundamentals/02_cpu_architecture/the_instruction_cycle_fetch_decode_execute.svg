<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 20.5714 L 15.0588 10.2857 Z" fill="#555" />
    </marker>
    <marker id="arr5r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 15.0588 0 L 15.0588 20.5714 L 0 10.2857 Z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="228.5714" height="375.2941" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="154.2857" y="125.2941" text-anchor="middle" font-size="26.4443" font-weight="bold" fill="var(--text)">FETCH</text>
  <text x="154.2857" y="203.7648" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)">Read instr</text>
  <text x="154.2857" y="261.7647" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)">from</text>
  <text x="154.2857" y="319.7647" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)">memory</text>
  <rect x="354.2857" y="40" width="228.5714" height="375.2941" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="468.5714" y="125.2941" text-anchor="middle" font-size="26.4443" font-weight="bold" fill="var(--text)">DECODE</text>
  <text x="468.5714" y="203.7648" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)">Identify</text>
  <text x="468.5714" y="261.7647" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)">opcode &amp;</text>
  <text x="468.5714" y="319.7647" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)">operands</text>
  <rect x="668.5714" y="40" width="228.5714" height="375.2941" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="782.8572" y="125.2941" text-anchor="middle" font-size="26.4443" font-weight="bold" fill="var(--text)">EXECUTE</text>
  <text x="782.8572" y="203.7648" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)">Perform</text>
  <text x="782.8572" y="261.7647" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)">operation</text>
  <text x="782.8572" y="319.7647" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)">in ALU</text>
  <rect x="982.8572" y="40" width="257.1428" height="375.2941" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.4763" y="125.2941" text-anchor="middle" font-size="24.5554" font-weight="bold" fill="var(--text)">WRITE-BACK</text>
  <text x="1110.4763" y="203.7648" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)">Store result</text>
  <text x="1110.4763" y="261.7647" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)">in register</text>
  <text x="1110.4763" y="319.7647" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)">or memory</text>
  <line x1="268.5714" y1="227.6471" x2="354.2857" y2="227.6471" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr5)" />
  <line x1="582.8572" y1="227.6471" x2="668.5714" y2="227.6471" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr5)" />
  <line x1="897.1429" y1="227.6471" x2="982.8572" y2="227.6471" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr5)" />
  <line x1="1110.4763" y1="415.2941" x2="1110.4763" y2="551.7646" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="1110.4763" y1="551.7646" x2="154.2857" y2="551.7646" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="154.2857" y1="551.7646" x2="154.2857" y2="415.2941" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr5)" />
  <text x="630.4762" y="620" text-anchor="middle" font-size="22.6665" fill="var(--text-muted)">(next instruction)</text>
</svg>
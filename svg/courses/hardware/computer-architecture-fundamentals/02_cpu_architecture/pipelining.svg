<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="40" y="40" font-size="24.6863" font-weight="bold" fill="var(--text)">Clock:</text>
  <text x="360.4188" y="40" text-anchor="middle" font-size="24.6863" fill="var(--text)">1</text>
  <text x="486.0732" y="40" text-anchor="middle" font-size="24.6863" fill="var(--text)">2</text>
  <text x="611.7278" y="40" text-anchor="middle" font-size="24.6863" fill="var(--text)">3</text>
  <text x="737.3822" y="40" text-anchor="middle" font-size="24.6863" fill="var(--text)">4</text>
  <text x="863.0366" y="40" text-anchor="middle" font-size="24.6863" fill="var(--text)">5</text>
  <text x="988.691" y="40" text-anchor="middle" font-size="24.6863" fill="var(--text)">6</text>
  <text x="1114.3454" y="40" text-anchor="middle" font-size="24.6863" fill="var(--text)">7</text>
  <text x="1240" y="40" text-anchor="middle" font-size="24.6863" fill="var(--text)">8</text>
  <text x="40" y="120.7326" font-size="24.6863" fill="var(--text)">Instr 1:</text>
  <rect x="301.7801" y="71.8681" width="115.1832" height="80.7327" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="358.3246" y="122.8572" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)">IF</text>
  <rect x="427.4345" y="71.8681" width="115.1832" height="80.7327" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="483.9791" y="122.8572" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)">ID</text>
  <rect x="553.089" y="71.8681" width="115.1832" height="80.7327" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="609.6334" y="122.8572" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)">EX</text>
  <rect x="678.7434" y="71.8681" width="115.1832" height="80.7327" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="735.2878" y="122.8572" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)">WB</text>
  <text x="40" y="237.5824" font-size="24.6863" fill="var(--text)">Instr 2:</text>
  <rect x="427.4345" y="188.718" width="115.1832" height="80.7327" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="483.9791" y="239.707" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)">IF</text>
  <rect x="553.089" y="188.718" width="115.1832" height="80.7327" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="609.6334" y="239.707" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)">ID</text>
  <rect x="678.7434" y="188.718" width="115.1832" height="80.7327" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="735.2878" y="239.707" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)">EX</text>
  <rect x="804.3979" y="188.718" width="115.1832" height="80.7327" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="860.9424" y="239.707" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)">WB</text>
  <text x="40" y="354.4323" font-size="24.6863" fill="var(--text)">Instr 3:</text>
  <rect x="553.089" y="305.5678" width="115.1832" height="80.7327" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="609.6334" y="356.5568" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)">IF</text>
  <rect x="678.7434" y="305.5678" width="115.1832" height="80.7327" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="735.2878" y="356.5568" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)">ID</text>
  <rect x="804.3979" y="305.5678" width="115.1832" height="80.7327" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="860.9424" y="356.5568" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)">EX</text>
  <rect x="930.0523" y="305.5678" width="115.1832" height="80.7327" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="986.5968" y="356.5568" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)">WB</text>
  <text x="40" y="471.2821" font-size="24.6863" fill="var(--text)">Instr 4:</text>
  <rect x="678.7434" y="422.4175" width="115.1832" height="80.7327" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="735.2878" y="473.4066" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)">IF</text>
  <rect x="804.3979" y="422.4175" width="115.1832" height="80.7327" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="860.9424" y="473.4066" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)">ID</text>
  <rect x="930.0523" y="422.4175" width="115.1832" height="80.7327" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="986.5968" y="473.4066" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)">EX</text>
  <rect x="1055.7067" y="422.4175" width="115.1832" height="80.7327" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1112.2512" y="473.4066" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)">WB</text>
  <text x="40" y="581.7583" font-size="22.7872" fill="var(--text-muted)">IF = Instruction Fetch</text>
  <text x="479.7905" y="581.7583" font-size="22.7872" fill="var(--text-muted)">ID = Instruction Decode</text>
  <text x="40" y="620" font-size="22.7872" fill="var(--text-muted)">EX = Execute</text>
  <text x="479.7905" y="620" font-size="22.7872" fill="var(--text-muted)">WB = Write Back</text>
</svg>
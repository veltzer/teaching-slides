<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="24.6863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Clock:</text>
  <text x="360.4188" y="40" text-anchor="middle" font-size="24.6863" fill="var(--text)" font-family="Arial, sans-serif">1</text>
  <text x="486.0732" y="40" text-anchor="middle" font-size="24.6863" fill="var(--text)" font-family="Arial, sans-serif">2</text>
  <text x="611.7278" y="40" text-anchor="middle" font-size="24.6863" fill="var(--text)" font-family="Arial, sans-serif">3</text>
  <text x="737.3822" y="40" text-anchor="middle" font-size="24.6863" fill="var(--text)" font-family="Arial, sans-serif">4</text>
  <text x="863.0366" y="40" text-anchor="middle" font-size="24.6863" fill="var(--text)" font-family="Arial, sans-serif">5</text>
  <text x="988.691" y="40" text-anchor="middle" font-size="24.6863" fill="var(--text)" font-family="Arial, sans-serif">6</text>
  <text x="1114.3454" y="40" text-anchor="middle" font-size="24.6863" fill="var(--text)" font-family="Arial, sans-serif">7</text>
  <text x="1240" y="40" text-anchor="middle" font-size="24.6863" fill="var(--text)" font-family="Arial, sans-serif">8</text>
  <text x="40" y="120.7326" font-size="24.6863" fill="var(--text)" font-family="Arial, sans-serif">Instr 1:</text>
  <rect x="301.7801" y="71.8681" width="115.1832" height="80.7327" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="358.3246" y="122.8572" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">IF</text>
  <rect x="427.4345" y="71.8681" width="115.1832" height="80.7327" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="483.9791" y="122.8572" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ID</text>
  <rect x="553.089" y="71.8681" width="115.1832" height="80.7327" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="609.6334" y="122.8572" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">EX</text>
  <rect x="678.7434" y="71.8681" width="115.1832" height="80.7327" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="735.2878" y="122.8572" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">WB</text>
  <text x="40" y="237.5824" font-size="24.6863" fill="var(--text)" font-family="Arial, sans-serif">Instr 2:</text>
  <rect x="427.4345" y="188.718" width="115.1832" height="80.7327" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="483.9791" y="239.707" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">IF</text>
  <rect x="553.089" y="188.718" width="115.1832" height="80.7327" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="609.6334" y="239.707" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ID</text>
  <rect x="678.7434" y="188.718" width="115.1832" height="80.7327" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="735.2878" y="239.707" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">EX</text>
  <rect x="804.3979" y="188.718" width="115.1832" height="80.7327" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="860.9424" y="239.707" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">WB</text>
  <text x="40" y="354.4323" font-size="24.6863" fill="var(--text)" font-family="Arial, sans-serif">Instr 3:</text>
  <rect x="553.089" y="305.5678" width="115.1832" height="80.7327" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="609.6334" y="356.5568" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">IF</text>
  <rect x="678.7434" y="305.5678" width="115.1832" height="80.7327" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="735.2878" y="356.5568" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ID</text>
  <rect x="804.3979" y="305.5678" width="115.1832" height="80.7327" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="860.9424" y="356.5568" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">EX</text>
  <rect x="930.0523" y="305.5678" width="115.1832" height="80.7327" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="986.5968" y="356.5568" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">WB</text>
  <text x="40" y="471.2821" font-size="24.6863" fill="var(--text)" font-family="Arial, sans-serif">Instr 4:</text>
  <rect x="678.7434" y="422.4175" width="115.1832" height="80.7327" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="735.2878" y="473.4066" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">IF</text>
  <rect x="804.3979" y="422.4175" width="115.1832" height="80.7327" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="860.9424" y="473.4066" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ID</text>
  <rect x="930.0523" y="422.4175" width="115.1832" height="80.7327" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="986.5968" y="473.4066" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">EX</text>
  <rect x="1055.7067" y="422.4175" width="115.1832" height="80.7327" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112.2512" y="473.4066" text-anchor="middle" font-size="24.6863" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">WB</text>
  <text x="40" y="581.7583" font-size="22.7872" fill="var(--text-muted)" font-family="Arial, sans-serif">IF = Instruction Fetch</text>
  <text x="479.7905" y="581.7583" font-size="22.7872" fill="var(--text-muted)" font-family="Arial, sans-serif">ID = Instruction Decode</text>
  <text x="40" y="620" font-size="22.7872" fill="var(--text-muted)" font-family="Arial, sans-serif">EX = Execute</text>
  <text x="479.7905" y="620" font-size="22.7872" fill="var(--text-muted)" font-family="Arial, sans-serif">WB = Write Back</text>
</svg>

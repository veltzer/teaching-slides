<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="336" height="158.1818" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208" y="105.9091" text-anchor="middle" font-size="30.8301" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Strongly</text>
  <text x="208" y="158.6364" text-anchor="middle" font-size="30.8301" fill="var(--text)" font-family="Arial, sans-serif">Not Taken</text>
  <rect x="904" y="40" width="336" height="158.1818" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1072" y="105.9091" text-anchor="middle" font-size="30.8301" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Strongly</text>
  <text x="1072" y="158.6364" text-anchor="middle" font-size="30.8301" fill="var(--text)" font-family="Arial, sans-serif">Taken</text>
  <rect x="40" y="461.8182" width="336" height="158.1818" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208" y="527.7273" text-anchor="middle" font-size="30.8301" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Weakly</text>
  <text x="208" y="575.1819" text-anchor="middle" font-size="30.8301" fill="var(--text)" font-family="Arial, sans-serif">Not Taken</text>
  <rect x="904" y="461.8182" width="336" height="158.1818" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1072" y="527.7273" text-anchor="middle" font-size="30.8301" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Weakly</text>
  <text x="1072" y="575.1819" text-anchor="middle" font-size="30.8301" fill="var(--text)" font-family="Arial, sans-serif">Taken</text>
  <line x1="376" y1="98" x2="904" y2="98" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="904" y1="140.1818" x2="376" y2="140.1818" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="640" y="82.1818" text-anchor="middle" font-size="26.0871" fill="var(--text-muted)" font-family="Arial, sans-serif">taken</text>
  <text x="640" y="177.0909" text-anchor="middle" font-size="26.0871" fill="var(--text-muted)" font-family="Arial, sans-serif">not taken</text>
  <line x1="376" y1="519.8183" x2="904" y2="519.8183" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="904" y1="562" x2="376" y2="562" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="640" y="509.2727" text-anchor="middle" font-size="26.0871" fill="var(--text-muted)" font-family="Arial, sans-serif">taken</text>
  <text x="640" y="604.1819" text-anchor="middle" font-size="26.0871" fill="var(--text-muted)" font-family="Arial, sans-serif">not taken</text>
  <line x1="208" y1="198.1818" x2="208" y2="461.8182" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="100.0001" y="343.1818" text-anchor="middle" font-size="26.0871" fill="var(--text-muted)" font-family="Arial, sans-serif">taken</text>
  <line x1="1072" y1="198.1818" x2="1072" y2="461.8182" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1203.9999" y="343.1818" text-anchor="middle" font-size="26.0871" fill="var(--text-muted)" font-family="Arial, sans-serif">not taken</text>
</svg>

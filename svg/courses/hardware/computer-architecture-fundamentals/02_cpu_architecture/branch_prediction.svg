<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr7" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 15.4286 L 18.2857 7.7143 Z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="336" height="158.1818" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208" y="105.9091" text-anchor="middle" font-size="30.8301" font-weight="bold" fill="var(--text)">Strongly</text>
  <text x="208" y="158.6364" text-anchor="middle" font-size="30.8301" fill="var(--text)">Not Taken</text>
  <rect x="904" y="40" width="336" height="158.1818" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1072" y="105.9091" text-anchor="middle" font-size="30.8301" font-weight="bold" fill="var(--text)">Strongly</text>
  <text x="1072" y="158.6364" text-anchor="middle" font-size="30.8301" fill="var(--text)">Taken</text>
  <rect x="40" y="461.8182" width="336" height="158.1818" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="208" y="527.7273" text-anchor="middle" font-size="30.8301" font-weight="bold" fill="var(--text)">Weakly</text>
  <text x="208" y="575.1819" text-anchor="middle" font-size="30.8301" fill="var(--text)">Not Taken</text>
  <rect x="904" y="461.8182" width="336" height="158.1818" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1072" y="527.7273" text-anchor="middle" font-size="30.8301" font-weight="bold" fill="var(--text)">Weakly</text>
  <text x="1072" y="575.1819" text-anchor="middle" font-size="30.8301" fill="var(--text)">Taken</text>
  <line x1="376" y1="98" x2="904" y2="98" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr7)" />
  <line x1="904" y1="140.1818" x2="376" y2="140.1818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr7)" />
  <text x="640" y="82.1818" text-anchor="middle" font-size="26.0871" fill="var(--text-muted)">taken</text>
  <text x="640" y="177.0909" text-anchor="middle" font-size="26.0871" fill="var(--text-muted)">not taken</text>
  <line x1="376" y1="519.8183" x2="904" y2="519.8183" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr7)" />
  <line x1="904" y1="562" x2="376" y2="562" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr7)" />
  <text x="640" y="509.2727" text-anchor="middle" font-size="26.0871" fill="var(--text-muted)">taken</text>
  <text x="640" y="604.1819" text-anchor="middle" font-size="26.0871" fill="var(--text-muted)">not taken</text>
  <line x1="208" y1="198.1818" x2="208" y2="461.8182" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr7)" />
  <text x="100.0001" y="343.1818" text-anchor="middle" font-size="26.0871" fill="var(--text-muted)">taken</text>
  <line x1="1072" y1="198.1818" x2="1072" y2="461.8182" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr7)" />
  <text x="1203.9999" y="343.1818" text-anchor="middle" font-size="26.0871" fill="var(--text-muted)">not taken</text>
</svg>
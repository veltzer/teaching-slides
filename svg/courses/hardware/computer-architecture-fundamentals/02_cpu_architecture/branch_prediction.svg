<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr7" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 15.4286 L 18.2857 7.7143 Z" fill="#555" />
    </marker>
  </defs>
  <rect x="68.2666" y="76.8" width="318.5778" height="153.6" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="227.5555" y="140.8" text-anchor="middle" font-size="29.5822" font-weight="bold" fill="var(--text)">Strongly</text>
  <text x="227.5555" y="192" text-anchor="middle" font-size="29.5822" fill="var(--text)">Not Taken</text>
  <rect x="887.4668" y="76.8" width="318.5778" height="153.6" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1046.7557" y="140.8" text-anchor="middle" font-size="29.5822" font-weight="bold" fill="var(--text)">Strongly</text>
  <text x="1046.7557" y="192" text-anchor="middle" font-size="29.5822" fill="var(--text)">Taken</text>
  <rect x="68.2666" y="486.4" width="318.5778" height="153.6" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="227.5555" y="550.4" text-anchor="middle" font-size="29.5822" font-weight="bold" fill="var(--text)">Weakly</text>
  <text x="227.5555" y="596.4801" text-anchor="middle" font-size="29.5822" fill="var(--text)">Not Taken</text>
  <rect x="887.4668" y="486.4" width="318.5778" height="153.6" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1046.7557" y="550.4" text-anchor="middle" font-size="29.5822" font-weight="bold" fill="var(--text)">Weakly</text>
  <text x="1046.7557" y="596.4801" text-anchor="middle" font-size="29.5822" fill="var(--text)">Taken</text>
  <line x1="386.8444" y1="133.12" x2="887.4668" y2="133.12" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr7)" />
  <line x1="887.4668" y1="174.08" x2="386.8444" y2="174.08" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr7)" />
  <text x="637.1556" y="117.76" text-anchor="middle" font-size="25.0312" fill="var(--text-muted)">taken</text>
  <text x="637.1556" y="209.92" text-anchor="middle" font-size="25.0312" fill="var(--text-muted)">not taken</text>
  <line x1="386.8444" y1="542.7201" x2="887.4668" y2="542.7201" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr7)" />
  <line x1="887.4668" y1="583.68" x2="386.8444" y2="583.68" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr7)" />
  <text x="637.1556" y="532.48" text-anchor="middle" font-size="25.0312" fill="var(--text-muted)">taken</text>
  <text x="637.1556" y="624.6401" text-anchor="middle" font-size="25.0312" fill="var(--text-muted)">not taken</text>
  <line x1="227.5555" y1="230.4" x2="227.5555" y2="486.4" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr7)" />
  <text x="125.1556" y="371.2" text-anchor="middle" font-size="25.0312" fill="var(--text-muted)">taken</text>
  <line x1="1046.7557" y1="230.4" x2="1046.7557" y2="486.4" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr7)" />
  <text x="1171.9112" y="371.2" text-anchor="middle" font-size="25.0312" fill="var(--text-muted)">not taken</text>
</svg>
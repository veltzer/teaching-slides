<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="24.1699" fill="var(--text-muted)" font-family="Arial, sans-serif">63</text>
  <text x="462.9508" y="40" font-size="24.1699" fill="var(--text-muted)" font-family="Arial, sans-serif">31</text>
  <text x="758.0327" y="40" font-size="24.1699" fill="var(--text-muted)" font-family="Arial, sans-serif">15</text>
  <text x="935.0819" y="40" font-size="24.1699" fill="var(--text-muted)" font-family="Arial, sans-serif">7</text>
  <text x="1053.1147" y="40" font-size="24.1699" fill="var(--text-muted)" font-family="Arial, sans-serif">0</text>
  <rect x="40" y="86.4" width="1200" height="510.4" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="266.2295" y="620" text-anchor="middle" font-size="24.1699" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">RAX (64-bit)</text>
  <rect x="492.459" y="132.7999" width="747.5409" height="394.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="767.8688" y="550.4" text-anchor="middle" font-size="24.1699" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">EAX (32-bit)</text>
  <rect x="767.8688" y="179.2" width="472.1311" height="301.6001" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="905.5737" y="541.12" text-anchor="middle" font-size="24.1699" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AX (16-bit)</text>
  <rect x="1003.9343" y="225.6" width="236.0656" height="208.8" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1121.9672" y="536.48" text-anchor="middle" font-size="24.1699" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AL (8-bit)</text>
  <text x="266.2295" y="318.3999" text-anchor="middle" font-size="26.184" fill="var(--text)" font-family="Arial, sans-serif">RAX</text>
  <text x="630.1639" y="318.3999" text-anchor="middle" font-size="26.184" fill="var(--text)" font-family="Arial, sans-serif">EAX</text>
  <text x="905.5737" y="309.12" text-anchor="middle" font-size="26.184" fill="var(--text)" font-family="Arial, sans-serif">AX</text>
  <text x="1121.9672" y="350.88" text-anchor="middle" font-size="26.184" fill="var(--text)" font-family="Arial, sans-serif">AL</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr0" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 10.8 L 16 5.4 Z" fill="#555" />
    </marker>
  </defs>
  <rect x="18.0944" y="16.285" width="1121.8547" height="537.4046" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="579.0218" y="55.369" text-anchor="middle" font-size="26.056" font-weight="bold" fill="var(--text)">CPU</text>
  <rect x="63.3305" y="81.4249" width="208.0859" height="113.9949" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="168.2782" y="127.0229" text-anchor="middle" font-size="21.1705" fill="var(--text)">Control Unit</text>
  <text x="168.2782" y="157.9644" text-anchor="middle" font-size="19.542" fill="var(--text-muted)">(CU)</text>
  <rect x="385.4114" y="81.4249" width="262.3692" height="113.9949" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="517.5007" y="127.0229" text-anchor="middle" font-size="21.1705" fill="var(--text)">ALU</text>
  <text x="517.5007" y="154.7074" text-anchor="middle" font-size="19.542" fill="var(--text-muted)">(Arithmetic Logic Unit)</text>
  <rect x="769.0133" y="81.4249" width="271.4165" height="113.9949" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="904.7215" y="127.0229" text-anchor="middle" font-size="21.1705" fill="var(--text)">Registers</text>
  <text x="904.7215" y="154.7074" text-anchor="middle" font-size="19.542" fill="var(--text-muted)">(Fast local storage)</text>
  <line x1="271.4165" y1="138.4224" x2="385.4114" y2="138.4224" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr0)" />
  <line x1="647.7806" y1="138.4224" x2="769.0133" y2="138.4224" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr0)" />
  <line x1="168.2782" y1="195.4198" x2="168.2782" y2="284.9873" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="517.5007" y1="195.4198" x2="517.5007" y2="284.9873" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="904.7215" y1="195.4198" x2="904.7215" y2="284.9873" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="168.2782" y1="284.9873" x2="904.7215" y2="284.9873" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="517.5007" y1="284.9873" x2="517.5007" y2="320.8142" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr0)" />
  <rect x="372.7453" y="320.8142" width="289.5109" height="48.855" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="517.5007" y="353.3842" text-anchor="middle" font-size="21.1705" fill="var(--text)">Internal Bus</text>
  <line x1="517.5007" y1="369.6692" x2="517.5007" y2="410.3817" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="180.9443" y1="410.3817" x2="922.8159" y2="410.3817" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="180.9443" y1="410.3817" x2="180.9443" y2="447.8372" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr0)" />
  <line x1="517.5007" y1="410.3817" x2="517.5007" y2="447.8372" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr0)" />
  <line x1="868.5327" y1="410.3817" x2="868.5327" y2="447.8372" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr0)" />
  <rect x="63.3305" y="447.8372" width="235.2276" height="65.1399" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="180.9443" y="488.5496" text-anchor="middle" font-size="21.1705" fill="var(--text)">L1 I-Cache</text>
  <rect x="381.7925" y="447.8372" width="271.4165" height="65.1399" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="517.5007" y="488.5496" text-anchor="middle" font-size="21.1705" fill="var(--text)">L1 D-Cache</text>
  <rect x="732.8244" y="447.8372" width="271.4165" height="65.1399" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="868.5327" y="488.5496" text-anchor="middle" font-size="21.1705" fill="var(--text)">Branch Pred.</text>
  <line x1="579.0218" y1="553.6896" x2="579.0218" y2="591.145" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr0)" />
  <rect x="434.2663" y="591.145" width="289.5109" height="48.855" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="579.0218" y="623.715" text-anchor="middle" font-size="21.1705" fill="var(--text)">External Bus</text>
</svg>
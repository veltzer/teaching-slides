<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arr16" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 12.7059 L 16.5161 6.3529 Z" fill="#555" />
    </marker>
  </defs>
  <text x="640.0002" y="40" text-anchor="middle" font-size="27.9962" font-weight="bold" fill="var(--text)">MESI Cache Coherence State Transitions</text>
  <rect x="40" y="457.2937" width="214.2855" height="95.7096" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.1429" y="514.7194" text-anchor="middle" font-size="31.9958" font-weight="bold" fill="var(--text)">I</text>
  <text x="147.1429" y="545.3466" text-anchor="middle" font-size="21.9972" fill="var(--text-muted)">Invalid</text>
  <rect x="1025.7145" y="457.2937" width="214.2855" height="95.7096" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1132.8574" y="514.7194" text-anchor="middle" font-size="31.9958" font-weight="bold" fill="var(--text)">S</text>
  <text x="1132.8574" y="545.3466" text-anchor="middle" font-size="21.9972" fill="var(--text-muted)">Shared</text>
  <rect x="40" y="112.7392" width="214.2855" height="95.7096" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.1429" y="170.1649" text-anchor="middle" font-size="31.9958" font-weight="bold" fill="var(--text)">E</text>
  <text x="147.1429" y="200.792" text-anchor="middle" font-size="21.9972" fill="var(--text-muted)">Exclusive</text>
  <rect x="1025.7145" y="112.7392" width="214.2855" height="95.7096" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1132.8574" y="170.1649" text-anchor="middle" font-size="31.9958" font-weight="bold" fill="var(--text)">M</text>
  <text x="1132.8574" y="200.792" text-anchor="middle" font-size="21.9972" fill="var(--text-muted)">Modified</text>
  <line x1="254.2859" y1="499.4059" x2="1025.7145" y2="499.4059" stroke="var(--text-muted)" stroke-width="0.9287" marker-end="url(#arr16)" />
  <text x="640.0002" y="487.9207" text-anchor="middle" font-size="21.9972" fill="var(--text-muted)">Read (shared)</text>
  <line x1="147.1429" y1="457.2937" x2="147.1429" y2="208.449" stroke="var(--text-muted)" stroke-width="0.9287" marker-end="url(#arr16)" />
  <text x="82.8574" y="342.4423" text-anchor="middle" font-size="21.9972" fill="var(--text-muted)" transform="rotate(-90,50,180)">Read hit / excl</text>
  <line x1="254.2859" y1="160.5941" x2="1025.7145" y2="160.5941" stroke="var(--text-muted)" stroke-width="0.9287" marker-end="url(#arr16)" />
  <text x="640.0002" y="149.1088" text-anchor="middle" font-size="21.9972" fill="var(--text-muted)">Write hit</text>
  <line x1="1132.8574" y1="208.449" x2="1132.8574" y2="457.2937" stroke="var(--text-muted)" stroke-width="0.9287" marker-end="url(#arr16)" />
  <text x="1240" y="342.4423" text-anchor="middle" font-size="19.9973" fill="var(--text-muted)" transform="rotate(90,590,180)">Other core reads (flush)</text>
  <line x1="1132.8574" y1="457.2937" x2="1132.8574" y2="218.0198" stroke="transparent" stroke-width="0" />
  <path d="M 1025.7145 480.264 Q 640.0002 380.7261 1025.7145 208.449" stroke="var(--text-muted)" stroke-width="0.9287" fill="none" stroke-dasharray="3.0956 1.8573" marker-end="url(#arr16)" />
  <text x="768.5715" y="371.1551" text-anchor="middle" font-size="21.9972" fill="var(--text-muted)">Write → invalidate others</text>
  <path d="M 254.2859 131.8811 Q 640.0002 74.4554 1025.7145 131.8811" stroke="var(--text-faint)" stroke-width="0.9287" fill="none" stroke-dasharray="3.0956 1.8573" marker-end="url(#arr16)" />
  <text x="640.0002" y="78.2839" text-anchor="middle" font-size="21.9972" fill="var(--text-faint)">Other core reads</text>
  <path d="M 1025.7145 543.4323 Q 640.0002 600.858 254.2859 543.4323" stroke="var(--danger-border)" stroke-width="0.9287" fill="none" stroke-dasharray="3.0956 1.8573" marker-end="url(#arr16)" />
  <text x="640.0002" y="620" text-anchor="middle" font-size="21.9972" fill="var(--danger-accent)">Invalidate received</text>
</svg>
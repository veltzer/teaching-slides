<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr16" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 12.7059 L 16.5161 6.3529 Z" fill="#555" />
    </marker>
  </defs>
  <text x="404.898" y="29.4742" text-anchor="middle" font-size="18.2857" font-weight="bold" fill="var(--text)">MESI Cache Coherence State Transitions</text>
  <rect x="39.1837" y="321.5366" width="130.6122" height="66.9868" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="104.4898" y="361.7287" text-anchor="middle" font-size="20.898" font-weight="bold" fill="var(--text)">I</text>
  <text x="104.4898" y="383.1645" text-anchor="middle" font-size="14.3674" fill="var(--text-muted)">Invalid</text>
  <rect x="640" y="321.5366" width="130.6122" height="66.9868" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="705.3061" y="361.7287" text-anchor="middle" font-size="20.898" font-weight="bold" fill="var(--text)">S</text>
  <text x="705.3061" y="383.1645" text-anchor="middle" font-size="14.3674" fill="var(--text-muted)">Shared</text>
  <rect x="39.1837" y="80.3841" width="130.6122" height="66.9868" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="104.4898" y="120.5762" text-anchor="middle" font-size="20.898" font-weight="bold" fill="var(--text)">E</text>
  <text x="104.4898" y="142.012" text-anchor="middle" font-size="14.3674" fill="var(--text-muted)">Exclusive</text>
  <rect x="640" y="80.3841" width="130.6122" height="66.9868" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="705.3061" y="120.5762" text-anchor="middle" font-size="20.898" font-weight="bold" fill="var(--text)">M</text>
  <text x="705.3061" y="142.012" text-anchor="middle" font-size="14.3674" fill="var(--text-muted)">Modified</text>
  <line x1="169.7959" y1="351.0108" x2="640" y2="351.0108" stroke="var(--text-muted)" stroke-width="1.9592" marker-end="url(#arr16)" />
  <text x="404.898" y="342.9724" text-anchor="middle" font-size="14.3674" fill="var(--text-muted)">Read (shared)</text>
  <line x1="104.4898" y1="321.5366" x2="104.4898" y2="147.371" stroke="var(--text-muted)" stroke-width="1.9592" marker-end="url(#arr16)" />
  <text x="65.3061" y="241.1525" text-anchor="middle" font-size="14.3674" fill="var(--text-muted)" transform="rotate(-90,50,180)">Read hit / excl</text>
  <line x1="169.7959" y1="113.8776" x2="640" y2="113.8776" stroke="var(--text-muted)" stroke-width="1.9592" marker-end="url(#arr16)" />
  <text x="404.898" y="105.8391" text-anchor="middle" font-size="14.3674" fill="var(--text-muted)">Write hit</text>
  <line x1="705.3061" y1="147.371" x2="705.3061" y2="321.5366" stroke="var(--text-muted)" stroke-width="1.9592" marker-end="url(#arr16)" />
  <text x="770.6122" y="241.1525" text-anchor="middle" font-size="13.0612" fill="var(--text-muted)" transform="rotate(90,590,180)">Other core reads (flush)</text>
  <line x1="705.3061" y1="321.5366" x2="705.3061" y2="154.0696" stroke="transparent" stroke-width="0" />
  <path d="M 640 337.6135 Q 404.898 267.9472 640 147.371" stroke="var(--text-muted)" stroke-width="1.9592" fill="none" stroke-dasharray="6.5306 3.9183" marker-end="url(#arr16)" />
  <text x="483.2653" y="261.2485" text-anchor="middle" font-size="14.3674" fill="var(--text-muted)">Write → invalidate others</text>
  <path d="M 169.7959 93.7815 Q 404.898 53.5894 640 93.7815" stroke="var(--text-faint)" stroke-width="1.9592" fill="none" stroke-dasharray="6.5306 3.9183" marker-end="url(#arr16)" />
  <text x="404.898" y="56.2689" text-anchor="middle" font-size="14.3674" fill="var(--text-faint)">Other core reads</text>
  <path d="M 640 381.8247 Q 404.898 422.0168 169.7959 381.8247" stroke="var(--danger-border)" stroke-width="1.9592" fill="none" stroke-dasharray="6.5306 3.9183" marker-end="url(#arr16)" />
  <text x="404.898" y="435.4142" text-anchor="middle" font-size="14.3674" fill="var(--danger-accent)">Invalidate received</text>
</svg>
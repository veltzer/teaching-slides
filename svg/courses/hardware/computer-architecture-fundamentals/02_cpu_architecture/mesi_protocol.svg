  <text x="440.6304" y="77.8011" text-anchor="middle" font-size="12.1838" fill="var(--text-faint)">Other core reads</text>
  <path d="M 640 353.8767 Q 440.6304 387.9601 241.2608 353.8767" stroke="var(--danger-border)" stroke-width="0.9287" fill="none" stroke-dasharray="3.0956 1.8573" marker-end="url(#arr16)" />
  <text x="440.6304" y="399.3213" text-anchor="middle" font-size="12.1838" fill="var(--danger-accent)">Invalidate received</text>

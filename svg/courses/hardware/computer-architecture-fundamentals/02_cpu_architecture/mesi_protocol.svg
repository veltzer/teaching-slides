  <text x="695.3805" y="355.0129" text-anchor="middle" font-size="12.1838" fill="var(--text-muted)">Shared</text>
  <rect x="130.4998" y="98.2511" width="110.7608" height="56.8057" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.377" />

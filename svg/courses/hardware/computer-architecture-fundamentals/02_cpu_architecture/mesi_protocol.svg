<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr16" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 12.7059 L 16.5161 6.3529 Z" fill="#555" />
    </marker>
  </defs>
  <text x="640.0001" y="80" text-anchor="middle" font-size="22.5227" font-weight="bold" fill="var(--text)">MESI Cache Coherence State Transitions</text>
  <rect x="189.5464" y="439.7359" width="160.8762" height="82.5083" rx="7.3903" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="269.9845" y="489.2409" text-anchor="middle" font-size="25.7403" font-weight="bold" fill="var(--text)">I</text>
  <text x="269.9845" y="515.6436" text-anchor="middle" font-size="17.6965" fill="var(--text-muted)">Invalid</text>
  <rect x="929.5773" y="439.7359" width="160.8762" height="82.5083" rx="7.3903" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1010.0155" y="489.2409" text-anchor="middle" font-size="25.7403" font-weight="bold" fill="var(--text)">S</text>
  <text x="1010.0155" y="515.6436" text-anchor="middle" font-size="17.6965" fill="var(--text-muted)">Shared</text>
  <rect x="189.5464" y="142.7062" width="160.8762" height="82.5083" rx="7.3903" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="269.9845" y="192.2112" text-anchor="middle" font-size="25.7403" font-weight="bold" fill="var(--text)">E</text>
  <text x="269.9845" y="218.6138" text-anchor="middle" font-size="17.6965" fill="var(--text-muted)">Exclusive</text>
  <rect x="929.5773" y="142.7062" width="160.8762" height="82.5083" rx="7.3903" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1010.0155" y="192.2112" text-anchor="middle" font-size="25.7403" font-weight="bold" fill="var(--text)">M</text>
  <text x="1010.0155" y="218.6138" text-anchor="middle" font-size="17.6965" fill="var(--text-muted)">Modified</text>
  <line x1="350.4227" y1="476.0396" x2="929.5773" y2="476.0396" stroke="var(--text-muted)" stroke-width="1.9592" marker-end="url(#arr16)" />
  <text x="640.0001" y="466.1386" text-anchor="middle" font-size="17.6965" fill="var(--text-muted)">Read (shared)</text>
  <line x1="269.9845" y1="439.7359" x2="269.9845" y2="225.2146" stroke="var(--text-muted)" stroke-width="1.9592" marker-end="url(#arr16)" />
  <text x="221.7216" y="340.7261" text-anchor="middle" font-size="17.6965" fill="var(--text-muted)" transform="rotate(-90,50,180)">Read hit / excl</text>
  <line x1="350.4227" y1="183.9604" x2="929.5773" y2="183.9604" stroke="var(--text-muted)" stroke-width="1.9592" marker-end="url(#arr16)" />
  <text x="640.0001" y="174.0593" text-anchor="middle" font-size="17.6965" fill="var(--text-muted)">Write hit</text>
  <line x1="1010.0155" y1="225.2146" x2="1010.0155" y2="439.7359" stroke="var(--text-muted)" stroke-width="1.9592" marker-end="url(#arr16)" />
  <text x="1090.4536" y="340.7261" text-anchor="middle" font-size="16.0876" fill="var(--text-muted)" transform="rotate(90,590,180)">Other core reads (flush)</text>
  <line x1="1010.0155" y1="439.7359" x2="1010.0155" y2="233.4653" stroke="transparent" stroke-width="0" />
  <path d="M 929.5773 459.538 Q 640.0001 373.7294 929.5773 225.2146" stroke="var(--text-muted)" stroke-width="1.9592" fill="none" stroke-dasharray="6.5306 3.9183" marker-end="url(#arr16)" />
  <text x="736.5258" y="365.4785" text-anchor="middle" font-size="17.6965" fill="var(--text-muted)">Write → invalidate others</text>
  <path d="M 350.4227 159.2079 Q 640.0001 109.7029 929.5773 159.2079" stroke="var(--text-faint)" stroke-width="1.9592" fill="none" stroke-dasharray="6.5306 3.9183" marker-end="url(#arr16)" />
  <text x="640.0001" y="113.0033" text-anchor="middle" font-size="17.6965" fill="var(--text-faint)">Other core reads</text>
  <path d="M 929.5773 513.9933 Q 640.0001 563.4983 350.4227 513.9933" stroke="var(--danger-border)" stroke-width="1.9592" fill="none" stroke-dasharray="6.5306 3.9183" marker-end="url(#arr16)" />
  <text x="640.0001" y="580" text-anchor="middle" font-size="17.6965" fill="var(--danger-accent)">Invalidate received</text>
</svg>
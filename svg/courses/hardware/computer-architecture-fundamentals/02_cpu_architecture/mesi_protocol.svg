<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <!-- PLACEHOLDERSVG — replace with real diagram -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.0002" y="40" text-anchor="middle" font-size="27.9962" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">MESI Cache Coherence State Transitions</text>
  <rect x="40" y="457.2937" width="214.2855" height="95.7096" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.1429" y="514.7194" text-anchor="middle" font-size="31.9958" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">I</text>
  <text x="147.1429" y="545.3466" text-anchor="middle" font-size="21.9972" fill="var(--text-muted)" font-family="Arial, sans-serif">Invalid</text>
  <rect x="1025.7145" y="457.2937" width="214.2855" height="95.7096" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1132.8574" y="514.7194" text-anchor="middle" font-size="31.9958" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">S</text>
  <text x="1132.8574" y="545.3466" text-anchor="middle" font-size="21.9972" fill="var(--text-muted)" font-family="Arial, sans-serif">Shared</text>
  <rect x="40" y="112.7392" width="214.2855" height="95.7096" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.1429" y="170.1649" text-anchor="middle" font-size="31.9958" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">E</text>
  <text x="147.1429" y="200.792" text-anchor="middle" font-size="21.9972" fill="var(--text-muted)" font-family="Arial, sans-serif">Exclusive</text>
  <rect x="1025.7145" y="112.7392" width="214.2855" height="95.7096" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1132.8574" y="170.1649" text-anchor="middle" font-size="31.9958" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">M</text>
  <text x="1132.8574" y="200.792" text-anchor="middle" font-size="21.9972" fill="var(--text-muted)" font-family="Arial, sans-serif">Modified</text>
  <line x1="254.2859" y1="499.4059" x2="1025.7145" y2="499.4059" stroke="var(--text-muted)" stroke-width="0.9287" marker-end="url(#arrow)"/>
  <text x="640.0002" y="487.9207" text-anchor="middle" font-size="21.9972" fill="var(--text-muted)" font-family="Arial, sans-serif">Read (shared)</text>
  <line x1="147.1429" y1="457.2937" x2="147.1429" y2="208.449" stroke="var(--text-muted)" stroke-width="0.9287" marker-end="url(#arrow)"/>
  <text x="82.8574" y="342.4423" text-anchor="middle" font-size="21.9972" fill="var(--text-muted)" transform="rotate(-90,50,180)" font-family="Arial, sans-serif">Read hit / excl</text>
  <line x1="254.2859" y1="160.5941" x2="1025.7145" y2="160.5941" stroke="var(--text-muted)" stroke-width="0.9287" marker-end="url(#arrow)"/>
  <text x="640.0002" y="149.1088" text-anchor="middle" font-size="21.9972" fill="var(--text-muted)" font-family="Arial, sans-serif">Write hit</text>
  <line x1="1132.8574" y1="208.449" x2="1132.8574" y2="457.2937" stroke="var(--text-muted)" stroke-width="0.9287" marker-end="url(#arrow)"/>
  <text x="1240" y="342.4423" text-anchor="middle" font-size="19.9973" fill="var(--text-muted)" transform="rotate(90,590,180)" font-family="Arial, sans-serif">Other core reads (flush)</text>
  <line x1="1132.8574" y1="457.2937" x2="1132.8574" y2="218.0198" stroke="transparent" stroke-width="0"/>
  <path d="M 1025.7145 480.264 Q 640.0002 380.7261 1025.7145 208.449" stroke="var(--text-muted)" stroke-width="0.9287" fill="none" stroke-dasharray="3.0956 1.8573" marker-end="url(#arrow)"/>
  <text x="768.5715" y="371.1551" text-anchor="middle" font-size="21.9972" fill="var(--text-muted)" font-family="Arial, sans-serif">Write → invalidate others</text>
  <path d="M 254.2859 131.8811 Q 640.0002 74.4554 1025.7145 131.8811" stroke="var(--text-faint)" stroke-width="0.9287" fill="none" stroke-dasharray="3.0956 1.8573" marker-end="url(#arrow)"/>
  <text x="640.0002" y="78.2839" text-anchor="middle" font-size="21.9972" fill="var(--text-faint)" font-family="Arial, sans-serif">Other core reads</text>
  <path d="M 1025.7145 543.4323 Q 640.0002 600.858 254.2859 543.4323" stroke="var(--danger-border)" stroke-width="0.9287" fill="none" stroke-dasharray="3.0956 1.8573" marker-end="url(#arrow)"/>
  <text x="640.0002" y="620" text-anchor="middle" font-size="21.9972" fill="var(--danger-accent)" font-family="Arial, sans-serif">Invalidate received</text>
</svg>

  <ns0:rect x="18.4127" y="22.8572" width="1141.5872" height="148.5714" rx="7.3651" fill="#e3f2fd" stroke="#333333" stroke-width="2.7619" />
  <ns0:text x="46.0317" y="82.2857" font-size="23.9365" font-weight="bold" fill="#222222">64-bit GP:</ns0:text>
  <ns0:text x="211.746" y="82.2857" font-size="23.9365" fill="#222222">RAX  RBX  RCX  RDX  RSI  RDI  RSP  RBP</ns0:text>
  <ns0:text x="211.746" y="141.7142" font-size="23.9365" fill="#222222">R8   R9   R10  R11  R12  R13  R14  R15</ns0:text>
  <ns0:rect x="18.4127" y="171.4286" width="1141.5872" height="148.5714" rx="7.3651" fill="#e8f5e9" stroke="#333333" stroke-width="2.7619" />
  <ns0:text x="46.0317" y="223.9999" font-size="23.9365" font-weight="bold" fill="#222222">Special:</ns0:text>
  <ns0:text x="211.746" y="223.9999" font-size="23.9365" fill="#222222">RIP (instruction pointer)</ns0:text>
  <ns0:text x="211.746" y="269.7142" font-size="23.9365" fill="#222222">RFLAGS (status flags)   RSP (stack pointer)</ns0:text>
  <ns0:rect x="18.4127" y="320" width="1141.5872" height="91.4285" rx="7.3651" fill="#fff3e0" stroke="#333333" stroke-width="2.7619" />
  <ns0:text x="46.0317" y="377.1428" font-size="23.9365" font-weight="bold" fill="#222222">Segment:</ns0:text>
  <ns0:text x="211.746" y="377.1428" font-size="23.9365" fill="#222222">CS  DS  SS  ES  FS  GS</ns0:text>
  <ns0:rect x="18.4127" y="411.4286" width="1141.5872" height="228.5714" rx="7.3651" fill="#fce4ec" stroke="#333333" stroke-width="2.7619" />
  <ns0:text x="46.0317" y="468.5714" font-size="23.9365" font-weight="bold" fill="#222222">Vector:</ns0:text>
  <ns0:text x="211.746" y="468.5714" font-size="23.9365" fill="#222222">XMM0–XMM15  (128-bit SSE)</ns0:text>
  <ns0:text x="211.746" y="521.1428" font-size="23.9365" fill="#222222">YMM0–YMM15  (256-bit AVX)</ns0:text>
  <ns0:text x="211.746" y="573.7142" font-size="23.9365" fill="#222222">ZMM0–ZMM31  (512-bit AVX-512)</ns0:text>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr10" markerWidth="16.5161" markerHeight="15.1579" refX="14.4516" refY="5.6842" orient="auto">
      <ns0:path d="M 0 0 L 0 11.3684 L 16.5161 5.6842 Z" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="20.5103" y="18.8236" width="1230.6136" height="282.3529" rx="7.5294" fill="#e3f2fd" stroke="#333333" stroke-width="2.8235" />
  <ns0:text x="635.817" y="60.2353" text-anchor="middle" font-size="26.3529" font-weight="bold" fill="#222222">CPU Core 0</ns0:text>
  <ns0:rect x="61.5307" y="84.7059" width="533.2659" height="103.5294" rx="7.5294" fill="#bbdefb" stroke="#333333" stroke-width="2.8235" />
  <ns0:text x="328.1636" y="126.1177" text-anchor="middle" font-size="24.4706" font-weight="bold" fill="#222222">L1 I-Cache</ns0:text>
  <ns0:text x="328.1636" y="163.7647" text-anchor="middle" font-size="22.5882" fill="#555">32 KB, ~1 ns</ns0:text>
  <ns0:rect x="635.817" y="84.7059" width="574.2863" height="103.5294" rx="7.5294" fill="#bbdefb" stroke="#333333" stroke-width="2.8235" />
  <ns0:text x="922.9602" y="126.1177" text-anchor="middle" font-size="24.4706" font-weight="bold" fill="#222222">L1 D-Cache</ns0:text>
  <ns0:text x="922.9602" y="163.7647" text-anchor="middle" font-size="22.5882" fill="#555">32–48 KB, ~1 ns</ns0:text>
  <ns0:rect x="61.5307" y="216.4706" width="1148.5726" height="65.8824" rx="7.5294" fill="#c8e6c9" stroke="#333333" stroke-width="2.8235" />
  <ns0:text x="635.817" y="250.353" text-anchor="middle" font-size="24.4706" font-weight="bold" fill="#222222">L2 Cache (Unified)  –  256 KB – 1.25 MB, ~3–5 ns</ns0:text>
  <ns0:line x1="635.817" y1="301.1765" x2="635.817" y2="348.2353" stroke="#555" stroke-width="2.8235" marker-end="url(#arr10)" />
  <ns0:rect x="20.5103" y="348.2353" width="1230.6136" height="94.1176" rx="7.5294" fill="#ffcc80" stroke="#333333" stroke-width="2.8235" />
  <ns0:text x="635.817" y="389.647" text-anchor="middle" font-size="24.4706" font-weight="bold" fill="#222222">L3 Cache (Shared across cores)</ns0:text>
  <ns0:text x="635.817" y="425.4118" text-anchor="middle" font-size="22.5882" fill="#555">8–96 MB, ~10–20 ns</ns0:text>
  <ns0:line x1="635.817" y1="442.353" x2="635.817" y2="489.4118" stroke="#555" stroke-width="2.8235" marker-end="url(#arr10)" />
  <ns0:rect x="20.5103" y="489.4118" width="1230.6136" height="94.1176" rx="7.5294" fill="#ffcc80" stroke="#333333" stroke-width="2.8235" />
  <ns0:text x="635.817" y="530.8236" text-anchor="middle" font-size="24.4706" font-weight="bold" fill="#222222">Main Memory (DRAM)</ns0:text>
  <ns0:text x="635.817" y="566.5883" text-anchor="middle" font-size="22.5882" fill="#555">8–512+ GB, ~50–100 ns</ns0:text>
  <ns0:text x="635.817" y="640" text-anchor="middle" font-size="22.5882" fill="#888">← smaller &amp; faster        larger &amp; slower →</ns0:text>
</ns0:svg>
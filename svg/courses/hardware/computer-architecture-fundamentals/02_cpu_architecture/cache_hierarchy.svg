<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 11.3684 L 16.5161 5.6842 Z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="263.6364" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="78.6666" text-anchor="middle" font-size="25.1458" font-weight="bold" fill="var(--text)">CPU Core 0</text>
  <rect x="79.9999" y="101.5151" width="520" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="339.9999" y="140.1818" text-anchor="middle" font-size="23.3497" font-weight="bold" fill="var(--text)">L1 I-Cache</text>
  <text x="339.9999" y="175.3333" text-anchor="middle" font-size="21.5535" fill="var(--text-muted)">32 KB, ~1 ns</text>
  <rect x="639.9999" y="101.5151" width="560" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="919.9999" y="140.1818" text-anchor="middle" font-size="23.3497" font-weight="bold" fill="var(--text)">L1 D-Cache</text>
  <text x="919.9999" y="175.3333" text-anchor="middle" font-size="21.5535" fill="var(--text-muted)">32–48 KB, ~1 ns</text>
  <rect x="79.9999" y="224.5454" width="1119.9999" height="61.5152" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="256.1818" text-anchor="middle" font-size="23.3497" font-weight="bold" fill="var(--text)">L2 Cache (Unified)  –  256 KB – 1.25 MB, ~3–5 ns</text>
  <line x1="639.9999" y1="303.6364" x2="639.9999" y2="347.5757" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr10)" />
  <rect x="40" y="347.5757" width="1200" height="87.8788" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="386.2423" text-anchor="middle" font-size="23.3497" font-weight="bold" fill="var(--text)">L3 Cache (Shared across cores)</text>
  <text x="639.9999" y="419.6364" text-anchor="middle" font-size="21.5535" fill="var(--text-muted)">8–96 MB, ~10–20 ns</text>
  <line x1="639.9999" y1="435.4546" x2="639.9999" y2="479.394" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr10)" />
  <rect x="40" y="479.394" width="1200" height="87.8788" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="518.0607" text-anchor="middle" font-size="23.3497" font-weight="bold" fill="var(--text)">Main Memory (DRAM)</text>
  <text x="639.9999" y="551.4546" text-anchor="middle" font-size="21.5535" fill="var(--text-muted)">8–512+ GB, ~50–100 ns</text>
  <text x="639.9999" y="620" text-anchor="middle" font-size="21.5535" fill="var(--text-faint)">← smaller &amp; faster        larger &amp; slower →</text>
</svg>
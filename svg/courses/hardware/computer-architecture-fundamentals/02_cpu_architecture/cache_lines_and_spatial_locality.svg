<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <text x="20" y="105.6" font-size="26" font-weight="bold" fill="#222222">Memory address: 0x1000</text>
  <text x="20" y="264" font-size="26" fill="#555">Cache line:</text>
  <rect x="200" y="168" width="140" height="168" rx="4" fill="#bbdefb" stroke="#333333" stroke-width="3" />
  <text x="270" y="273.6" text-anchor="middle" font-size="24" fill="#222222">byte 0</text>
  <rect x="340" y="168" width="140" height="168" rx="4" fill="#c8e6c9" stroke="#333333" stroke-width="3" />
  <text x="410" y="273.6" text-anchor="middle" font-size="24" fill="#222222">byte 1</text>
  <rect x="480" y="168" width="140" height="168" rx="4" fill="#ffe0b2" stroke="#333333" stroke-width="3" />
  <text x="550" y="273.6" text-anchor="middle" font-size="24" fill="#222222">byte 2</text>
  <rect x="620" y="168" width="140" height="168" rx="4" fill="#f0f4f8" stroke="#333333" stroke-width="3" />
  <text x="690" y="273.6" text-anchor="middle" font-size="24" fill="#555">...</text>
  <rect x="760" y="168" width="160" height="168" rx="4" fill="#fce4ec" stroke="#333333" stroke-width="3" />
  <text x="840" y="273.6" text-anchor="middle" font-size="24" fill="#222222">byte 63</text>
  <text x="270" y="422.4" text-anchor="middle" font-size="22" fill="#555">0x1000</text>
  <text x="410" y="422.4" text-anchor="middle" font-size="22" fill="#555">0x1001</text>
  <text x="550" y="422.4" text-anchor="middle" font-size="22" fill="#555">0x1002</text>
  <text x="840" y="422.4" text-anchor="middle" font-size="22" fill="#555">0x103F</text>
  <text x="20" y="552" font-size="24" fill="#555">When you access address 0x1010, the entire 64-byte line (0x1000–0x103F) is loaded into cache.</text>
</svg>
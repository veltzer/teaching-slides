<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="34.2212" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Memory address: 0x1000</text>
  <text x="40" y="245.8065" font-size="34.2212" fill="var(--text-muted)" font-family="Arial, sans-serif">Cache line:</text>
  <rect x="280" y="121.0753" width="186.6666" height="218.2795" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="373.3334" y="258.2795" text-anchor="middle" font-size="31.5887" fill="var(--text)" font-family="Arial, sans-serif">byte 0</text>
  <rect x="466.6667" y="121.0753" width="186.6666" height="218.2795" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="258.2795" text-anchor="middle" font-size="31.5887" fill="var(--text)" font-family="Arial, sans-serif">byte 1</text>
  <rect x="653.3333" y="121.0753" width="186.6666" height="218.2795" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="746.6666" y="258.2795" text-anchor="middle" font-size="31.5887" fill="var(--text)" font-family="Arial, sans-serif">byte 2</text>
  <rect x="840" y="121.0753" width="186.6666" height="218.2795" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="933.3333" y="258.2795" text-anchor="middle" font-size="31.5887" fill="var(--text-muted)" font-family="Arial, sans-serif">...</text>
  <rect x="1026.6666" y="121.0753" width="213.3334" height="218.2795" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1133.3333" y="258.2795" text-anchor="middle" font-size="31.5887" fill="var(--text)" font-family="Arial, sans-serif">byte 63</text>
  <text x="373.3334" y="451.6129" text-anchor="middle" font-size="28.9564" fill="var(--text-muted)" font-family="Arial, sans-serif">0x1000</text>
  <text x="560" y="451.6129" text-anchor="middle" font-size="28.9564" fill="var(--text-muted)" font-family="Arial, sans-serif">0x1001</text>
  <text x="746.6666" y="451.6129" text-anchor="middle" font-size="28.9564" fill="var(--text-muted)" font-family="Arial, sans-serif">0x1002</text>
  <text x="1133.3333" y="451.6129" text-anchor="middle" font-size="28.9564" fill="var(--text-muted)" font-family="Arial, sans-serif">0x103F</text>
  <text x="40" y="620" font-size="31.5887" fill="var(--text-muted)" font-family="Arial, sans-serif">When you access address 0x1010, the entire 64-byte line (0x1000–0x103F) is loaded into cache.</text>
</svg>

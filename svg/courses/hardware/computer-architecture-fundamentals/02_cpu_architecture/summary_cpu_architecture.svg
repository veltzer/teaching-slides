<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ns0:rect x="17.681" y="16.4103" width="1131.5894" height="623.5897" rx="6.5641" fill="var(--surface)" stroke="var(--text-dark)" stroke-width="2.4615" />
  <ns0:rect x="17.681" y="16.4103" width="1131.5894" height="62.359" rx="6.5641" fill="var(--text-muted)" stroke="var(--text-dark)" stroke-width="2.4615" />
  <ns0:text x="583.4758" y="57.4359" text-anchor="middle" font-size="24.6154" font-weight="bold" fill="var(--bg)">Modern CPU Overview</ns0:text>
  <ns0:rect x="44.2027" y="98.4615" width="512.7514" height="196.9231" rx="6.5641" fill="var(--primary-pale)" stroke="var(--text-dark)" stroke-width="2.4615" />
  <ns0:text x="300.5785" y="131.2821" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text-darker)">Core Components</ns0:text>
  <ns0:text x="61.8838" y="164.1026" font-size="19.6923" fill="var(--text-dark)">• ALU performs arithmetic/logic</ns0:text>
  <ns0:text x="61.8838" y="193.641" font-size="19.6923" fill="var(--text-dark)">• Registers: fastest storage</ns0:text>
  <ns0:text x="61.8838" y="223.1795" font-size="19.6923" fill="var(--text-dark)">  (sub-nanosecond access)</ns0:text>
  <ns0:text x="61.8838" y="252.7179" font-size="19.6923" fill="var(--text-dark)">• Control Unit: fetch-decode-execute</ns0:text>
  <ns0:rect x="609.9974" y="98.4615" width="512.7514" height="196.9231" rx="6.5641" fill="var(--ok-pale)" stroke="var(--text-dark)" stroke-width="2.4615" />
  <ns0:text x="866.3731" y="131.2821" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text-darker)">Performance Features</ns0:text>
  <ns0:text x="627.6785" y="164.1026" font-size="19.6923" fill="var(--text-dark)">• Pipelining: overlap stages</ns0:text>
  <ns0:text x="627.6785" y="193.641" font-size="19.6923" fill="var(--text-dark)">• Superscalar: multi instr/cycle</ns0:text>
  <ns0:text x="627.6785" y="223.1795" font-size="19.6923" fill="var(--text-dark)">• Out-of-Order: exec when ready</ns0:text>
  <ns0:text x="627.6785" y="252.7179" font-size="19.6923" fill="var(--text-dark)">• Branch Prediction: speculate</ns0:text>
  <ns0:rect x="44.2027" y="328.2051" width="512.7514" height="180.5128" rx="6.5641" fill="var(--warn-pale)" stroke="var(--text-dark)" stroke-width="2.4615" />
  <ns0:text x="300.5785" y="361.0256" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text-darker)">Memory Hierarchy</ns0:text>
  <ns0:text x="61.8838" y="393.8462" font-size="19.6923" fill="var(--text-dark)">• L1/L2/L3 caches bridge memory wall</ns0:text>
  <ns0:text x="61.8838" y="423.3846" font-size="19.6923" fill="var(--text-dark)">• Cache coherence (MESI) keeps</ns0:text>
  <ns0:text x="61.8838" y="452.9231" font-size="19.6923" fill="var(--text-dark)">  multi-core caches consistent</ns0:text>
  <ns0:text x="61.8838" y="482.4615" font-size="19.6923" fill="var(--text-dark)">• 64-byte cache lines, spatial locality</ns0:text>
  <ns0:rect x="609.9974" y="328.2051" width="512.7514" height="180.5128" rx="6.5641" fill="var(--danger-pale3)" stroke="var(--text-dark)" stroke-width="2.4615" />
  <ns0:text x="866.3731" y="361.0256" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text-darker)">ISA Families</ns0:text>
  <ns0:text x="627.6785" y="393.8462" font-size="19.6923" fill="var(--text-dark)">• CISC (x86): complex instructions,</ns0:text>
  <ns0:text x="627.6785" y="423.3846" font-size="19.6923" fill="var(--text-dark)">  huge legacy ecosystem</ns0:text>
  <ns0:text x="627.6785" y="456.2051" font-size="19.6923" fill="var(--text-dark)">• RISC (ARM): simple instructions,</ns0:text>
  <ns0:text x="627.6785" y="485.7436" font-size="19.6923" fill="var(--text-dark)">  power efficient, growing fast</ns0:text>
  <ns0:text x="583.4758" y="607.1795" text-anchor="middle" font-size="19.6923" fill="var(--text-muted)">Modern CPUs combine all these features for peak performance.</ns0:text>
</ns0:svg>
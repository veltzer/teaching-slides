<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="61.22222" rx="6.164414" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2.4615" />
  <text x="640.0001" y="80.277782" text-anchor="middle" font-size="25.116494" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Modern CPU Overview</text>
  <rect x="68.1251" y="120.555459" width="543.75" height="193.333333" rx="6.164414" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0002" y="152.777769" text-anchor="middle" font-size="21.767573" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Core Components</text>
  <text x="86.8751" y="184.999974" font-size="20.093113" fill="var(--text)" font-family="Arial, sans-serif">• ALU performs arithmetic/logic</text>
  <text x="86.8751" y="213.999989" font-size="20.093113" fill="var(--text)" font-family="Arial, sans-serif">• Registers: fastest storage</text>
  <text x="86.8751" y="243.000005" font-size="20.093113" fill="var(--text)" font-family="Arial, sans-serif">  (sub-nanosecond access)</text>
  <text x="86.8751" y="271.999916" font-size="20.093113" fill="var(--text)" font-family="Arial, sans-serif">• Control Unit: fetch-decode-execute</text>
  <rect x="668.1251" y="120.555459" width="543.75" height="193.333333" rx="6.164414" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940.0001" y="152.777769" text-anchor="middle" font-size="21.767573" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Performance Features</text>
  <text x="686.8751" y="184.999974" font-size="20.093113" fill="var(--text)" font-family="Arial, sans-serif">• Pipelining: overlap stages</text>
  <text x="686.8751" y="213.999989" font-size="20.093113" fill="var(--text)" font-family="Arial, sans-serif">• Superscalar: multi instr/cycle</text>
  <text x="686.8751" y="243.000005" font-size="20.093113" fill="var(--text)" font-family="Arial, sans-serif">• Out-of-Order: exec when ready</text>
  <text x="686.8751" y="271.999916" font-size="20.093113" fill="var(--text)" font-family="Arial, sans-serif">• Branch Prediction: speculate</text>
  <rect x="68.1251" y="346.111102" width="543.75" height="177.222178" rx="6.164414" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0002" y="378.333307" text-anchor="middle" font-size="21.767573" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Memory Hierarchy</text>
  <text x="86.8751" y="410.555617" font-size="20.093113" fill="var(--text)" font-family="Arial, sans-serif">• L1/L2/L3 caches bridge memory wall</text>
  <text x="86.8751" y="439.555527" font-size="20.093113" fill="var(--text)" font-family="Arial, sans-serif">• Cache coherence (MESI) keeps</text>
  <text x="86.8751" y="468.555543" font-size="20.093113" fill="var(--text)" font-family="Arial, sans-serif">  multi-core caches consistent</text>
  <text x="86.8751" y="497.555454" font-size="20.093113" fill="var(--text)" font-family="Arial, sans-serif">• 64-byte cache lines, spatial locality</text>
  <rect x="668.1251" y="346.111102" width="543.75" height="177.222178" rx="6.164414" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940.0001" y="378.333307" text-anchor="middle" font-size="21.767573" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">ISA Families</text>
  <text x="686.8751" y="410.555617" font-size="20.093113" fill="var(--text)" font-family="Arial, sans-serif">• CISC (x86): complex instructions,</text>
  <text x="686.8751" y="439.555527" font-size="20.093113" fill="var(--text)" font-family="Arial, sans-serif">  huge legacy ecosystem</text>
  <text x="686.8751" y="471.777732" font-size="20.093113" fill="var(--text)" font-family="Arial, sans-serif">• RISC (ARM): simple instructions,</text>
  <text x="686.8751" y="500.777748" font-size="20.093113" fill="var(--text)" font-family="Arial, sans-serif">  power efficient, growing fast</text>
  <text x="640.0001" y="620" text-anchor="middle" font-size="20.093113" fill="var(--text-muted)" font-family="Arial, sans-serif">Modern CPUs combine all these features for peak performance.</text>
</svg>
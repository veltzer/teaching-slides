<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <rect x="19.3939" y="18" width="1241.2121" height="684" rx="7.2" fill="#f0f4f8" stroke="#333333" stroke-width="2.7" />
  <rect x="19.3939" y="18" width="1241.2121" height="68.4" rx="7.2" fill="#37474f" stroke="#333333" stroke-width="2.7" />
  <text x="640" y="63" text-anchor="middle" font-size="27" font-weight="bold" fill="white">Modern CPU Overview</text>
  <rect x="48.4848" y="108" width="562.4242" height="216" rx="7.2" fill="#e3f2fd" stroke="#333333" stroke-width="2.7" />
  <text x="329.697" y="144" text-anchor="middle" font-size="23.4" font-weight="bold" fill="#222222">Core Components</text>
  <text x="67.8788" y="180" font-size="21.6" fill="#333">• ALU performs arithmetic/logic</text>
  <text x="67.8788" y="212.4" font-size="21.6" fill="#333">• Registers: fastest storage</text>
  <text x="67.8788" y="244.8" font-size="21.6" fill="#333">  (sub-nanosecond access)</text>
  <text x="67.8788" y="277.2" font-size="21.6" fill="#333">• Control Unit: fetch-decode-execute</text>
  <rect x="669.0909" y="108" width="562.4242" height="216" rx="7.2" fill="#e8f5e9" stroke="#333333" stroke-width="2.7" />
  <text x="950.303" y="144" text-anchor="middle" font-size="23.4" font-weight="bold" fill="#222222">Performance Features</text>
  <text x="688.4848" y="180" font-size="21.6" fill="#333">• Pipelining: overlap stages</text>
  <text x="688.4848" y="212.4" font-size="21.6" fill="#333">• Superscalar: multi instr/cycle</text>
  <text x="688.4848" y="244.8" font-size="21.6" fill="#333">• Out-of-Order: exec when ready</text>
  <text x="688.4848" y="277.2" font-size="21.6" fill="#333">• Branch Prediction: speculate</text>
  <rect x="48.4848" y="360" width="562.4242" height="198" rx="7.2" fill="#fff3e0" stroke="#333333" stroke-width="2.7" />
  <text x="329.697" y="396" text-anchor="middle" font-size="23.4" font-weight="bold" fill="#222222">Memory Hierarchy</text>
  <text x="67.8788" y="432" font-size="21.6" fill="#333">• L1/L2/L3 caches bridge memory wall</text>
  <text x="67.8788" y="464.4" font-size="21.6" fill="#333">• Cache coherence (MESI) keeps</text>
  <text x="67.8788" y="496.8" font-size="21.6" fill="#333">  multi-core caches consistent</text>
  <text x="67.8788" y="529.2" font-size="21.6" fill="#333">• 64-byte cache lines, spatial locality</text>
  <rect x="669.0909" y="360" width="562.4242" height="198" rx="7.2" fill="#fce4ec" stroke="#333333" stroke-width="2.7" />
  <text x="950.303" y="396" text-anchor="middle" font-size="23.4" font-weight="bold" fill="#222222">ISA Families</text>
  <text x="688.4848" y="432" font-size="21.6" fill="#333">• CISC (x86): complex instructions,</text>
  <text x="688.4848" y="464.4" font-size="21.6" fill="#333">  huge legacy ecosystem</text>
  <text x="688.4848" y="500.4" font-size="21.6" fill="#333">• RISC (ARM): simple instructions,</text>
  <text x="688.4848" y="532.8" font-size="21.6" fill="#333">  power efficient, growing fast</text>
  <text x="640" y="666" text-anchor="middle" font-size="21.6" fill="#555">Modern CPUs combine all these features for peak performance.</text>
</svg>
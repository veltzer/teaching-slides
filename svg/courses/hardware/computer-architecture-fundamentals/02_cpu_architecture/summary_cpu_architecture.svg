<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="61.22222" rx="6.164414" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2.4615" />
  <text x="640.0001" y="80.277782" text-anchor="middle" font-size="25.116494" font-weight="bold" fill="var(--bg)">Modern CPU Overview</text>
  <rect x="68.1251" y="120.555459" width="543.75" height="193.333333" rx="6.164414" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0002" y="152.777769" text-anchor="middle" font-size="21.767573" font-weight="bold" fill="var(--text)">Core Components</text>
  <text x="86.8751" y="184.999974" font-size="20.093113" fill="var(--text)">• ALU performs arithmetic/logic</text>
  <text x="86.8751" y="213.999989" font-size="20.093113" fill="var(--text)">• Registers: fastest storage</text>
  <text x="86.8751" y="243.000005" font-size="20.093113" fill="var(--text)">  (sub-nanosecond access)</text>
  <text x="86.8751" y="271.999916" font-size="20.093113" fill="var(--text)">• Control Unit: fetch-decode-execute</text>
  <rect x="668.1251" y="120.555459" width="543.75" height="193.333333" rx="6.164414" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940.0001" y="152.777769" text-anchor="middle" font-size="21.767573" font-weight="bold" fill="var(--text)">Performance Features</text>
  <text x="686.8751" y="184.999974" font-size="20.093113" fill="var(--text)">• Pipelining: overlap stages</text>
  <text x="686.8751" y="213.999989" font-size="20.093113" fill="var(--text)">• Superscalar: multi instr/cycle</text>
  <text x="686.8751" y="243.000005" font-size="20.093113" fill="var(--text)">• Out-of-Order: exec when ready</text>
  <text x="686.8751" y="271.999916" font-size="20.093113" fill="var(--text)">• Branch Prediction: speculate</text>
  <rect x="68.1251" y="346.111102" width="543.75" height="177.222178" rx="6.164414" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340.0002" y="378.333307" text-anchor="middle" font-size="21.767573" font-weight="bold" fill="var(--text)">Memory Hierarchy</text>
  <text x="86.8751" y="410.555617" font-size="20.093113" fill="var(--text)">• L1/L2/L3 caches bridge memory wall</text>
  <text x="86.8751" y="439.555527" font-size="20.093113" fill="var(--text)">• Cache coherence (MESI) keeps</text>
  <text x="86.8751" y="468.555543" font-size="20.093113" fill="var(--text)">  multi-core caches consistent</text>
  <text x="86.8751" y="497.555454" font-size="20.093113" fill="var(--text)">• 64-byte cache lines, spatial locality</text>
  <rect x="668.1251" y="346.111102" width="543.75" height="177.222178" rx="6.164414" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940.0001" y="378.333307" text-anchor="middle" font-size="21.767573" font-weight="bold" fill="var(--text)">ISA Families</text>
  <text x="686.8751" y="410.555617" font-size="20.093113" fill="var(--text)">• CISC (x86): complex instructions,</text>
  <text x="686.8751" y="439.555527" font-size="20.093113" fill="var(--text)">  huge legacy ecosystem</text>
  <text x="686.8751" y="471.777732" font-size="20.093113" fill="var(--text)">• RISC (ARM): simple instructions,</text>
  <text x="686.8751" y="500.777748" font-size="20.093113" fill="var(--text)">  power efficient, growing fast</text>
  <text x="640.0001" y="620" text-anchor="middle" font-size="20.093113" fill="var(--text-muted)">Modern CPUs combine all these features for peak performance.</text>
</svg>
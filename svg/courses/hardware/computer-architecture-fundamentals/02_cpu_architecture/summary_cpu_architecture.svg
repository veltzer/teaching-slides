<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="17.681" y="16.4103" width="1131.5894" height="623.5897" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="17.681" y="16.4103" width="1131.5894" height="62.359" rx="6" fill="var(--text-muted)" stroke="var(--text)" stroke-width="2.4615" />
  <text x="583.4758" y="57.4359" text-anchor="middle" font-size="24.6154" font-weight="bold" fill="var(--bg)">Modern CPU Overview</text>
  <rect x="44.2027" y="98.4615" width="512.7514" height="196.9231" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="300.5785" y="131.2821" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text)">Core Components</text>
  <text x="61.8838" y="164.1026" font-size="19.6923" fill="var(--text)">• ALU performs arithmetic/logic</text>
  <text x="61.8838" y="193.641" font-size="19.6923" fill="var(--text)">• Registers: fastest storage</text>
  <text x="61.8838" y="223.1795" font-size="19.6923" fill="var(--text)">  (sub-nanosecond access)</text>
  <text x="61.8838" y="252.7179" font-size="19.6923" fill="var(--text)">• Control Unit: fetch-decode-execute</text>
  <rect x="609.9974" y="98.4615" width="512.7514" height="196.9231" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="866.3731" y="131.2821" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text)">Performance Features</text>
  <text x="627.6785" y="164.1026" font-size="19.6923" fill="var(--text)">• Pipelining: overlap stages</text>
  <text x="627.6785" y="193.641" font-size="19.6923" fill="var(--text)">• Superscalar: multi instr/cycle</text>
  <text x="627.6785" y="223.1795" font-size="19.6923" fill="var(--text)">• Out-of-Order: exec when ready</text>
  <text x="627.6785" y="252.7179" font-size="19.6923" fill="var(--text)">• Branch Prediction: speculate</text>
  <rect x="44.2027" y="328.2051" width="512.7514" height="180.5128" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="300.5785" y="361.0256" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text)">Memory Hierarchy</text>
  <text x="61.8838" y="393.8462" font-size="19.6923" fill="var(--text)">• L1/L2/L3 caches bridge memory wall</text>
  <text x="61.8838" y="423.3846" font-size="19.6923" fill="var(--text)">• Cache coherence (MESI) keeps</text>
  <text x="61.8838" y="452.9231" font-size="19.6923" fill="var(--text)">  multi-core caches consistent</text>
  <text x="61.8838" y="482.4615" font-size="19.6923" fill="var(--text)">• 64-byte cache lines, spatial locality</text>
  <rect x="609.9974" y="328.2051" width="512.7514" height="180.5128" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="866.3731" y="361.0256" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text)">ISA Families</text>
  <text x="627.6785" y="393.8462" font-size="19.6923" fill="var(--text)">• CISC (x86): complex instructions,</text>
  <text x="627.6785" y="423.3846" font-size="19.6923" fill="var(--text)">  huge legacy ecosystem</text>
  <text x="627.6785" y="456.2051" font-size="19.6923" fill="var(--text)">• RISC (ARM): simple instructions,</text>
  <text x="627.6785" y="485.7436" font-size="19.6923" fill="var(--text)">  power efficient, growing fast</text>
  <text x="583.4758" y="607.1795" text-anchor="middle" font-size="19.6923" fill="var(--text-muted)">Modern CPUs combine all these features for peak performance.</text>
</svg>
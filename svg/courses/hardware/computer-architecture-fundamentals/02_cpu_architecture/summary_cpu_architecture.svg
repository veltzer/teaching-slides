<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="17.681" y="16.4103" width="1131.5894" height="623.5897" rx="6.5641" fill="#f5f5f5" stroke="#333333" stroke-width="2.4615" />
  <ns0:rect x="17.681" y="16.4103" width="1131.5894" height="62.359" rx="6.5641" fill="#555555" stroke="#333333" stroke-width="2.4615" />
  <ns0:text x="583.4758" y="57.4359" text-anchor="middle" font-size="24.6154" font-weight="bold" fill="white">Modern CPU Overview</ns0:text>
  <ns0:rect x="44.2027" y="98.4615" width="512.7514" height="196.9231" rx="6.5641" fill="#e3f2fd" stroke="#333333" stroke-width="2.4615" />
  <ns0:text x="300.5785" y="131.2821" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#222222">Core Components</ns0:text>
  <ns0:text x="61.8838" y="164.1026" font-size="19.6923" fill="#333">• ALU performs arithmetic/logic</ns0:text>
  <ns0:text x="61.8838" y="193.641" font-size="19.6923" fill="#333">• Registers: fastest storage</ns0:text>
  <ns0:text x="61.8838" y="223.1795" font-size="19.6923" fill="#333">  (sub-nanosecond access)</ns0:text>
  <ns0:text x="61.8838" y="252.7179" font-size="19.6923" fill="#333">• Control Unit: fetch-decode-execute</ns0:text>
  <ns0:rect x="609.9974" y="98.4615" width="512.7514" height="196.9231" rx="6.5641" fill="#e8f5e9" stroke="#333333" stroke-width="2.4615" />
  <ns0:text x="866.3731" y="131.2821" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#222222">Performance Features</ns0:text>
  <ns0:text x="627.6785" y="164.1026" font-size="19.6923" fill="#333">• Pipelining: overlap stages</ns0:text>
  <ns0:text x="627.6785" y="193.641" font-size="19.6923" fill="#333">• Superscalar: multi instr/cycle</ns0:text>
  <ns0:text x="627.6785" y="223.1795" font-size="19.6923" fill="#333">• Out-of-Order: exec when ready</ns0:text>
  <ns0:text x="627.6785" y="252.7179" font-size="19.6923" fill="#333">• Branch Prediction: speculate</ns0:text>
  <ns0:rect x="44.2027" y="328.2051" width="512.7514" height="180.5128" rx="6.5641" fill="#fff3e0" stroke="#333333" stroke-width="2.4615" />
  <ns0:text x="300.5785" y="361.0256" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#222222">Memory Hierarchy</ns0:text>
  <ns0:text x="61.8838" y="393.8462" font-size="19.6923" fill="#333">• L1/L2/L3 caches bridge memory wall</ns0:text>
  <ns0:text x="61.8838" y="423.3846" font-size="19.6923" fill="#333">• Cache coherence (MESI) keeps</ns0:text>
  <ns0:text x="61.8838" y="452.9231" font-size="19.6923" fill="#333">  multi-core caches consistent</ns0:text>
  <ns0:text x="61.8838" y="482.4615" font-size="19.6923" fill="#333">• 64-byte cache lines, spatial locality</ns0:text>
  <ns0:rect x="609.9974" y="328.2051" width="512.7514" height="180.5128" rx="6.5641" fill="#fce4ec" stroke="#333333" stroke-width="2.4615" />
  <ns0:text x="866.3731" y="361.0256" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#222222">ISA Families</ns0:text>
  <ns0:text x="627.6785" y="393.8462" font-size="19.6923" fill="#333">• CISC (x86): complex instructions,</ns0:text>
  <ns0:text x="627.6785" y="423.3846" font-size="19.6923" fill="#333">  huge legacy ecosystem</ns0:text>
  <ns0:text x="627.6785" y="456.2051" font-size="19.6923" fill="#333">• RISC (ARM): simple instructions,</ns0:text>
  <ns0:text x="627.6785" y="485.7436" font-size="19.6923" fill="#333">  power efficient, growing fast</ns0:text>
  <ns0:text x="583.4758" y="607.1795" text-anchor="middle" font-size="19.6923" fill="#555">Modern CPUs combine all these features for peak performance.</ns0:text>
</ns0:svg>
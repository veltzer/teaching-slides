<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 11.3684 L 17.0667 5.6842 Z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1158.6208" height="423.4921" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="619.3104" y="86.0317" text-anchor="middle" font-size="27.5913" font-weight="bold" fill="var(--text)">Control Unit</text>
  <rect x="102.069" y="122.8571" width="320.6897" height="128.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="263.4483" y="174.4127" text-anchor="middle" font-size="23.9125" fill="var(--text)">Instruction</text>
  <text x="263.4483" y="205.7143" text-anchor="middle" font-size="23.9125" fill="var(--text)">Register (IR)</text>
  <rect x="598.6207" y="122.8571" width="331.0345" height="128.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="764.138" y="174.4127" text-anchor="middle" font-size="23.9125" fill="var(--text)">Instruction</text>
  <text x="764.138" y="205.7143" text-anchor="middle" font-size="23.9125" fill="var(--text)">Decoder</text>
  <line x1="422.7587" y1="187.3015" x2="598.6207" y2="187.3015" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr4)" />
  <line x1="764.138" y1="251.746" x2="764.138" y2="306.9841" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr4)" />
  <rect x="598.6207" y="306.9841" width="331.0345" height="110.4762" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="764.138" y="353.0158" text-anchor="middle" font-size="23.9125" fill="var(--text)">Control Signal</text>
  <text x="764.138" y="386.1587" text-anchor="middle" font-size="23.9125" fill="var(--text)">Generator</text>
  <line x1="764.138" y1="417.4603" x2="764.138" y2="491.1111" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="226.2069" y1="491.1111" x2="1115.8622" y2="491.1111" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="226.2069" y1="491.1111" x2="226.2069" y2="546.3492" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr4)" />
  <line x1="764.138" y1="491.1111" x2="764.138" y2="546.3492" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr4)" />
  <line x1="1115.8622" y1="491.1111" x2="1115.8622" y2="546.3492" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr4)" />
  <rect x="91.7242" y="546.3492" width="268.9655" height="73.6508" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.2069" y="592.3809" text-anchor="middle" font-size="23.9125" fill="var(--text)">ALU</text>
  <rect x="608.9656" y="546.3492" width="310.3448" height="73.6508" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="764.138" y="592.3809" text-anchor="middle" font-size="23.9125" fill="var(--text)">Registers</text>
  <rect x="971.0345" y="546.3492" width="268.9655" height="73.6508" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.5173" y="592.3809" text-anchor="middle" font-size="23.9125" fill="var(--text)">Memory</text>
</svg>
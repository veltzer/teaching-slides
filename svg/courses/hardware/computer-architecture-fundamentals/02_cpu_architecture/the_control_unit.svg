<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1158.6208" height="423.4921" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="619.3104" y="86.0317" text-anchor="middle" font-size="27.5913" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Control Unit</text>
  <rect x="102.069" y="122.8571" width="320.6897" height="128.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="263.4483" y="174.4127" text-anchor="middle" font-size="23.9125" fill="var(--text)" font-family="Arial, sans-serif">Instruction</text>
  <text x="263.4483" y="205.7143" text-anchor="middle" font-size="23.9125" fill="var(--text)" font-family="Arial, sans-serif">Register (IR)</text>
  <rect x="598.6207" y="122.8571" width="331.0345" height="128.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="764.138" y="174.4127" text-anchor="middle" font-size="23.9125" fill="var(--text)" font-family="Arial, sans-serif">Instruction</text>
  <text x="764.138" y="205.7143" text-anchor="middle" font-size="23.9125" fill="var(--text)" font-family="Arial, sans-serif">Decoder</text>
  <line x1="422.7587" y1="187.3015" x2="598.6207" y2="187.3015" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="764.138" y1="251.746" x2="764.138" y2="306.9841" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="598.6207" y="306.9841" width="331.0345" height="110.4762" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="764.138" y="353.0158" text-anchor="middle" font-size="23.9125" fill="var(--text)" font-family="Arial, sans-serif">Control Signal</text>
  <text x="764.138" y="386.1587" text-anchor="middle" font-size="23.9125" fill="var(--text)" font-family="Arial, sans-serif">Generator</text>
  <line x1="764.138" y1="417.4603" x2="764.138" y2="491.1111" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="226.2069" y1="491.1111" x2="1115.8622" y2="491.1111" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="226.2069" y1="491.1111" x2="226.2069" y2="546.3492" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="764.138" y1="491.1111" x2="764.138" y2="546.3492" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1115.8622" y1="491.1111" x2="1115.8622" y2="546.3492" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="91.7242" y="546.3492" width="268.9655" height="73.6508" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.2069" y="592.3809" text-anchor="middle" font-size="23.9125" fill="var(--text)" font-family="Arial, sans-serif">ALU</text>
  <rect x="608.9656" y="546.3492" width="310.3448" height="73.6508" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="764.138" y="592.3809" text-anchor="middle" font-size="23.9125" fill="var(--text)" font-family="Arial, sans-serif">Registers</text>
  <rect x="971.0345" y="546.3492" width="268.9655" height="73.6508" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.5173" y="592.3809" text-anchor="middle" font-size="23.9125" fill="var(--text)" font-family="Arial, sans-serif">Memory</text>
</svg>

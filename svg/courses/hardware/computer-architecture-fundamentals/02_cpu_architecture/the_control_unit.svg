<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 11.3684 L 17.0667 5.6842 Z" fill="#555" />
    </marker>
  </defs>
  <rect x="21.3333" y="18.9474" width="1194.6667" height="435.7895" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="618.6667" y="66.3158" text-anchor="middle" font-size="28.4211" font-weight="bold" fill="var(--text)">Control Unit</text>
  <rect x="85.3333" y="104.2105" width="330.6667" height="132.6316" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="251.7333" y="157.2632" text-anchor="middle" font-size="24.6316" fill="var(--text)">Instruction</text>
  <text x="251.7333" y="189.4737" text-anchor="middle" font-size="24.6316" fill="var(--text)">Register (IR)</text>
  <rect x="597.3333" y="104.2105" width="341.3333" height="132.6316" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="768" y="157.2632" text-anchor="middle" font-size="24.6316" fill="var(--text)">Instruction</text>
  <text x="768" y="189.4737" text-anchor="middle" font-size="24.6316" fill="var(--text)">Decoder</text>
  <line x1="416" y1="170.5263" x2="597.3333" y2="170.5263" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr4)" />
  <line x1="768" y1="236.8421" x2="768" y2="293.6842" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr4)" />
  <rect x="597.3333" y="293.6842" width="341.3333" height="113.6842" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="768" y="341.0526" text-anchor="middle" font-size="24.6316" fill="var(--text)">Control Signal</text>
  <text x="768" y="375.1579" text-anchor="middle" font-size="24.6316" fill="var(--text)">Generator</text>
  <line x1="768" y1="407.3684" x2="768" y2="483.1579" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="213.3333" y1="483.1579" x2="1130.6667" y2="483.1579" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="213.3333" y1="483.1579" x2="213.3333" y2="540" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr4)" />
  <line x1="768" y1="483.1579" x2="768" y2="540" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr4)" />
  <line x1="1130.6667" y1="483.1579" x2="1130.6667" y2="540" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr4)" />
  <rect x="74.6667" y="540" width="277.3333" height="75.7895" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="213.3333" y="587.3684" text-anchor="middle" font-size="24.6316" fill="var(--text)">ALU</text>
  <rect x="608" y="540" width="320" height="75.7895" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="768" y="587.3684" text-anchor="middle" font-size="24.6316" fill="var(--text)">Registers</text>
  <rect x="981.3333" y="540" width="277.3333" height="75.7895" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1120" y="587.3684" text-anchor="middle" font-size="24.6316" fill="var(--text)">Memory</text>
</svg>
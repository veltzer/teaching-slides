<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Title row: two modes -->
  <rect x="68.125" y="58.125" width="553.125" height="39.875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="344.6875" y="83.5" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)" text-anchor="middle">Config Mode (Modern)</text>

  <rect x="658.75" y="58.125" width="553.125" height="39.875" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="935.3125" y="83.5" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)" text-anchor="middle">Module Mode (Legacy)</text>

  <!-- Config mode box -->
  <rect x="68.125" y="108.875" width="553.125" height="181.25" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="82.1875" y="130.625" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)">find_package(OpenSSL REQUIRED)</text>
  <text x="82.1875" y="150.5625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Searches for OpenSSLConfig.cmake or openssl-config.cmake</text>
  <text x="82.1875" y="170.5" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Search order:</text>
  <text x="100.9375" y="186.8125" font-family="monospace" font-size="11.0609" fill="var(--text)">1. CMAKE_PREFIX_PATH dirs</text>
  <text x="100.9375" y="203.125" font-family="monospace" font-size="11.0609" fill="var(--text)">2. &lt;Package&gt;_DIR variable</text>
  <text x="100.9375" y="219.4375" font-family="monospace" font-size="11.0609" fill="var(--text)">3. System default paths</text>
  <text x="82.1875" y="241.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Result: Imported target OpenSSL::SSL, OpenSSL::Crypto</text>
  <text x="82.1875" y="261.125" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">target_link_libraries(app PRIVATE OpenSSL::SSL)</text>
  <text x="82.1875" y="279.25" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">Includes, link flags, defines handled automatically</text>

  <!-- Module mode box -->
  <rect x="658.75" y="108.875" width="553.125" height="181.25" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="672.8125" y="130.625" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)">find_package(ZLIB MODULE REQUIRED)</text>
  <text x="672.8125" y="150.5625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Searches for FindZLIB.cmake in CMAKE_MODULE_PATH</text>
  <text x="672.8125" y="170.5" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Sets variables:</text>
  <text x="691.5625" y="186.8125" font-family="monospace" font-size="11.0609" fill="var(--text)">ZLIB_FOUND</text>
  <text x="691.5625" y="203.125" font-family="monospace" font-size="11.0609" fill="var(--text)">ZLIB_INCLUDE_DIRS</text>
  <text x="691.5625" y="219.4375" font-family="monospace" font-size="11.0609" fill="var(--text)">ZLIB_LIBRARIES</text>
  <text x="672.8125" y="241.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Usage (old style):</text>
  <text x="672.8125" y="261.125" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">target_include_directories(app PRIVATE ${ZLIB_INCLUDE_DIRS})</text>
  <text x="672.8125" y="279.25" font-family="monospace" font-size="11.0609" fill="var(--text-muted)">target_link_libraries(app PRIVATE ${ZLIB_LIBRARIES})</text>

  <!-- FetchContent -->
  <rect x="68.125" y="307.3438" width="768.75" height="154.0625" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="82.1875" y="329.0938" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--warn-accent)">FetchContent Workflow</text>
  <text x="82.1875" y="349.0312" font-family="monospace" font-size="11.0609" fill="var(--text)">include(FetchContent)</text>
  <text x="82.1875" y="365.3438" font-family="monospace" font-size="11.0609" fill="var(--text)">FetchContent_Declare(</text>
  <text x="100.9375" y="381.6562" font-family="monospace" font-size="11.0609" fill="var(--text)">  googletest</text>
  <text x="100.9375" y="397.9688" font-family="monospace" font-size="11.0609" fill="var(--text)">  GIT_REPOSITORY https://github.com/google/googletest.git</text>
  <text x="100.9375" y="414.2812" font-family="monospace" font-size="11.0609" fill="var(--text)">  GIT_TAG        v1.14.0</text>
  <text x="82.1875" y="430.5938" font-family="monospace" font-size="11.0609" fill="var(--text)">)</text>
  <text x="82.1875" y="446.9062" font-family="monospace" font-size="11.0609" fill="var(--text)">FetchContent_MakeAvailable(googletest)</text>

  <!-- CMAKE_PREFIX_PATH box -->
  <rect x="855.625" y="307.3438" width="356.25" height="154.0625" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="869.6875" y="329.0938" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--info-accent)">CMAKE_PREFIX_PATH</text>
  <text x="869.6875" y="349.0312" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Tell CMake where to search:</text>
  <text x="869.6875" y="367.1562" font-family="monospace" font-size="11.0609" fill="var(--text)">cmake -DCMAKE_PREFIX_PATH=</text>
  <text x="888.4375" y="383.4688" font-family="monospace" font-size="11.0609" fill="var(--text)">"/opt/mylibs;/usr/local"</text>
  <text x="869.6875" y="403.4062" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Or in CMakeLists.txt:</text>
  <text x="869.6875" y="421.5312" font-family="monospace" font-size="11.0609" fill="var(--text)">list(APPEND CMAKE_PREFIX_PATH</text>
  <text x="888.4375" y="437.8438" font-family="monospace" font-size="11.0609" fill="var(--text)">  "/opt/mylibs")</text>

  <!-- Bottom summary -->
  <rect x="68.125" y="478.625" width="1143.75" height="123.25" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <text x="640" y="500.375" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)" text-anchor="middle">Imported Targets vs Variables</text>

  <rect x="86.875" y="511.25" width="525" height="76.125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="349.375" y="529.375" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Modern: Imported Targets (preferred)</text>
  <text x="105.625" y="547.5" font-family="monospace" font-size="11.0609" fill="var(--text)">target_link_libraries(myapp PRIVATE Boost::filesystem)</text>
  <text x="105.625" y="563.8125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Transitive deps, usage requirements propagated automatically</text>
  <text x="105.625" y="580.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Includes + defines + link flags all in one target</text>

  <rect x="640" y="511.25" width="553.125" height="76.125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="916.5625" y="529.375" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Legacy: Variables (avoid for new code)</text>
  <text x="658.75" y="547.5" font-family="monospace" font-size="11.0609" fill="var(--text)">target_link_libraries(myapp ${ZLIB_LIBRARIES})</text>
  <text x="658.75" y="563.8125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Manual include_directories needed separately</text>
  <text x="658.75" y="580.125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">No transitive dependency propagation</text>
</svg>

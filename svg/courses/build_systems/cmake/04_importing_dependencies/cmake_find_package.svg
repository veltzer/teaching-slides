<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  

    <!-- Gradients -->






    <!-- Drop shadow -->

    <!-- Arrow markers -->
  
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Title row: two modes -->
  <rect x="30" y="20" width="590" height="44" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="325" y="48" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Config Mode (Modern)</text>

  <rect x="660" y="20" width="590" height="44" rx="6" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="955" y="48" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Module Mode (Legacy)</text>

  <!-- Config mode box -->
  <rect x="30" y="76" width="590" height="200" rx="5" fill="#e3f2fd" filter="url(#shadow)"/>
  <text x="45" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1565c0">find_package(OpenSSL REQUIRED)</text>
  <text x="45" y="122" font-family="Arial, sans-serif" font-size="12" fill="#333333">Searches for OpenSSLConfig.cmake or openssl-config.cmake</text>
  <text x="45" y="144" font-family="Arial, sans-serif" font-size="12" fill="#333333">Search order:</text>
  <text x="65" y="162" font-family="monospace" font-size="12" fill="#333333">1. CMAKE_PREFIX_PATH dirs</text>
  <text x="65" y="180" font-family="monospace" font-size="12" fill="#333333">2. &lt;Package&gt;_DIR variable</text>
  <text x="65" y="198" font-family="monospace" font-size="12" fill="#333333">3. System default paths</text>
  <text x="45" y="222" font-family="Arial, sans-serif" font-size="12" fill="#333333">Result: Imported target OpenSSL::SSL, OpenSSL::Crypto</text>
  <text x="45" y="244" font-family="monospace" font-size="12" fill="#555555">target_link_libraries(app PRIVATE OpenSSL::SSL)</text>
  <text x="45" y="264" font-family="Arial, sans-serif" font-size="11" fill="#888888">Includes, link flags, defines handled automatically</text>

  <!-- Module mode box -->
  <rect x="660" y="76" width="590" height="200" rx="5" fill="#e8f5e9" filter="url(#shadow)"/>
  <text x="675" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">find_package(ZLIB MODULE REQUIRED)</text>
  <text x="675" y="122" font-family="Arial, sans-serif" font-size="12" fill="#333333">Searches for FindZLIB.cmake in CMAKE_MODULE_PATH</text>
  <text x="675" y="144" font-family="Arial, sans-serif" font-size="12" fill="#333333">Sets variables:</text>
  <text x="695" y="162" font-family="monospace" font-size="12" fill="#333333">ZLIB_FOUND</text>
  <text x="695" y="180" font-family="monospace" font-size="12" fill="#333333">ZLIB_INCLUDE_DIRS</text>
  <text x="695" y="198" font-family="monospace" font-size="12" fill="#333333">ZLIB_LIBRARIES</text>
  <text x="675" y="222" font-family="Arial, sans-serif" font-size="12" fill="#333333">Usage (old style):</text>
  <text x="675" y="244" font-family="monospace" font-size="12" fill="#555555">target_include_directories(app PRIVATE ${ZLIB_INCLUDE_DIRS})</text>
  <text x="675" y="264" font-family="monospace" font-size="12" fill="#555555">target_link_libraries(app PRIVATE ${ZLIB_LIBRARIES})</text>

  <!-- FetchContent -->
  <rect x="30" y="295" width="820" height="170" rx="5" fill="#fff3e0" filter="url(#shadow)"/>
  <text x="45" y="319" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#e65100">FetchContent Workflow</text>
  <text x="45" y="341" font-family="monospace" font-size="12" fill="#333333">include(FetchContent)</text>
  <text x="45" y="359" font-family="monospace" font-size="12" fill="#333333">FetchContent_Declare(</text>
  <text x="65" y="377" font-family="monospace" font-size="12" fill="#333333">  googletest</text>
  <text x="65" y="395" font-family="monospace" font-size="12" fill="#333333">  GIT_REPOSITORY https://github.com/google/googletest.git</text>
  <text x="65" y="413" font-family="monospace" font-size="12" fill="#333333">  GIT_TAG        v1.14.0</text>
  <text x="45" y="431" font-family="monospace" font-size="12" fill="#333333">)</text>
  <text x="45" y="449" font-family="monospace" font-size="12" fill="#333333">FetchContent_MakeAvailable(googletest)</text>

  <!-- CMAKE_PREFIX_PATH box -->
  <rect x="870" y="295" width="380" height="170" rx="5" fill="#f3e5f5" filter="url(#shadow)"/>
  <text x="885" y="319" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#6a1b9a">CMAKE_PREFIX_PATH</text>
  <text x="885" y="341" font-family="Arial, sans-serif" font-size="12" fill="#333333">Tell CMake where to search:</text>
  <text x="885" y="361" font-family="monospace" font-size="12" fill="#333333">cmake -DCMAKE_PREFIX_PATH=</text>
  <text x="905" y="379" font-family="monospace" font-size="12" fill="#333333">"/opt/mylibs;/usr/local"</text>
  <text x="885" y="401" font-family="Arial, sans-serif" font-size="12" fill="#333333">Or in CMakeLists.txt:</text>
  <text x="885" y="421" font-family="monospace" font-size="12" fill="#333333">list(APPEND CMAKE_PREFIX_PATH</text>
  <text x="905" y="439" font-family="monospace" font-size="12" fill="#333333">  "/opt/mylibs")</text>

  <!-- Bottom summary -->
  <rect x="30" y="484" width="1220" height="136" rx="6" fill="#f5f5f5" filter="url(#shadow)"/>
  <text x="640" y="508" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Imported Targets vs Variables</text>

  <rect x="50" y="520" width="560" height="84" rx="4" fill="#e3f2fd"/>
  <text x="330" y="540" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1565c0" text-anchor="middle">Modern: Imported Targets (preferred)</text>
  <text x="70" y="560" font-family="monospace" font-size="12" fill="#333333">target_link_libraries(myapp PRIVATE Boost::filesystem)</text>
  <text x="70" y="578" font-family="Arial, sans-serif" font-size="12" fill="#555555">Transitive deps, usage requirements propagated automatically</text>
  <text x="70" y="596" font-family="Arial, sans-serif" font-size="12" fill="#555555">Includes + defines + link flags all in one target</text>

  <rect x="640" y="520" width="590" height="84" rx="4" fill="#e8f5e9"/>
  <text x="935" y="540" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">Legacy: Variables (avoid for new code)</text>
  <text x="660" y="560" font-family="monospace" font-size="12" fill="#333333">target_link_libraries(myapp ${ZLIB_LIBRARIES})</text>
  <text x="660" y="578" font-family="Arial, sans-serif" font-size="12" fill="#555555">Manual include_directories needed separately</text>
  <text x="660" y="596" font-family="Arial, sans-serif" font-size="12" fill="#555555">No transitive dependency propagation</text>
</svg>

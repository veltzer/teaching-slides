<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="580" height="45" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--primary-text)">Config Mode (Modern)</text>

  <rect x="660" y="40" width="580" height="45" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--ok-text)">Module Mode (Legacy)</text>

  <rect x="40" y="95" width="580" height="200" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="55" y="120" font-family="Courier New, monospace" font-size="13" font-weight="bold" fill="var(--primary-text)">find_package(OpenSSL REQUIRED)</text>
  <text x="55" y="150" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">Looks for OpenSSLConfig.cmake</text>
  <text x="55" y="180" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">Search: CMAKE_PREFIX_PATH, _DIR</text>
  <text x="55" y="215" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">Provides imported targets</text>
  <text x="55" y="245" font-family="Courier New, monospace" font-size="12" fill="var(--primary-text)">target_link_libraries(app OpenSSL::SSL)</text>
  <text x="55" y="275" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-text)">Flags propagated automatically</text>

  <rect x="660" y="95" width="580" height="200" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="675" y="120" font-family="Courier New, monospace" font-size="13" font-weight="bold" fill="var(--ok-text)">find_package(ZLIB MODULE)</text>
  <text x="675" y="150" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Looks for FindZLIB.cmake</text>
  <text x="675" y="180" font-family="Courier New, monospace" font-size="12" fill="var(--ok-text)">ZLIB_FOUND</text>
  <text x="675" y="200" font-family="Courier New, monospace" font-size="12" fill="var(--ok-text)">ZLIB_INCLUDE_DIRS</text>
  <text x="675" y="220" font-family="Courier New, monospace" font-size="12" fill="var(--ok-text)">ZLIB_LIBRARIES</text>
  <text x="675" y="255" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Use with include_directories</text>
  <text x="675" y="280" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-text)">Manual plumbing needed</text>

  <rect x="40" y="310" width="806" height="160" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="55" y="335" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-text)">FetchContent</text>
  <text x="55" y="360" font-family="Courier New, monospace" font-size="12" fill="var(--warn-text)">include(FetchContent)</text>
  <text x="55" y="385" font-family="Courier New, monospace" font-size="12" fill="var(--warn-text)">FetchContent_Declare(googletest</text>
  <text x="55" y="410" font-family="Courier New, monospace" font-size="12" fill="var(--warn-text)">  GIT_REPOSITORY .../googletest.git</text>
  <text x="55" y="435" font-family="Courier New, monospace" font-size="12" fill="var(--warn-text)">  GIT_TAG v1.14.0)</text>
  <text x="55" y="460" font-family="Courier New, monospace" font-size="12" fill="var(--warn-text)">FetchContent_MakeAvailable(googletest)</text>

  <rect x="866" y="310" width="374" height="160" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="881" y="335" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-text)">CMAKE_PREFIX_PATH</text>
  <text x="881" y="360" font-family="Arial, sans-serif" font-size="12" fill="var(--info-text)">Tell CMake where to look</text>
  <text x="881" y="390" font-family="Courier New, monospace" font-size="11" fill="var(--info-text)">-DCMAKE_PREFIX_PATH=</text>
  <text x="881" y="410" font-family="Courier New, monospace" font-size="11" fill="var(--info-text)">  "/opt/mylibs;/usr/local"</text>
  <text x="881" y="445" font-family="Courier New, monospace" font-size="11" fill="var(--info-text)">list(APPEND CMAKE_PREFIX_PATH ...)</text>

  <rect x="40" y="485" width="1200" height="135" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Imported Targets vs Variables</text>

  <rect x="60" y="520" width="550" height="85" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-text)">Modern: Imported Targets</text>
  <text x="80" y="565" font-family="Courier New, monospace" font-size="11" fill="var(--primary-text)">target_link_libraries(app Boost::filesystem)</text>
  <text x="80" y="585" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-text)">Transitive deps propagated</text>

  <rect x="640" y="520" width="580" height="85" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-text)">Legacy: Variables</text>
  <text x="660" y="565" font-family="Courier New, monospace" font-size="11" fill="var(--ok-text)">target_link_libraries(app ${ZLIB_LIBRARIES})</text>
  <text x="660" y="585" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-text)">Manual include dirs</text>
</svg>

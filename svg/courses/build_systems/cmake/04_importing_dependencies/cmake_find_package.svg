<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <!-- Title row: two modes -->
  <rect x="40" y="40" width="580.327869" height="42.533333" rx="6.347324" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="330.163934" y="67.066667" font-family="Arial, sans-serif" font-size="17.551832" font-weight="bold" fill="var(--bg)" text-anchor="middle">Config Mode (Modern)</text>

  <rect x="659.672131" y="40" width="580.327869" height="42.533333" rx="6.347324" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="949.836066" y="67.066667" font-family="Arial, sans-serif" font-size="17.551832" font-weight="bold" fill="var(--bg)" text-anchor="middle">Module Mode (Legacy)</text>

  <!-- Config mode box -->
  <rect x="40" y="94.133333" width="580.327869" height="193.333333" rx="6.347324" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="54.754098" y="117.333333" font-family="Arial, sans-serif" font-size="12.676347" font-weight="bold" fill="var(--primary-accent)">find_package(OpenSSL REQUIRED)</text>
  <text x="54.754098" y="138.6" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text)">Searches for OpenSSLConfig.cmake or openssl-config.cmake</text>
  <text x="54.754098" y="159.866667" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text)">Search order:</text>
  <text x="74.42623" y="177.266667" font-family="monospace" font-size="11.701186" fill="var(--text)">1. CMAKE_PREFIX_PATH dirs</text>
  <text x="74.42623" y="194.666667" font-family="monospace" font-size="11.701186" fill="var(--text)">2. &lt;Package&gt;_DIR variable</text>
  <text x="74.42623" y="212.066667" font-family="monospace" font-size="11.701186" fill="var(--text)">3. System default paths</text>
  <text x="54.754098" y="235.266667" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text)">Result: Imported target OpenSSL::SSL, OpenSSL::Crypto</text>
  <text x="54.754098" y="256.533333" font-family="monospace" font-size="11.701186" fill="var(--text-muted)">target_link_libraries(app PRIVATE OpenSSL::SSL)</text>
  <text x="54.754098" y="275.866667" font-family="Arial, sans-serif" font-size="10.726132" fill="var(--text-faint)">Includes, link flags, defines handled automatically</text>

  <!-- Module mode box -->
  <rect x="659.672131" y="94.133333" width="580.327869" height="193.333333" rx="6.347324" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="674.42623" y="117.333333" font-family="Arial, sans-serif" font-size="12.676347" font-weight="bold" fill="var(--ok-accent)">find_package(ZLIB MODULE REQUIRED)</text>
  <text x="674.42623" y="138.6" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text)">Searches for FindZLIB.cmake in CMAKE_MODULE_PATH</text>
  <text x="674.42623" y="159.866667" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text)">Sets variables:</text>
  <text x="694.098361" y="177.266667" font-family="monospace" font-size="11.701186" fill="var(--text)">ZLIB_FOUND</text>
  <text x="694.098361" y="194.666667" font-family="monospace" font-size="11.701186" fill="var(--text)">ZLIB_INCLUDE_DIRS</text>
  <text x="694.098361" y="212.066667" font-family="monospace" font-size="11.701186" fill="var(--text)">ZLIB_LIBRARIES</text>
  <text x="674.42623" y="235.266667" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text)">Usage (old style):</text>
  <text x="674.42623" y="256.533333" font-family="monospace" font-size="11.701186" fill="var(--text-muted)">target_include_directories(app PRIVATE ${ZLIB_INCLUDE_DIRS})</text>
  <text x="674.42623" y="275.866667" font-family="monospace" font-size="11.701186" fill="var(--text-muted)">target_link_libraries(app PRIVATE ${ZLIB_LIBRARIES})</text>

  <!-- FetchContent -->
  <rect x="40" y="305.833387" width="806.557377" height="164.333333" rx="6.347324" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="54.754098" y="329.033387" font-family="Arial, sans-serif" font-size="14.626457" font-weight="bold" fill="var(--warn-accent)">FetchContent Workflow</text>
  <text x="54.754098" y="350.299947" font-family="monospace" font-size="11.701186" fill="var(--text)">include(FetchContent)</text>
  <text x="54.754098" y="367.700053" font-family="monospace" font-size="11.701186" fill="var(--text)">FetchContent_Declare(</text>
  <text x="74.42623" y="385.099947" font-family="monospace" font-size="11.701186" fill="var(--text)">  googletest</text>
  <text x="74.42623" y="402.500053" font-family="monospace" font-size="11.701186" fill="var(--text)">  GIT_REPOSITORY https://github.com/google/googletest.git</text>
  <text x="74.42623" y="419.899947" font-family="monospace" font-size="11.701186" fill="var(--text)">  GIT_TAG        v1.14.0</text>
  <text x="54.754098" y="437.300053" font-family="monospace" font-size="11.701186" fill="var(--text)">)</text>
  <text x="54.754098" y="454.699947" font-family="monospace" font-size="11.701186" fill="var(--text)">FetchContent_MakeAvailable(googletest)</text>

  <!-- CMAKE_PREFIX_PATH box -->
  <rect x="866.229508" y="305.833387" width="373.770492" height="164.333333" rx="6.347324" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="880.983607" y="329.033387" font-family="Arial, sans-serif" font-size="14.626457" font-weight="bold" fill="var(--info-accent)">CMAKE_PREFIX_PATH</text>
  <text x="880.983607" y="350.299947" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text)">Tell CMake where to search:</text>
  <text x="880.983607" y="369.63328" font-family="monospace" font-size="11.701186" fill="var(--text)">cmake -DCMAKE_PREFIX_PATH=</text>
  <text x="900.655738" y="387.033387" font-family="monospace" font-size="11.701186" fill="var(--text)">"/opt/mylibs;/usr/local"</text>
  <text x="880.983607" y="408.299947" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text)">Or in CMakeLists.txt:</text>
  <text x="880.983607" y="427.63328" font-family="monospace" font-size="11.701186" fill="var(--text)">list(APPEND CMAKE_PREFIX_PATH</text>
  <text x="900.655738" y="445.033387" font-family="monospace" font-size="11.701186" fill="var(--text)">  "/opt/mylibs")</text>

  <!-- Bottom summary -->
  <rect x="40" y="488.533333" width="1200" height="131.466667" rx="6.347324" fill="var(--surface)"/>
  <text x="640" y="511.733333" font-family="Arial, sans-serif" font-size="13.651402" font-weight="bold" fill="var(--text)" text-anchor="middle">Imported Targets vs Variables</text>

  <rect x="59.672131" y="523.333333" width="550.819672" height="81.2" rx="6.347324" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335.081967" y="542.666667" font-family="Arial, sans-serif" font-size="12.676347" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Modern: Imported Targets (preferred)</text>
  <text x="79.344262" y="562" font-family="monospace" font-size="11.701186" fill="var(--text)">target_link_libraries(myapp PRIVATE Boost::filesystem)</text>
  <text x="79.344262" y="579.4" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text-muted)">Transitive deps, usage requirements propagated automatically</text>
  <text x="79.344262" y="596.8" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text-muted)">Includes + defines + link flags all in one target</text>

  <rect x="640" y="523.333333" width="580.327869" height="81.2" rx="6.347324" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930.163934" y="542.666667" font-family="Arial, sans-serif" font-size="12.676347" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Legacy: Variables (avoid for new code)</text>
  <text x="659.672131" y="562" font-family="monospace" font-size="11.701186" fill="var(--text)">target_link_libraries(myapp ${ZLIB_LIBRARIES})</text>
  <text x="659.672131" y="579.4" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text-muted)">Manual include_directories needed separately</text>
  <text x="659.672131" y="596.8" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text-muted)">No transitive dependency propagation</text>
</svg>

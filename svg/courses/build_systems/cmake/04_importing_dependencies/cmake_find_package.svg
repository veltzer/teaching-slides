<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <!-- Title row: two modes -->
  <rect x="40" y="40" width="580.327869" height="42.533333" rx="6.347324" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.163934" y="67.066667" font-family="Arial, sans-serif" font-size="17.551832" font-weight="bold" fill="var(--bg)" text-anchor="middle">Config Mode (Modern)</text>

  <rect x="659.672131" y="40" width="580.327869" height="42.533333" rx="6.347324" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.836066" y="67.066667" font-family="Arial, sans-serif" font-size="17.551832" font-weight="bold" fill="var(--bg)" text-anchor="middle">Module Mode (Legacy)</text>

  <!-- Config mode box -->
  <rect x="40" y="94.133333" width="580.327869" height="193.333333" rx="6.347324" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="54.754098" y="117.333333" font-family="Arial, sans-serif" font-size="12.676347" font-weight="bold" fill="var(--primary-accent)">find_package(OpenSSL REQUIRED)</text>
  <text x="54.754098" y="138.6" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text)">Searches for OpenSSLConfig.cmake or openssl-config.cmake</text>
  <text x="54.754098" y="159.866667" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text)">Search order:</text>
  <text x="74.42623" y="177.266667" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">1. CMAKE_PREFIX_PATH dirs</text>
  <text x="74.42623" y="194.666667" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">2. &lt;Package&gt;_DIR variable</text>
  <text x="74.42623" y="212.066667" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">3. System default paths</text>
  <text x="54.754098" y="235.266667" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text)">Result: Imported target OpenSSL::SSL, OpenSSL::Crypto</text>
  <text x="54.754098" y="256.533333" font-size="11.701186" fill="var(--text-muted)" font-family="Courier New, monospace">target_link_libraries(app PRIVATE OpenSSL::SSL)</text>
  <text x="54.754098" y="275.866667" font-family="Arial, sans-serif" font-size="10.726132" fill="var(--text-faint)">Includes, link flags, defines handled automatically</text>

  <!-- Module mode box -->
  <rect x="659.672131" y="94.133333" width="580.327869" height="193.333333" rx="6.347324" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="674.42623" y="117.333333" font-family="Arial, sans-serif" font-size="12.676347" font-weight="bold" fill="var(--ok-accent)">find_package(ZLIB MODULE REQUIRED)</text>
  <text x="674.42623" y="138.6" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text)">Searches for FindZLIB.cmake in CMAKE_MODULE_PATH</text>
  <text x="674.42623" y="159.866667" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text)">Sets variables:</text>
  <text x="694.098361" y="177.266667" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">ZLIB_FOUND</text>
  <text x="694.098361" y="194.666667" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">ZLIB_INCLUDE_DIRS</text>
  <text x="694.098361" y="212.066667" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">ZLIB_LIBRARIES</text>
  <text x="674.42623" y="235.266667" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text)">Usage (old style):</text>
  <text x="674.42623" y="256.533333" font-size="11.701186" fill="var(--text-muted)" font-family="Courier New, monospace">target_include_directories(app PRIVATE ${ZLIB_INCLUDE_DIRS})</text>
  <text x="674.42623" y="275.866667" font-size="11.701186" fill="var(--text-muted)" font-family="Courier New, monospace">target_link_libraries(app PRIVATE ${ZLIB_LIBRARIES})</text>

  <!-- FetchContent -->
  <rect x="40" y="305.833387" width="806.557377" height="164.333333" rx="6.347324" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="54.754098" y="329.033387" font-family="Arial, sans-serif" font-size="14.626457" font-weight="bold" fill="var(--warn-accent)">FetchContent Workflow</text>
  <text x="54.754098" y="350.299947" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">include(FetchContent)</text>
  <text x="54.754098" y="367.700053" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">FetchContent_Declare(</text>
  <text x="74.42623" y="385.099947" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">  googletest</text>
  <text x="74.42623" y="402.500053" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">  GIT_REPOSITORY https://github.com/google/googletest.git</text>
  <text x="74.42623" y="419.899947" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">  GIT_TAG        v1.14.0</text>
  <text x="54.754098" y="437.300053" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">)</text>
  <text x="54.754098" y="454.699947" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">FetchContent_MakeAvailable(googletest)</text>

  <!-- CMAKE_PREFIX_PATH box -->
  <rect x="866.229508" y="305.833387" width="373.770492" height="164.333333" rx="6.347324" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="880.983607" y="329.033387" font-family="Arial, sans-serif" font-size="14.626457" font-weight="bold" fill="var(--info-accent)">CMAKE_PREFIX_PATH</text>
  <text x="880.983607" y="350.299947" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text)">Tell CMake where to search:</text>
  <text x="880.983607" y="369.63328" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">cmake -DCMAKE_PREFIX_PATH=</text>
  <text x="900.655738" y="387.033387" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">"/opt/mylibs;/usr/local"</text>
  <text x="880.983607" y="408.299947" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text)">Or in CMakeLists.txt:</text>
  <text x="880.983607" y="427.63328" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">list(APPEND CMAKE_PREFIX_PATH</text>
  <text x="900.655738" y="445.033387" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">  "/opt/mylibs")</text>

  <!-- Bottom summary -->
  <rect x="40" y="488.533333" width="1200" height="131.466667" rx="6.347324" fill="var(--surface)"/>
  <text x="640" y="511.733333" font-family="Arial, sans-serif" font-size="13.651402" font-weight="bold" fill="var(--text)" text-anchor="middle">Imported Targets vs Variables</text>

  <rect x="59.672131" y="523.333333" width="550.819672" height="81.2" rx="6.347324" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335.081967" y="542.666667" font-family="Arial, sans-serif" font-size="12.676347" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Modern: Imported Targets (preferred)</text>
  <text x="79.344262" y="562" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">target_link_libraries(myapp PRIVATE Boost::filesystem)</text>
  <text x="79.344262" y="579.4" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text-muted)">Transitive deps, usage requirements propagated automatically</text>
  <text x="79.344262" y="596.8" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text-muted)">Includes + defines + link flags all in one target</text>

  <rect x="640" y="523.333333" width="580.327869" height="81.2" rx="6.347324" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930.163934" y="542.666667" font-family="Arial, sans-serif" font-size="12.676347" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Legacy: Variables (avoid for new code)</text>
  <text x="659.672131" y="562" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">target_link_libraries(myapp ${ZLIB_LIBRARIES})</text>
  <text x="659.672131" y="579.4" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text-muted)">Manual include_directories needed separately</text>
  <text x="659.672131" y="596.8" font-family="Arial, sans-serif" font-size="11.701186" fill="var(--text-muted)">No transitive dependency propagation</text>
</svg>

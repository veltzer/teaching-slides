<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="220" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="150" y="100" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CMakeLists.txt</text>
  <text x="150" y="300" text-anchor="middle" font-size="18" fill="var(--text-muted)" font-family="Arial, sans-serif">project()</text>
  <text x="150" y="330" text-anchor="middle" font-size="18" fill="var(--text-muted)" font-family="Arial, sans-serif">add_executable()</text>
  <text x="150" y="360" text-anchor="middle" font-size="18" fill="var(--text-muted)" font-family="Arial, sans-serif">target_link_libraries()</text>
  <text x="150" y="560" text-anchor="middle" font-size="16" fill="var(--text-faint)" font-family="Arial, sans-serif">declarative input</text>

  <line x1="270" y1="330" x2="330" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="340" y="40" width="220" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="100" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">cmake</text>
  <text x="450" y="130" text-anchor="middle" font-size="18" fill="var(--primary-text)" font-family="Arial, sans-serif">configure + generate</text>
  <text x="450" y="280" text-anchor="middle" font-size="16" fill="var(--primary-text)" font-family="Arial, sans-serif">detect compiler</text>
  <text x="450" y="310" text-anchor="middle" font-size="16" fill="var(--primary-text)" font-family="Arial, sans-serif">resolve deps</text>
  <text x="450" y="340" text-anchor="middle" font-size="16" fill="var(--primary-text)" font-family="Arial, sans-serif">pick generator</text>
  <text x="450" y="370" text-anchor="middle" font-size="16" fill="var(--primary-text)" font-family="Arial, sans-serif">emit build files</text>
  <text x="450" y="560" text-anchor="middle" font-size="15" fill="var(--primary-text)" font-family="Arial, sans-serif">cmake -S . -B build</text>

  <line x1="570" y1="330" x2="630" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="640" y="40" width="220" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="750" y="100" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Build Files</text>
  <text x="750" y="300" text-anchor="middle" font-size="18" fill="var(--text-muted)" font-family="Arial, sans-serif">Makefile</text>
  <text x="750" y="330" text-anchor="middle" font-size="18" fill="var(--text-muted)" font-family="Arial, sans-serif">Ninja build.ninja</text>
  <text x="750" y="360" text-anchor="middle" font-size="18" fill="var(--text-muted)" font-family="Arial, sans-serif">VS .sln / Xcode</text>
  <text x="750" y="560" text-anchor="middle" font-size="15" fill="var(--text-faint)" font-family="Arial, sans-serif">generator output</text>

  <line x1="870" y1="330" x2="930" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="940" y="40" width="160" height="580" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020" y="100" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Build Tool</text>
  <text x="1020" y="310" text-anchor="middle" font-size="18" fill="var(--warn-text)" font-family="Arial, sans-serif">make</text>
  <text x="1020" y="340" text-anchor="middle" font-size="18" fill="var(--warn-text)" font-family="Arial, sans-serif">ninja</text>
  <text x="1020" y="370" text-anchor="middle" font-size="18" fill="var(--warn-text)" font-family="Arial, sans-serif">msbuild</text>
  <text x="1020" y="560" text-anchor="middle" font-size="14" fill="var(--warn-text)" font-family="Arial, sans-serif">compile + link</text>

  <line x1="1110" y1="330" x2="1160" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1170" y="40" width="70" height="580" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1205" y="320" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--ok-text)" transform="rotate(-90 1205 320)" font-family="Arial, sans-serif">Binaries</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="220" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="150" y="100" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)">CMakeLists.txt</text>
  <text x="150" y="300" text-anchor="middle" font-size="18" fill="var(--text-muted)">project()</text>
  <text x="150" y="330" text-anchor="middle" font-size="18" fill="var(--text-muted)">add_executable()</text>
  <text x="150" y="360" text-anchor="middle" font-size="18" fill="var(--text-muted)">target_link_libraries()</text>
  <text x="150" y="560" text-anchor="middle" font-size="16" fill="var(--text-faint)">declarative input</text>

  <line x1="270" y1="330" x2="330" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="340" y="40" width="220" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="100" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--primary-text)">cmake</text>
  <text x="450" y="130" text-anchor="middle" font-size="18" fill="var(--primary-text)">configure + generate</text>
  <text x="450" y="280" text-anchor="middle" font-size="16" fill="var(--primary-text)">detect compiler</text>
  <text x="450" y="310" text-anchor="middle" font-size="16" fill="var(--primary-text)">resolve deps</text>
  <text x="450" y="340" text-anchor="middle" font-size="16" fill="var(--primary-text)">pick generator</text>
  <text x="450" y="370" text-anchor="middle" font-size="16" fill="var(--primary-text)">emit build files</text>
  <text x="450" y="560" text-anchor="middle" font-size="15" fill="var(--primary-text)">cmake -S . -B build</text>

  <line x1="570" y1="330" x2="630" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="640" y="40" width="220" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="750" y="100" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)">Build Files</text>
  <text x="750" y="300" text-anchor="middle" font-size="18" fill="var(--text-muted)">Makefile</text>
  <text x="750" y="330" text-anchor="middle" font-size="18" fill="var(--text-muted)">Ninja build.ninja</text>
  <text x="750" y="360" text-anchor="middle" font-size="18" fill="var(--text-muted)">VS .sln / Xcode</text>
  <text x="750" y="560" text-anchor="middle" font-size="15" fill="var(--text-faint)">generator output</text>

  <line x1="870" y1="330" x2="930" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="940" y="40" width="160" height="580" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1020" y="100" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--warn-text)">Build Tool</text>
  <text x="1020" y="310" text-anchor="middle" font-size="18" fill="var(--warn-text)">make</text>
  <text x="1020" y="340" text-anchor="middle" font-size="18" fill="var(--warn-text)">ninja</text>
  <text x="1020" y="370" text-anchor="middle" font-size="18" fill="var(--warn-text)">msbuild</text>
  <text x="1020" y="560" text-anchor="middle" font-size="14" fill="var(--warn-text)">compile + link</text>

  <line x1="1110" y1="330" x2="1160" y2="330" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1170" y="40" width="70" height="580" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1205" y="320" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--ok-text)" transform="rotate(-90 1205 320)">Binaries</text>

</svg>

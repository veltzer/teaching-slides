<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <!-- Variable Types Column -->
  <rect x="40" y="40" width="363.934426" height="42.533333" rx="6.347324" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.967213" y="67.066667" font-family="Arial, sans-serif" font-size="17.551832" font-weight="bold" fill="var(--bg)" text-anchor="middle">Variable Types</text>

  <!-- Normal Variable -->
  <rect x="40" y="94.133333" width="363.934426" height="77.333333" rx="6.347324" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="54.754098" y="117.333333" font-family="Arial, sans-serif" font-size="13.651402" font-weight="bold" fill="var(--primary-accent)">Normal Variable</text>
  <text x="54.754098" y="136.666667" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">set(MY_VAR "hello")</text>
  <text x="54.754098" y="154.066667" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">message(${MY_VAR})</text>

  <!-- Cache Variable -->
  <rect x="40" y="183.066667" width="363.934426" height="87" rx="6.347324" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="54.754098" y="206.266667" font-family="Arial, sans-serif" font-size="13.651402" font-weight="bold" fill="var(--ok-accent)">Cache Variable</text>
  <text x="54.754098" y="225.6" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">set(MYOPT "OFF"</text>
  <text x="54.754098" y="243" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">  CACHE BOOL "Enable opt")</text>
  <text x="54.754098" y="260.4" font-family="Arial, sans-serif" font-size="10.726132" fill="var(--text-muted)">Persists in CMakeCache.txt</text>

  <!-- Environment Variable -->
  <rect x="40" y="281.666667" width="363.934426" height="77.333333" rx="6.347324" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="54.754098" y="304.866667" font-family="Arial, sans-serif" font-size="13.651402" font-weight="bold" fill="var(--warn-accent)">Environment Variable</text>
  <text x="54.754098" y="324.2" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">set(ENV{PATH} "/opt/bin")</text>
  <text x="54.754098" y="341.6" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">message($ENV{HOME})</text>

  <!-- Variable Expansion -->
  <rect x="40" y="370.6" width="363.934426" height="101.499947" rx="6.347324" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="54.754098" y="393.8" font-family="Arial, sans-serif" font-size="13.651402" font-weight="bold" fill="var(--info-accent)">Variable Expansion</text>
  <text x="54.754098" y="413.133333" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">${VAR}      - normal</text>
  <text x="54.754098" y="430.533333" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">$ENV{VAR}  - environment</text>
  <text x="54.754098" y="447.933333" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">$CACHE{VAR}- cache</text>
  <text x="54.754098" y="465.333333" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">${${VAR}}  - indirect ref</text>

  <!-- Control Flow Column -->
  <rect x="443.278689" y="40" width="373.770492" height="42.533333" rx="6.347324" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.163934" y="67.066667" font-family="Arial, sans-serif" font-size="17.551832" font-weight="bold" fill="var(--bg)" text-anchor="middle">Control Flow</text>

  <!-- if/elseif/else -->
  <rect x="443.278689" y="94.133333" width="373.770492" height="106.333333" rx="6.347324" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="458.032787" y="117.333333" font-family="Arial, sans-serif" font-size="13.651402" font-weight="bold" fill="var(--primary-accent)">if / elseif / else</text>
  <text x="458.032787" y="136.666667" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">if(UNIX)</text>
  <text x="458.032787" y="154.066667" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">  set(PLAT "linux")</text>
  <text x="458.032787" y="171.466667" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">elseif(WIN32)</text>
  <text x="458.032787" y="188.866667" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">  set(PLAT "win")</text>
  <text x="458.032787" y="191.766613" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">endif()</text>

  <!-- foreach -->
  <rect x="443.278689" y="212.066667" width="373.770492" height="91.833387" rx="6.347324" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="458.032787" y="235.266667" font-family="Arial, sans-serif" font-size="13.651402" font-weight="bold" fill="var(--ok-accent)">foreach</text>
  <text x="458.032787" y="254.6" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">foreach(file ${SRCS})</text>
  <text x="458.032787" y="272" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">  message("File: ${file}")</text>
  <text x="458.032787" y="289.4" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">endforeach()</text>

  <!-- while -->
  <rect x="443.278689" y="315.499947" width="373.770492" height="91.833387" rx="6.347324" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="458.032787" y="338.699947" font-family="Arial, sans-serif" font-size="13.651402" font-weight="bold" fill="var(--warn-accent)">while</text>
  <text x="458.032787" y="358.03328" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">set(i 0)</text>
  <text x="458.032787" y="375.433387" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">while(i LESS 5)</text>
  <text x="458.032787" y="392.83328" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">  math(EXPR i "${i}+1")</text>
  <text x="458.032787" y="399.6" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">endwhile()</text>

  <!-- Macros vs Functions Column -->
  <rect x="856.393443" y="40" width="383.606557" height="42.533333" rx="6.347324" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.196721" y="67.066667" font-family="Arial, sans-serif" font-size="17.551832" font-weight="bold" fill="var(--bg)" text-anchor="middle">Macros vs Functions</text>

  <!-- macro -->
  <rect x="856.393443" y="94.133333" width="383.606557" height="106.333333" rx="6.347324" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="871.147541" y="117.333333" font-family="Arial, sans-serif" font-size="13.651402" font-weight="bold" fill="var(--danger-accent)">macro()</text>
  <text x="871.147541" y="136.666667" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">macro(greet name)</text>
  <text x="871.147541" y="154.066667" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">  message("Hi ${name}")</text>
  <text x="871.147541" y="171.466667" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">endmacro()</text>
  <text x="871.147541" y="189.833387" font-family="Arial, sans-serif" font-size="10.726132" fill="var(--text-muted)">No scope - caller variables modified</text>

  <!-- function -->
  <rect x="856.393443" y="212.066667" width="383.606557" height="106.333333" rx="6.347324" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="871.147541" y="235.266667" font-family="Arial, sans-serif" font-size="13.651402" font-weight="bold" fill="var(--ok-accent)">function()</text>
  <text x="871.147541" y="254.6" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">function(greet name)</text>
  <text x="871.147541" y="272" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">  message("Hi ${name}")</text>
  <text x="871.147541" y="289.4" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">endfunction()</text>
  <text x="871.147541" y="307.766613" font-family="Arial, sans-serif" font-size="10.726132" fill="var(--text-muted)">Own scope - caller vars protected</text>

  <!-- Generator Expressions -->
  <rect x="856.393443" y="330" width="383.606557" height="130.500053" rx="6.347324" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="871.147541" y="353.2" font-family="Arial, sans-serif" font-size="13.651402" font-weight="bold" fill="var(--primary-accent)">Generator Expressions $&lt;&gt;</text>
  <text x="871.147541" y="374.466667" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">$&lt;BUILD_INTERFACE:path&gt;</text>
  <text x="871.147541" y="391.866667" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">$&lt;INSTALL_INTERFACE:path&gt;</text>
  <text x="871.147541" y="409.266667" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">$&lt;CONFIG:Release&gt;</text>
  <text x="871.147541" y="426.666667" font-size="11.701186" fill="var(--text)" font-family="Courier New, monospace">$&lt;TARGET_FILE:mylib&gt;</text>
  <text x="871.147541" y="446" font-family="Arial, sans-serif" font-size="10.726132" fill="var(--text-muted)">Evaluated at build/install time</text>

  <!-- Bottom legend -->
  <rect x="40" y="504" width="1200" height="116" rx="6.347324" fill="var(--surface)"/>
  <text x="640" y="527.2" font-family="Arial, sans-serif" font-size="13.651402" font-weight="bold" fill="var(--text)" text-anchor="middle">Key Rules</text>
  <text x="59.672131" y="550.4" font-family="Arial, sans-serif" font-size="12.676347" fill="var(--text)">Truthiness: FALSE, OFF, NO, 0, "" or *-NOTFOUND are false; everything else is true</text>
  <text x="59.672131" y="571.666667" font-family="Arial, sans-serif" font-size="12.676347" fill="var(--text)">Lists: semicolon-separated strings  set(L a b c) == "a;b;c"</text>
  <text x="59.672131" y="592.933333" font-family="Arial, sans-serif" font-size="12.676347" fill="var(--text)">cmake_parse_arguments() parses keyword/multi-value args inside functions</text>
  <text x="59.672131" y="614.2" font-family="Arial, sans-serif" font-size="12.676347" fill="var(--text)">PARENT_SCOPE in set() propagates a variable out of a function into the caller</text>
</svg>

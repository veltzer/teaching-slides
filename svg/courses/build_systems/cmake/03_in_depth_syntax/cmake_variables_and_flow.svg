<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Variable Types Column -->
  <rect x="30" y="20" width="370" height="44" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="215" y="48" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Variable Types</text>

  <!-- Normal Variable -->
  <rect x="30" y="76" width="370" height="80" rx="5" fill="#e3f2fd" filter="url(#shadow)"/>
  <text x="45" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0">Normal Variable</text>
  <text x="45" y="120" font-family="monospace" font-size="12" fill="#333333">set(MY_VAR "hello")</text>
  <text x="45" y="138" font-family="monospace" font-size="12" fill="#333333">message(${MY_VAR})</text>

  <!-- Cache Variable -->
  <rect x="30" y="168" width="370" height="90" rx="5" fill="#e8f5e9" filter="url(#shadow)"/>
  <text x="45" y="192" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">Cache Variable</text>
  <text x="45" y="212" font-family="monospace" font-size="12" fill="#333333">set(MYOPT "OFF"</text>
  <text x="45" y="230" font-family="monospace" font-size="12" fill="#333333">  CACHE BOOL "Enable opt")</text>
  <text x="45" y="248" font-family="Arial, sans-serif" font-size="11" fill="#555555">Persists in CMakeCache.txt</text>

  <!-- Environment Variable -->
  <rect x="30" y="270" width="370" height="80" rx="5" fill="#fff3e0" filter="url(#shadow)"/>
  <text x="45" y="294" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e65100">Environment Variable</text>
  <text x="45" y="314" font-family="monospace" font-size="12" fill="#333333">set(ENV{PATH} "/opt/bin")</text>
  <text x="45" y="332" font-family="monospace" font-size="12" fill="#333333">message($ENV{HOME})</text>

  <!-- Variable Expansion -->
  <rect x="30" y="362" width="370" height="105" rx="5" fill="#f3e5f5" filter="url(#shadow)"/>
  <text x="45" y="386" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6a1b9a">Variable Expansion</text>
  <text x="45" y="406" font-family="monospace" font-size="12" fill="#333333">${VAR}      - normal</text>
  <text x="45" y="424" font-family="monospace" font-size="12" fill="#333333">$ENV{VAR}  - environment</text>
  <text x="45" y="442" font-family="monospace" font-size="12" fill="#333333">$CACHE{VAR}- cache</text>
  <text x="45" y="460" font-family="monospace" font-size="12" fill="#333333">${${VAR}}  - indirect ref</text>

  <!-- Control Flow Column -->
  <rect x="440" y="20" width="380" height="44" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="630" y="48" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Control Flow</text>

  <!-- if/elseif/else -->
  <rect x="440" y="76" width="380" height="110" rx="5" fill="#e3f2fd" filter="url(#shadow)"/>
  <text x="455" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0">if / elseif / else</text>
  <text x="455" y="120" font-family="monospace" font-size="12" fill="#333333">if(UNIX)</text>
  <text x="455" y="138" font-family="monospace" font-size="12" fill="#333333">  set(PLAT "linux")</text>
  <text x="455" y="156" font-family="monospace" font-size="12" fill="#333333">elseif(WIN32)</text>
  <text x="455" y="174" font-family="monospace" font-size="12" fill="#333333">  set(PLAT "win")</text>
  <text x="455" y="177" font-family="monospace" font-size="12" fill="#333333">endif()</text>

  <!-- foreach -->
  <rect x="440" y="198" width="380" height="95" rx="5" fill="#e8f5e9" filter="url(#shadow)"/>
  <text x="455" y="222" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">foreach</text>
  <text x="455" y="242" font-family="monospace" font-size="12" fill="#333333">foreach(file ${SRCS})</text>
  <text x="455" y="260" font-family="monospace" font-size="12" fill="#333333">  message("File: ${file}")</text>
  <text x="455" y="278" font-family="monospace" font-size="12" fill="#333333">endforeach()</text>

  <!-- while -->
  <rect x="440" y="305" width="380" height="95" rx="5" fill="#fff3e0" filter="url(#shadow)"/>
  <text x="455" y="329" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e65100">while</text>
  <text x="455" y="349" font-family="monospace" font-size="12" fill="#333333">set(i 0)</text>
  <text x="455" y="367" font-family="monospace" font-size="12" fill="#333333">while(i LESS 5)</text>
  <text x="455" y="385" font-family="monospace" font-size="12" fill="#333333">  math(EXPR i "${i}+1")</text>
  <text x="455" y="392" font-family="monospace" font-size="12" fill="#333333">endwhile()</text>

  <!-- Macros vs Functions Column -->
  <rect x="860" y="20" width="390" height="44" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="1055" y="48" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Macros vs Functions</text>

  <!-- macro -->
  <rect x="860" y="76" width="390" height="110" rx="5" fill="#fce4ec" filter="url(#shadow)"/>
  <text x="875" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c62828">macro()</text>
  <text x="875" y="120" font-family="monospace" font-size="12" fill="#333333">macro(greet name)</text>
  <text x="875" y="138" font-family="monospace" font-size="12" fill="#333333">  message("Hi ${name}")</text>
  <text x="875" y="156" font-family="monospace" font-size="12" fill="#333333">endmacro()</text>
  <text x="875" y="175" font-family="Arial, sans-serif" font-size="11" fill="#555555">No scope - caller variables modified</text>

  <!-- function -->
  <rect x="860" y="198" width="390" height="110" rx="5" fill="#e8f5e9" filter="url(#shadow)"/>
  <text x="875" y="222" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">function()</text>
  <text x="875" y="242" font-family="monospace" font-size="12" fill="#333333">function(greet name)</text>
  <text x="875" y="260" font-family="monospace" font-size="12" fill="#333333">  message("Hi ${name}")</text>
  <text x="875" y="278" font-family="monospace" font-size="12" fill="#333333">endfunction()</text>
  <text x="875" y="297" font-family="Arial, sans-serif" font-size="11" fill="#555555">Own scope - caller vars protected</text>

  <!-- Generator Expressions -->
  <rect x="860" y="320" width="390" height="135" rx="5" fill="#e3f2fd" filter="url(#shadow)"/>
  <text x="875" y="344" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0">Generator Expressions $&lt;&gt;</text>
  <text x="875" y="366" font-family="monospace" font-size="12" fill="#333333">$&lt;BUILD_INTERFACE:path&gt;</text>
  <text x="875" y="384" font-family="monospace" font-size="12" fill="#333333">$&lt;INSTALL_INTERFACE:path&gt;</text>
  <text x="875" y="402" font-family="monospace" font-size="12" fill="#333333">$&lt;CONFIG:Release&gt;</text>
  <text x="875" y="420" font-family="monospace" font-size="12" fill="#333333">$&lt;TARGET_FILE:mylib&gt;</text>
  <text x="875" y="440" font-family="Arial, sans-serif" font-size="11" fill="#555555">Evaluated at build/install time</text>

  <!-- Bottom legend -->
  <rect x="30" y="500" width="1220" height="120" rx="6" fill="#f5f5f5" filter="url(#shadow)"/>
  <text x="640" y="524" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Key Rules</text>
  <text x="50" y="548" font-family="Arial, sans-serif" font-size="13" fill="#333333">Truthiness: FALSE, OFF, NO, 0, "" or *-NOTFOUND are false; everything else is true</text>
  <text x="50" y="570" font-family="Arial, sans-serif" font-size="13" fill="#333333">Lists: semicolon-separated strings  set(L a b c) == "a;b;c"</text>
  <text x="50" y="592" font-family="Arial, sans-serif" font-size="13" fill="#333333">cmake_parse_arguments() parses keyword/multi-value args inside functions</text>
  <text x="50" y="614" font-family="Arial, sans-serif" font-size="13" fill="#333333">PARENT_SCOPE in set() propagates a variable out of a function into the caller</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="380" height="580" rx="8.616263691415" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="86.400000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.540659228539" font-weight="bold" fill="var(--primary-text)">Variables</text>

  <text x="60" y="138.600000000001" font-family="Arial, sans-serif" font-size="15.078461459976" font-weight="bold" fill="var(--primary-text)">Normal</text>
  <text x="60" y="167.6" font-family="Courier New, monospace" font-size="14.001428498549" fill="var(--primary-text)">set(V "hello")</text>
  <text x="60" y="196.6" font-family="Courier New, monospace" font-size="14.001428498549" fill="var(--primary-text)">message(${V})</text>

  <text x="60" y="248.8" font-family="Arial, sans-serif" font-size="15.078461459976" font-weight="bold" fill="var(--primary-text)">Cache</text>
  <text x="60" y="277.8" font-family="Courier New, monospace" font-size="14.001428498549" fill="var(--primary-text)">set(O OFF CACHE BOOL "")</text>

  <text x="60" y="330.000000000001" font-family="Arial, sans-serif" font-size="15.078461459976" font-weight="bold" fill="var(--primary-text)">Environment</text>
  <text x="60" y="359" font-family="Courier New, monospace" font-size="14.001428498549" fill="var(--primary-text)">$ENV{HOME}</text>

  <text x="60" y="411.2" font-family="Arial, sans-serif" font-size="15.078461459976" font-weight="bold" fill="var(--primary-text)">Expansion</text>
  <text x="60" y="440.2" font-family="Courier New, monospace" font-size="12.924395537123" fill="var(--primary-text)">${VAR} normal</text>
  <text x="60" y="469.2" font-family="Courier New, monospace" font-size="12.924395537123" fill="var(--primary-text)">$CACHE{V} cache</text>
  <text x="60" y="498.200000000001" font-family="Courier New, monospace" font-size="12.924395537123" fill="var(--primary-text)">${${V}} indirect</text>

  <rect x="450" y="40" width="380" height="580" rx="8.616263691415" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="86.400000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.540659228539" font-weight="bold" fill="var(--ok-text)">Control Flow</text>

  <text x="470" y="138.600000000001" font-family="Arial, sans-serif" font-size="15.078461459976" font-weight="bold" fill="var(--ok-text)">if / elseif / else</text>
  <text x="470" y="167.6" font-family="Courier New, monospace" font-size="12.924395537123" fill="var(--ok-text)">if(UNIX) ... elseif(WIN32)</text>
  <text x="470" y="190.8" font-family="Courier New, monospace" font-size="12.924395537123" fill="var(--ok-text)">... endif()</text>

  <text x="470" y="260.4" font-family="Arial, sans-serif" font-size="15.078461459976" font-weight="bold" fill="var(--ok-text)">foreach</text>
  <text x="470" y="289.4" font-family="Courier New, monospace" font-size="12.924395537123" fill="var(--ok-text)">foreach(f ${SRCS})</text>
  <text x="470" y="312.6" font-family="Courier New, monospace" font-size="12.924395537123" fill="var(--ok-text)">... endforeach()</text>

  <text x="470" y="382.200000000001" font-family="Arial, sans-serif" font-size="15.078461459976" font-weight="bold" fill="var(--ok-text)">while</text>
  <text x="470" y="411.2" font-family="Courier New, monospace" font-size="12.924395537123" fill="var(--ok-text)">while(i LESS 5)</text>
  <text x="470" y="434.400000000001" font-family="Courier New, monospace" font-size="12.924395537123" fill="var(--ok-text)">... endwhile()</text>

  <text x="470" y="498.200000000001" font-family="Arial, sans-serif" font-size="15.078461459976" font-weight="bold" fill="var(--ok-text)">Lists</text>
  <text x="470" y="527.2" font-family="Courier New, monospace" font-size="12.924395537123" fill="var(--ok-text)">semicolon-separated</text>

  <rect x="860" y="40" width="380" height="284.2" rx="8.616263691415" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="86.400000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.540659228539" font-weight="bold" fill="var(--danger-text)">macro vs function</text>
  <text x="880" y="132.8" font-family="Courier New, monospace" font-size="12.924395537123" fill="var(--danger-text)">macro(): no scope</text>
  <text x="880" y="179.2" font-family="Courier New, monospace" font-size="12.924395537123" fill="var(--danger-text)">function(): own scope</text>
  <text x="880" y="237.2" font-family="Arial, sans-serif" font-size="14.001428498549" fill="var(--danger-text)">PARENT_SCOPE propagates</text>
  <text x="880" y="283.6" font-family="Arial, sans-serif" font-size="14.001428498549" fill="var(--danger-text)">cmake_parse_arguments</text>

  <rect x="860" y="347.4" width="380" height="272.6" rx="8.616263691415" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="393.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.540659228539" font-weight="bold" fill="var(--info-text)">Generator Expressions</text>
  <text x="880" y="440.2" font-family="Courier New, monospace" font-size="12.924395537123" fill="var(--info-text)">$&lt;BUILD_INTERFACE:p&gt;</text>
  <text x="880" y="475" font-family="Courier New, monospace" font-size="12.924395537123" fill="var(--info-text)">$&lt;CONFIG:Release&gt;</text>
  <text x="880" y="509.8" font-family="Courier New, monospace" font-size="12.924395537123" fill="var(--info-text)">$&lt;TARGET_FILE:lib&gt;</text>
  <text x="880" y="562" font-family="Arial, sans-serif" font-size="14.001428498549" fill="var(--info-text)">Eval at build/install time</text>
</svg>

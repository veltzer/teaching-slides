<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Variable Types Column -->
  <rect x="68.125" y="58.125" width="346.875" height="39.875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="241.5625" y="83.5" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)" text-anchor="middle">Variable Types</text>

  <!-- Normal Variable -->
  <rect x="68.125" y="108.875" width="346.875" height="72.5" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="82.1875" y="130.625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">Normal Variable</text>
  <text x="82.1875" y="148.75" font-family="monospace" font-size="11.0609" fill="var(--text)">set(MY_VAR "hello")</text>
  <text x="82.1875" y="165.0625" font-family="monospace" font-size="11.0609" fill="var(--text)">message(${MY_VAR})</text>

  <!-- Cache Variable -->
  <rect x="68.125" y="192.25" width="346.875" height="81.5625" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="82.1875" y="214" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">Cache Variable</text>
  <text x="82.1875" y="232.125" font-family="monospace" font-size="11.0609" fill="var(--text)">set(MYOPT "OFF"</text>
  <text x="82.1875" y="248.4375" font-family="monospace" font-size="11.0609" fill="var(--text)">  CACHE BOOL "Enable opt")</text>
  <text x="82.1875" y="264.75" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Persists in CMakeCache.txt</text>

  <!-- Environment Variable -->
  <rect x="68.125" y="284.6875" width="346.875" height="72.5" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="82.1875" y="306.4375" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)">Environment Variable</text>
  <text x="82.1875" y="324.5625" font-family="monospace" font-size="11.0609" fill="var(--text)">set(ENV{PATH} "/opt/bin")</text>
  <text x="82.1875" y="340.875" font-family="monospace" font-size="11.0609" fill="var(--text)">message($ENV{HOME})</text>

  <!-- Variable Expansion -->
  <rect x="68.125" y="368.0625" width="346.875" height="95.1562" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="82.1875" y="389.8125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--info-accent)">Variable Expansion</text>
  <text x="82.1875" y="407.9375" font-family="monospace" font-size="11.0609" fill="var(--text)">${VAR}      - normal</text>
  <text x="82.1875" y="424.25" font-family="monospace" font-size="11.0609" fill="var(--text)">$ENV{VAR}  - environment</text>
  <text x="82.1875" y="440.5625" font-family="monospace" font-size="11.0609" fill="var(--text)">$CACHE{VAR}- cache</text>
  <text x="82.1875" y="456.875" font-family="monospace" font-size="11.0609" fill="var(--text)">${${VAR}}  - indirect ref</text>

  <!-- Control Flow Column -->
  <rect x="452.5" y="58.125" width="356.25" height="39.875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="630.625" y="83.5" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)" text-anchor="middle">Control Flow</text>

  <!-- if/elseif/else -->
  <rect x="452.5" y="108.875" width="356.25" height="99.6875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="466.5625" y="130.625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">if / elseif / else</text>
  <text x="466.5625" y="148.75" font-family="monospace" font-size="11.0609" fill="var(--text)">if(UNIX)</text>
  <text x="466.5625" y="165.0625" font-family="monospace" font-size="11.0609" fill="var(--text)">  set(PLAT "linux")</text>
  <text x="466.5625" y="181.375" font-family="monospace" font-size="11.0609" fill="var(--text)">elseif(WIN32)</text>
  <text x="466.5625" y="197.6875" font-family="monospace" font-size="11.0609" fill="var(--text)">  set(PLAT "win")</text>
  <text x="466.5625" y="200.4062" font-family="monospace" font-size="11.0609" fill="var(--text)">endif()</text>

  <!-- foreach -->
  <rect x="452.5" y="219.4375" width="356.25" height="86.0938" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="466.5625" y="241.1875" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">foreach</text>
  <text x="466.5625" y="259.3125" font-family="monospace" font-size="11.0609" fill="var(--text)">foreach(file ${SRCS})</text>
  <text x="466.5625" y="275.625" font-family="monospace" font-size="11.0609" fill="var(--text)">  message("File: ${file}")</text>
  <text x="466.5625" y="291.9375" font-family="monospace" font-size="11.0609" fill="var(--text)">endforeach()</text>

  <!-- while -->
  <rect x="452.5" y="316.4062" width="356.25" height="86.0938" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="466.5625" y="338.1562" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)">while</text>
  <text x="466.5625" y="356.2812" font-family="monospace" font-size="11.0609" fill="var(--text)">set(i 0)</text>
  <text x="466.5625" y="372.5938" font-family="monospace" font-size="11.0609" fill="var(--text)">while(i LESS 5)</text>
  <text x="466.5625" y="388.9062" font-family="monospace" font-size="11.0609" fill="var(--text)">  math(EXPR i "${i}+1")</text>
  <text x="466.5625" y="395.25" font-family="monospace" font-size="11.0609" fill="var(--text)">endwhile()</text>

  <!-- Macros vs Functions Column -->
  <rect x="846.25" y="58.125" width="365.625" height="39.875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1029.0625" y="83.5" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)" text-anchor="middle">Macros vs Functions</text>

  <!-- macro -->
  <rect x="846.25" y="108.875" width="365.625" height="99.6875" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="860.3125" y="130.625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--danger-accent)">macro()</text>
  <text x="860.3125" y="148.75" font-family="monospace" font-size="11.0609" fill="var(--text)">macro(greet name)</text>
  <text x="860.3125" y="165.0625" font-family="monospace" font-size="11.0609" fill="var(--text)">  message("Hi ${name}")</text>
  <text x="860.3125" y="181.375" font-family="monospace" font-size="11.0609" fill="var(--text)">endmacro()</text>
  <text x="860.3125" y="198.5938" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">No scope - caller variables modified</text>

  <!-- function -->
  <rect x="846.25" y="219.4375" width="365.625" height="99.6875" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="860.3125" y="241.1875" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)">function()</text>
  <text x="860.3125" y="259.3125" font-family="monospace" font-size="11.0609" fill="var(--text)">function(greet name)</text>
  <text x="860.3125" y="275.625" font-family="monospace" font-size="11.0609" fill="var(--text)">  message("Hi ${name}")</text>
  <text x="860.3125" y="291.9375" font-family="monospace" font-size="11.0609" fill="var(--text)">endfunction()</text>
  <text x="860.3125" y="309.1562" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Own scope - caller vars protected</text>

  <!-- Generator Expressions -->
  <rect x="846.25" y="330" width="365.625" height="122.3438" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="860.3125" y="351.75" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)">Generator Expressions $&lt;&gt;</text>
  <text x="860.3125" y="371.6875" font-family="monospace" font-size="11.0609" fill="var(--text)">$&lt;BUILD_INTERFACE:path&gt;</text>
  <text x="860.3125" y="388" font-family="monospace" font-size="11.0609" fill="var(--text)">$&lt;INSTALL_INTERFACE:path&gt;</text>
  <text x="860.3125" y="404.3125" font-family="monospace" font-size="11.0609" fill="var(--text)">$&lt;CONFIG:Release&gt;</text>
  <text x="860.3125" y="420.625" font-family="monospace" font-size="11.0609" fill="var(--text)">$&lt;TARGET_FILE:mylib&gt;</text>
  <text x="860.3125" y="438.75" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Evaluated at build/install time</text>

  <!-- Bottom legend -->
  <rect x="68.125" y="493.125" width="1143.75" height="108.75" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <text x="640" y="514.875" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)" text-anchor="middle">Key Rules</text>
  <text x="86.875" y="536.625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Truthiness: FALSE, OFF, NO, 0, "" or *-NOTFOUND are false; everything else is true</text>
  <text x="86.875" y="556.5625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">Lists: semicolon-separated strings  set(L a b c) == "a;b;c"</text>
  <text x="86.875" y="576.5" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">cmake_parse_arguments() parses keyword/multi-value args inside functions</text>
  <text x="86.875" y="596.4375" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--text)">PARENT_SCOPE in set() propagates a variable out of a function into the caller</text>
</svg>

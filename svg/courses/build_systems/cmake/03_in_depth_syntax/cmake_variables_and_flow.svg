<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Variable Types Column -->
  <rect x="30" y="20" width="370" height="44" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="215" y="48" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">Variable Types</text>

  <!-- Normal Variable -->
  <rect x="30" y="76" width="370" height="80" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="45" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)">Normal Variable</text>
  <text x="45" y="120" font-family="monospace" font-size="12" fill="var(--text)">set(MY_VAR "hello")</text>
  <text x="45" y="138" font-family="monospace" font-size="12" fill="var(--text)">message(${MY_VAR})</text>

  <!-- Cache Variable -->
  <rect x="30" y="168" width="370" height="90" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="45" y="192" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">Cache Variable</text>
  <text x="45" y="212" font-family="monospace" font-size="12" fill="var(--text)">set(MYOPT "OFF"</text>
  <text x="45" y="230" font-family="monospace" font-size="12" fill="var(--text)">  CACHE BOOL "Enable opt")</text>
  <text x="45" y="248" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Persists in CMakeCache.txt</text>

  <!-- Environment Variable -->
  <rect x="30" y="270" width="370" height="80" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="45" y="294" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)">Environment Variable</text>
  <text x="45" y="314" font-family="monospace" font-size="12" fill="var(--text)">set(ENV{PATH} "/opt/bin")</text>
  <text x="45" y="332" font-family="monospace" font-size="12" fill="var(--text)">message($ENV{HOME})</text>

  <!-- Variable Expansion -->
  <rect x="30" y="362" width="370" height="105" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="45" y="386" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-accent)">Variable Expansion</text>
  <text x="45" y="406" font-family="monospace" font-size="12" fill="var(--text)">${VAR}      - normal</text>
  <text x="45" y="424" font-family="monospace" font-size="12" fill="var(--text)">$ENV{VAR}  - environment</text>
  <text x="45" y="442" font-family="monospace" font-size="12" fill="var(--text)">$CACHE{VAR}- cache</text>
  <text x="45" y="460" font-family="monospace" font-size="12" fill="var(--text)">${${VAR}}  - indirect ref</text>

  <!-- Control Flow Column -->
  <rect x="440" y="20" width="380" height="44" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="630" y="48" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">Control Flow</text>

  <!-- if/elseif/else -->
  <rect x="440" y="76" width="380" height="110" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="455" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)">if / elseif / else</text>
  <text x="455" y="120" font-family="monospace" font-size="12" fill="var(--text)">if(UNIX)</text>
  <text x="455" y="138" font-family="monospace" font-size="12" fill="var(--text)">  set(PLAT "linux")</text>
  <text x="455" y="156" font-family="monospace" font-size="12" fill="var(--text)">elseif(WIN32)</text>
  <text x="455" y="174" font-family="monospace" font-size="12" fill="var(--text)">  set(PLAT "win")</text>
  <text x="455" y="177" font-family="monospace" font-size="12" fill="var(--text)">endif()</text>

  <!-- foreach -->
  <rect x="440" y="198" width="380" height="95" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="455" y="222" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">foreach</text>
  <text x="455" y="242" font-family="monospace" font-size="12" fill="var(--text)">foreach(file ${SRCS})</text>
  <text x="455" y="260" font-family="monospace" font-size="12" fill="var(--text)">  message("File: ${file}")</text>
  <text x="455" y="278" font-family="monospace" font-size="12" fill="var(--text)">endforeach()</text>

  <!-- while -->
  <rect x="440" y="305" width="380" height="95" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="455" y="329" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)">while</text>
  <text x="455" y="349" font-family="monospace" font-size="12" fill="var(--text)">set(i 0)</text>
  <text x="455" y="367" font-family="monospace" font-size="12" fill="var(--text)">while(i LESS 5)</text>
  <text x="455" y="385" font-family="monospace" font-size="12" fill="var(--text)">  math(EXPR i "${i}+1")</text>
  <text x="455" y="392" font-family="monospace" font-size="12" fill="var(--text)">endwhile()</text>

  <!-- Macros vs Functions Column -->
  <rect x="860" y="20" width="390" height="44" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1055" y="48" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">Macros vs Functions</text>

  <!-- macro -->
  <rect x="860" y="76" width="390" height="110" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="875" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-accent)">macro()</text>
  <text x="875" y="120" font-family="monospace" font-size="12" fill="var(--text)">macro(greet name)</text>
  <text x="875" y="138" font-family="monospace" font-size="12" fill="var(--text)">  message("Hi ${name}")</text>
  <text x="875" y="156" font-family="monospace" font-size="12" fill="var(--text)">endmacro()</text>
  <text x="875" y="175" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">No scope - caller variables modified</text>

  <!-- function -->
  <rect x="860" y="198" width="390" height="110" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="875" y="222" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">function()</text>
  <text x="875" y="242" font-family="monospace" font-size="12" fill="var(--text)">function(greet name)</text>
  <text x="875" y="260" font-family="monospace" font-size="12" fill="var(--text)">  message("Hi ${name}")</text>
  <text x="875" y="278" font-family="monospace" font-size="12" fill="var(--text)">endfunction()</text>
  <text x="875" y="297" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Own scope - caller vars protected</text>

  <!-- Generator Expressions -->
  <rect x="860" y="320" width="390" height="135" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="875" y="344" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)">Generator Expressions $&lt;&gt;</text>
  <text x="875" y="366" font-family="monospace" font-size="12" fill="var(--text)">$&lt;BUILD_INTERFACE:path&gt;</text>
  <text x="875" y="384" font-family="monospace" font-size="12" fill="var(--text)">$&lt;INSTALL_INTERFACE:path&gt;</text>
  <text x="875" y="402" font-family="monospace" font-size="12" fill="var(--text)">$&lt;CONFIG:Release&gt;</text>
  <text x="875" y="420" font-family="monospace" font-size="12" fill="var(--text)">$&lt;TARGET_FILE:mylib&gt;</text>
  <text x="875" y="440" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Evaluated at build/install time</text>

  <!-- Bottom legend -->
  <rect x="30" y="500" width="1220" height="120" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <text x="640" y="524" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)" text-anchor="middle">Key Rules</text>
  <text x="50" y="548" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Truthiness: FALSE, OFF, NO, 0, "" or *-NOTFOUND are false; everything else is true</text>
  <text x="50" y="570" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Lists: semicolon-separated strings  set(L a b c) == "a;b;c"</text>
  <text x="50" y="592" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">cmake_parse_arguments() parses keyword/multi-value args inside functions</text>
  <text x="50" y="614" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">PARENT_SCOPE in set() propagates a variable out of a function into the caller</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.198779106895" font-weight="bold" fill="var(--primary-accent)">CMake Variables and Flow</text>

  <rect x="40" y="72.830188679245" width="380" height="547.169811320755" rx="8.368855109814" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="116.603773584906" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--primary-text)">Variables</text>

  <text x="60" y="165.849056603774" font-family="Arial, sans-serif" font-size="14.645496442174" font-weight="bold" fill="var(--primary-text)">Normal</text>
  <text x="60" y="193.207547169811" font-family="Courier New, monospace" font-size="13.599389553447" fill="var(--primary-text)">set(V "hello")</text>
  <text x="60" y="220.566037735849" font-family="Courier New, monospace" font-size="13.599389553447" fill="var(--primary-text)">message(${V})</text>

  <text x="60" y="269.811320754717" font-family="Arial, sans-serif" font-size="14.645496442174" font-weight="bold" fill="var(--primary-text)">Cache</text>
  <text x="60" y="297.169811320755" font-family="Courier New, monospace" font-size="13.599389553447" fill="var(--primary-text)">set(O OFF CACHE BOOL "")</text>

  <text x="60" y="346.415094339623" font-family="Arial, sans-serif" font-size="14.645496442174" font-weight="bold" fill="var(--primary-text)">Environment</text>
  <text x="60" y="373.77358490566" font-family="Courier New, monospace" font-size="13.599389553447" fill="var(--primary-text)">$ENV{HOME}</text>

  <text x="60" y="423.018867924528" font-family="Arial, sans-serif" font-size="14.645496442174" font-weight="bold" fill="var(--primary-text)">Expansion</text>
  <text x="60" y="450.377358490566" font-family="Courier New, monospace" font-size="12.553282664721" fill="var(--primary-text)">${VAR} normal</text>
  <text x="60" y="477.735849056604" font-family="Courier New, monospace" font-size="12.553282664721" fill="var(--primary-text)">$CACHE{V} cache</text>
  <text x="60" y="505.094339622642" font-family="Courier New, monospace" font-size="12.553282664721" fill="var(--primary-text)">${${V}} indirect</text>

  <rect x="450" y="72.830188679245" width="380" height="547.169811320755" rx="8.368855109814" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="116.603773584906" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--ok-text)">Control Flow</text>

  <text x="470" y="165.849056603774" font-family="Arial, sans-serif" font-size="14.645496442174" font-weight="bold" fill="var(--ok-text)">if / elseif / else</text>
  <text x="470" y="193.207547169811" font-family="Courier New, monospace" font-size="12.553282664721" fill="var(--ok-text)">if(UNIX) ... elseif(WIN32)</text>
  <text x="470" y="215.094339622641" font-family="Courier New, monospace" font-size="12.553282664721" fill="var(--ok-text)">... endif()</text>

  <text x="470" y="280.754716981132" font-family="Arial, sans-serif" font-size="14.645496442174" font-weight="bold" fill="var(--ok-text)">foreach</text>
  <text x="470" y="308.11320754717" font-family="Courier New, monospace" font-size="12.553282664721" fill="var(--ok-text)">foreach(f ${SRCS})</text>
  <text x="470" y="330" font-family="Courier New, monospace" font-size="12.553282664721" fill="var(--ok-text)">... endforeach()</text>

  <text x="470" y="395.660377358491" font-family="Arial, sans-serif" font-size="14.645496442174" font-weight="bold" fill="var(--ok-text)">while</text>
  <text x="470" y="423.018867924528" font-family="Courier New, monospace" font-size="12.553282664721" fill="var(--ok-text)">while(i LESS 5)</text>
  <text x="470" y="444.905660377359" font-family="Courier New, monospace" font-size="12.553282664721" fill="var(--ok-text)">... endwhile()</text>

  <text x="470" y="505.094339622642" font-family="Arial, sans-serif" font-size="14.645496442174" font-weight="bold" fill="var(--ok-text)">Lists</text>
  <text x="470" y="532.452830188679" font-family="Courier New, monospace" font-size="12.553282664721" fill="var(--ok-text)">semicolon-separated</text>

  <rect x="860" y="72.830188679245" width="380" height="268.11320754717" rx="8.368855109814" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="116.603773584906" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--danger-text)">macro vs function</text>
  <text x="880" y="160.377358490566" font-family="Courier New, monospace" font-size="12.553282664721" fill="var(--danger-text)">macro(): no scope</text>
  <text x="880" y="204.150943396226" font-family="Courier New, monospace" font-size="12.553282664721" fill="var(--danger-text)">function(): own scope</text>
  <text x="880" y="258.867924528302" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--danger-text)">PARENT_SCOPE propagates</text>
  <text x="880" y="302.641509433962" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--danger-text)">cmake_parse_arguments</text>

  <rect x="860" y="362.830188679245" width="380" height="257.169811320755" rx="8.368855109814" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="406.603773584906" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--info-text)">Generator Expressions</text>
  <text x="880" y="450.377358490566" font-family="Courier New, monospace" font-size="12.553282664721" fill="var(--info-text)">$&lt;BUILD_INTERFACE:p&gt;</text>
  <text x="880" y="483.207547169811" font-family="Courier New, monospace" font-size="12.553282664721" fill="var(--info-text)">$&lt;CONFIG:Release&gt;</text>
  <text x="880" y="516.037735849057" font-family="Courier New, monospace" font-size="12.553282664721" fill="var(--info-text)">$&lt;TARGET_FILE:lib&gt;</text>
  <text x="880" y="565.283018867925" font-family="Arial, sans-serif" font-size="13.599389553447" fill="var(--info-text)">Eval at build/install time</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1018"/>
      <stop offset="100%" style="stop-color:#1a2028"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- CMake triangle logo stylized -->
  <polygon points="400,60 500,220 300,220" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.7"/>
  <polygon points="400,90 480,210 320,210" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  <polygon points="400,120 460,200 340,200" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.4"/>
  <!-- Inner triangle fill -->
  <polygon points="400,100 470,205 330,205" fill="#ef4444" opacity="0.08"/>
  <!-- Source files (left) -->
  <rect x="100" y="120" width="60" height="45" rx="3" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
  <text x="112" y="148" font-family="monospace" font-size="10" fill="#3b82f6" opacity="0.8">.cpp</text>
  <rect x="100" y="180" width="60" height="45" rx="3" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
  <text x="118" y="208" font-family="monospace" font-size="10" fill="#3b82f6" opacity="0.8">.h</text>
  <!-- Build output (right) -->
  <rect x="640" y="120" width="60" height="45" rx="3" fill="#1e293b" stroke="#22c55e" stroke-width="1" opacity="0.6"/>
  <text x="652" y="148" font-family="monospace" font-size="10" fill="#22c55e" opacity="0.8">.exe</text>
  <rect x="640" y="180" width="60" height="45" rx="3" fill="#1e293b" stroke="#22c55e" stroke-width="1" opacity="0.6"/>
  <text x="656" y="208" font-family="monospace" font-size="10" fill="#22c55e" opacity="0.8">.so</text>
  <!-- Arrows from source to cmake to output -->
  <line x1="165" y1="145" x2="295" y2="170" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
  <line x1="165" y1="200" x2="295" y2="185" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
  <line x1="505" y1="170" x2="635" y2="145" stroke="#22c55e" stroke-width="1.5" opacity="0.4"/>
  <line x1="505" y1="185" x2="635" y2="200" stroke="#22c55e" stroke-width="1.5" opacity="0.4"/>
  <!-- CMakeLists.txt representation -->
  <rect x="320" y="260" width="160" height="60" rx="5" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" opacity="0.7"/>
  <text x="335" y="282" font-family="monospace" font-size="10" fill="#ef4444" opacity="0.7">CMakeLists.txt</text>
  <rect x="335" y="293" width="80" height="4" rx="2" fill="#3b82f6" opacity="0.4"/>
  <rect x="335" y="303" width="60" height="4" rx="2" fill="#22c55e" opacity="0.3"/>
  <!-- Gear/build icon -->
  <circle cx="400" cy="155" r="15" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.5"/>
  <circle cx="400" cy="155" r="6" fill="#ef4444" opacity="0.3"/>
  <!-- Decorative dots -->
  <circle cx="80" cy="60" r="2" fill="#ef4444" opacity="0.3"/>
  <circle cx="720" cy="70" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="80" cy="360" r="2" fill="#3b82f6" opacity="0.3"/>
  <circle cx="720" cy="360" r="2" fill="#ef4444" opacity="0.3"/>
  <!-- Bottom accent -->
  <rect x="250" y="375" width="300" height="3" rx="1.5" fill="url(#accent)" opacity="0.6"/>
</svg>

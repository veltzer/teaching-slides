<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#1a1a2e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#e74c3c" />
      <stop offset="100%" style="stop-color:#4285f4" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <polygon points="568.8889,96 711.1111,352 426.6667,352" fill="none" stroke="var(--danger-border)" stroke-width="4.2667" opacity="0.7" />
  <polygon points="568.8889,144 682.6667,336 455.1111,336" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" opacity="0.5" />
  <polygon points="568.8889,192 654.2222,320 483.5556,320" fill="none" stroke="var(--ok-border)" stroke-width="2.1333" opacity="0.4" />
  <polygon points="568.8889,160 668.4444,328 469.3333,328" fill="var(--danger-fill)" opacity="0.08" />
  <rect x="142.2222" y="192" width="85.3333" height="72" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1.4222" opacity="0.6" />
  <text x="159.2889" y="236.8" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)" opacity="0.8">.cpp</text>
  <rect x="142.2222" y="288" width="85.3333" height="72" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1.4222" opacity="0.6" />
  <text x="167.8222" y="332.8" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)" opacity="0.8">.h</text>
  <rect x="910.2222" y="192" width="85.3333" height="72" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.6" />
  <text x="927.2889" y="236.8" font-family="monospace" font-size="14.2222" fill="var(--ok-accent)" opacity="0.8">.exe</text>
  <rect x="910.2222" y="288" width="85.3333" height="72" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.6" />
  <text x="932.9778" y="332.8" font-family="monospace" font-size="14.2222" fill="var(--ok-accent)" opacity="0.8">.so</text>
  <line x1="234.6667" y1="232" x2="419.5556" y2="272" stroke="var(--primary-border)" stroke-width="2" opacity="0.4" />
  <line x1="234.6667" y1="320" x2="419.5556" y2="296" stroke="var(--primary-border)" stroke-width="2" opacity="0.4" />
  <line x1="718.2222" y1="272" x2="903.1111" y2="232" stroke="var(--ok-border)" stroke-width="2" opacity="0.4" />
  <line x1="718.2222" y1="296" x2="903.1111" y2="320" stroke="var(--ok-border)" stroke-width="2" opacity="0.4" />
  <rect x="455.1111" y="416" width="227.5556" height="96" rx="6" fill="var(--code-bg)" stroke="var(--danger-border)" stroke-width="2.1333" opacity="0.7" />
  <text x="476.4444" y="451.2" font-family="monospace" font-size="14.2222" fill="var(--danger-accent)" opacity="0.7">CMakeLists.txt</text>
  <rect x="476.4444" y="468.8" width="113.7778" height="6.4" rx="6" fill="var(--primary-fill)" opacity="0.4" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="476.4444" y="484.8" width="85.3333" height="6.4" rx="6" fill="var(--ok-fill)" opacity="0.3" stroke="var(--ok-border)" stroke-width="2"/>
  <circle cx="568.8889" cy="248" r="21.3333" fill="none" stroke="var(--danger-border)" stroke-width="2.1333" opacity="0.5" />
  <circle cx="568.8889" cy="248" r="8.5333" fill="var(--danger-fill)" opacity="0.3" />
  <circle cx="113.7778" cy="96" r="2.8444" fill="var(--danger-fill)" opacity="0.3" />
  <circle cx="1024" cy="112" r="4.2667" fill="var(--primary-fill)" opacity="0.3" />
  <circle cx="113.7778" cy="576" r="2.8444" fill="var(--primary-fill)" opacity="0.3" />
  <circle cx="1024" cy="576" r="2.8444" fill="var(--danger-fill)" opacity="0.3" />
  <rect x="355.5556" y="600" width="426.6667" height="4.8" rx="6" fill="url(#accent)" opacity="0.6" />
</svg>
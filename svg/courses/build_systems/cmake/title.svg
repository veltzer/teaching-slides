<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <polygon points="640,127 790,359 490,359" fill="none" stroke="var(--danger-border)" stroke-width="4.2667" opacity="0.7"/>
  <polygon points="640,170.5 760,344.5 520,344.5" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" opacity="0.5"/>
  <polygon points="640,214 730,330 550,330" fill="none" stroke="var(--ok-border)" stroke-width="2.1333" opacity="0.4"/>
  <polygon points="640,185 744.9999,337.25 535,337.25" fill="var(--danger-fill)" opacity="0.08"/>
  <rect x="190" y="214" width="90" height="65.25" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1.4222" opacity="0.6"/>
  <text x="208" y="254.6" font-size="13.9044" fill="var(--primary-accent)" opacity="0.8" font-family="Courier New, monospace">.cpp</text>
  <rect x="190" y="301" width="90" height="65.25" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1.4222" opacity="0.6"/>
  <text x="217" y="341.6" font-size="13.9044" fill="var(--primary-accent)" opacity="0.8" font-family="Courier New, monospace">.h</text>
  <rect x="1000" y="214" width="90" height="65.25" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.6"/>
  <text x="1018" y="254.6" font-size="13.9044" fill="var(--ok-accent)" opacity="0.8" font-family="Courier New, monospace">.exe</text>
  <rect x="1000" y="301" width="90" height="65.25" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.6"/>
  <text x="1024" y="341.6" font-size="13.9044" fill="var(--ok-accent)" opacity="0.8" font-family="Courier New, monospace">.so</text>
  <line x1="287.5" y1="250.25" x2="482.5" y2="286.5" stroke="var(--primary-border)" stroke-width="2" opacity="0.4"/>
  <line x1="287.5" y1="330" x2="482.5" y2="308.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.4"/>
  <line x1="797.5" y1="286.5" x2="992.5" y2="250.25" stroke="var(--ok-border)" stroke-width="2" opacity="0.4"/>
  <line x1="797.5" y1="308.25" x2="992.5" y2="330" stroke="var(--ok-border)" stroke-width="2" opacity="0.4"/>
  <rect x="520" y="417" width="240" height="87" rx="6" fill="var(--code-bg)" stroke="var(--danger-border)" stroke-width="2.1333" opacity="0.7"/>
  <text x="542.4999" y="448.9" font-size="13.9044" fill="var(--danger-accent)" opacity="0.7" font-family="Courier New, monospace">CMakeLists.txt</text>
  <rect x="542.4999" y="464.85" width="120" height="5.8" rx="6" fill="url(#grad-primary)" opacity="0.4" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="542.4999" y="479.35" width="90" height="5.8" rx="6" fill="url(#grad-ok)" opacity="0.3" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="640" cy="264.75" r="20.8566" fill="none" stroke="var(--danger-border)" stroke-width="2.1333" opacity="0.5"/>
  <circle cx="640" cy="264.75" r="8.3426" fill="var(--danger-fill)" opacity="0.3"/>
  <circle cx="160" cy="127" r="2.7808" fill="var(--danger-fill)" opacity="0.3"/>
  <circle cx="1120" cy="141.5" r="4.1714" fill="var(--primary-fill)" opacity="0.3"/>
  <circle cx="160" cy="562" r="2.7808" fill="var(--primary-fill)" opacity="0.3"/>
  <circle cx="1120" cy="562" r="2.7808" fill="var(--danger-fill)" opacity="0.3"/>
  <rect x="415" y="583.75" width="450" height="4.35" rx="6" fill="url(#accent)" opacity="0.6"/>
</svg>

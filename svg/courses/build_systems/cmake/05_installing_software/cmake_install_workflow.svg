<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1e88e5"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Header -->
  <rect x="30" y="14" width="1220" height="44" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">cmake --install . --prefix /opt/myproject</text>

  <!-- Step flow: 3 boxes + arrows -->
  <!-- Box 1: CMakeLists.txt -->
  <rect x="30" y="74" width="340" height="200" rx="5" fill="#e3f2fd" filter="url(#shadow)"/>
  <text x="200" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0" text-anchor="middle">1. Declare Install Rules</text>
  <text x="45" y="120" font-family="monospace" font-size="11" fill="#333333">include(GNUInstallDirs)</text>
  <text x="45" y="140" font-family="monospace" font-size="11" fill="#333333">install(TARGETS mylib myapp</text>
  <text x="60" y="158" font-family="monospace" font-size="11" fill="#333333">  RUNTIME DESTINATION</text>
  <text x="75" y="176" font-family="monospace" font-size="11" fill="#333333">    ${CMAKE_INSTALL_BINDIR}</text>
  <text x="60" y="194" font-family="monospace" font-size="11" fill="#333333">  LIBRARY DESTINATION</text>
  <text x="75" y="212" font-family="monospace" font-size="11" fill="#333333">    ${CMAKE_INSTALL_LIBDIR}</text>
  <text x="60" y="230" font-family="monospace" font-size="11" fill="#333333">  ARCHIVE DESTINATION</text>
  <text x="75" y="248" font-family="monospace" font-size="11" fill="#333333">    ${CMAKE_INSTALL_LIBDIR})</text>

  <!-- Arrow 1 -->
  <line x1="375" y1="174" x2="430" y2="174" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: Headers + Files -->
  <rect x="435" y="74" width="380" height="200" rx="5" fill="#e8f5e9" filter="url(#shadow)"/>
  <text x="625" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">2. Install Headers &amp;amp; Files</text>
  <text x="450" y="120" font-family="monospace" font-size="11" fill="#333333">install(FILES include/mylib.h</text>
  <text x="465" y="138" font-family="monospace" font-size="11" fill="#333333">  DESTINATION ${CMAKE_INSTALL_INCLUDEDIR}</text>
  <text x="450" y="156" font-family="monospace" font-size="11" fill="#333333">)</text>
  <text x="450" y="178" font-family="monospace" font-size="11" fill="#333333">install(DIRECTORY include/</text>
  <text x="465" y="196" font-family="monospace" font-size="11" fill="#333333">  DESTINATION ${CMAKE_INSTALL_INCLUDEDIR}</text>
  <text x="465" y="214" font-family="monospace" font-size="11" fill="#333333">  FILES_MATCHING PATTERN "*.h"</text>
  <text x="450" y="232" font-family="monospace" font-size="11" fill="#333333">)</text>

  <!-- Arrow 2 -->
  <line x1="820" y1="174" x2="875" y2="174" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: Run install -->
  <rect x="880" y="74" width="370" height="200" rx="5" fill="#fff3e0" filter="url(#shadow)"/>
  <text x="1065" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e65100" text-anchor="middle">3. Run Install</text>
  <text x="895" y="120" font-family="monospace" font-size="11" fill="#333333">cmake -B build -S .</text>
  <text x="895" y="138" font-family="monospace" font-size="11" fill="#333333">cmake --build build</text>
  <text x="895" y="156" font-family="monospace" font-size="11" fill="#333333">cmake --install build</text>
  <text x="895" y="178" font-family="Arial, sans-serif" font-size="11" fill="#888888">or override prefix:</text>
  <text x="895" y="198" font-family="monospace" font-size="11" fill="#333333">cmake --install build \</text>
  <text x="910" y="216" font-family="monospace" font-size="11" fill="#333333">  --prefix /opt/mylib</text>
  <text x="895" y="238" font-family="monospace" font-size="11" fill="#333333">make install  (classic)</text>

  <!-- GNUInstallDirs table -->
  <rect x="30" y="292" width="600" height="258" rx="5" fill="#f5f5f5" filter="url(#shadow)"/>
  <text x="330" y="316" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">GNUInstallDirs Standard Paths</text>

  <rect x="40" y="326" width="580" height="28" rx="3" fill="#1e88e5"/>
  <text x="130" y="345" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Variable</text>
  <text x="390" y="345" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Default Value</text>

  <text x="50" y="370" font-family="monospace" font-size="11" fill="#333333">CMAKE_INSTALL_BINDIR</text>
  <text x="330" y="370" font-family="monospace" font-size="11" fill="#555555">bin</text>
  <text x="50" y="392" font-family="monospace" font-size="11" fill="#333333">CMAKE_INSTALL_LIBDIR</text>
  <text x="330" y="392" font-family="monospace" font-size="11" fill="#555555">lib  (or lib64 on 64-bit)</text>
  <text x="50" y="414" font-family="monospace" font-size="11" fill="#333333">CMAKE_INSTALL_INCLUDEDIR</text>
  <text x="330" y="414" font-family="monospace" font-size="11" fill="#555555">include</text>
  <text x="50" y="436" font-family="monospace" font-size="11" fill="#333333">CMAKE_INSTALL_DATADIR</text>
  <text x="330" y="436" font-family="monospace" font-size="11" fill="#555555">share</text>
  <text x="50" y="458" font-family="monospace" font-size="11" fill="#333333">CMAKE_INSTALL_MANDIR</text>
  <text x="330" y="458" font-family="monospace" font-size="11" fill="#555555">share/man</text>
  <text x="50" y="480" font-family="monospace" font-size="11" fill="#333333">CMAKE_INSTALL_DOCDIR</text>
  <text x="330" y="480" font-family="monospace" font-size="11" fill="#555555">share/doc/&lt;name&gt;</text>
  <text x="50" y="502" font-family="monospace" font-size="11" fill="#333333">CMAKE_INSTALL_SYSCONFDIR</text>
  <text x="330" y="502" font-family="monospace" font-size="11" fill="#555555">etc</text>
  <text x="50" y="524" font-family="Arial, sans-serif" font-size="11" fill="#888888">All relative to CMAKE_INSTALL_PREFIX (default: /usr/local)</text>

  <!-- Component packaging -->
  <rect x="650" y="292" width="600" height="258" rx="5" fill="#e3f2fd" filter="url(#shadow)"/>
  <text x="950" y="316" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0" text-anchor="middle">Component-Based Installation</text>
  <text x="665" y="340" font-family="monospace" font-size="11" fill="#333333">install(TARGETS mylib myapp</text>
  <text x="680" y="358" font-family="monospace" font-size="11" fill="#333333">  RUNTIME DESTINATION bin</text>
  <text x="695" y="376" font-family="monospace" font-size="11" fill="#333333">    COMPONENT Runtime</text>
  <text x="680" y="394" font-family="monospace" font-size="11" fill="#333333">  LIBRARY DESTINATION lib</text>
  <text x="695" y="412" font-family="monospace" font-size="11" fill="#333333">    COMPONENT Runtime</text>
  <text x="680" y="430" font-family="monospace" font-size="11" fill="#333333">  ARCHIVE DESTINATION lib</text>
  <text x="695" y="448" font-family="monospace" font-size="11" fill="#333333">    COMPONENT Development</text>
  <text x="680" y="466" font-family="monospace" font-size="11" fill="#333333">  INCLUDES DESTINATION include</text>
  <text x="695" y="484" font-family="monospace" font-size="11" fill="#333333">    COMPONENT Development</text>
  <text x="665" y="506" font-family="monospace" font-size="11" fill="#333333">)</text>
  <text x="665" y="530" font-family="Arial, sans-serif" font-size="11" fill="#555555">cmake --install build --component Runtime</text>
</svg>

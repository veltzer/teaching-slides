<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <!-- Header -->
  <rect x="40" y="40" width="1200" height="47.61194" rx="6.715586" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="70.298507" font-family="Arial, sans-serif" font-size="18.570162" font-weight="bold" fill="var(--bg)" text-anchor="middle">cmake --install . --prefix /opt/myproject</text>

  <!-- Step flow: 3 boxes + arrows -->
  <!-- Box 1: CMakeLists.txt -->
  <rect x="40" y="104.925373" width="334.42623" height="216.41791" rx="6.715586" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="207.213115" y="130.895522" font-family="Arial, sans-serif" font-size="14.443435" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">1. Declare Install Rules</text>
  <text x="54.754098" y="154.701493" font-family="monospace" font-size="11.348445" fill="var(--text)">include(GNUInstallDirs)</text>
  <text x="54.754098" y="176.343284" font-family="monospace" font-size="11.348445" fill="var(--text)">install(TARGETS mylib myapp</text>
  <text x="69.508197" y="195.820896" font-family="monospace" font-size="11.348445" fill="var(--text)">  RUNTIME DESTINATION</text>
  <text x="84.262295" y="215.298507" font-family="monospace" font-size="11.348445" fill="var(--text)">    ${CMAKE_INSTALL_BINDIR}</text>
  <text x="69.508197" y="234.776119" font-family="monospace" font-size="11.348445" fill="var(--text)">  LIBRARY DESTINATION</text>
  <text x="84.262295" y="254.253731" font-family="monospace" font-size="11.348445" fill="var(--text)">    ${CMAKE_INSTALL_LIBDIR}</text>
  <text x="69.508197" y="273.731343" font-family="monospace" font-size="11.348445" fill="var(--text)">  ARCHIVE DESTINATION</text>
  <text x="84.262295" y="293.208955" font-family="monospace" font-size="11.348445" fill="var(--text)">    ${CMAKE_INSTALL_LIBDIR})</text>

  <!-- Arrow 1 -->
  <line x1="379.344262" y1="213.134328" x2="433.442623" y2="213.134328" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: Headers + Files -->
  <rect x="438.360656" y="104.925373" width="373.770492" height="216.41791" rx="6.715586" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="625.245902" y="130.895522" font-family="Arial, sans-serif" font-size="14.443435" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">2. Install Headers &amp;amp; Files</text>
  <text x="453.114754" y="154.701493" font-family="monospace" font-size="11.348445" fill="var(--text)">install(FILES include/mylib.h</text>
  <text x="467.868852" y="174.179104" font-family="monospace" font-size="11.348445" fill="var(--text)">  DESTINATION ${CMAKE_INSTALL_INCLUDEDIR}</text>
  <text x="453.114754" y="193.656716" font-family="monospace" font-size="11.348445" fill="var(--text)">)</text>
  <text x="453.114754" y="217.462687" font-family="monospace" font-size="11.348445" fill="var(--text)">install(DIRECTORY include/</text>
  <text x="467.868852" y="236.940299" font-family="monospace" font-size="11.348445" fill="var(--text)">  DESTINATION ${CMAKE_INSTALL_INCLUDEDIR}</text>
  <text x="467.868852" y="256.41791" font-family="monospace" font-size="11.348445" fill="var(--text)">  FILES_MATCHING PATTERN "*.h"</text>
  <text x="453.114754" y="275.895522" font-family="monospace" font-size="11.348445" fill="var(--text)">)</text>

  <!-- Arrow 2 -->
  <line x1="817.04918" y1="213.134328" x2="871.147541" y2="213.134328" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: Run install -->
  <rect x="876.065574" y="104.925373" width="363.934426" height="216.41791" rx="6.715586" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1058.032787" y="130.895522" font-family="Arial, sans-serif" font-size="14.443435" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">3. Run Install</text>
  <text x="890.819672" y="154.701493" font-family="monospace" font-size="11.348445" fill="var(--text)">cmake -B build -S .</text>
  <text x="890.819672" y="174.179104" font-family="monospace" font-size="11.348445" fill="var(--text)">cmake --build build</text>
  <text x="890.819672" y="193.656716" font-family="monospace" font-size="11.348445" fill="var(--text)">cmake --install build</text>
  <text x="890.819672" y="217.462687" font-family="Arial, sans-serif" font-size="11.348445" fill="var(--text-faint)">or override prefix:</text>
  <text x="890.819672" y="239.104478" font-family="monospace" font-size="11.348445" fill="var(--text)">cmake --install build \</text>
  <text x="905.57377" y="258.58209" font-family="monospace" font-size="11.348445" fill="var(--text)">  --prefix /opt/mylib</text>
  <text x="890.819672" y="282.38806" font-family="monospace" font-size="11.348445" fill="var(--text)">make install  (classic)</text>

  <!-- GNUInstallDirs table -->
  <rect x="40" y="340.820896" width="590.163934" height="279.179104" rx="6.715586" fill="var(--surface)"/>
  <text x="335.081967" y="366.791045" font-family="Arial, sans-serif" font-size="14.443435" font-weight="bold" fill="var(--text)" text-anchor="middle">GNUInstallDirs Standard Paths</text>

  <rect x="49.836066" y="377.61194" width="570.491803" height="30.298507" rx="6.715586" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="138.360656" y="398.171582" font-family="Arial, sans-serif" font-size="12.380071" font-weight="bold" fill="var(--bg)" text-anchor="middle">Variable</text>
  <text x="394.098361" y="398.171582" font-family="Arial, sans-serif" font-size="12.380071" font-weight="bold" fill="var(--bg)" text-anchor="middle">Default Value</text>

  <text x="59.672131" y="425.223881" font-family="monospace" font-size="11.348445" fill="var(--text)">CMAKE_INSTALL_BINDIR</text>
  <text x="335.081967" y="425.223881" font-family="monospace" font-size="11.348445" fill="var(--text-muted)">bin</text>
  <text x="59.672131" y="449.029851" font-family="monospace" font-size="11.348445" fill="var(--text)">CMAKE_INSTALL_LIBDIR</text>
  <text x="335.081967" y="449.029851" font-family="monospace" font-size="11.348445" fill="var(--text-muted)">lib  (or lib64 on 64-bit)</text>
  <text x="59.672131" y="472.835821" font-family="monospace" font-size="11.348445" fill="var(--text)">CMAKE_INSTALL_INCLUDEDIR</text>
  <text x="335.081967" y="472.835821" font-family="monospace" font-size="11.348445" fill="var(--text-muted)">include</text>
  <text x="59.672131" y="496.641791" font-family="monospace" font-size="11.348445" fill="var(--text)">CMAKE_INSTALL_DATADIR</text>
  <text x="335.081967" y="496.641791" font-family="monospace" font-size="11.348445" fill="var(--text-muted)">share</text>
  <text x="59.672131" y="520.447761" font-family="monospace" font-size="11.348445" fill="var(--text)">CMAKE_INSTALL_MANDIR</text>
  <text x="335.081967" y="520.447761" font-family="monospace" font-size="11.348445" fill="var(--text-muted)">share/man</text>
  <text x="59.672131" y="544.253731" font-family="monospace" font-size="11.348445" fill="var(--text)">CMAKE_INSTALL_DOCDIR</text>
  <text x="335.081967" y="544.253731" font-family="monospace" font-size="11.348445" fill="var(--text-muted)">share/doc/&lt;name&gt;</text>
  <text x="59.672131" y="568.059701" font-family="monospace" font-size="11.348445" fill="var(--text)">CMAKE_INSTALL_SYSCONFDIR</text>
  <text x="335.081967" y="568.059701" font-family="monospace" font-size="11.348445" fill="var(--text-muted)">etc</text>
  <text x="59.672131" y="591.865672" font-family="Arial, sans-serif" font-size="11.348445" fill="var(--text-faint)">All relative to CMAKE_INSTALL_PREFIX (default: /usr/local)</text>

  <!-- Component packaging -->
  <rect x="649.836066" y="340.820896" width="590.163934" height="279.179104" rx="6.715586" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="944.918033" y="366.791045" font-family="Arial, sans-serif" font-size="14.443435" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Component-Based Installation</text>
  <text x="664.590164" y="392.761194" font-family="monospace" font-size="11.348445" fill="var(--text)">install(TARGETS mylib myapp</text>
  <text x="679.344262" y="412.238806" font-family="monospace" font-size="11.348445" fill="var(--text)">  RUNTIME DESTINATION bin</text>
  <text x="694.098361" y="431.716418" font-family="monospace" font-size="11.348445" fill="var(--text)">    COMPONENT Runtime</text>
  <text x="679.344262" y="451.19403" font-family="monospace" font-size="11.348445" fill="var(--text)">  LIBRARY DESTINATION lib</text>
  <text x="694.098361" y="470.671642" font-family="monospace" font-size="11.348445" fill="var(--text)">    COMPONENT Runtime</text>
  <text x="679.344262" y="490.149254" font-family="monospace" font-size="11.348445" fill="var(--text)">  ARCHIVE DESTINATION lib</text>
  <text x="694.098361" y="509.626866" font-family="monospace" font-size="11.348445" fill="var(--text)">    COMPONENT Development</text>
  <text x="679.344262" y="529.104478" font-family="monospace" font-size="11.348445" fill="var(--text)">  INCLUDES DESTINATION include</text>
  <text x="694.098361" y="548.58209" font-family="monospace" font-size="11.348445" fill="var(--text)">    COMPONENT Development</text>
  <text x="664.590164" y="572.38806" font-family="monospace" font-size="11.348445" fill="var(--text)">)</text>
  <text x="664.590164" y="598.358209" font-family="Arial, sans-serif" font-size="11.348445" fill="var(--text-muted)">cmake --install build --component Runtime</text>
</svg>

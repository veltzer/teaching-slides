<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Header -->
  <rect x="68.125" y="52.6875" width="1143.75" height="39.875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="78.0625" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)" text-anchor="middle">cmake --install . --prefix /opt/myproject</text>

  <!-- Step flow: 3 boxes + arrows -->
  <!-- Box 1: CMakeLists.txt -->
  <rect x="68.125" y="107.0625" width="318.75" height="181.25" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="227.5" y="128.8125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">1. Declare Install Rules</text>
  <text x="82.1875" y="148.75" font-family="monospace" font-size="10.1392" fill="var(--text)">include(GNUInstallDirs)</text>
  <text x="82.1875" y="166.875" font-family="monospace" font-size="10.1392" fill="var(--text)">install(TARGETS mylib myapp</text>
  <text x="96.25" y="183.1875" font-family="monospace" font-size="10.1392" fill="var(--text)">  RUNTIME DESTINATION</text>
  <text x="110.3125" y="199.5" font-family="monospace" font-size="10.1392" fill="var(--text)">    ${CMAKE_INSTALL_BINDIR}</text>
  <text x="96.25" y="215.8125" font-family="monospace" font-size="10.1392" fill="var(--text)">  LIBRARY DESTINATION</text>
  <text x="110.3125" y="232.125" font-family="monospace" font-size="10.1392" fill="var(--text)">    ${CMAKE_INSTALL_LIBDIR}</text>
  <text x="96.25" y="248.4375" font-family="monospace" font-size="10.1392" fill="var(--text)">  ARCHIVE DESTINATION</text>
  <text x="110.3125" y="264.75" font-family="monospace" font-size="10.1392" fill="var(--text)">    ${CMAKE_INSTALL_LIBDIR})</text>

  <!-- Arrow 1 -->
  <line x1="391.5625" y1="197.6875" x2="443.125" y2="197.6875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: Headers + Files -->
  <rect x="447.8125" y="107.0625" width="356.25" height="181.25" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="625.9375" y="128.8125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">2. Install Headers &amp;amp; Files</text>
  <text x="461.875" y="148.75" font-family="monospace" font-size="10.1392" fill="var(--text)">install(FILES include/mylib.h</text>
  <text x="475.9375" y="165.0625" font-family="monospace" font-size="10.1392" fill="var(--text)">  DESTINATION ${CMAKE_INSTALL_INCLUDEDIR}</text>
  <text x="461.875" y="181.375" font-family="monospace" font-size="10.1392" fill="var(--text)">)</text>
  <text x="461.875" y="201.3125" font-family="monospace" font-size="10.1392" fill="var(--text)">install(DIRECTORY include/</text>
  <text x="475.9375" y="217.625" font-family="monospace" font-size="10.1392" fill="var(--text)">  DESTINATION ${CMAKE_INSTALL_INCLUDEDIR}</text>
  <text x="475.9375" y="233.9375" font-family="monospace" font-size="10.1392" fill="var(--text)">  FILES_MATCHING PATTERN "*.h"</text>
  <text x="461.875" y="250.25" font-family="monospace" font-size="10.1392" fill="var(--text)">)</text>

  <!-- Arrow 2 -->
  <line x1="808.75" y1="197.6875" x2="860.3125" y2="197.6875" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: Run install -->
  <rect x="865" y="107.0625" width="346.875" height="181.25" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1038.4375" y="128.8125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">3. Run Install</text>
  <text x="879.0625" y="148.75" font-family="monospace" font-size="10.1392" fill="var(--text)">cmake -B build -S .</text>
  <text x="879.0625" y="165.0625" font-family="monospace" font-size="10.1392" fill="var(--text)">cmake --build build</text>
  <text x="879.0625" y="181.375" font-family="monospace" font-size="10.1392" fill="var(--text)">cmake --install build</text>
  <text x="879.0625" y="201.3125" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">or override prefix:</text>
  <text x="879.0625" y="219.4375" font-family="monospace" font-size="10.1392" fill="var(--text)">cmake --install build \</text>
  <text x="893.125" y="235.75" font-family="monospace" font-size="10.1392" fill="var(--text)">  --prefix /opt/mylib</text>
  <text x="879.0625" y="255.6875" font-family="monospace" font-size="10.1392" fill="var(--text)">make install  (classic)</text>

  <!-- GNUInstallDirs table -->
  <rect x="68.125" y="304.625" width="562.5" height="233.8125" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <text x="349.375" y="326.375" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)" text-anchor="middle">GNUInstallDirs Standard Paths</text>

  <rect x="77.5" y="335.4375" width="543.75" height="25.375" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="161.875" y="352.6562" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)" text-anchor="middle">Variable</text>
  <text x="405.625" y="352.6562" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)" text-anchor="middle">Default Value</text>

  <text x="86.875" y="375.3125" font-family="monospace" font-size="10.1392" fill="var(--text)">CMAKE_INSTALL_BINDIR</text>
  <text x="349.375" y="375.3125" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">bin</text>
  <text x="86.875" y="395.25" font-family="monospace" font-size="10.1392" fill="var(--text)">CMAKE_INSTALL_LIBDIR</text>
  <text x="349.375" y="395.25" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">lib  (or lib64 on 64-bit)</text>
  <text x="86.875" y="415.1875" font-family="monospace" font-size="10.1392" fill="var(--text)">CMAKE_INSTALL_INCLUDEDIR</text>
  <text x="349.375" y="415.1875" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">include</text>
  <text x="86.875" y="435.125" font-family="monospace" font-size="10.1392" fill="var(--text)">CMAKE_INSTALL_DATADIR</text>
  <text x="349.375" y="435.125" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">share</text>
  <text x="86.875" y="455.0625" font-family="monospace" font-size="10.1392" fill="var(--text)">CMAKE_INSTALL_MANDIR</text>
  <text x="349.375" y="455.0625" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">share/man</text>
  <text x="86.875" y="475" font-family="monospace" font-size="10.1392" fill="var(--text)">CMAKE_INSTALL_DOCDIR</text>
  <text x="349.375" y="475" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">share/doc/&lt;name&gt;</text>
  <text x="86.875" y="494.9375" font-family="monospace" font-size="10.1392" fill="var(--text)">CMAKE_INSTALL_SYSCONFDIR</text>
  <text x="349.375" y="494.9375" font-family="monospace" font-size="10.1392" fill="var(--text-muted)">etc</text>
  <text x="86.875" y="514.875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-faint)">All relative to CMAKE_INSTALL_PREFIX (default: /usr/local)</text>

  <!-- Component packaging -->
  <rect x="649.375" y="304.625" width="562.5" height="233.8125" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="930.625" y="326.375" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Component-Based Installation</text>
  <text x="663.4375" y="348.125" font-family="monospace" font-size="10.1392" fill="var(--text)">install(TARGETS mylib myapp</text>
  <text x="677.5" y="364.4375" font-family="monospace" font-size="10.1392" fill="var(--text)">  RUNTIME DESTINATION bin</text>
  <text x="691.5625" y="380.75" font-family="monospace" font-size="10.1392" fill="var(--text)">    COMPONENT Runtime</text>
  <text x="677.5" y="397.0625" font-family="monospace" font-size="10.1392" fill="var(--text)">  LIBRARY DESTINATION lib</text>
  <text x="691.5625" y="413.375" font-family="monospace" font-size="10.1392" fill="var(--text)">    COMPONENT Runtime</text>
  <text x="677.5" y="429.6875" font-family="monospace" font-size="10.1392" fill="var(--text)">  ARCHIVE DESTINATION lib</text>
  <text x="691.5625" y="446" font-family="monospace" font-size="10.1392" fill="var(--text)">    COMPONENT Development</text>
  <text x="677.5" y="462.3125" font-family="monospace" font-size="10.1392" fill="var(--text)">  INCLUDES DESTINATION include</text>
  <text x="691.5625" y="478.625" font-family="monospace" font-size="10.1392" fill="var(--text)">    COMPONENT Development</text>
  <text x="663.4375" y="498.5625" font-family="monospace" font-size="10.1392" fill="var(--text)">)</text>
  <text x="663.4375" y="520.3125" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">cmake --install build --component Runtime</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Header -->
  <rect x="30" y="14" width="1220" height="44" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">cmake --install . --prefix /opt/myproject</text>

  <!-- Step flow: 3 boxes + arrows -->
  <!-- Box 1: CMakeLists.txt -->
  <rect x="30" y="74" width="340" height="200" rx="5" fill="var(--primary-pale)" filter="url(#shadow)"/>
  <text x="200" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">1. Declare Install Rules</text>
  <text x="45" y="120" font-family="monospace" font-size="11" fill="var(--text-dark)">include(GNUInstallDirs)</text>
  <text x="45" y="140" font-family="monospace" font-size="11" fill="var(--text-dark)">install(TARGETS mylib myapp</text>
  <text x="60" y="158" font-family="monospace" font-size="11" fill="var(--text-dark)">  RUNTIME DESTINATION</text>
  <text x="75" y="176" font-family="monospace" font-size="11" fill="var(--text-dark)">    ${CMAKE_INSTALL_BINDIR}</text>
  <text x="60" y="194" font-family="monospace" font-size="11" fill="var(--text-dark)">  LIBRARY DESTINATION</text>
  <text x="75" y="212" font-family="monospace" font-size="11" fill="var(--text-dark)">    ${CMAKE_INSTALL_LIBDIR}</text>
  <text x="60" y="230" font-family="monospace" font-size="11" fill="var(--text-dark)">  ARCHIVE DESTINATION</text>
  <text x="75" y="248" font-family="monospace" font-size="11" fill="var(--text-dark)">    ${CMAKE_INSTALL_LIBDIR})</text>

  <!-- Arrow 1 -->
  <line x1="375" y1="174" x2="430" y2="174" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: Headers + Files -->
  <rect x="435" y="74" width="380" height="200" rx="5" fill="var(--ok-pale)" filter="url(#shadow)"/>
  <text x="625" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">2. Install Headers &amp;amp; Files</text>
  <text x="450" y="120" font-family="monospace" font-size="11" fill="var(--text-dark)">install(FILES include/mylib.h</text>
  <text x="465" y="138" font-family="monospace" font-size="11" fill="var(--text-dark)">  DESTINATION ${CMAKE_INSTALL_INCLUDEDIR}</text>
  <text x="450" y="156" font-family="monospace" font-size="11" fill="var(--text-dark)">)</text>
  <text x="450" y="178" font-family="monospace" font-size="11" fill="var(--text-dark)">install(DIRECTORY include/</text>
  <text x="465" y="196" font-family="monospace" font-size="11" fill="var(--text-dark)">  DESTINATION ${CMAKE_INSTALL_INCLUDEDIR}</text>
  <text x="465" y="214" font-family="monospace" font-size="11" fill="var(--text-dark)">  FILES_MATCHING PATTERN "*.h"</text>
  <text x="450" y="232" font-family="monospace" font-size="11" fill="var(--text-dark)">)</text>

  <!-- Arrow 2 -->
  <line x1="820" y1="174" x2="875" y2="174" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: Run install -->
  <rect x="880" y="74" width="370" height="200" rx="5" fill="var(--warn-pale)" filter="url(#shadow)"/>
  <text x="1065" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">3. Run Install</text>
  <text x="895" y="120" font-family="monospace" font-size="11" fill="var(--text-dark)">cmake -B build -S .</text>
  <text x="895" y="138" font-family="monospace" font-size="11" fill="var(--text-dark)">cmake --build build</text>
  <text x="895" y="156" font-family="monospace" font-size="11" fill="var(--text-dark)">cmake --install build</text>
  <text x="895" y="178" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">or override prefix:</text>
  <text x="895" y="198" font-family="monospace" font-size="11" fill="var(--text-dark)">cmake --install build \</text>
  <text x="910" y="216" font-family="monospace" font-size="11" fill="var(--text-dark)">  --prefix /opt/mylib</text>
  <text x="895" y="238" font-family="monospace" font-size="11" fill="var(--text-dark)">make install  (classic)</text>

  <!-- GNUInstallDirs table -->
  <rect x="30" y="292" width="600" height="258" rx="5" fill="var(--surface)" filter="url(#shadow)"/>
  <text x="330" y="316" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">GNUInstallDirs Standard Paths</text>

  <rect x="40" y="326" width="580" height="28" rx="3" fill="var(--primary)"/>
  <text x="130" y="345" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">Variable</text>
  <text x="390" y="345" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">Default Value</text>

  <text x="50" y="370" font-family="monospace" font-size="11" fill="var(--text-dark)">CMAKE_INSTALL_BINDIR</text>
  <text x="330" y="370" font-family="monospace" font-size="11" fill="var(--text-muted)">bin</text>
  <text x="50" y="392" font-family="monospace" font-size="11" fill="var(--text-dark)">CMAKE_INSTALL_LIBDIR</text>
  <text x="330" y="392" font-family="monospace" font-size="11" fill="var(--text-muted)">lib  (or lib64 on 64-bit)</text>
  <text x="50" y="414" font-family="monospace" font-size="11" fill="var(--text-dark)">CMAKE_INSTALL_INCLUDEDIR</text>
  <text x="330" y="414" font-family="monospace" font-size="11" fill="var(--text-muted)">include</text>
  <text x="50" y="436" font-family="monospace" font-size="11" fill="var(--text-dark)">CMAKE_INSTALL_DATADIR</text>
  <text x="330" y="436" font-family="monospace" font-size="11" fill="var(--text-muted)">share</text>
  <text x="50" y="458" font-family="monospace" font-size="11" fill="var(--text-dark)">CMAKE_INSTALL_MANDIR</text>
  <text x="330" y="458" font-family="monospace" font-size="11" fill="var(--text-muted)">share/man</text>
  <text x="50" y="480" font-family="monospace" font-size="11" fill="var(--text-dark)">CMAKE_INSTALL_DOCDIR</text>
  <text x="330" y="480" font-family="monospace" font-size="11" fill="var(--text-muted)">share/doc/&lt;name&gt;</text>
  <text x="50" y="502" font-family="monospace" font-size="11" fill="var(--text-dark)">CMAKE_INSTALL_SYSCONFDIR</text>
  <text x="330" y="502" font-family="monospace" font-size="11" fill="var(--text-muted)">etc</text>
  <text x="50" y="524" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">All relative to CMAKE_INSTALL_PREFIX (default: /usr/local)</text>

  <!-- Component packaging -->
  <rect x="650" y="292" width="600" height="258" rx="5" fill="var(--primary-pale)" filter="url(#shadow)"/>
  <text x="950" y="316" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Component-Based Installation</text>
  <text x="665" y="340" font-family="monospace" font-size="11" fill="var(--text-dark)">install(TARGETS mylib myapp</text>
  <text x="680" y="358" font-family="monospace" font-size="11" fill="var(--text-dark)">  RUNTIME DESTINATION bin</text>
  <text x="695" y="376" font-family="monospace" font-size="11" fill="var(--text-dark)">    COMPONENT Runtime</text>
  <text x="680" y="394" font-family="monospace" font-size="11" fill="var(--text-dark)">  LIBRARY DESTINATION lib</text>
  <text x="695" y="412" font-family="monospace" font-size="11" fill="var(--text-dark)">    COMPONENT Runtime</text>
  <text x="680" y="430" font-family="monospace" font-size="11" fill="var(--text-dark)">  ARCHIVE DESTINATION lib</text>
  <text x="695" y="448" font-family="monospace" font-size="11" fill="var(--text-dark)">    COMPONENT Development</text>
  <text x="680" y="466" font-family="monospace" font-size="11" fill="var(--text-dark)">  INCLUDES DESTINATION include</text>
  <text x="695" y="484" font-family="monospace" font-size="11" fill="var(--text-dark)">    COMPONENT Development</text>
  <text x="665" y="506" font-family="monospace" font-size="11" fill="var(--text-dark)">)</text>
  <text x="665" y="530" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">cmake --install build --component Runtime</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="51.785714285714" rx="8.141603913586" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="73.142857142857" text-anchor="middle" font-family="Courier New, monospace" font-size="18.318608805568" font-weight="bold" fill="var(--primary-text)">cmake --install build --prefix /opt/myproject</text>

  <rect x="40" y="112.5" width="380" height="207.142857142857" rx="8.141603913586" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--primary-text)">1. Declare rules</text>
  <text x="60" y="179.821428571429" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--primary-text)">include(GNUInstallDirs)</text>
  <text x="60" y="205.714285714286" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--primary-text)">install(TARGETS mylib</text>
  <text x="60" y="231.607142857143" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--primary-text)">  RUNTIME DESTINATION bin</text>
  <text x="60" y="257.5" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--primary-text)">  LIBRARY DESTINATION lib</text>
  <text x="60" y="283.392857142857" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--primary-text)">  ARCHIVE DESTINATION lib)</text>

  <line x1="425" y1="216.071428571429" x2="445" y2="216.071428571429" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="450" y="112.5" width="380" height="207.142857142857" rx="8.141603913586" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--ok-text)">2. Install headers</text>
  <text x="470" y="179.821428571429" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--ok-text)">install(FILES mylib.h</text>
  <text x="470" y="205.714285714286" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--ok-text)">  DESTINATION include)</text>
  <text x="470" y="247.142857142857" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--ok-text)">install(DIRECTORY include/</text>
  <text x="470" y="273.035714285714" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--ok-text)">  DESTINATION include</text>
  <text x="470" y="298.928571428571" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--ok-text)">  PATTERN "*.h")</text>

  <line x1="835" y1="216.071428571429" x2="855" y2="216.071428571429" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="860" y="112.5" width="380" height="207.142857142857" rx="8.141603913586" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--warn-text)">3. Run install</text>
  <text x="880" y="179.821428571429" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--warn-text)">cmake -B build -S .</text>
  <text x="880" y="205.714285714286" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--warn-text)">cmake --build build</text>
  <text x="880" y="231.607142857143" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--warn-text)">cmake --install build</text>
  <text x="880" y="273.035714285714" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--warn-text)">cmake --install build \</text>
  <text x="880" y="296.857142857143" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--warn-text)">  --prefix /opt/mylib</text>

  <rect x="40" y="340.357142857143" width="580" height="279.642857142857" rx="8.141603913586" fill="var(--surface)" stroke="var(--border)"/>
  <text x="330" y="371.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--text)">GNUInstallDirs paths</text>
  <text x="60" y="407.678571428571" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--text)">BINDIR</text>
  <text x="340" y="407.678571428571" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--text-muted)">bin</text>
  <text x="60" y="433.571428571429" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--text)">LIBDIR</text>
  <text x="340" y="433.571428571429" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--text-muted)">lib</text>
  <text x="60" y="459.464285714286" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--text)">INCLUDEDIR</text>
  <text x="340" y="459.464285714286" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--text-muted)">include</text>
  <text x="60" y="485.357142857143" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--text)">DATADIR</text>
  <text x="340" y="485.357142857143" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--text-muted)">share</text>
  <text x="60" y="511.25" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--text)">MANDIR</text>
  <text x="340" y="511.25" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--text-muted)">share/man</text>
  <text x="60" y="537.142857142857" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--text)">SYSCONFDIR</text>
  <text x="340" y="537.142857142857" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--text-muted)">etc</text>
  <text x="60" y="594.107142857143" font-family="Arial, sans-serif" font-size="11.19470538118" fill="var(--text-faint)">relative to CMAKE_INSTALL_PREFIX</text>

  <rect x="640" y="340.357142857143" width="600" height="279.642857142857" rx="8.141603913586" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="371.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--info-text)">Components</text>
  <text x="660" y="402.5" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--info-text)">install(TARGETS mylib</text>
  <text x="660" y="428.392857142857" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--info-text)">  RUNTIME DESTINATION bin</text>
  <text x="660" y="454.285714285714" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--info-text)">    COMPONENT Runtime</text>
  <text x="660" y="480.178571428571" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--info-text)">  ARCHIVE DESTINATION lib</text>
  <text x="660" y="506.071428571429" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--info-text)">    COMPONENT Development)</text>
  <text x="660" y="568.214285714286" font-family="Courier New, monospace" font-size="12.212405870379" fill="var(--info-text)">--component Runtime</text>
</svg>

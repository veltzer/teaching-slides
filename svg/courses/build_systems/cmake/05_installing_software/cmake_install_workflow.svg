<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Header -->
  <rect x="30" y="14" width="1220" height="44" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">cmake --install . --prefix /opt/myproject</text>

  <!-- Step flow: 3 boxes + arrows -->
  <!-- Box 1: CMakeLists.txt -->
  <rect x="30" y="74" width="340" height="200" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="200" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">1. Declare Install Rules</text>
  <text x="45" y="120" font-family="monospace" font-size="11" fill="var(--text)">include(GNUInstallDirs)</text>
  <text x="45" y="140" font-family="monospace" font-size="11" fill="var(--text)">install(TARGETS mylib myapp</text>
  <text x="60" y="158" font-family="monospace" font-size="11" fill="var(--text)">  RUNTIME DESTINATION</text>
  <text x="75" y="176" font-family="monospace" font-size="11" fill="var(--text)">    ${CMAKE_INSTALL_BINDIR}</text>
  <text x="60" y="194" font-family="monospace" font-size="11" fill="var(--text)">  LIBRARY DESTINATION</text>
  <text x="75" y="212" font-family="monospace" font-size="11" fill="var(--text)">    ${CMAKE_INSTALL_LIBDIR}</text>
  <text x="60" y="230" font-family="monospace" font-size="11" fill="var(--text)">  ARCHIVE DESTINATION</text>
  <text x="75" y="248" font-family="monospace" font-size="11" fill="var(--text)">    ${CMAKE_INSTALL_LIBDIR})</text>

  <!-- Arrow 1 -->
  <line x1="375" y1="174" x2="430" y2="174" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: Headers + Files -->
  <rect x="435" y="74" width="380" height="200" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="625" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">2. Install Headers &amp;amp; Files</text>
  <text x="450" y="120" font-family="monospace" font-size="11" fill="var(--text)">install(FILES include/mylib.h</text>
  <text x="465" y="138" font-family="monospace" font-size="11" fill="var(--text)">  DESTINATION ${CMAKE_INSTALL_INCLUDEDIR}</text>
  <text x="450" y="156" font-family="monospace" font-size="11" fill="var(--text)">)</text>
  <text x="450" y="178" font-family="monospace" font-size="11" fill="var(--text)">install(DIRECTORY include/</text>
  <text x="465" y="196" font-family="monospace" font-size="11" fill="var(--text)">  DESTINATION ${CMAKE_INSTALL_INCLUDEDIR}</text>
  <text x="465" y="214" font-family="monospace" font-size="11" fill="var(--text)">  FILES_MATCHING PATTERN "*.h"</text>
  <text x="450" y="232" font-family="monospace" font-size="11" fill="var(--text)">)</text>

  <!-- Arrow 2 -->
  <line x1="820" y1="174" x2="875" y2="174" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: Run install -->
  <rect x="880" y="74" width="370" height="200" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1065" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">3. Run Install</text>
  <text x="895" y="120" font-family="monospace" font-size="11" fill="var(--text)">cmake -B build -S .</text>
  <text x="895" y="138" font-family="monospace" font-size="11" fill="var(--text)">cmake --build build</text>
  <text x="895" y="156" font-family="monospace" font-size="11" fill="var(--text)">cmake --install build</text>
  <text x="895" y="178" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">or override prefix:</text>
  <text x="895" y="198" font-family="monospace" font-size="11" fill="var(--text)">cmake --install build \</text>
  <text x="910" y="216" font-family="monospace" font-size="11" fill="var(--text)">  --prefix /opt/mylib</text>
  <text x="895" y="238" font-family="monospace" font-size="11" fill="var(--text)">make install  (classic)</text>

  <!-- GNUInstallDirs table -->
  <rect x="30" y="292" width="600" height="258" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <text x="330" y="316" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)" text-anchor="middle">GNUInstallDirs Standard Paths</text>

  <rect x="40" y="326" width="580" height="28" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="130" y="345" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">Variable</text>
  <text x="390" y="345" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">Default Value</text>

  <text x="50" y="370" font-family="monospace" font-size="11" fill="var(--text)">CMAKE_INSTALL_BINDIR</text>
  <text x="330" y="370" font-family="monospace" font-size="11" fill="var(--text-muted)">bin</text>
  <text x="50" y="392" font-family="monospace" font-size="11" fill="var(--text)">CMAKE_INSTALL_LIBDIR</text>
  <text x="330" y="392" font-family="monospace" font-size="11" fill="var(--text-muted)">lib  (or lib64 on 64-bit)</text>
  <text x="50" y="414" font-family="monospace" font-size="11" fill="var(--text)">CMAKE_INSTALL_INCLUDEDIR</text>
  <text x="330" y="414" font-family="monospace" font-size="11" fill="var(--text-muted)">include</text>
  <text x="50" y="436" font-family="monospace" font-size="11" fill="var(--text)">CMAKE_INSTALL_DATADIR</text>
  <text x="330" y="436" font-family="monospace" font-size="11" fill="var(--text-muted)">share</text>
  <text x="50" y="458" font-family="monospace" font-size="11" fill="var(--text)">CMAKE_INSTALL_MANDIR</text>
  <text x="330" y="458" font-family="monospace" font-size="11" fill="var(--text-muted)">share/man</text>
  <text x="50" y="480" font-family="monospace" font-size="11" fill="var(--text)">CMAKE_INSTALL_DOCDIR</text>
  <text x="330" y="480" font-family="monospace" font-size="11" fill="var(--text-muted)">share/doc/&lt;name&gt;</text>
  <text x="50" y="502" font-family="monospace" font-size="11" fill="var(--text)">CMAKE_INSTALL_SYSCONFDIR</text>
  <text x="330" y="502" font-family="monospace" font-size="11" fill="var(--text-muted)">etc</text>
  <text x="50" y="524" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">All relative to CMAKE_INSTALL_PREFIX (default: /usr/local)</text>

  <!-- Component packaging -->
  <rect x="650" y="292" width="600" height="258" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="950" y="316" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Component-Based Installation</text>
  <text x="665" y="340" font-family="monospace" font-size="11" fill="var(--text)">install(TARGETS mylib myapp</text>
  <text x="680" y="358" font-family="monospace" font-size="11" fill="var(--text)">  RUNTIME DESTINATION bin</text>
  <text x="695" y="376" font-family="monospace" font-size="11" fill="var(--text)">    COMPONENT Runtime</text>
  <text x="680" y="394" font-family="monospace" font-size="11" fill="var(--text)">  LIBRARY DESTINATION lib</text>
  <text x="695" y="412" font-family="monospace" font-size="11" fill="var(--text)">    COMPONENT Runtime</text>
  <text x="680" y="430" font-family="monospace" font-size="11" fill="var(--text)">  ARCHIVE DESTINATION lib</text>
  <text x="695" y="448" font-family="monospace" font-size="11" fill="var(--text)">    COMPONENT Development</text>
  <text x="680" y="466" font-family="monospace" font-size="11" fill="var(--text)">  INCLUDES DESTINATION include</text>
  <text x="695" y="484" font-family="monospace" font-size="11" fill="var(--text)">    COMPONENT Development</text>
  <text x="665" y="506" font-family="monospace" font-size="11" fill="var(--text)">)</text>
  <text x="665" y="530" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">cmake --install build --component Runtime</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">A Minimal CMake Project</text>
  <rect x="40" y="80" width="585" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="332" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">CMakeLists.txt</text>
  <text x="60" y="160" font-family="Courier New, monospace" font-size="14" fill="var(--info-text)">cmake_minimum_required(VERSION 3.20)</text>
  <text x="60" y="190" font-family="Courier New, monospace" font-size="14" fill="var(--info-text)">project(hello LANGUAGES CXX)</text>
  <text x="60" y="220" font-family="Courier New, monospace" font-size="14" fill="var(--info-text)">add_executable(hello main.cpp)</text>
  <text x="60" y="280" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-text)">Three lines, three jobs</text>
  <text x="60" y="310" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Pin minimum CMake version</text>
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Declare the project + langs</text>
  <text x="60" y="370" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Define the target + sources</text>
  <text x="60" y="430" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">Targets are the unit of work</text>

  <rect x="640" y="80" width="600" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">The build dance</text>
  <text x="660" y="160" font-family="Courier New, monospace" font-size="14" fill="var(--ok-text)">cmake -B build</text>
  <text x="660" y="190" font-family="Courier New, monospace" font-size="14" fill="var(--ok-text)">cmake --build build</text>
  <text x="660" y="220" font-family="Courier New, monospace" font-size="14" fill="var(--ok-text)">./build/hello</text>
  <text x="660" y="280" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-text)">Two phases</text>
  <text x="660" y="310" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Configure: write makefiles</text>
  <text x="660" y="340" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Build: invoke compiler</text>
  <text x="660" y="370" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">build/ is disposable</text>
  <text x="660" y="430" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">Don't commit build/</text>
</svg>

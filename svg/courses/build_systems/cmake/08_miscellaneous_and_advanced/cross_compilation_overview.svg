<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="29.018513" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Cross-Compilation Overview</text>

  <rect x="40" y="82.962963" width="370" height="537.037037" rx="6.218253" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="131.296296" text-anchor="middle" font-size="22.80026" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Host</text>
  <text x="225" y="168.888889" text-anchor="middle" font-size="16.582007" fill="var(--primary-text)" font-family="Arial, sans-serif">Machine that runs CMake</text>
  <text x="225" y="222.592593" text-anchor="middle" font-size="16.582007" fill="var(--primary-text)" font-family="Arial, sans-serif">x86_64 Linux laptop</text>
  <text x="225" y="265.555556" text-anchor="middle" font-size="16.582007" fill="var(--primary-text)" font-family="Arial, sans-serif">Invokes the compiler</text>
  <text x="225" y="319.259259" text-anchor="middle" font-size="16.582007" fill="var(--primary-text)" font-family="Arial, sans-serif">Runs build tools</text>
  <text x="225" y="372.962963" text-anchor="middle" font-size="16.582007" fill="var(--primary-text)" font-family="Arial, sans-serif">Generates artifacts</text>
  <text x="225" y="448.148148" text-anchor="middle" font-size="16.582007" fill="var(--primary-text)" font-family="Arial, sans-serif">Needs toolchain file</text>
  <text x="225" y="491.111111" text-anchor="middle" font-size="16.582007" fill="var(--primary-text)" font-family="Arial, sans-serif">-DCMAKE_TOOLCHAIN_FILE</text>
  <text x="225" y="555.555556" text-anchor="middle" font-size="16.582007" fill="var(--primary-text)" font-family="Arial, sans-serif">points at sysroot</text>

  <rect x="455" y="82.962963" width="370" height="537.037037" rx="6.218253" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="131.296296" text-anchor="middle" font-size="22.80026" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Toolchain</text>
  <text x="640" y="168.888889" text-anchor="middle" font-size="16.582007" fill="var(--warn-text)" font-family="Arial, sans-serif">Cross compiler + sysroot</text>
  <text x="640" y="222.592593" text-anchor="middle" font-size="16.582007" fill="var(--warn-text)" font-family="Arial, sans-serif">aarch64-linux-gnu-gcc</text>
  <text x="640" y="265.555556" text-anchor="middle" font-size="16.582007" fill="var(--warn-text)" font-family="Arial, sans-serif">Target headers</text>
  <text x="640" y="319.259259" text-anchor="middle" font-size="16.582007" fill="var(--warn-text)" font-family="Arial, sans-serif">Target libraries</text>
  <text x="640" y="372.962963" text-anchor="middle" font-size="16.582007" fill="var(--warn-text)" font-family="Arial, sans-serif">CMAKE_SYSTEM_NAME</text>
  <text x="640" y="426.666667" text-anchor="middle" font-size="16.582007" fill="var(--warn-text)" font-family="Arial, sans-serif">CMAKE_SYSTEM_PROCESSOR</text>
  <text x="640" y="480.37037" text-anchor="middle" font-size="16.582007" fill="var(--warn-text)" font-family="Arial, sans-serif">find_root rules</text>
  <text x="640" y="555.555556" text-anchor="middle" font-size="16.582007" fill="var(--warn-text)" font-family="Arial, sans-serif">Reproducible builds</text>

  <rect x="870" y="82.962963" width="370" height="537.037037" rx="6.218253" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="131.296296" text-anchor="middle" font-size="22.80026" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Target</text>
  <text x="1055" y="168.888889" text-anchor="middle" font-size="16.582007" fill="var(--ok-text)" font-family="Arial, sans-serif">Device that runs output</text>
  <text x="1055" y="222.592593" text-anchor="middle" font-size="16.582007" fill="var(--ok-text)" font-family="Arial, sans-serif">ARM board, MCU</text>
  <text x="1055" y="265.555556" text-anchor="middle" font-size="16.582007" fill="var(--ok-text)" font-family="Arial, sans-serif">Different CPU arch</text>
  <text x="1055" y="319.259259" text-anchor="middle" font-size="16.582007" fill="var(--ok-text)" font-family="Arial, sans-serif">Different OS or libc</text>
  <text x="1055" y="372.962963" text-anchor="middle" font-size="16.582007" fill="var(--ok-text)" font-family="Arial, sans-serif">Receives binary</text>
  <text x="1055" y="448.148148" text-anchor="middle" font-size="16.582007" fill="var(--ok-text)" font-family="Arial, sans-serif">Cannot run host tools</text>
  <text x="1055" y="491.111111" text-anchor="middle" font-size="16.582007" fill="var(--ok-text)" font-family="Arial, sans-serif">try_run needs emulator</text>
  <text x="1055" y="555.555556" text-anchor="middle" font-size="16.582007" fill="var(--ok-text)" font-family="Arial, sans-serif">qemu-user helps</text>

  <line x1="410" y1="351.481481" x2="455" y2="351.481481" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="825" y1="351.481481" x2="870" y2="351.481481" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Header -->
  <rect x="30" y="14" width="1220" height="44" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">CPack Packaging Workflow</text>

  <!-- Workflow arrow: CMakeLists -> cpack -->
  <rect x="30" y="74" width="280" height="100" rx="5" fill="var(--primary-pale)" filter="url(#shadow)"/>
  <text x="170" y="98" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">CMakeLists.txt</text>
  <text x="45" y="118" font-family="monospace" font-size="11" fill="var(--text-dark)">include(CPack)</text>
  <text x="45" y="136" font-family="monospace" font-size="11" fill="var(--text-dark)">set(CPACK_PACKAGE_NAME</text>
  <text x="60" y="154" font-family="monospace" font-size="11" fill="var(--text-dark)">  "myproject")</text>

  <line x1="315" y1="124" x2="370" y2="124" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="375" y="74" width="230" height="100" rx="5" fill="var(--warn-pale)" filter="url(#shadow)"/>
  <text x="490" y="98" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Configure &amp;amp; Build</text>
  <text x="390" y="120" font-family="monospace" font-size="11" fill="var(--text-dark)">cmake -B build</text>
  <text x="390" y="138" font-family="monospace" font-size="11" fill="var(--text-dark)">cmake --build build</text>

  <line x1="610" y1="124" x2="665" y2="124" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="670" y="74" width="230" height="100" rx="5" fill="var(--ok-pale)" filter="url(#shadow)"/>
  <text x="785" y="98" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Run CPack</text>
  <text x="685" y="120" font-family="monospace" font-size="11" fill="var(--text-dark)">cd build</text>
  <text x="685" y="138" font-family="monospace" font-size="11" fill="var(--text-dark)">cpack -G DEB</text>
  <text x="685" y="156" font-family="monospace" font-size="11" fill="var(--text-dark)">cpack -G RPM TGZ</text>

  <line x1="905" y1="124" x2="960" y2="124" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="965" y="74" width="285" height="100" rx="5" fill="var(--info-pale)" filter="url(#shadow)"/>
  <text x="1107" y="98" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">Output Packages</text>
  <text x="980" y="120" font-family="monospace" font-size="11" fill="var(--text-dark)">myproject-1.0.0-Linux.deb</text>
  <text x="980" y="138" font-family="monospace" font-size="11" fill="var(--text-dark)">myproject-1.0.0-Linux.rpm</text>
  <text x="980" y="156" font-family="monospace" font-size="11" fill="var(--text-dark)">myproject-1.0.0-Linux.tar.gz</text>

  <!-- Generator cards: 4 generators -->
  <rect x="30" y="194" width="590" height="44" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="325" y="222" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Archive Generators</text>

  <rect x="660" y="194" width="590" height="44" rx="6" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="955" y="222" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)" text-anchor="middle">Native Generators</text>

  <!-- TGZ / ZIP / TXZ -->
  <rect x="30" y="248" width="590" height="160" rx="5" fill="var(--primary-pale)" filter="url(#shadow)"/>
  <text x="50" y="272" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)">TGZ / ZIP / TXZ / STGZ</text>
  <text x="50" y="294" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Cross-platform tarballs and zip archives</text>
  <text x="50" y="316" font-family="monospace" font-size="11" fill="var(--text-dark)">set(CPACK_GENERATOR "TGZ;ZIP")</text>
  <text x="50" y="336" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">STGZ creates self-extracting shell script</text>
  <text x="50" y="358" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Works on Linux / macOS / Windows</text>
  <text x="50" y="380" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">No dependency metadata</text>
  <text x="50" y="398" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Simple and universally supported</text>

  <!-- DEB + RPM -->
  <rect x="660" y="248" width="590" height="160" rx="5" fill="var(--warn-pale)" filter="url(#shadow)"/>
  <text x="680" y="272" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-dk)">DEB (Debian/Ubuntu) / RPM (Red Hat/Fedora)</text>
  <text x="680" y="294" font-family="monospace" font-size="11" fill="var(--text-dark)">set(CPACK_DEBIAN_PACKAGE_DEPENDS "libssl1.1")</text>
  <text x="680" y="314" font-family="monospace" font-size="11" fill="var(--text-dark)">set(CPACK_RPM_PACKAGE_REQUIRES  "openssl")</text>
  <text x="680" y="336" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Native package manager integration</text>
  <text x="680" y="356" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Dependency declarations tracked by apt / dnf</text>
  <text x="680" y="376" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Pre/post install scripts supported</text>
  <text x="680" y="396" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">NSIS generator for Windows installers</text>

  <!-- CPACK variables -->
  <rect x="30" y="428" width="820" height="192" rx="5" fill="var(--surface)" filter="url(#shadow)"/>
  <text x="440" y="452" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text-dark)" text-anchor="middle">Essential CPACK_* Variables</text>
  <text x="50" y="476" font-family="monospace" font-size="11" fill="var(--text-dark)">set(CPACK_PACKAGE_NAME            "myproject")</text>
  <text x="50" y="496" font-family="monospace" font-size="11" fill="var(--text-dark)">set(CPACK_PACKAGE_VERSION         "1.2.3")</text>
  <text x="50" y="516" font-family="monospace" font-size="11" fill="var(--text-dark)">set(CPACK_PACKAGE_VENDOR          "Acme Corp")</text>
  <text x="50" y="536" font-family="monospace" font-size="11" fill="var(--text-dark)">set(CPACK_PACKAGE_DESCRIPTION     "My awesome project")</text>
  <text x="50" y="556" font-family="monospace" font-size="11" fill="var(--text-dark)">set(CPACK_PACKAGE_CONTACT         "dev@acme.com")</text>
  <text x="50" y="576" font-family="monospace" font-size="11" fill="var(--text-dark)">set(CPACK_RESOURCE_FILE_LICENSE   "${CMAKE_SOURCE_DIR}/LICENSE")</text>
  <text x="50" y="596" font-family="monospace" font-size="11" fill="var(--text-dark)">set(CPACK_COMPONENTS_ALL          Runtime Development)</text>

  <!-- Component note -->
  <rect x="870" y="428" width="380" height="192" rx="5" fill="var(--ok-pale)" filter="url(#shadow)"/>
  <text x="1060" y="452" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Component Packaging</text>
  <text x="885" y="476" font-family="monospace" font-size="11" fill="var(--text-dark)">cpack --config CPackConfig.cmake</text>
  <text x="885" y="498" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Install only selected component:</text>
  <text x="885" y="518" font-family="monospace" font-size="11" fill="var(--text-dark)">cpack -G DEB \</text>
  <text x="900" y="536" font-family="monospace" font-size="11" fill="var(--text-dark)">  --component Runtime</text>
  <text x="885" y="558" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Separate .deb for Runtime</text>
  <text x="885" y="578" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">and Development components</text>
  <text x="885" y="600" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Reduces download size for users</text>
</svg>

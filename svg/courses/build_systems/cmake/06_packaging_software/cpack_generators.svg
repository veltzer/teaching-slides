<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490037834601" font-weight="bold" fill="var(--text)">CPack Packaging</text>

  <!-- Workflow row -->
  <rect x="40" y="71.351351351351" width="270" height="99.279279279279" rx="6.133646682164" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175" y="102.702702702703" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--primary-text)">CMakeLists.txt</text>
  <text x="55" y="130.918918918919" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--primary-text)">include(CPack)</text>
  <text x="55" y="154.954954954955" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--primary-text)">CPACK_PACKAGE_NAME</text>

  <line x1="315" y1="120.468468468468" x2="370" y2="120.468468468468" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="375" y="71.351351351351" width="225" height="99.279279279279" rx="6.133646682164" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487" y="102.702702702703" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--warn-text)">Build</text>
  <text x="390" y="130.918918918919" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--warn-text)">cmake -B build</text>
  <text x="390" y="154.954954954955" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--warn-text)">cmake --build build</text>

  <line x1="605" y1="120.468468468468" x2="660" y2="120.468468468468" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="665" y="71.351351351351" width="225" height="99.279279279279" rx="6.133646682164" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="777" y="102.702702702703" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--ok-text)">Run CPack</text>
  <text x="680" y="130.918918918919" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--ok-text)">cpack -G DEB</text>
  <text x="680" y="154.954954954955" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--ok-text)">cpack -G RPM TGZ</text>

  <line x1="895" y1="120.468468468468" x2="950" y2="120.468468468468" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="955" y="71.351351351351" width="285" height="99.279279279279" rx="6.133646682164" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="102.702702702703" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--info-text)">Outputs</text>
  <text x="970" y="130.918918918919" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--info-text)">myproj-1.0.0.deb</text>
  <text x="970" y="154.954954954955" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--info-text)">myproj-1.0.0.rpm</text>

  <!-- Generator cards -->
  <rect x="40" y="201.981981981982" width="580" height="209.009009009009" rx="6.133646682164" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--primary-text)">Archive: TGZ / ZIP / TXZ</text>
  <text x="60" y="269.90990990991" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">Cross-platform archives</text>
  <text x="60" y="301.261261261261" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--primary-text)">CPACK_GENERATOR "TGZ;ZIP"</text>
  <text x="60" y="337.837837837838" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">STGZ = self-extracting</text>
  <text x="60" y="369.189189189189" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">No dependency metadata</text>

  <rect x="660" y="201.981981981982" width="580" height="209.009009009009" rx="6.133646682164" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.356391152437" font-weight="bold" fill="var(--warn-text)">Native: DEB / RPM / NSIS</text>
  <text x="680" y="269.90990990991" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--warn-text)">CPACK_DEBIAN_PACKAGE_DEPENDS</text>
  <text x="680" y="301.261261261261" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--warn-text)">CPACK_RPM_PACKAGE_REQUIRES</text>
  <text x="680" y="337.837837837838" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--warn-text)">apt / dnf integration</text>
  <text x="680" y="369.189189189189" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--warn-text)">Pre/post install scripts</text>

  <!-- Variables + Components -->
  <rect x="40" y="431.891891891892" width="800" height="188.108108108108" rx="6.133646682164" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="440" y="458.018018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--text)">Essential CPACK_* Variables</text>
  <text x="60" y="489.369369369369" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--text)">CPACK_PACKAGE_NAME    "myproject"</text>
  <text x="60" y="515.495495495495" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--text)">CPACK_PACKAGE_VERSION "1.2.3"</text>
  <text x="60" y="541.621621621622" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--text)">CPACK_PACKAGE_VENDOR  "Acme"</text>
  <text x="60" y="567.747747747748" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--text)">CPACK_PACKAGE_CONTACT "dev@acme"</text>
  <text x="60" y="593.873873873874" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--text)">CPACK_COMPONENTS_ALL  Runtime Development</text>

  <rect x="860" y="431.891891891892" width="380" height="188.108108108108" rx="6.133646682164" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="458.018018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" font-weight="bold" fill="var(--ok-text)">Components</text>
  <text x="880" y="494.594594594595" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--ok-text)">cpack -G DEB</text>
  <text x="880" y="520.720720720721" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--ok-text)">  --component Runtime</text>
  <text x="880" y="562.522522522523" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">Split Runtime / Dev</text>
  <text x="880" y="593.873873873874" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">Smaller downloads</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <!-- Header -->
  <rect x="40" y="40" width="1200" height="42.112211" rx="6.315824" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="66.79868" font-family="Arial, sans-serif" font-size="17.464726" font-weight="bold" fill="var(--bg)" text-anchor="middle">CPack Packaging Workflow</text>

  <!-- Workflow arrow: CMakeLists -> cpack -->
  <rect x="40" y="97.425743" width="275.409836" height="95.709571" rx="6.315824" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="177.704918" y="120.39604" font-family="Arial, sans-serif" font-size="12.613437" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">CMakeLists.txt</text>
  <text x="54.754098" y="139.537954" font-family="monospace" font-size="10.6729" fill="var(--text)">include(CPack)</text>
  <text x="54.754098" y="156.765677" font-family="monospace" font-size="10.6729" fill="var(--text)">set(CPACK_PACKAGE_NAME</text>
  <text x="69.508197" y="173.993399" font-family="monospace" font-size="10.6729" fill="var(--text)">  "myproject")</text>

  <line x1="320.327869" y1="145.280528" x2="374.42623" y2="145.280528" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="379.344262" y="97.425743" width="226.229508" height="95.709571" rx="6.315824" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="492.459016" y="120.39604" font-family="Arial, sans-serif" font-size="12.613437" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Configure &amp;amp; Build</text>
  <text x="394.098361" y="141.452145" font-family="monospace" font-size="10.6729" fill="var(--text)">cmake -B build</text>
  <text x="394.098361" y="158.679868" font-family="monospace" font-size="10.6729" fill="var(--text)">cmake --build build</text>

  <line x1="610.491803" y1="145.280528" x2="664.590164" y2="145.280528" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="669.508197" y="97.425743" width="226.229508" height="95.709571" rx="6.315824" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="782.622951" y="120.39604" font-family="Arial, sans-serif" font-size="12.613437" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Run CPack</text>
  <text x="684.262295" y="141.452145" font-family="monospace" font-size="10.6729" fill="var(--text)">cd build</text>
  <text x="684.262295" y="158.679868" font-family="monospace" font-size="10.6729" fill="var(--text)">cpack -G DEB</text>
  <text x="684.262295" y="175.907591" font-family="monospace" font-size="10.6729" fill="var(--text)">cpack -G RPM TGZ</text>

  <line x1="900.655738" y1="145.280528" x2="954.754098" y2="145.280528" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="959.672131" y="97.425743" width="280.327869" height="95.709571" rx="6.315824" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1099.344262" y="120.39604" font-family="Arial, sans-serif" font-size="12.613437" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Output Packages</text>
  <text x="974.42623" y="141.452145" font-family="monospace" font-size="10.6729" fill="var(--text)">myproject-1.0.0-Linux.deb</text>
  <text x="974.42623" y="158.679868" font-family="monospace" font-size="10.6729" fill="var(--text)">myproject-1.0.0-Linux.rpm</text>
  <text x="974.42623" y="175.907591" font-family="monospace" font-size="10.6729" fill="var(--text)">myproject-1.0.0-Linux.tar.gz</text>

  <!-- Generator cards: 4 generators -->
  <rect x="40" y="212.277228" width="580.327869" height="42.112211" rx="6.315824" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="330.163934" y="239.075908" font-family="Arial, sans-serif" font-size="14.553868" font-weight="bold" fill="var(--bg)" text-anchor="middle">Archive Generators</text>

  <rect x="659.672131" y="212.277228" width="580.327869" height="42.112211" rx="6.315824" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="949.836066" y="239.075908" font-family="Arial, sans-serif" font-size="14.553868" font-weight="bold" fill="var(--bg)" text-anchor="middle">Native Generators</text>

  <!-- TGZ / ZIP / TXZ -->
  <rect x="40" y="263.960396" width="580.327869" height="153.135314" rx="6.315824" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="59.672131" y="286.930693" font-family="Arial, sans-serif" font-size="12.613437" font-weight="bold" fill="var(--primary-accent)">TGZ / ZIP / TXZ / STGZ</text>
  <text x="59.672131" y="307.986799" font-family="Arial, sans-serif" font-size="11.643116" fill="var(--text)">Cross-platform tarballs and zip archives</text>
  <text x="59.672131" y="329.042904" font-family="monospace" font-size="10.6729" fill="var(--text)">set(CPACK_GENERATOR "TGZ;ZIP")</text>
  <text x="59.672131" y="348.184818" font-family="Arial, sans-serif" font-size="11.643116" fill="var(--text-muted)">STGZ creates self-extracting shell script</text>
  <text x="59.672131" y="369.240924" font-family="Arial, sans-serif" font-size="11.643116" fill="var(--text-muted)">Works on Linux / macOS / Windows</text>
  <text x="59.672131" y="390.29703" font-family="Arial, sans-serif" font-size="11.643116" fill="var(--text-muted)">No dependency metadata</text>
  <text x="59.672131" y="407.524752" font-family="Arial, sans-serif" font-size="11.643116" fill="var(--text-muted)">Simple and universally supported</text>

  <!-- DEB + RPM -->
  <rect x="659.672131" y="263.960396" width="580.327869" height="153.135314" rx="6.315824" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="679.344262" y="286.930693" font-family="Arial, sans-serif" font-size="12.613437" font-weight="bold" fill="var(--warn-accent)">DEB (Debian/Ubuntu) / RPM (Red Hat/Fedora)</text>
  <text x="679.344262" y="307.986799" font-family="monospace" font-size="10.6729" fill="var(--text)">set(CPACK_DEBIAN_PACKAGE_DEPENDS "libssl1.1")</text>
  <text x="679.344262" y="327.128713" font-family="monospace" font-size="10.6729" fill="var(--text)">set(CPACK_RPM_PACKAGE_REQUIRES  "openssl")</text>
  <text x="679.344262" y="348.184818" font-family="Arial, sans-serif" font-size="11.643116" fill="var(--text-muted)">Native package manager integration</text>
  <text x="679.344262" y="367.326733" font-family="Arial, sans-serif" font-size="11.643116" fill="var(--text-muted)">Dependency declarations tracked by apt / dnf</text>
  <text x="679.344262" y="386.468647" font-family="Arial, sans-serif" font-size="11.643116" fill="var(--text-muted)">Pre/post install scripts supported</text>
  <text x="679.344262" y="405.610561" font-family="Arial, sans-serif" font-size="11.643116" fill="var(--text-muted)">NSIS generator for Windows installers</text>

  <!-- CPACK variables -->
  <rect x="40" y="436.237624" width="806.557377" height="183.762376" rx="6.315824" fill="var(--surface)"/>
  <text x="443.278689" y="459.207921" font-family="Arial, sans-serif" font-size="13.583652" font-weight="bold" fill="var(--text)" text-anchor="middle">Essential CPACK_* Variables</text>
  <text x="59.672131" y="482.178218" font-family="monospace" font-size="10.6729" fill="var(--text)">set(CPACK_PACKAGE_NAME            "myproject")</text>
  <text x="59.672131" y="501.320132" font-family="monospace" font-size="10.6729" fill="var(--text)">set(CPACK_PACKAGE_VERSION         "1.2.3")</text>
  <text x="59.672131" y="520.462046" font-family="monospace" font-size="10.6729" fill="var(--text)">set(CPACK_PACKAGE_VENDOR          "Acme Corp")</text>
  <text x="59.672131" y="539.60396" font-family="monospace" font-size="10.6729" fill="var(--text)">set(CPACK_PACKAGE_DESCRIPTION     "My awesome project")</text>
  <text x="59.672131" y="558.745875" font-family="monospace" font-size="10.6729" fill="var(--text)">set(CPACK_PACKAGE_CONTACT         "dev@acme.com")</text>
  <text x="59.672131" y="577.887789" font-family="monospace" font-size="10.6729" fill="var(--text)">set(CPACK_RESOURCE_FILE_LICENSE   "${CMAKE_SOURCE_DIR}/LICENSE")</text>
  <text x="59.672131" y="597.029703" font-family="monospace" font-size="10.6729" fill="var(--text)">set(CPACK_COMPONENTS_ALL          Runtime Development)</text>

  <!-- Component note -->
  <rect x="866.229508" y="436.237624" width="373.770492" height="183.762376" rx="6.315824" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1053.114754" y="459.207921" font-family="Arial, sans-serif" font-size="13.583652" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Component Packaging</text>
  <text x="880.983607" y="482.178218" font-family="monospace" font-size="10.6729" fill="var(--text)">cpack --config CPackConfig.cmake</text>
  <text x="880.983607" y="503.234323" font-family="Arial, sans-serif" font-size="11.643116" fill="var(--text)">Install only selected component:</text>
  <text x="880.983607" y="522.376238" font-family="monospace" font-size="10.6729" fill="var(--text)">cpack -G DEB \</text>
  <text x="895.737705" y="539.60396" font-family="monospace" font-size="10.6729" fill="var(--text)">  --component Runtime</text>
  <text x="880.983607" y="560.660066" font-family="Arial, sans-serif" font-size="11.643116" fill="var(--text-muted)">Separate .deb for Runtime</text>
  <text x="880.983607" y="579.80198" font-family="Arial, sans-serif" font-size="11.643116" fill="var(--text-muted)">and Development components</text>
  <text x="880.983607" y="600.858086" font-family="Arial, sans-serif" font-size="11.643116" fill="var(--text-muted)">Reduces download size for users</text>
</svg>

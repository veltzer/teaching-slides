<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Header -->
  <rect x="68.125" y="52.6875" width="1143.75" height="39.875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="78.0625" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)" text-anchor="middle">CPack Packaging Workflow</text>

  <!-- Workflow arrow: CMakeLists -> cpack -->
  <rect x="68.125" y="107.0625" width="262.5" height="90.625" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="199.375" y="128.8125" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">CMakeLists.txt</text>
  <text x="82.1875" y="146.9375" font-family="monospace" font-size="10.1392" fill="var(--text)">include(CPack)</text>
  <text x="82.1875" y="163.25" font-family="monospace" font-size="10.1392" fill="var(--text)">set(CPACK_PACKAGE_NAME</text>
  <text x="96.25" y="179.5625" font-family="monospace" font-size="10.1392" fill="var(--text)">  "myproject")</text>

  <line x1="335.3125" y1="152.375" x2="386.875" y2="152.375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="391.5625" y="107.0625" width="215.625" height="90.625" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="499.375" y="128.8125" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Configure &amp;amp; Build</text>
  <text x="405.625" y="148.75" font-family="monospace" font-size="10.1392" fill="var(--text)">cmake -B build</text>
  <text x="405.625" y="165.0625" font-family="monospace" font-size="10.1392" fill="var(--text)">cmake --build build</text>

  <line x1="611.875" y1="152.375" x2="663.4375" y2="152.375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="668.125" y="107.0625" width="215.625" height="90.625" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="775.9375" y="128.8125" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Run CPack</text>
  <text x="682.1875" y="148.75" font-family="monospace" font-size="10.1392" fill="var(--text)">cd build</text>
  <text x="682.1875" y="165.0625" font-family="monospace" font-size="10.1392" fill="var(--text)">cpack -G DEB</text>
  <text x="682.1875" y="181.375" font-family="monospace" font-size="10.1392" fill="var(--text)">cpack -G RPM TGZ</text>

  <line x1="888.4375" y1="152.375" x2="940" y2="152.375" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="944.6875" y="107.0625" width="267.1875" height="90.625" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1077.8125" y="128.8125" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Output Packages</text>
  <text x="958.75" y="148.75" font-family="monospace" font-size="10.1392" fill="var(--text)">myproject-1.0.0-Linux.deb</text>
  <text x="958.75" y="165.0625" font-family="monospace" font-size="10.1392" fill="var(--text)">myproject-1.0.0-Linux.rpm</text>
  <text x="958.75" y="181.375" font-family="monospace" font-size="10.1392" fill="var(--text)">myproject-1.0.0-Linux.tar.gz</text>

  <!-- Generator cards: 4 generators -->
  <rect x="68.125" y="215.8125" width="553.125" height="39.875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="344.6875" y="241.1875" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)" text-anchor="middle">Archive Generators</text>

  <rect x="658.75" y="215.8125" width="553.125" height="39.875" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="935.3125" y="241.1875" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--bg)" text-anchor="middle">Native Generators</text>

  <!-- TGZ / ZIP / TXZ -->
  <rect x="68.125" y="264.75" width="553.125" height="145" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="86.875" y="286.5" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)">TGZ / ZIP / TXZ / STGZ</text>
  <text x="86.875" y="306.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Cross-platform tarballs and zip archives</text>
  <text x="86.875" y="326.375" font-family="monospace" font-size="10.1392" fill="var(--text)">set(CPACK_GENERATOR "TGZ;ZIP")</text>
  <text x="86.875" y="344.5" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">STGZ creates self-extracting shell script</text>
  <text x="86.875" y="364.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Works on Linux / macOS / Windows</text>
  <text x="86.875" y="384.375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">No dependency metadata</text>
  <text x="86.875" y="400.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Simple and universally supported</text>

  <!-- DEB + RPM -->
  <rect x="658.75" y="264.75" width="553.125" height="145" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="677.5" y="286.5" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--warn-accent)">DEB (Debian/Ubuntu) / RPM (Red Hat/Fedora)</text>
  <text x="677.5" y="306.4375" font-family="monospace" font-size="10.1392" fill="var(--text)">set(CPACK_DEBIAN_PACKAGE_DEPENDS "libssl1.1")</text>
  <text x="677.5" y="324.5625" font-family="monospace" font-size="10.1392" fill="var(--text)">set(CPACK_RPM_PACKAGE_REQUIRES  "openssl")</text>
  <text x="677.5" y="344.5" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Native package manager integration</text>
  <text x="677.5" y="362.625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Dependency declarations tracked by apt / dnf</text>
  <text x="677.5" y="380.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Pre/post install scripts supported</text>
  <text x="677.5" y="398.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">NSIS generator for Windows installers</text>

  <!-- CPACK variables -->
  <rect x="68.125" y="427.875" width="768.75" height="174" rx="6" fill="var(--surface)" filter="url(#shadow)"/>
  <text x="452.5" y="449.625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--text)" text-anchor="middle">Essential CPACK_* Variables</text>
  <text x="86.875" y="471.375" font-family="monospace" font-size="10.1392" fill="var(--text)">set(CPACK_PACKAGE_NAME            "myproject")</text>
  <text x="86.875" y="489.5" font-family="monospace" font-size="10.1392" fill="var(--text)">set(CPACK_PACKAGE_VERSION         "1.2.3")</text>
  <text x="86.875" y="507.625" font-family="monospace" font-size="10.1392" fill="var(--text)">set(CPACK_PACKAGE_VENDOR          "Acme Corp")</text>
  <text x="86.875" y="525.75" font-family="monospace" font-size="10.1392" fill="var(--text)">set(CPACK_PACKAGE_DESCRIPTION     "My awesome project")</text>
  <text x="86.875" y="543.875" font-family="monospace" font-size="10.1392" fill="var(--text)">set(CPACK_PACKAGE_CONTACT         "dev@acme.com")</text>
  <text x="86.875" y="562" font-family="monospace" font-size="10.1392" fill="var(--text)">set(CPACK_RESOURCE_FILE_LICENSE   "${CMAKE_SOURCE_DIR}/LICENSE")</text>
  <text x="86.875" y="580.125" font-family="monospace" font-size="10.1392" fill="var(--text)">set(CPACK_COMPONENTS_ALL          Runtime Development)</text>

  <!-- Component note -->
  <rect x="855.625" y="427.875" width="356.25" height="174" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1033.75" y="449.625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Component Packaging</text>
  <text x="869.6875" y="471.375" font-family="monospace" font-size="10.1392" fill="var(--text)">cpack --config CPackConfig.cmake</text>
  <text x="869.6875" y="491.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Install only selected component:</text>
  <text x="869.6875" y="509.4375" font-family="monospace" font-size="10.1392" fill="var(--text)">cpack -G DEB \</text>
  <text x="883.75" y="525.75" font-family="monospace" font-size="10.1392" fill="var(--text)">  --component Runtime</text>
  <text x="869.6875" y="545.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Separate .deb for Runtime</text>
  <text x="869.6875" y="563.8125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">and Development components</text>
  <text x="869.6875" y="583.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">Reduces download size for users</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.699677" font-weight="bold" fill="var(--text)">Fixtures: Tests Share Setup and Teardown</text>
  <rect x="40" y="82.181818" width="220" height="537.818182" rx="6.161464" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="145.454545" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--warn-text)">setup_db</text>
  <text x="150" y="198.181818" text-anchor="middle" font-size="15.40366" fill="var(--warn-text)">FIXTURES_SETUP</text>
  <text x="150" y="256.181818" text-anchor="middle" font-size="15.40366" fill="var(--warn-text)">create schema,</text>
  <text x="150" y="282.545455" text-anchor="middle" font-size="15.40366" fill="var(--warn-text)">seed data,</text>
  <text x="150" y="308.909091" text-anchor="middle" font-size="15.40366" fill="var(--warn-text)">open pool</text>
  <text x="150" y="409.090909" text-anchor="middle" font-size="14.376749" fill="var(--warn-text)">runs once</text>
  <text x="150" y="435.454545" text-anchor="middle" font-size="14.376749" fill="var(--warn-text)">before any test</text>
  <line x1="260" y1="351.090909" x2="295" y2="351.090909" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="310" y="82.181818" width="200" height="537.818182" rx="6.161464" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="177.090909" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--primary-text)">test_insert</text>
  <text x="410" y="266.727273" text-anchor="middle" font-size="14.376749" fill="var(--primary-text)">FIXTURES_</text>
  <text x="410" y="293.090909" text-anchor="middle" font-size="14.376749" fill="var(--primary-text)">REQUIRED</text>
  <text x="410" y="372.181818" text-anchor="middle" font-size="14.376749" fill="var(--primary-text)">uses shared</text>
  <text x="410" y="398.545455" text-anchor="middle" font-size="14.376749" fill="var(--primary-text)">database</text>
  <rect x="530" y="82.181818" width="200" height="537.818182" rx="6.161464" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="177.090909" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--primary-text)">test_query</text>
  <text x="630" y="266.727273" text-anchor="middle" font-size="14.376749" fill="var(--primary-text)">FIXTURES_</text>
  <text x="630" y="293.090909" text-anchor="middle" font-size="14.376749" fill="var(--primary-text)">REQUIRED</text>
  <text x="630" y="372.181818" text-anchor="middle" font-size="14.376749" fill="var(--primary-text)">uses shared</text>
  <text x="630" y="398.545455" text-anchor="middle" font-size="14.376749" fill="var(--primary-text)">database</text>
  <rect x="750" y="82.181818" width="200" height="537.818182" rx="6.161464" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="850" y="177.090909" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--primary-text)">test_delete</text>
  <text x="850" y="266.727273" text-anchor="middle" font-size="14.376749" fill="var(--primary-text)">FIXTURES_</text>
  <text x="850" y="293.090909" text-anchor="middle" font-size="14.376749" fill="var(--primary-text)">REQUIRED</text>
  <text x="850" y="372.181818" text-anchor="middle" font-size="14.376749" fill="var(--primary-text)">uses shared</text>
  <text x="850" y="398.545455" text-anchor="middle" font-size="14.376749" fill="var(--primary-text)">database</text>
  <line x1="515" y1="351.090909" x2="525" y2="351.090909" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="735" y1="351.090909" x2="745" y2="351.090909" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="955" y1="351.090909" x2="1015" y2="351.090909" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1020" y="82.181818" width="220" height="537.818182" rx="6.161464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130" y="145.454545" text-anchor="middle" font-size="22.592034" font-weight="bold" fill="var(--ok-text)">cleanup_db</text>
  <text x="1130" y="198.181818" text-anchor="middle" font-size="14.376749" fill="var(--ok-text)">FIXTURES_CLEANUP</text>
  <text x="1130" y="256.181818" text-anchor="middle" font-size="15.40366" fill="var(--ok-text)">drop schema,</text>
  <text x="1130" y="282.545455" text-anchor="middle" font-size="15.40366" fill="var(--ok-text)">close pool,</text>
  <text x="1130" y="308.909091" text-anchor="middle" font-size="15.40366" fill="var(--ok-text)">remove temp files</text>
  <text x="1130" y="409.090909" text-anchor="middle" font-size="14.376749" fill="var(--ok-text)">runs once after</text>
  <text x="1130" y="435.454545" text-anchor="middle" font-size="14.376749" fill="var(--ok-text)">all tests complete</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="220" height="580" rx="6.398529432114" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="108.235293800461" text-anchor="middle" font-size="23.461273892103" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">setup_db</text>
  <text x="150" y="165.098039173395" text-anchor="middle" font-size="15.996323580286" fill="var(--warn-text)" font-family="Arial, sans-serif">FIXTURES_SETUP</text>
  <text x="150" y="227.647058760092" text-anchor="middle" font-size="15.996323580286" fill="var(--warn-text)" font-family="Arial, sans-serif">create schema,</text>
  <text x="150" y="256.078431985775" text-anchor="middle" font-size="15.996323580286" fill="var(--warn-text)" font-family="Arial, sans-serif">seed data,</text>
  <text x="150" y="284.509804133026" text-anchor="middle" font-size="15.996323580286" fill="var(--warn-text)" font-family="Arial, sans-serif">open pool</text>
  <text x="150" y="392.549019586697" text-anchor="middle" font-size="14.929901662109" fill="var(--warn-text)" font-family="Arial, sans-serif">runs once</text>
  <text x="150" y="420.980391733948" text-anchor="middle" font-size="14.929901662109" fill="var(--warn-text)" font-family="Arial, sans-serif">before any test</text>
  <line x1="260" y1="330" x2="295" y2="330" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="310" y="40" width="200" height="580" rx="6.398529432114" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="142.352941239908" text-anchor="middle" font-size="23.461273892103" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">test_insert</text>
  <text x="410" y="239.019608266052" text-anchor="middle" font-size="14.929901662109" fill="var(--primary-text)" font-family="Arial, sans-serif">FIXTURES_</text>
  <text x="410" y="267.450980413303" text-anchor="middle" font-size="14.929901662109" fill="var(--primary-text)" font-family="Arial, sans-serif">REQUIRED</text>
  <text x="410" y="352.745097933487" text-anchor="middle" font-size="14.929901662109" fill="var(--primary-text)" font-family="Arial, sans-serif">uses shared</text>
  <text x="410" y="381.17647115917" text-anchor="middle" font-size="14.929901662109" fill="var(--primary-text)" font-family="Arial, sans-serif">database</text>
  <rect x="530" y="40" width="200" height="580" rx="6.398529432114" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="142.352941239908" text-anchor="middle" font-size="23.461273892103" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">test_query</text>
  <text x="630" y="239.019608266052" text-anchor="middle" font-size="14.929901662109" fill="var(--primary-text)" font-family="Arial, sans-serif">FIXTURES_</text>
  <text x="630" y="267.450980413303" text-anchor="middle" font-size="14.929901662109" fill="var(--primary-text)" font-family="Arial, sans-serif">REQUIRED</text>
  <text x="630" y="352.745097933487" text-anchor="middle" font-size="14.929901662109" fill="var(--primary-text)" font-family="Arial, sans-serif">uses shared</text>
  <text x="630" y="381.17647115917" text-anchor="middle" font-size="14.929901662109" fill="var(--primary-text)" font-family="Arial, sans-serif">database</text>
  <rect x="750" y="40" width="200" height="580" rx="6.398529432114" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="850" y="142.352941239908" text-anchor="middle" font-size="23.461273892103" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">test_delete</text>
  <text x="850" y="239.019608266052" text-anchor="middle" font-size="14.929901662109" fill="var(--primary-text)" font-family="Arial, sans-serif">FIXTURES_</text>
  <text x="850" y="267.450980413303" text-anchor="middle" font-size="14.929901662109" fill="var(--primary-text)" font-family="Arial, sans-serif">REQUIRED</text>
  <text x="850" y="352.745097933487" text-anchor="middle" font-size="14.929901662109" fill="var(--primary-text)" font-family="Arial, sans-serif">uses shared</text>
  <text x="850" y="381.17647115917" text-anchor="middle" font-size="14.929901662109" fill="var(--primary-text)" font-family="Arial, sans-serif">database</text>
  <line x1="515" y1="330" x2="525" y2="330" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="735" y1="330" x2="745" y2="330" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="955" y1="330" x2="1015" y2="330" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="1020" y="40" width="220" height="580" rx="6.398529432114" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130" y="108.235293800461" text-anchor="middle" font-size="23.461273892103" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">cleanup_db</text>
  <text x="1130" y="165.098039173395" text-anchor="middle" font-size="14.929901662109" fill="var(--ok-text)" font-family="Arial, sans-serif">FIXTURES_CLEANUP</text>
  <text x="1130" y="227.647058760092" text-anchor="middle" font-size="15.996323580286" fill="var(--ok-text)" font-family="Arial, sans-serif">drop schema,</text>
  <text x="1130" y="256.078431985775" text-anchor="middle" font-size="15.996323580286" fill="var(--ok-text)" font-family="Arial, sans-serif">close pool,</text>
  <text x="1130" y="284.509804133026" text-anchor="middle" font-size="15.996323580286" fill="var(--ok-text)" font-family="Arial, sans-serif">remove temp files</text>
  <text x="1130" y="392.549019586697" text-anchor="middle" font-size="14.929901662109" fill="var(--ok-text)" font-family="Arial, sans-serif">runs once after</text>
  <text x="1130" y="420.980391733948" text-anchor="middle" font-size="14.929901662109" fill="var(--ok-text)" font-family="Arial, sans-serif">all tests complete</text>
</svg>

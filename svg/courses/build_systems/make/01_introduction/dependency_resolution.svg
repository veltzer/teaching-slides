<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="545.882353" y="40" width="352.941176" height="73.263153" rx="7.554139" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="722.352941" y="83.754271" text-anchor="middle" font-size="26.258941" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">program</text>
  <rect x="204.705882" y="223.157881" width="305.882353" height="69.192879" rx="7.554139" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="357.647059" y="263.859605" text-anchor="middle" font-size="24.070759" fill="var(--text)" font-family="Arial, sans-serif">main.o</text>
  <rect x="934.117647" y="223.157881" width="305.882353" height="69.192879" rx="7.554139" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1087.058698" y="263.859605" text-anchor="middle" font-size="24.070759" fill="var(--text)" font-family="Arial, sans-serif">utils.o</text>
  <rect x="63.529412" y="426.666625" width="270.58811" height="69.192879" rx="7.554139" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="198.823529" y="467.368474" text-anchor="middle" font-size="24.070759" fill="var(--text)" font-family="Arial, sans-serif">main.c</text>
  <rect x="392.941176" y="426.666625" width="270.58811" height="69.192879" rx="7.554139" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="528.235294" y="467.368474" text-anchor="middle" font-size="24.070759" fill="var(--text)" font-family="Arial, sans-serif">utils.c</text>
  <rect x="722.352941" y="426.666625" width="270.58811" height="69.192879" rx="7.554139" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="857.647059" y="467.368474" text-anchor="middle" font-size="24.070759" fill="var(--text)" font-family="Arial, sans-serif">utils.h</text>
  <line x1="651.764706" y1="113.263153" x2="416.470588" y2="223.157881" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="792.941176" y1="113.263153" x2="1028.235294" y2="223.157881" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="357.647059" y1="292.350887" x2="263.529412" y2="426.666625" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="1040" y1="292.350887" x2="757.647059" y2="426.666625" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="1134.117647" y1="292.350887" x2="945.882353" y2="426.666625" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="40" y="558.947415" width="28.235294" height="24.421009" rx="7.554139" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.352941" y="577.263203" font-size="19.694269" fill="var(--text-muted)" font-family="Arial, sans-serif">Final target</text>
  <rect x="275.294118" y="558.947415" width="28.235294" height="24.421009" rx="7.554139" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="317.647059" y="577.263203" font-size="19.694269" fill="var(--text-muted)" font-family="Arial, sans-serif">Intermediate objects</text>
  <rect x="628.235294" y="558.947415" width="28.235294" height="24.421009" rx="7.554139" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="670.588235" y="577.263203" font-size="19.694269" fill="var(--text-muted)" font-family="Arial, sans-serif">Source files</text>
  <text x="722.352941" y="620" text-anchor="middle" font-size="17.505961" fill="var(--text-muted)" font-family="Arial, sans-serif">Arrows show "depends on" relationships (top-down resolution)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="391.1111" y="17.7778" width="355.5556" height="53.3333" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="49.7778" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">Read Makefile</text>
  <line x1="568.8889" y1="72.8889" x2="568.8889" y2="99.5556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="391.1111" y="101.3333" width="355.5556" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="133.3333" text-anchor="middle" font-family="sans-serif" font-size="17.7778" fill="var(--text)">Build dependency graph</text>
  <line x1="568.8889" y1="156.4444" x2="568.8889" y2="183.1111" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <polygon points="568.8889,184.8889 711.1111,238.2222 568.8889,291.5556 426.6667,238.2222" fill="url(#grad-surface)" stroke="var(--primary-border)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="568.8889" y="232.8889" text-anchor="middle" font-family="sans-serif" font-size="16" fill="var(--primary-accent)">Target</text>
  <text x="568.8889" y="252.4444" text-anchor="middle" font-family="sans-serif" font-size="16" fill="var(--primary-accent)">up to date?</text>
  <line x1="711.1111" y1="238.2222" x2="871.1111" y2="238.2222" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="789.3333" y="227.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">yes</text>
  <rect x="871.1111" y="211.5556" width="213.3333" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="977.7778" y="243.5556" text-anchor="middle" font-family="sans-serif" font-size="16" fill="var(--text-faint)">Skip — nothing to do</text>
  <line x1="568.8889" y1="291.5556" x2="568.8889" y2="318.2222" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="584.8889" y="309.3333" font-family="sans-serif" font-size="13.3333" fill="var(--primary-accent)">no</text>
  <rect x="391.1111" y="320" width="355.5556" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="352" text-anchor="middle" font-family="sans-serif" font-size="17.7778" fill="var(--text)">Build prerequisites first</text>
  <path d="M 391.1111 346.6667 Q 302.2222 346.6667 302.2222 238.2222 Q 302.2222 129.7778 391.1111 129.7778" stroke="var(--primary-border)" stroke-width="1.3333" fill="none" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow-primary)" />
  <text x="273.7778" y="241.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--primary-accent)" transform="rotate(-90 308 272)">recurse</text>
  <line x1="568.8889" y1="375.1111" x2="568.8889" y2="401.7778" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="391.1111" y="403.5556" width="355.5556" height="53.3333" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="435.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">Run recipe (shell commands)</text>
  <line x1="568.8889" y1="458.6667" x2="568.8889" y2="485.3333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="391.1111" y="487.1111" width="355.5556" height="53.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="519.1111" text-anchor="middle" font-family="sans-serif" font-size="17.7778" fill="var(--text-muted)">Update timestamp on target</text>
  <rect x="71.1111" y="403.5556" width="266.6667" height="88.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="204.4444" y="430.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)">Out-of-date if:</text>
  <text x="88.8889" y="451.5556" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• target doesn't exist, OR</text>
  <text x="88.8889" y="471.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• any prerequisite is newer</text>
  <text x="88.8889" y="490.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">  than the target</text>
</svg>
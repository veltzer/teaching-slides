<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="418.947368" y="40" width="421.052632" height="59.183641" rx="7.035281" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="629.473684" y="75.510209" text-anchor="middle" font-family="sans-serif" font-size="20.379566" font-weight="bold" fill="var(--bg)">Read Makefile</text>
  <line x1="629.473684" y1="101.156539" x2="629.473684" y2="130.748421" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="418.947368" y="132.721074" width="421.052632" height="59.183641" rx="7.035281" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="629.473684" y="168.231283" text-anchor="middle" font-family="sans-serif" font-size="20.379566" fill="var(--text)">Build dependency graph</text>
  <line x1="629.473684" y1="193.877491" x2="629.473684" y2="223.469373" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <polygon points="629.473684,225.442271 797.894737,284.625912 629.473684,343.809675 461.052632,284.625912" fill="url(#grad-surface)" stroke="var(--primary-border)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="629.473684" y="278.707585" text-anchor="middle" font-family="sans-serif" font-size="18.341563" fill="var(--primary-accent)">Target</text>
  <text x="629.473684" y="300.408118" text-anchor="middle" font-family="sans-serif" font-size="18.341563" fill="var(--primary-accent)">up to date?</text>
  <line x1="797.894737" y1="284.625912" x2="987.368421" y2="284.625912" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="890.526204" y="272.789257" text-anchor="middle" font-family="sans-serif" font-size="15.284616" fill="var(--text-muted)">yes</text>
  <rect x="987.368421" y="255.034153" width="252.631579" height="59.183641" rx="7.035281" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1113.684211" y="290.544362" text-anchor="middle" font-family="sans-serif" font-size="18.341563" fill="var(--text-faint)">Skip — nothing to do</text>
  <line x1="629.473684" y1="343.809675" x2="629.473684" y2="373.401435" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="648.421053" y="363.537433" font-family="sans-serif" font-size="15.284616" fill="var(--primary-accent)">no</text>
  <rect x="418.947368" y="375.37421" width="421.052632" height="59.183641" rx="7.035281" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="629.473684" y="410.88442" text-anchor="middle" font-family="sans-serif" font-size="20.379566" fill="var(--text)">Build prerequisites first</text>
  <path d="M 418.947368 404.966092 Q 313.684211 404.966092 313.684211 284.625912 Q 313.684211 164.285732 418.947368 164.285732" stroke="var(--primary-border)" stroke-width="1.3333" fill="none" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow-primary)" />
  <text x="328.75" y="259.1111" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--primary-accent)" transform="rotate(-90 308 272)">recurse</text>
  <line x1="629.473684" y1="436.530627" x2="629.473684" y2="466.122509" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="418.947368" y="468.095407" width="421.052632" height="59.183641" rx="7.035281" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="629.473684" y="503.605616" text-anchor="middle" font-family="sans-serif" font-size="20.379566" font-weight="bold" fill="var(--bg)">Run recipe (shell commands)</text>
  <line x1="629.473684" y1="529.251824" x2="629.473684" y2="558.843583" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="418.947368" y="560.816359" width="421.052632" height="59.183641" rx="7.035281" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="629.473684" y="596.326568" text-anchor="middle" font-family="sans-serif" font-size="20.379566" fill="var(--text-muted)">Update timestamp on target</text>
  <rect x="40" y="468.095407" width="315.789474" height="98.639524" rx="7.035281" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="197.894625" y="497.687166" text-anchor="middle" font-family="sans-serif" font-size="15.284616" font-weight="bold" fill="var(--primary-accent)">Out-of-date if:</text>
  <text x="61.052632" y="521.360721" font-family="sans-serif" font-size="14.265556" fill="var(--text-muted)">• target doesn't exist, OR</text>
  <text x="61.052632" y="543.061254" font-family="sans-serif" font-size="14.265556" fill="var(--text-muted)">• any prerequisite is newer</text>
  <text x="61.052632" y="564.762033" font-family="sans-serif" font-size="14.265556" fill="var(--text-muted)">  than the target</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="452.5" y="56.1111" width="375" height="48.3333" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="85.1111" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)">Read Makefile</text>
  <line x1="640" y1="106.0556" x2="640" y2="130.2223" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="452.5" y="131.8333" width="375" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="160.8333" text-anchor="middle" font-family="sans-serif" font-size="17.3806" fill="var(--text)">Build dependency graph</text>
  <line x1="640" y1="181.7777" x2="640" y2="205.9444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <polygon points="640,207.5556 790,255.8889 640,304.2223 490,255.8889" fill="url(#grad-surface)" stroke="var(--primary-border)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="640" y="251.0556" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--primary-accent)">Target</text>
  <text x="640" y="268.7777" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--primary-accent)">up to date?</text>
  <line x1="790" y1="255.8889" x2="958.75" y2="255.8889" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="872.4999" y="246.2223" text-anchor="middle" font-family="sans-serif" font-size="13.0354" fill="var(--text-muted)">yes</text>
  <rect x="958.75" y="231.7223" width="225" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1071.25" y="260.7223" text-anchor="middle" font-family="sans-serif" font-size="15.6425" fill="var(--text-faint)">Skip — nothing to do</text>
  <line x1="640" y1="304.2223" x2="640" y2="328.3889" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="656.875" y="320.3333" font-family="sans-serif" font-size="13.0354" fill="var(--primary-accent)">no</text>
  <rect x="452.5" y="330" width="375" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="359" text-anchor="middle" font-family="sans-serif" font-size="17.3806" fill="var(--text)">Build prerequisites first</text>
  <path d="M 452.5 354.1667 Q 358.75 354.1667 358.75 255.8889 Q 358.75 157.6111 452.5 157.6111" stroke="var(--primary-border)" stroke-width="1.3333" fill="none" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow-primary)" />
  <text x="328.75" y="259.1111" text-anchor="middle" font-family="sans-serif" font-size="11.2974" fill="var(--primary-accent)" transform="rotate(-90 308 272)">recurse</text>
  <line x1="640" y1="379.9444" x2="640" y2="404.1111" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="452.5" y="405.7223" width="375" height="48.3333" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="434.7223" text-anchor="middle" font-family="sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)">Run recipe (shell commands)</text>
  <line x1="640" y1="455.6667" x2="640" y2="479.8333" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="452.5" y="481.4444" width="375" height="48.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="510.4444" text-anchor="middle" font-family="sans-serif" font-size="17.3806" fill="var(--text-muted)">Update timestamp on target</text>
  <rect x="115" y="405.7223" width="281.25" height="80.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="255.6249" y="429.8889" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)">Out-of-date if:</text>
  <text x="133.75" y="449.2223" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">• target doesn't exist, OR</text>
  <text x="133.75" y="466.9444" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">• any prerequisite is newer</text>
  <text x="133.75" y="484.6667" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">  than the target</text>
</svg>
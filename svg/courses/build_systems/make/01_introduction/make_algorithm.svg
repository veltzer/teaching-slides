<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" />
  <rect x="391.1111" y="17.7778" width="355.5556" height="53.3333" rx="5.3333" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="568.8889" y="49.7778" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">Read Makefile</text>
  <line x1="568.8889" y1="72.8889" x2="568.8889" y2="99.5556" stroke="var(--primary-dk)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="391.1111" y="101.3333" width="355.5556" height="53.3333" rx="5.3333" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="568.8889" y="133.3333" text-anchor="middle" font-family="sans-serif" font-size="17.7778" fill="var(--text)">Build dependency graph</text>
  <line x1="568.8889" y1="156.4444" x2="568.8889" y2="183.1111" stroke="var(--primary-dk)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <polygon points="568.8889,184.8889 711.1111,238.2222 568.8889,291.5556 426.6667,238.2222" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="568.8889" y="232.8889" text-anchor="middle" font-family="sans-serif" font-size="16" fill="var(--primary-dk)">Target</text>
  <text x="568.8889" y="252.4444" text-anchor="middle" font-family="sans-serif" font-size="16" fill="var(--primary-dk)">up to date?</text>
  <line x1="711.1111" y1="238.2222" x2="871.1111" y2="238.2222" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="789.3333" y="227.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">yes</text>
  <rect x="871.1111" y="211.5556" width="213.3333" height="53.3333" rx="5.3333" fill="var(--surface-dark)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="977.7778" y="243.5556" text-anchor="middle" font-family="sans-serif" font-size="16" fill="var(--text-disabled)">Skip — nothing to do</text>
  <line x1="568.8889" y1="291.5556" x2="568.8889" y2="318.2222" stroke="var(--primary-dk)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="584.8889" y="309.3333" font-family="sans-serif" font-size="13.3333" fill="var(--primary-dk)">no</text>
  <rect x="391.1111" y="320" width="355.5556" height="53.3333" rx="5.3333" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="568.8889" y="352" text-anchor="middle" font-family="sans-serif" font-size="17.7778" fill="var(--text)">Build prerequisites first</text>
  <path d="M 391.1111 346.6667 Q 302.2222 346.6667 302.2222 238.2222 Q 302.2222 129.7778 391.1111 129.7778" stroke="var(--primary-dk)" stroke-width="1.3333" fill="none" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow-primary)" />
  <text x="273.7778" y="241.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--primary-dk)" transform="rotate(-90 308 272)">recurse</text>
  <line x1="568.8889" y1="375.1111" x2="568.8889" y2="401.7778" stroke="var(--primary-dk)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="391.1111" y="403.5556" width="355.5556" height="53.3333" rx="5.3333" fill="url(#grad-primary)" filter="url(#shadow)" />
  <text x="568.8889" y="435.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">Run recipe (shell commands)</text>
  <line x1="568.8889" y1="458.6667" x2="568.8889" y2="485.3333" stroke="var(--primary-dk)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="391.1111" y="487.1111" width="355.5556" height="53.3333" rx="5.3333" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="568.8889" y="519.1111" text-anchor="middle" font-family="sans-serif" font-size="17.7778" fill="var(--text-muted)">Update timestamp on target</text>
  <rect x="71.1111" y="403.5556" width="266.6667" height="88.8889" rx="5.3333" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.3333" />
  <text x="204.4444" y="430.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-dk)">Out-of-date if:</text>
  <text x="88.8889" y="451.5556" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• target doesn't exist, OR</text>
  <text x="88.8889" y="471.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">• any prerequisite is newer</text>
  <text x="88.8889" y="490.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">  than the target</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Step 1 -->
  <rect x="440" y="20" width="400" height="60" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="56" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Read Makefile</text>

  <line x1="640" y1="82" x2="640" y2="112" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Step 2 -->
  <rect x="440" y="114" width="400" height="60" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="150" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#212121">Build dependency graph</text>

  <line x1="640" y1="176" x2="640" y2="206" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Step 3: diamond -->
  <polygon points="640,208 800,268 640,328 480,268" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="262" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1565c0">Target</text>
  <text x="640" y="284" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1565c0">up to date?</text>

  <!-- Yes branch -->
  <line x1="800" y1="268" x2="980" y2="268" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="888" y="256" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">yes</text>
  <rect x="980" y="238" width="240" height="60" rx="6" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1100" y="274" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#9e9e9e">Skip — nothing to do</text>

  <!-- No branch -->
  <line x1="640" y1="328" x2="640" y2="358" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="658" y="348" font-family="sans-serif" font-size="15" fill="#1565c0">no</text>

  <!-- Step 4: build prereqs first -->
  <rect x="440" y="360" width="400" height="60" rx="6" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="396" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#212121">Build prerequisites first</text>
  <!-- recursive arrow -->
  <path d="M 440 390 Q 340 390 340 268 Q 340 146 440 146" stroke="#1565c0" stroke-width="1.5" fill="none" stroke-dasharray="6 3" marker-end="url(#arrow-accent)"/>
  <text x="308" y="272" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1565c0" transform="rotate(-90 308 272)">recurse</text>

  <line x1="640" y1="422" x2="640" y2="452" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Step 5: run recipe -->
  <rect x="440" y="454" width="400" height="60" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="490" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Run recipe (shell commands)</text>

  <line x1="640" y1="516" x2="640" y2="546" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Step 6 -->
  <rect x="440" y="548" width="400" height="60" rx="6" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="584" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#555555">Update timestamp on target</text>

  <!-- Key insight -->
  <rect x="80" y="454" width="300" height="100" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="230" y="484" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1565c0">Out-of-date if:</text>
  <text x="100" y="508" font-family="sans-serif" font-size="14" fill="#555555">• target doesn't exist, OR</text>
  <text x="100" y="530" font-family="sans-serif" font-size="14" fill="#555555">• any prerequisite is newer</text>
  <text x="100" y="552" font-family="sans-serif" font-size="14" fill="#555555">  than the target</text>
</svg>

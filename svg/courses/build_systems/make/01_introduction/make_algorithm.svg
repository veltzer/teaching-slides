<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="391.1111" y="17.7778" width="355.5556" height="53.3333" rx="5.3333" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="49.7778" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#ffffff">Read Makefile</ns0:text>
  <ns0:line x1="568.8889" y1="72.8889" x2="568.8889" y2="99.5556" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:rect x="391.1111" y="101.3333" width="355.5556" height="53.3333" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="133.3333" text-anchor="middle" font-family="sans-serif" font-size="17.7778" fill="#212121">Build dependency graph</ns0:text>
  <ns0:line x1="568.8889" y1="156.4444" x2="568.8889" y2="183.1111" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:polygon points="568.8889,184.8889 711.1111,238.2222 568.8889,291.5556 426.6667,238.2222" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="232.8889" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1565c0">Target</ns0:text>
  <ns0:text x="568.8889" y="252.4444" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1565c0">up to date?</ns0:text>
  <ns0:line x1="711.1111" y1="238.2222" x2="871.1111" y2="238.2222" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:text x="789.3333" y="227.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">yes</ns0:text>
  <ns0:rect x="871.1111" y="211.5556" width="213.3333" height="53.3333" rx="5.3333" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="977.7778" y="243.5556" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9e9e9e">Skip — nothing to do</ns0:text>
  <ns0:line x1="568.8889" y1="291.5556" x2="568.8889" y2="318.2222" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:text x="584.8889" y="309.3333" font-family="sans-serif" font-size="13.3333" fill="#1565c0">no</ns0:text>
  <ns0:rect x="391.1111" y="320" width="355.5556" height="53.3333" rx="5.3333" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="352" text-anchor="middle" font-family="sans-serif" font-size="17.7778" fill="#212121">Build prerequisites first</ns0:text>
  <ns0:path d="M 391.1111 346.6667 Q 302.2222 346.6667 302.2222 238.2222 Q 302.2222 129.7778 391.1111 129.7778" stroke="#1565c0" stroke-width="1.3333" fill="none" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow-primary)" />
  <ns0:text x="273.7778" y="241.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#1565c0" transform="rotate(-90 308 272)">recurse</ns0:text>
  <ns0:line x1="568.8889" y1="375.1111" x2="568.8889" y2="401.7778" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:rect x="391.1111" y="403.5556" width="355.5556" height="53.3333" rx="5.3333" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="435.5556" text-anchor="middle" font-family="sans-serif" font-size="17.7778" font-weight="bold" fill="#ffffff">Run recipe (shell commands)</ns0:text>
  <ns0:line x1="568.8889" y1="458.6667" x2="568.8889" y2="485.3333" stroke="#1565c0" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <ns0:rect x="391.1111" y="487.1111" width="355.5556" height="53.3333" rx="5.3333" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="519.1111" text-anchor="middle" font-family="sans-serif" font-size="17.7778" fill="#555555">Update timestamp on target</ns0:text>
  <ns0:rect x="71.1111" y="403.5556" width="266.6667" height="88.8889" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="204.4444" y="430.2222" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="#1565c0">Out-of-date if:</ns0:text>
  <ns0:text x="88.8889" y="451.5556" font-family="sans-serif" font-size="12.4444" fill="#555555">• target doesn't exist, OR</ns0:text>
  <ns0:text x="88.8889" y="471.1111" font-family="sans-serif" font-size="12.4444" fill="#555555">• any prerequisite is newer</ns0:text>
  <ns0:text x="88.8889" y="490.6667" font-family="sans-serif" font-size="12.4444" fill="#555555">  than the target</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- PHONY -->
  <rect x="40" y="40" width="390" height="210" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">.PHONY Targets</text>
  <text x="60" y="115" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">.PHONY: all clean test</text>
  <text x="60" y="145" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">.PHONY: lint help</text>
  <text x="60" y="185" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">Prevents file-name clash</text>
  <text x="60" y="215" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">Always runs recipe</text>

  <!-- Variables -->
  <rect x="445" y="40" width="390" height="210" rx="8" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Variables</text>
  <text x="465" y="115" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">CC := gcc</text>
  <text x="465" y="145" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">CFLAGS ?= -Wall -O2</text>
  <text x="465" y="175" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">SRCS := $(wildcard *.c)</text>
  <text x="465" y="205" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">OBJS := $(SRCS:.c=.o)</text>
  <text x="465" y="235" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--bg)">?= allows env override</text>

  <!-- Debug -->
  <rect x="850" y="40" width="390" height="210" rx="8" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Debug</text>
  <text x="870" y="115" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">print-%:</text>
  <text x="890" y="140" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">@echo "$* = $($*)"</text>
  <text x="870" y="175" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">make --dry-run</text>
  <text x="870" y="205" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">make --warn-undef</text>
  <text x="870" y="235" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--bg)">@ silences echo</text>

  <!-- Self-documenting help -->
  <rect x="40" y="275" width="590" height="210" rx="8" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Help Target</text>
  <text x="60" y="345" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">help: ## Show help</text>
  <text x="75" y="370" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">@grep -E '^.*##' \</text>
  <text x="90" y="395" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">$(MAKEFILE_LIST) | ...</text>
  <text x="60" y="430" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">clean: ## Remove builds</text>
  <text x="60" y="460" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">test: ## Run tests</text>

  <!-- Project structure -->
  <rect x="650" y="275" width="590" height="210" rx="8" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Layout</text>
  <text x="670" y="345" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">project/</text>
  <text x="685" y="370" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">Makefile</text>
  <text x="685" y="395" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">config.mk</text>
  <text x="685" y="420" font-family="Courier New, monospace" font-size="13" fill="var(--bg)">src/  build/  dist/</text>
  <text x="670" y="460" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--bg)">-include config.mk</text>

  <!-- Pitfalls -->
  <rect x="40" y="510" width="1200" height="110" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--bg)">Pitfalls</text>
  <text x="640" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">Use tabs for recipes, never spaces</text>
  <text x="640" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">Declare .PHONY for every non-file target</text>
</svg>

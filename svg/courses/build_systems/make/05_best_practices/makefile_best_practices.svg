<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- Header -->
  <rect x="30" y="14" width="1220" height="44" rx="6" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">Makefile Best Practices</text>

  <!-- PHONY targets -->
  <rect x="30" y="74" width="390" height="220" rx="5" fill="var(--primary-pale)" filter="url(#shadow)"/>
  <text x="225" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">.PHONY Targets</text>
  <text x="45" y="120" font-family="monospace" font-size="12" fill="var(--text-dark)">.PHONY: all clean test install</text>
  <text x="45" y="140" font-family="monospace" font-size="12" fill="var(--text-dark)">.PHONY: help lint format</text>
  <text x="45" y="164" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Prevents conflict with files named</text>
  <text x="45" y="182" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">"clean" or "all"</text>
  <text x="45" y="202" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Always runs recipe (no up-to-date check)</text>
  <text x="45" y="226" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)">Common phony targets:</text>
  <text x="45" y="246" font-family="monospace" font-size="12" fill="var(--text-dark)">all  clean  test  install</text>
  <text x="45" y="264" font-family="monospace" font-size="12" fill="var(--text-dark)">lint  format  doc  help</text>

  <!-- Variable organization -->
  <rect x="440" y="74" width="400" height="220" rx="5" fill="var(--ok-pale)" filter="url(#shadow)"/>
  <text x="640" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">Variable Organization</text>
  <text x="455" y="120" font-family="monospace" font-size="11" fill="var(--text-faint)"># Toolchain</text>
  <text x="455" y="138" font-family="monospace" font-size="12" fill="var(--text-dark)">CC      := gcc</text>
  <text x="455" y="156" font-family="monospace" font-size="12" fill="var(--text-dark)">CXX     := g++</text>
  <text x="455" y="178" font-family="monospace" font-size="11" fill="var(--text-faint)"># Flags (override via env)</text>
  <text x="455" y="196" font-family="monospace" font-size="12" fill="var(--text-dark)">CFLAGS  ?= -Wall -O2</text>
  <text x="455" y="218" font-family="monospace" font-size="11" fill="var(--text-faint)"># Sources and objects</text>
  <text x="455" y="236" font-family="monospace" font-size="12" fill="var(--text-dark)">SRCS    := $(wildcard src/*.c)</text>
  <text x="455" y="254" font-family="monospace" font-size="12" fill="var(--text-dark)">OBJS    := $(SRCS:.c=.o)</text>
  <text x="455" y="276" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">?= allows environment override</text>

  <!-- Debug targets -->
  <rect x="860" y="74" width="390" height="220" rx="5" fill="var(--warn-pale)" filter="url(#shadow)"/>
  <text x="1055" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-dk)" text-anchor="middle">Debug Targets</text>
  <text x="875" y="120" font-family="monospace" font-size="12" fill="var(--text-dark)">print-%:</text>
  <text x="890" y="138" font-family="monospace" font-size="12" fill="var(--text-dark)">@echo "$* = $($*)"</text>
  <text x="875" y="162" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Usage: make print-SRCS</text>
  <text x="875" y="184" font-family="monospace" font-size="12" fill="var(--text-dark)">make VERBOSE=1    # show cmds</text>
  <text x="875" y="204" font-family="monospace" font-size="12" fill="var(--text-dark)">make --dry-run    # no execute</text>
  <text x="875" y="224" font-family="monospace" font-size="12" fill="var(--text-dark)">make --warn-undef # undef vars</text>
  <text x="875" y="248" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Prefix recipe with @ to silence echo</text>
  <text x="875" y="268" font-family="monospace" font-size="12" fill="var(--text-dark)">@$(CC) -c $&lt; -o $@</text>

  <!-- Self-documenting help -->
  <rect x="30" y="312" width="600" height="200" rx="5" fill="var(--info-pale)" filter="url(#shadow)"/>
  <text x="330" y="336" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">Self-Documenting Help Target</text>
  <text x="45" y="358" font-family="monospace" font-size="12" fill="var(--text-dark)">help: ## Show this help</text>
  <text x="60" y="376" font-family="monospace" font-size="12" fill="var(--text-dark)">@grep -E '^[a-zA-Z_-]+:.*##' \</text>
  <text x="75" y="394" font-family="monospace" font-size="12" fill="var(--text-dark)">  $(MAKEFILE_LIST) | \</text>
  <text x="75" y="412" font-family="monospace" font-size="12" fill="var(--text-dark)">  awk 'BEGIN{FS="## "}; \</text>
  <text x="75" y="430" font-family="monospace" font-size="12" fill="var(--text-dark)">  {printf "%-20s %s\n",$$1,$$2}'</text>
  <text x="45" y="456" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Tag each target with ## description:</text>
  <text x="45" y="476" font-family="monospace" font-size="12" fill="var(--text-dark)">clean: ## Remove build artifacts</text>
  <text x="45" y="496" font-family="monospace" font-size="12" fill="var(--text-dark)">test:  ## Run all unit tests</text>

  <!-- Project structure -->
  <rect x="650" y="312" width="600" height="200" rx="5" fill="var(--danger-pale3)" filter="url(#shadow)"/>
  <text x="950" y="336" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-dk)" text-anchor="middle">Real-World Project Structure</text>
  <text x="665" y="358" font-family="monospace" font-size="12" fill="var(--text-dark)">project/</text>
  <text x="680" y="376" font-family="monospace" font-size="12" fill="var(--text-dark)">  Makefile          # main entry</text>
  <text x="680" y="394" font-family="monospace" font-size="12" fill="var(--text-dark)">  config.mk         # user settings</text>
  <text x="680" y="412" font-family="monospace" font-size="12" fill="var(--text-dark)">  rules.mk          # pattern rules</text>
  <text x="680" y="430" font-family="monospace" font-size="12" fill="var(--text-dark)">  src/</text>
  <text x="695" y="448" font-family="monospace" font-size="12" fill="var(--text-dark)">*.c  *.h</text>
  <text x="680" y="466" font-family="monospace" font-size="12" fill="var(--text-dark)">  build/            # obj files</text>
  <text x="680" y="484" font-family="monospace" font-size="12" fill="var(--text-dark)">  dist/             # final binaries</text>
  <text x="665" y="504" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">-include config.mk at top of Makefile</text>

  <!-- Bottom tips -->
  <rect x="30" y="530" width="1220" height="90" rx="6" fill="var(--primary-pale)" filter="url(#shadow)"/>
  <text x="640" y="554" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">Common Pitfalls to Avoid</text>
  <text x="50" y="576" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Use tabs (not spaces) for recipe lines - spaces cause "missing separator" errors</text>
  <text x="50" y="596" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Avoid spaces around := assignment - "CC := gcc" not "CC :=gcc"</text>
  <text x="50" y="616" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Declare .PHONY for every non-file target - prevents silent skips when a file of that name exists</text>
</svg>

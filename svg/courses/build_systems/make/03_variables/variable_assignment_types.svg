<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="17.7778" width="142.2222" height="39.1111" rx="6" fill="var(--text)" />
  <text x="97.7778" y="42.6667" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--bg)">Operator</text>
  <rect x="177.7778" y="17.7778" width="177.7778" height="39.1111" rx="6" fill="var(--text)" />
  <text x="266.6667" y="42.6667" text-anchor="middle" font-family="sans-serif" font-size="15.1111" font-weight="bold" fill="var(--bg)">Name</text>
  <rect x="364.4444" y="17.7778" width="373.3333" height="39.1111" rx="6" fill="var(--text)" />
  <text x="551.1111" y="42.6667" text-anchor="middle" font-family="sans-serif" font-size="15.1111" font-weight="bold" fill="var(--bg)">Behaviour</text>
  <rect x="746.6667" y="17.7778" width="373.3333" height="39.1111" rx="6" fill="var(--text)" />
  <text x="933.3333" y="42.6667" text-anchor="middle" font-family="sans-serif" font-size="15.1111" font-weight="bold" fill="var(--bg)">Example</text>
  <rect x="26.6667" y="65.7778" width="142.2222" height="88.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="97.7778" y="117.3333" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="var(--bg)">=</text>
  <rect x="177.7778" y="65.7778" width="177.7778" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="266.6667" y="106.6667" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text)">Recursive</text>
  <text x="266.6667" y="126.2222" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text)">expand</text>
  <rect x="364.4444" y="65.7778" width="373.3333" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="551.1111" y="99.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Expanded every time it is used.</text>
  <text x="551.1111" y="119.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Can reference variables defined later.</text>
  <text x="551.1111" y="138.6667" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">Risk: infinite recursion if self-referential</text>
  <rect x="746.6667" y="65.7778" width="373.3333" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="764.4444" y="99.5556" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">CC = gcc</text>
  <text x="764.4444" y="120.8889" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">CFLAGS = $(EXTRA)</text>
  <text x="764.4444" y="142.2222" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">EXTRA can be set later</text>
  <rect x="26.6667" y="163.5556" width="142.2222" height="88.8889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="97.7778" y="215.1111" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="var(--bg)">:=</text>
  <rect x="177.7778" y="163.5556" width="177.7778" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="266.6667" y="204.4444" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text)">Simple</text>
  <text x="266.6667" y="224" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text)">expand</text>
  <rect x="364.4444" y="163.5556" width="373.3333" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="551.1111" y="197.3333" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Expanded once at definition time.</text>
  <text x="551.1111" y="216.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Safe — no recursion possible.</text>
  <text x="551.1111" y="236.4444" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">Preferred for performance</text>
  <rect x="746.6667" y="163.5556" width="373.3333" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="764.4444" y="197.3333" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">SRC := $(wildcard *.c)</text>
  <text x="764.4444" y="218.6667" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">OBJ := $(SRC:.c=.o)</text>
  <rect x="26.6667" y="261.3333" width="142.2222" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="97.7778" y="312.8889" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="var(--primary-accent)">?=</text>
  <rect x="177.7778" y="261.3333" width="177.7778" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="266.6667" y="302.2222" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text)">Conditional</text>
  <text x="266.6667" y="321.7778" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text)">assign</text>
  <rect x="364.4444" y="261.3333" width="373.3333" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="551.1111" y="295.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Only assigns if variable is not</text>
  <text x="551.1111" y="314.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">already set (or set via environment).</text>
  <text x="551.1111" y="334.2222" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">Great for defaults users can override</text>
  <rect x="746.6667" y="261.3333" width="373.3333" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="764.4444" y="295.1111" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">CC ?= gcc</text>
  <text x="764.4444" y="316.4444" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">User can override:</text>
  <text x="764.4444" y="334.2222" font-family="monospace" font-size="14.2222" fill="var(--text-muted)">make CC=clang</text>
  <rect x="26.6667" y="359.1111" width="142.2222" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="97.7778" y="410.6667" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="var(--primary-accent)">+=</text>
  <rect x="177.7778" y="359.1111" width="177.7778" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="266.6667" y="400" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text)">Append</text>
  <rect x="364.4444" y="359.1111" width="373.3333" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="551.1111" y="392.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Appends to existing value</text>
  <text x="551.1111" y="412.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">with a space separator.</text>
  <text x="551.1111" y="432" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">Inherits expansion type of original</text>
  <rect x="746.6667" y="359.1111" width="373.3333" height="88.8889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="764.4444" y="392.8889" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">CFLAGS := -Wall</text>
  <text x="764.4444" y="414.2222" font-family="monospace" font-size="14.2222" fill="var(--primary-accent)">CFLAGS += -O2</text>
  <text x="764.4444" y="435.5556" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">result: -Wall -O2</text>
  <rect x="26.6667" y="469.3333" width="1084.4444" height="39.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.8889" y="493.3333" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-accent)">Prefer <tspan font-family="monospace">:=</tspan> for most variables — it is faster and avoids unexpected re-expansion</text>
</svg>
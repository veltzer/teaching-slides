<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="100" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" font-weight="bold" fill="var(--text)">Operator</text>
  <text x="305" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" font-weight="bold" fill="var(--text)">Name</text>
  <text x="615" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" font-weight="bold" fill="var(--text)">Behaviour</text>
  <text x="1035" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" font-weight="bold" fill="var(--text)">Example</text>
  <line x1="40" y1="55.818181818182" x2="1240" y2="55.818181818182" stroke="var(--border)" stroke-width="1"/>

  <rect x="40" y="71.636363636364" width="160" height="105.454545454545" rx="6.16146381663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="140.181818181818" text-anchor="middle" font-family="Courier New, monospace" font-size="36.968782899778" font-weight="bold" fill="var(--primary-text)">=</text>
  <text x="305" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--text)">Recursive</text>
  <text x="305" y="145.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--text)">expand</text>
  <text x="615" y="113.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">Expanded every use</text>
  <text x="615" y="140.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">Can forward-reference</text>
  <text x="615" y="164.436363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--text-faint)">Risk: recursion</text>
  <text x="850" y="113.818181818182" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--primary-accent)">CC = gcc</text>
  <text x="850" y="140.181818181818" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--primary-accent)">CFLAGS = $(EXTRA)</text>

  <rect x="40" y="192.909090909091" width="160" height="105.454545454545" rx="6.16146381663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="261.454545454545" text-anchor="middle" font-family="Courier New, monospace" font-size="36.968782899778" font-weight="bold" fill="var(--primary-text)">:=</text>
  <text x="305" y="240.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--text)">Simple</text>
  <text x="305" y="266.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--text)">expand</text>
  <text x="615" y="235.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">Expanded once</text>
  <text x="615" y="261.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">No recursion</text>
  <text x="615" y="282.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--text-faint)">Preferred</text>
  <text x="850" y="235.090909090909" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--primary-accent)">SRC := $(wildcard *.c)</text>
  <text x="850" y="261.454545454545" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--primary-accent)">OBJ := $(SRC:.c=.o)</text>

  <rect x="40" y="314.181818181818" width="160" height="105.454545454545" rx="6.16146381663" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="382.727272727273" text-anchor="middle" font-family="Courier New, monospace" font-size="36.968782899778" font-weight="bold" fill="var(--ok-text)">?=</text>
  <text x="305" y="361.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--text)">Conditional</text>
  <text x="305" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--text)">assign</text>
  <text x="615" y="356.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">Only if unset</text>
  <text x="615" y="382.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">Honors environment</text>
  <text x="615" y="403.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--text-faint)">Good for defaults</text>
  <text x="850" y="356.363636363636" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--ok-accent)">CC ?= gcc</text>
  <text x="850" y="388" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--text-muted)">make CC=clang</text>

  <rect x="40" y="435.454545454545" width="160" height="105.454545454545" rx="6.16146381663" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="504" text-anchor="middle" font-family="Courier New, monospace" font-size="36.968782899778" font-weight="bold" fill="var(--warn-text)">+=</text>
  <text x="305" y="488.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--text)">Append</text>
  <text x="615" y="477.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">Append with space</text>
  <text x="615" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--text-muted)">Keeps original type</text>
  <text x="850" y="472.363636363636" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--warn-accent)">CFLAGS := -Wall</text>
  <text x="850" y="498.727272727273" font-family="Courier New, monospace" font-size="15.403659541574" fill="var(--warn-accent)">CFLAGS += -O2</text>
  <text x="850" y="525.090909090909" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--text-faint)">= -Wall -O2</text>

  <rect x="40" y="562" width="1200" height="58" rx="6.16146381663" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="598.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.430570177679" fill="var(--primary-text)">Prefer := — faster, no surprise re-expansion</text>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="var(--bg)" />
  <ns0:rect x="26.6667" y="17.7778" width="142.2222" height="39.1111" rx="3.5556" fill="var(--text)" />
  <ns0:text x="97.7778" y="42.6667" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="var(--bg)">Operator</ns0:text>
  <ns0:rect x="177.7778" y="17.7778" width="177.7778" height="39.1111" rx="3.5556" fill="var(--text)" />
  <ns0:text x="266.6667" y="42.6667" text-anchor="middle" font-family="sans-serif" font-size="15.1111" font-weight="bold" fill="var(--bg)">Name</ns0:text>
  <ns0:rect x="364.4444" y="17.7778" width="373.3333" height="39.1111" rx="3.5556" fill="var(--text)" />
  <ns0:text x="551.1111" y="42.6667" text-anchor="middle" font-family="sans-serif" font-size="15.1111" font-weight="bold" fill="var(--bg)">Behaviour</ns0:text>
  <ns0:rect x="746.6667" y="17.7778" width="373.3333" height="39.1111" rx="3.5556" fill="var(--text)" />
  <ns0:text x="933.3333" y="42.6667" text-anchor="middle" font-family="sans-serif" font-size="15.1111" font-weight="bold" fill="var(--bg)">Example</ns0:text>
  <ns0:rect x="26.6667" y="65.7778" width="142.2222" height="88.8889" rx="3.5556" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="97.7778" y="117.3333" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="var(--bg)">=</ns0:text>
  <ns0:rect x="177.7778" y="65.7778" width="177.7778" height="88.8889" rx="3.5556" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="266.6667" y="106.6667" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text)">Recursive</ns0:text>
  <ns0:text x="266.6667" y="126.2222" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text)">expand</ns0:text>
  <ns0:rect x="364.4444" y="65.7778" width="373.3333" height="88.8889" rx="3.5556" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="551.1111" y="99.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Expanded every time it is used.</ns0:text>
  <ns0:text x="551.1111" y="119.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Can reference variables defined later.</ns0:text>
  <ns0:text x="551.1111" y="138.6667" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-disabled)">Risk: infinite recursion if self-referential</ns0:text>
  <ns0:rect x="746.6667" y="65.7778" width="373.3333" height="88.8889" rx="3.5556" fill="var(--surface-dark)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="764.4444" y="99.5556" font-family="monospace" font-size="14.2222" fill="var(--primary-dk)">CC = gcc</ns0:text>
  <ns0:text x="764.4444" y="120.8889" font-family="monospace" font-size="14.2222" fill="var(--primary-dk)">CFLAGS = $(EXTRA)</ns0:text>
  <ns0:text x="764.4444" y="142.2222" font-family="sans-serif" font-size="11.5556" fill="var(--text-disabled)">EXTRA can be set later</ns0:text>
  <ns0:rect x="26.6667" y="163.5556" width="142.2222" height="88.8889" rx="3.5556" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="97.7778" y="215.1111" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="var(--bg)">:=</ns0:text>
  <ns0:rect x="177.7778" y="163.5556" width="177.7778" height="88.8889" rx="3.5556" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="266.6667" y="204.4444" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text)">Simple</ns0:text>
  <ns0:text x="266.6667" y="224" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text)">expand</ns0:text>
  <ns0:rect x="364.4444" y="163.5556" width="373.3333" height="88.8889" rx="3.5556" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="551.1111" y="197.3333" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Expanded once at definition time.</ns0:text>
  <ns0:text x="551.1111" y="216.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Safe — no recursion possible.</ns0:text>
  <ns0:text x="551.1111" y="236.4444" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-disabled)">Preferred for performance</ns0:text>
  <ns0:rect x="746.6667" y="163.5556" width="373.3333" height="88.8889" rx="3.5556" fill="var(--surface-dark)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="764.4444" y="197.3333" font-family="monospace" font-size="14.2222" fill="var(--primary-dk)">SRC := $(wildcard *.c)</ns0:text>
  <ns0:text x="764.4444" y="218.6667" font-family="monospace" font-size="14.2222" fill="var(--primary-dk)">OBJ := $(SRC:.c=.o)</ns0:text>
  <ns0:rect x="26.6667" y="261.3333" width="142.2222" height="88.8889" rx="3.5556" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="97.7778" y="312.8889" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="var(--primary-dk)">?=</ns0:text>
  <ns0:rect x="177.7778" y="261.3333" width="177.7778" height="88.8889" rx="3.5556" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="266.6667" y="302.2222" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text)">Conditional</ns0:text>
  <ns0:text x="266.6667" y="321.7778" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text)">assign</ns0:text>
  <ns0:rect x="364.4444" y="261.3333" width="373.3333" height="88.8889" rx="3.5556" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="551.1111" y="295.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Only assigns if variable is not</ns0:text>
  <ns0:text x="551.1111" y="314.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">already set (or set via environment).</ns0:text>
  <ns0:text x="551.1111" y="334.2222" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-disabled)">Great for defaults users can override</ns0:text>
  <ns0:rect x="746.6667" y="261.3333" width="373.3333" height="88.8889" rx="3.5556" fill="var(--surface-dark)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="764.4444" y="295.1111" font-family="monospace" font-size="14.2222" fill="var(--primary-dk)">CC ?= gcc</ns0:text>
  <ns0:text x="764.4444" y="316.4444" font-family="sans-serif" font-size="12.4444" fill="var(--text-disabled)">User can override:</ns0:text>
  <ns0:text x="764.4444" y="334.2222" font-family="monospace" font-size="14.2222" fill="var(--text-muted)">make CC=clang</ns0:text>
  <ns0:rect x="26.6667" y="359.1111" width="142.2222" height="88.8889" rx="3.5556" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="97.7778" y="410.6667" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="var(--primary-dk)">+=</ns0:text>
  <ns0:rect x="177.7778" y="359.1111" width="177.7778" height="88.8889" rx="3.5556" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="266.6667" y="400" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--text)">Append</ns0:text>
  <ns0:rect x="364.4444" y="359.1111" width="373.3333" height="88.8889" rx="3.5556" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="551.1111" y="392.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">Appends to existing value</ns0:text>
  <ns0:text x="551.1111" y="412.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="var(--text-muted)">with a space separator.</ns0:text>
  <ns0:text x="551.1111" y="432" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-disabled)">Inherits expansion type of original</ns0:text>
  <ns0:rect x="746.6667" y="359.1111" width="373.3333" height="88.8889" rx="3.5556" fill="var(--surface-dark)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="764.4444" y="392.8889" font-family="monospace" font-size="14.2222" fill="var(--primary-dk)">CFLAGS := -Wall</ns0:text>
  <ns0:text x="764.4444" y="414.2222" font-family="monospace" font-size="14.2222" fill="var(--primary-dk)">CFLAGS += -O2</ns0:text>
  <ns0:text x="764.4444" y="435.5556" font-family="sans-serif" font-size="12.4444" fill="var(--text-disabled)">result: -Wall -O2</ns0:text>
  <ns0:rect x="26.6667" y="469.3333" width="1084.4444" height="39.1111" rx="5.3333" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="493.3333" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="var(--primary-dk)">Prefer <ns0:tspan font-family="monospace">:=</ns0:tspan> for most variables — it is faster and avoids unexpected re-expansion</ns0:text>
</ns0:svg>
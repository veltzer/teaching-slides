<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="26.6667" y="17.7778" width="142.2222" height="39.1111" rx="3.5556" fill="#212121" />
  <ns0:text x="97.7778" y="42.6667" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">Operator</ns0:text>
  <ns0:rect x="177.7778" y="17.7778" width="177.7778" height="39.1111" rx="3.5556" fill="#212121" />
  <ns0:text x="266.6667" y="42.6667" text-anchor="middle" font-family="sans-serif" font-size="15.1111" font-weight="bold" fill="#ffffff">Name</ns0:text>
  <ns0:rect x="364.4444" y="17.7778" width="373.3333" height="39.1111" rx="3.5556" fill="#212121" />
  <ns0:text x="551.1111" y="42.6667" text-anchor="middle" font-family="sans-serif" font-size="15.1111" font-weight="bold" fill="#ffffff">Behaviour</ns0:text>
  <ns0:rect x="746.6667" y="17.7778" width="373.3333" height="39.1111" rx="3.5556" fill="#212121" />
  <ns0:text x="933.3333" y="42.6667" text-anchor="middle" font-family="sans-serif" font-size="15.1111" font-weight="bold" fill="#ffffff">Example</ns0:text>
  <ns0:rect x="26.6667" y="65.7778" width="142.2222" height="88.8889" rx="3.5556" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="97.7778" y="117.3333" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#ffffff">=</ns0:text>
  <ns0:rect x="177.7778" y="65.7778" width="177.7778" height="88.8889" rx="3.5556" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="266.6667" y="106.6667" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#212121">Recursive</ns0:text>
  <ns0:text x="266.6667" y="126.2222" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#212121">expand</ns0:text>
  <ns0:rect x="364.4444" y="65.7778" width="373.3333" height="88.8889" rx="3.5556" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="551.1111" y="99.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">Expanded every time it is used.</ns0:text>
  <ns0:text x="551.1111" y="119.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">Can reference variables defined later.</ns0:text>
  <ns0:text x="551.1111" y="138.6667" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">Risk: infinite recursion if self-referential</ns0:text>
  <ns0:rect x="746.6667" y="65.7778" width="373.3333" height="88.8889" rx="3.5556" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="764.4444" y="99.5556" font-family="monospace" font-size="14.2222" fill="#1565c0">CC = gcc</ns0:text>
  <ns0:text x="764.4444" y="120.8889" font-family="monospace" font-size="14.2222" fill="#1565c0">CFLAGS = $(EXTRA)</ns0:text>
  <ns0:text x="764.4444" y="142.2222" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">EXTRA can be set later</ns0:text>
  <ns0:rect x="26.6667" y="163.5556" width="142.2222" height="88.8889" rx="3.5556" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="97.7778" y="215.1111" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#ffffff">:=</ns0:text>
  <ns0:rect x="177.7778" y="163.5556" width="177.7778" height="88.8889" rx="3.5556" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="266.6667" y="204.4444" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#212121">Simple</ns0:text>
  <ns0:text x="266.6667" y="224" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#212121">expand</ns0:text>
  <ns0:rect x="364.4444" y="163.5556" width="373.3333" height="88.8889" rx="3.5556" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="551.1111" y="197.3333" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">Expanded once at definition time.</ns0:text>
  <ns0:text x="551.1111" y="216.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">Safe — no recursion possible.</ns0:text>
  <ns0:text x="551.1111" y="236.4444" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">Preferred for performance</ns0:text>
  <ns0:rect x="746.6667" y="163.5556" width="373.3333" height="88.8889" rx="3.5556" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="764.4444" y="197.3333" font-family="monospace" font-size="14.2222" fill="#1565c0">SRC := $(wildcard *.c)</ns0:text>
  <ns0:text x="764.4444" y="218.6667" font-family="monospace" font-size="14.2222" fill="#1565c0">OBJ := $(SRC:.c=.o)</ns0:text>
  <ns0:rect x="26.6667" y="261.3333" width="142.2222" height="88.8889" rx="3.5556" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="97.7778" y="312.8889" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#1565c0">?=</ns0:text>
  <ns0:rect x="177.7778" y="261.3333" width="177.7778" height="88.8889" rx="3.5556" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="266.6667" y="302.2222" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#212121">Conditional</ns0:text>
  <ns0:text x="266.6667" y="321.7778" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#212121">assign</ns0:text>
  <ns0:rect x="364.4444" y="261.3333" width="373.3333" height="88.8889" rx="3.5556" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="551.1111" y="295.1111" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">Only assigns if variable is not</ns0:text>
  <ns0:text x="551.1111" y="314.6667" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">already set (or set via environment).</ns0:text>
  <ns0:text x="551.1111" y="334.2222" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">Great for defaults users can override</ns0:text>
  <ns0:rect x="746.6667" y="261.3333" width="373.3333" height="88.8889" rx="3.5556" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="764.4444" y="295.1111" font-family="monospace" font-size="14.2222" fill="#1565c0">CC ?= gcc</ns0:text>
  <ns0:text x="764.4444" y="316.4444" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">User can override:</ns0:text>
  <ns0:text x="764.4444" y="334.2222" font-family="monospace" font-size="14.2222" fill="#555555">make CC=clang</ns0:text>
  <ns0:rect x="26.6667" y="359.1111" width="142.2222" height="88.8889" rx="3.5556" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="97.7778" y="410.6667" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#1565c0">+=</ns0:text>
  <ns0:rect x="177.7778" y="359.1111" width="177.7778" height="88.8889" rx="3.5556" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="266.6667" y="400" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#212121">Append</ns0:text>
  <ns0:rect x="364.4444" y="359.1111" width="373.3333" height="88.8889" rx="3.5556" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="551.1111" y="392.8889" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">Appends to existing value</ns0:text>
  <ns0:text x="551.1111" y="412.4444" text-anchor="middle" font-family="sans-serif" font-size="13.3333" fill="#555555">with a space separator.</ns0:text>
  <ns0:text x="551.1111" y="432" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="#9e9e9e">Inherits expansion type of original</ns0:text>
  <ns0:rect x="746.6667" y="359.1111" width="373.3333" height="88.8889" rx="3.5556" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="764.4444" y="392.8889" font-family="monospace" font-size="14.2222" fill="#1565c0">CFLAGS := -Wall</ns0:text>
  <ns0:text x="764.4444" y="414.2222" font-family="monospace" font-size="14.2222" fill="#1565c0">CFLAGS += -O2</ns0:text>
  <ns0:text x="764.4444" y="435.5556" font-family="sans-serif" font-size="12.4444" fill="#9e9e9e">result: -Wall -O2</ns0:text>
  <ns0:rect x="26.6667" y="469.3333" width="1084.4444" height="39.1111" rx="5.3333" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="568.8889" y="493.3333" text-anchor="middle" font-family="sans-serif" font-size="15.1111" fill="#1565c0">Prefer <ns0:tspan font-family="monospace">:=</ns0:tspan> for most variables — it is faster and avoids unexpected re-expansion</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6.6276" x="40" y="40"/>
  <rect x="68.1249" y="56.111" width="150" height="35.4444" rx="6.6276" fill="var(--text)" />
  <text x="143.125" y="78.6666" text-anchor="middle" font-family="monospace" font-size="15.6425" font-weight="bold" fill="var(--bg)">Operator</text>
  <rect x="227.4999" y="56.111" width="187.4999" height="35.4444" rx="6.6276" fill="var(--text)" />
  <text x="321.25" y="78.6666" text-anchor="middle" font-family="sans-serif" font-size="14.7734" font-weight="bold" fill="var(--bg)">Name</text>
  <rect x="424.3749" y="56.111" width="393.75" height="35.4444" rx="6.6276" fill="var(--text)" />
  <text x="621.2499" y="78.6666" text-anchor="middle" font-family="sans-serif" font-size="14.7734" font-weight="bold" fill="var(--bg)">Behaviour</text>
  <rect x="827.5" y="56.111" width="393.75" height="35.4444" rx="6.6276" fill="var(--text)" />
  <text x="1024.3748" y="78.6666" text-anchor="middle" font-family="sans-serif" font-size="14.7734" font-weight="bold" fill="var(--bg)">Example</text>
  <rect x="68.1249" y="99.6111" width="150" height="80.5557" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="143.125" y="146.3332" text-anchor="middle" font-family="monospace" font-size="31.285" font-weight="bold" fill="var(--bg)">=</text>
  <rect x="227.4999" y="99.6111" width="187.4999" height="80.5557" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="321.25" y="136.6667" text-anchor="middle" font-family="sans-serif" font-size="14.7734" fill="var(--text)">Recursive</text>
  <text x="321.25" y="154.3888" text-anchor="middle" font-family="sans-serif" font-size="14.7734" fill="var(--text)">expand</text>
  <rect x="424.3749" y="99.6111" width="393.75" height="80.5557" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="621.2499" y="130.2223" text-anchor="middle" font-family="sans-serif" font-size="13.0355" fill="var(--text-muted)">Expanded every time it is used.</text>
  <text x="621.2499" y="147.9443" text-anchor="middle" font-family="sans-serif" font-size="13.0355" fill="var(--text-muted)">Can reference variables defined later.</text>
  <text x="621.2499" y="165.6666" text-anchor="middle" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">Risk: infinite recursion if self-referential</text>
  <rect x="827.5" y="99.6111" width="393.75" height="80.5557" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="846.2499" y="130.2223" font-family="monospace" font-size="13.9043" fill="var(--primary-accent)">CC = gcc</text>
  <text x="846.2499" y="149.5556" font-family="monospace" font-size="13.9043" fill="var(--primary-accent)">CFLAGS = $(EXTRA)</text>
  <text x="846.2499" y="168.8888" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">EXTRA can be set later</text>
  <rect x="68.1249" y="188.2222" width="150" height="80.5557" rx="6.6276" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="143.125" y="234.9444" text-anchor="middle" font-family="monospace" font-size="31.285" font-weight="bold" fill="var(--bg)">:=</text>
  <rect x="227.4999" y="188.2222" width="187.4999" height="80.5557" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="321.25" y="225.2777" text-anchor="middle" font-family="sans-serif" font-size="14.7734" fill="var(--text)">Simple</text>
  <text x="321.25" y="243" text-anchor="middle" font-family="sans-serif" font-size="14.7734" fill="var(--text)">expand</text>
  <rect x="424.3749" y="188.2222" width="393.75" height="80.5557" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="621.2499" y="218.8332" text-anchor="middle" font-family="sans-serif" font-size="13.0355" fill="var(--text-muted)">Expanded once at definition time.</text>
  <text x="621.2499" y="236.5555" text-anchor="middle" font-family="sans-serif" font-size="13.0355" fill="var(--text-muted)">Safe — no recursion possible.</text>
  <text x="621.2499" y="254.2777" text-anchor="middle" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">Preferred for performance</text>
  <rect x="827.5" y="188.2222" width="393.75" height="80.5557" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="846.2499" y="218.8332" font-family="monospace" font-size="13.9043" fill="var(--primary-accent)">SRC := $(wildcard *.c)</text>
  <text x="846.2499" y="238.1667" font-family="monospace" font-size="13.9043" fill="var(--primary-accent)">OBJ := $(SRC:.c=.o)</text>
  <rect x="68.1249" y="276.8333" width="150" height="80.5557" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="143.125" y="323.5555" text-anchor="middle" font-family="monospace" font-size="31.285" font-weight="bold" fill="var(--primary-accent)">?=</text>
  <rect x="227.4999" y="276.8333" width="187.4999" height="80.5557" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="321.25" y="313.8889" text-anchor="middle" font-family="sans-serif" font-size="14.7734" fill="var(--text)">Conditional</text>
  <text x="321.25" y="331.611" text-anchor="middle" font-family="sans-serif" font-size="14.7734" fill="var(--text)">assign</text>
  <rect x="424.3749" y="276.8333" width="393.75" height="80.5557" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="621.2499" y="307.4444" text-anchor="middle" font-family="sans-serif" font-size="13.0355" fill="var(--text-muted)">Only assigns if variable is not</text>
  <text x="621.2499" y="325.1667" text-anchor="middle" font-family="sans-serif" font-size="13.0355" fill="var(--text-muted)">already set (or set via environment).</text>
  <text x="621.2499" y="342.8888" text-anchor="middle" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">Great for defaults users can override</text>
  <rect x="827.5" y="276.8333" width="393.75" height="80.5557" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="846.2499" y="307.4444" font-family="monospace" font-size="13.9043" fill="var(--primary-accent)">CC ?= gcc</text>
  <text x="846.2499" y="326.7777" font-family="sans-serif" font-size="12.1662" fill="var(--text-faint)">User can override:</text>
  <text x="846.2499" y="342.8888" font-family="monospace" font-size="13.9043" fill="var(--text-muted)">make CC=clang</text>
  <rect x="68.1249" y="365.4443" width="150" height="80.5557" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="143.125" y="412.1667" text-anchor="middle" font-family="monospace" font-size="31.285" font-weight="bold" fill="var(--primary-accent)">+=</text>
  <rect x="227.4999" y="365.4443" width="187.4999" height="80.5557" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="321.25" y="402.5" text-anchor="middle" font-family="sans-serif" font-size="14.7734" fill="var(--text)">Append</text>
  <rect x="424.3749" y="365.4443" width="393.75" height="80.5557" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="621.2499" y="396.0556" text-anchor="middle" font-family="sans-serif" font-size="13.0355" fill="var(--text-muted)">Appends to existing value</text>
  <text x="621.2499" y="413.7777" text-anchor="middle" font-family="sans-serif" font-size="13.0355" fill="var(--text-muted)">with a space separator.</text>
  <text x="621.2499" y="431.5" text-anchor="middle" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">Inherits expansion type of original</text>
  <rect x="827.5" y="365.4443" width="393.75" height="80.5557" rx="6.6276" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="846.2499" y="396.0556" font-family="monospace" font-size="13.9043" fill="var(--primary-accent)">CFLAGS := -Wall</text>
  <text x="846.2499" y="415.3889" font-family="monospace" font-size="13.9043" fill="var(--primary-accent)">CFLAGS += -O2</text>
  <text x="846.2499" y="434.7223" font-family="sans-serif" font-size="12.1662" fill="var(--text-faint)">result: -Wall -O2</text>
  <rect x="68.1249" y="465.3333" width="1143.75" height="35.4444" rx="6.6276" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="487.0833" text-anchor="middle" font-family="sans-serif" font-size="14.7734" fill="var(--primary-accent)">Prefer <tspan font-family="monospace">:=</tspan> for most variables — it is faster and avoids unexpected re-expansion</text>
</svg>
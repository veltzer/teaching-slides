<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect width="1087.5767" height="474.8286" fill="var(--bg)" rx="5.7089" x="152.4233" y="145.1714"/>
  <rect x="177.9133" y="158.361" width="135.9471" height="29.0173" rx="5.7089" fill="var(--text)" />
  <text x="245.8869" y="176.8266" text-anchor="middle" font-family="monospace" font-size="13.4741" font-weight="bold" fill="var(--bg)">Operator</text>
  <rect x="322.3571" y="158.361" width="169.9338" height="29.0173" rx="5.7089" fill="var(--text)" />
  <text x="407.3241" y="176.8266" text-anchor="middle" font-family="sans-serif" font-size="12.7255" font-weight="bold" fill="var(--bg)">Name</text>
  <rect x="500.7876" y="158.361" width="356.8611" height="29.0173" rx="5.7089" fill="var(--text)" />
  <text x="679.2182" y="176.8266" text-anchor="middle" font-family="sans-serif" font-size="12.7255" font-weight="bold" fill="var(--bg)">Behaviour</text>
  <rect x="866.1455" y="158.361" width="356.8611" height="29.0173" rx="5.7089" fill="var(--text)" />
  <text x="1044.5759" y="176.8266" text-anchor="middle" font-family="sans-serif" font-size="12.7255" font-weight="bold" fill="var(--bg)">Example</text>
  <rect x="177.9133" y="193.9732" width="135.9471" height="65.9485" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="245.8869" y="232.2232" text-anchor="middle" font-family="monospace" font-size="26.9482" font-weight="bold" fill="var(--bg)">=</text>
  <rect x="322.3571" y="193.9732" width="169.9338" height="65.9485" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="407.3241" y="224.3095" text-anchor="middle" font-family="sans-serif" font-size="12.7255" fill="var(--text)">Recursive</text>
  <text x="407.3241" y="238.8181" text-anchor="middle" font-family="sans-serif" font-size="12.7255" fill="var(--text)">expand</text>
  <rect x="500.7876" y="193.9732" width="356.8611" height="65.9485" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="679.2182" y="219.0337" text-anchor="middle" font-family="sans-serif" font-size="11.2285" fill="var(--text-muted)">Expanded every time it is used.</text>
  <text x="679.2182" y="233.5422" text-anchor="middle" font-family="sans-serif" font-size="11.2285" fill="var(--text-muted)">Can reference variables defined later.</text>
  <text x="679.2182" y="248.0509" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-faint)">Risk: infinite recursion if self-referential</text>
  <rect x="866.1455" y="193.9732" width="356.8611" height="65.9485" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="883.1388" y="219.0337" font-family="monospace" font-size="11.9769" fill="var(--primary-accent)">CC = gcc</text>
  <text x="883.1388" y="234.8613" font-family="monospace" font-size="11.9769" fill="var(--primary-accent)">CFLAGS = $(EXTRA)</text>
  <text x="883.1388" y="250.6888" font-family="sans-serif" font-size="10" fill="var(--text-faint)">EXTRA can be set later</text>
  <rect x="177.9133" y="266.5165" width="135.9471" height="65.9485" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="245.8869" y="304.7665" text-anchor="middle" font-family="monospace" font-size="26.9482" font-weight="bold" fill="var(--bg)">:=</text>
  <rect x="322.3571" y="266.5165" width="169.9338" height="65.9485" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="407.3241" y="296.8527" text-anchor="middle" font-family="sans-serif" font-size="12.7255" fill="var(--text)">Simple</text>
  <text x="407.3241" y="311.3614" text-anchor="middle" font-family="sans-serif" font-size="12.7255" fill="var(--text)">expand</text>
  <rect x="500.7876" y="266.5165" width="356.8611" height="65.9485" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="679.2182" y="291.5768" text-anchor="middle" font-family="sans-serif" font-size="11.2285" fill="var(--text-muted)">Expanded once at definition time.</text>
  <text x="679.2182" y="306.0855" text-anchor="middle" font-family="sans-serif" font-size="11.2285" fill="var(--text-muted)">Safe — no recursion possible.</text>
  <text x="679.2182" y="320.5941" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-faint)">Preferred for performance</text>
  <rect x="866.1455" y="266.5165" width="356.8611" height="65.9485" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="883.1388" y="291.5768" font-family="monospace" font-size="11.9769" fill="var(--primary-accent)">SRC := $(wildcard *.c)</text>
  <text x="883.1388" y="307.4045" font-family="monospace" font-size="11.9769" fill="var(--primary-accent)">OBJ := $(SRC:.c=.o)</text>
  <rect x="177.9133" y="339.0597" width="135.9471" height="65.9485" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="245.8869" y="377.3098" text-anchor="middle" font-family="monospace" font-size="26.9482" font-weight="bold" fill="var(--primary-accent)">?=</text>
  <rect x="322.3571" y="339.0597" width="169.9338" height="65.9485" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="407.3241" y="369.396" text-anchor="middle" font-family="sans-serif" font-size="12.7255" fill="var(--text)">Conditional</text>
  <text x="407.3241" y="383.9046" text-anchor="middle" font-family="sans-serif" font-size="12.7255" fill="var(--text)">assign</text>
  <rect x="500.7876" y="339.0597" width="356.8611" height="65.9485" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="679.2182" y="364.1201" text-anchor="middle" font-family="sans-serif" font-size="11.2285" fill="var(--text-muted)">Only assigns if variable is not</text>
  <text x="679.2182" y="378.6288" text-anchor="middle" font-family="sans-serif" font-size="11.2285" fill="var(--text-muted)">already set (or set via environment).</text>
  <text x="679.2182" y="393.1374" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-faint)">Great for defaults users can override</text>
  <rect x="866.1455" y="339.0597" width="356.8611" height="65.9485" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="883.1388" y="364.1201" font-family="monospace" font-size="11.9769" fill="var(--primary-accent)">CC ?= gcc</text>
  <text x="883.1388" y="379.9477" font-family="sans-serif" font-size="10.4797" fill="var(--text-faint)">User can override:</text>
  <text x="883.1388" y="393.1374" font-family="monospace" font-size="11.9769" fill="var(--text-muted)">make CC=clang</text>
  <rect x="177.9133" y="411.6029" width="135.9471" height="65.9485" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="245.8869" y="449.8531" text-anchor="middle" font-family="monospace" font-size="26.9482" font-weight="bold" fill="var(--primary-accent)">+=</text>
  <rect x="322.3571" y="411.6029" width="169.9338" height="65.9485" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="407.3241" y="441.9393" text-anchor="middle" font-family="sans-serif" font-size="12.7255" fill="var(--text)">Append</text>
  <rect x="500.7876" y="411.6029" width="356.8611" height="65.9485" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="679.2182" y="436.6634" text-anchor="middle" font-family="sans-serif" font-size="11.2285" fill="var(--text-muted)">Appends to existing value</text>
  <text x="679.2182" y="451.172" text-anchor="middle" font-family="sans-serif" font-size="11.2285" fill="var(--text-muted)">with a space separator.</text>
  <text x="679.2182" y="465.6807" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-faint)">Inherits expansion type of original</text>
  <rect x="866.1455" y="411.6029" width="356.8611" height="65.9485" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="883.1388" y="436.6634" font-family="monospace" font-size="11.9769" fill="var(--primary-accent)">CFLAGS := -Wall</text>
  <text x="883.1388" y="452.491" font-family="monospace" font-size="11.9769" fill="var(--primary-accent)">CFLAGS += -O2</text>
  <text x="883.1388" y="468.3187" font-family="sans-serif" font-size="10.4797" fill="var(--text-faint)">result: -Wall -O2</text>
  <rect x="177.9133" y="493.379" width="1036.5965" height="29.0173" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="696.2116" y="511.1851" text-anchor="middle" font-family="sans-serif" font-size="12.7255" fill="var(--primary-accent)">Prefer <tspan font-family="monospace">:=</tspan> for most variables — it is faster and avoids unexpected re-expansion</text>
</svg>
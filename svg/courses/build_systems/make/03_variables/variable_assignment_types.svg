<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Header row -->
  <rect x="30"   y="20" width="160" height="44" rx="4" fill="#212121"/>
  <text x="110"  y="48" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">Operator</text>
  <rect x="200"  y="20" width="200" height="44" rx="4" fill="#212121"/>
  <text x="300"  y="48" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Name</text>
  <rect x="410"  y="20" width="420" height="44" rx="4" fill="#212121"/>
  <text x="620"  y="48" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Behaviour</text>
  <rect x="840"  y="20" width="420" height="44" rx="4" fill="#212121"/>
  <text x="1050" y="48" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Example</text>

  <!-- Row 1: = -->
  <rect x="30"   y="74" width="160" height="100" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="110"  y="132" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#ffffff">=</text>
  <rect x="200"  y="74" width="200" height="100" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300"  y="120" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#212121">Recursive</text>
  <text x="300"  y="142" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#212121">expand</text>
  <rect x="410"  y="74" width="420" height="100" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="620"  y="112" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Expanded every time it is used.</text>
  <text x="620"  y="134" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Can reference variables defined later.</text>
  <text x="620"  y="156" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9e9e9e">Risk: infinite recursion if self-referential</text>
  <rect x="840"  y="74" width="420" height="100" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="860"  y="112" font-family="monospace" font-size="16" fill="#1565c0">CC = gcc</text>
  <text x="860"  y="136" font-family="monospace" font-size="16" fill="#1565c0">CFLAGS = $(EXTRA)</text>
  <text x="860"  y="160" font-family="sans-serif" font-size="13" fill="#9e9e9e">EXTRA can be set later</text>

  <!-- Row 2: := -->
  <rect x="30"   y="184" width="160" height="100" rx="4" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="110"  y="242" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#ffffff">:=</text>
  <rect x="200"  y="184" width="200" height="100" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300"  y="230" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#212121">Simple</text>
  <text x="300"  y="252" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#212121">expand</text>
  <rect x="410"  y="184" width="420" height="100" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="620"  y="222" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Expanded once at definition time.</text>
  <text x="620"  y="244" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Safe — no recursion possible.</text>
  <text x="620"  y="266" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9e9e9e">Preferred for performance</text>
  <rect x="840"  y="184" width="420" height="100" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="860"  y="222" font-family="monospace" font-size="16" fill="#1565c0">SRC := $(wildcard *.c)</text>
  <text x="860"  y="246" font-family="monospace" font-size="16" fill="#1565c0">OBJ := $(SRC:.c=.o)</text>

  <!-- Row 3: ?= -->
  <rect x="30"   y="294" width="160" height="100" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110"  y="352" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#1565c0">?=</text>
  <rect x="200"  y="294" width="200" height="100" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300"  y="340" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#212121">Conditional</text>
  <text x="300"  y="362" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#212121">assign</text>
  <rect x="410"  y="294" width="420" height="100" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="620"  y="332" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Only assigns if variable is not</text>
  <text x="620"  y="354" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">already set (or set via environment).</text>
  <text x="620"  y="376" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9e9e9e">Great for defaults users can override</text>
  <rect x="840"  y="294" width="420" height="100" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="860"  y="332" font-family="monospace" font-size="16" fill="#1565c0">CC ?= gcc</text>
  <text x="860"  y="356" font-family="sans-serif" font-size="14" fill="#9e9e9e">User can override:</text>
  <text x="860"  y="376" font-family="monospace" font-size="16" fill="#555555">make CC=clang</text>

  <!-- Row 4: += -->
  <rect x="30"   y="404" width="160" height="100" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110"  y="462" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#1565c0">+=</text>
  <rect x="200"  y="404" width="200" height="100" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300"  y="450" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#212121">Append</text>
  <rect x="410"  y="404" width="420" height="100" rx="4" fill="url(#grad-surface)" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="620"  y="442" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">Appends to existing value</text>
  <text x="620"  y="464" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555555">with a space separator.</text>
  <text x="620"  y="486" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9e9e9e">Inherits expansion type of original</text>
  <rect x="840"  y="404" width="420" height="100" rx="4" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="860"  y="442" font-family="monospace" font-size="16" fill="#1565c0">CFLAGS := -Wall</text>
  <text x="860"  y="466" font-family="monospace" font-size="16" fill="#1565c0">CFLAGS += -O2</text>
  <text x="860"  y="490" font-family="sans-serif" font-size="14" fill="#9e9e9e">result: -Wall -O2</text>

  <!-- Tip -->
  <rect x="30" y="528" width="1220" height="44" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="555" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1565c0">Prefer <tspan font-family="monospace">:=</tspan> for most variables — it is faster and avoids unexpected re-expansion</text>
</svg>

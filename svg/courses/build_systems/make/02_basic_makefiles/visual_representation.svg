  <text x="897.8124" y="479.0277" text-anchor="middle" font-size="15.6425" fill="var(--text)">lib.c</text>
  <rect x="996.25" y="450.8333" width="159.375" height="46.7223" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1075.9375" y="479.0277" text-anchor="middle" font-size="15.6425" fill="var(--text)">lib.h</text>
  <rect x="133.75" y="281.6667" width="187.5" height="46.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="227.5" y="309.8611" text-anchor="middle" font-size="15.6425" fill="var(--text)">main.o</text>
  <rect x="546.25" y="281.6667" width="187.5" height="46.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="640" y="309.8611" text-anchor="middle" font-size="15.6425" fill="var(--text)">utils.o</text>
  <rect x="958.75" y="281.6667" width="187.5" height="46.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1052.5" y="309.8611" text-anchor="middle" font-size="15.6425" fill="var(--text)">lib.o</text>
  <rect x="499.375" y="104.4444" width="281.25" height="56.3889" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="138.2777" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--bg)">program</text>

  <line x1="325.9375" y1="450.8333" x2="246.25" y2="328.3889" stroke="var(--text-muted)" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="504.0625" y1="450.8333" x2="250.9375" y2="328.3889" stroke="var(--text-muted)" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="719.6874" y1="450.8333" x2="649.375" y2="328.3889" stroke="var(--text-muted)" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="504.0625" y1="450.8333" x2="607.1875" y2="328.3889" stroke="var(--text-muted)" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="325.9375" y1="450.8333" x2="593.1249" y2="328.3889" stroke="var(--text-muted)" stroke-width="1.6" marker-end="url(#arrow)" />

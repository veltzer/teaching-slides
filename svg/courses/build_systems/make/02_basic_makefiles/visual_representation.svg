  <rect x="53.3333" y="549.3333" width="19.5556" height="19.5556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="83.5556" y="564.4444" font-size="14.2222" fill="var(--text-muted)">Source files (.c/.h)</text>
  <rect x="293.3333" y="549.3333" width="19.5556" height="19.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="323.5556" y="564.4444" font-size="14.2222" fill="var(--text-muted)">Object files (.o)</text>
  <rect x="515.5556" y="549.3333" width="19.5556" height="19.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="545.7778" y="564.4444" font-size="14.2222" fill="var(--text-muted)">Final executable</text>

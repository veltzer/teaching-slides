<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Source files row (bottom) -->
  <rect x="30" y="510" width="170" height="58" rx="7" fill="#fff8e1" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="545" text-anchor="middle" font-size="18" fill="#212121">main.c</text>

  <rect x="220" y="510" width="170" height="58" rx="7" fill="#fff8e1" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="305" y="545" text-anchor="middle" font-size="18" fill="#212121">config.h</text>

  <rect x="410" y="510" width="170" height="58" rx="7" fill="#fff8e1" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="495" y="545" text-anchor="middle" font-size="18" fill="#212121">utils.h</text>

  <rect x="640" y="510" width="170" height="58" rx="7" fill="#fff8e1" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="725" y="545" text-anchor="middle" font-size="18" fill="#212121">utils.c</text>

  <rect x="830" y="510" width="170" height="58" rx="7" fill="#fff8e1" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="915" y="545" text-anchor="middle" font-size="18" fill="#212121">lib.c</text>

  <rect x="1020" y="510" width="170" height="58" rx="7" fill="#fff8e1" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="545" text-anchor="middle" font-size="18" fill="#212121">lib.h</text>

  <!-- Object files row (middle) -->
  <rect x="100" y="300" width="200" height="58" rx="7" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="200" y="335" text-anchor="middle" font-size="18" fill="#212121">main.o</text>

  <rect x="540" y="300" width="200" height="58" rx="7" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="640" y="335" text-anchor="middle" font-size="18" fill="#212121">utils.o</text>

  <rect x="980" y="300" width="200" height="58" rx="7" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1080" y="335" text-anchor="middle" font-size="18" fill="#212121">lib.o</text>

  <!-- Final target (top) -->
  <rect x="490" y="80" width="300" height="70" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="122" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">program</text>

  <!-- Source to object arrows -->
  <line x1="115" y1="510" x2="175" y2="358" stroke="#555555" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="305" y1="510" x2="220" y2="358" stroke="#555555" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="495" y1="510" x2="225" y2="358" stroke="#555555" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="725" y1="510" x2="650" y2="358" stroke="#555555" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="495" y1="510" x2="605" y2="358" stroke="#555555" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="305" y1="510" x2="590" y2="358" stroke="#555555" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="915" y1="510" x2="1055" y2="358" stroke="#555555" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="1105" y1="510" x2="1090" y2="358" stroke="#555555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Object to program arrows -->
  <line x1="240" y1="300" x2="545" y2="150" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <line x1="640" y1="300" x2="640" y2="150" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <line x1="1040" y1="300" x2="735" y2="150" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

  <!-- Legend -->
  <rect x="60" y="618" width="22" height="22" rx="4" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="94" y="635" font-size="16" fill="#555555">Source files (.c/.h)</text>

  <rect x="330" y="618" width="22" height="22" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2"/>
  <text x="364" y="635" font-size="16" fill="#555555">Object files (.o)</text>

  <rect x="580" y="618" width="22" height="22" rx="4" fill="url(#grad-accent)"/>
  <text x="614" y="635" font-size="16" fill="#555555">Final executable</text>
</svg>

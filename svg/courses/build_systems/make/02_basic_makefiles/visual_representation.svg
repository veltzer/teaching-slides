  <text x="813.3333" y="484.4444" text-anchor="middle" font-size="16" fill="var(--text)">lib.c</text>
  <rect x="906.6667" y="453.3333" width="151.1111" height="51.5556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="982.2222" y="484.4444" text-anchor="middle" font-size="16" fill="var(--text)">lib.h</text>
  <rect x="88.8889" y="266.6667" width="177.7778" height="51.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="177.7778" y="297.7778" text-anchor="middle" font-size="16" fill="var(--text)">main.o</text>
  <rect x="480" y="266.6667" width="177.7778" height="51.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="297.7778" text-anchor="middle" font-size="16" fill="var(--text)">utils.o</text>
  <rect x="871.1111" y="266.6667" width="177.7778" height="51.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="960" y="297.7778" text-anchor="middle" font-size="16" fill="var(--text)">lib.o</text>
  <rect x="435.5556" y="71.1111" width="266.6667" height="62.2222" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="108.4444" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--bg)">program</text>

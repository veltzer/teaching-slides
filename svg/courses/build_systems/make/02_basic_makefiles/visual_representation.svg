  <text x="128.125" y="551.5277" font-size="13.9044" fill="var(--text-muted)">Source files (.c/.h)</text>
  <rect x="349.375" y="537.8333" width="20.625" height="17.7223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="381.25" y="551.5277" font-size="13.9044" fill="var(--text-muted)">Object files (.o)</text>
  <rect x="583.75" y="537.8333" width="20.625" height="17.7223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="615.625" y="551.5277" font-size="13.9044" fill="var(--text-muted)">Final executable</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Header -->
  <rect x="30" y="14" width="1220" height="44" rx="6" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">GNU Make Advanced Features</text>

  <!-- Pattern Rules -->
  <rect x="30" y="74" width="390" height="230" rx="5" fill="#e3f2fd" filter="url(#shadow)"/>
  <text x="225" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0" text-anchor="middle">Pattern Rules  %</text>
  <text x="45" y="120" font-family="monospace" font-size="12" fill="#333333">%.o: %.c</text>
  <text x="60" y="138" font-family="monospace" font-size="12" fill="#333333">$(CC) $(CFLAGS) -c $&lt; -o $@</text>
  <text x="45" y="162" font-family="monospace" font-size="12" fill="#333333">%.o: %.cpp</text>
  <text x="60" y="180" font-family="monospace" font-size="12" fill="#333333">$(CXX) -c $&lt; -o $@</text>
  <text x="45" y="204" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1565c0">Automatic Variables:</text>
  <text x="45" y="224" font-family="monospace" font-size="12" fill="#333333">$@  - target filename</text>
  <text x="45" y="242" font-family="monospace" font-size="12" fill="#333333">$&lt;  - first prerequisite</text>
  <text x="45" y="260" font-family="monospace" font-size="12" fill="#333333">$^  - all prerequisites</text>
  <text x="45" y="278" font-family="monospace" font-size="12" fill="#333333">$*  - stem (matched by %)</text>

  <!-- String Functions -->
  <rect x="440" y="74" width="400" height="230" rx="5" fill="#e8f5e9" filter="url(#shadow)"/>
  <text x="640" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">String Functions</text>
  <text x="455" y="120" font-family="monospace" font-size="12" fill="#333333">$(subst from,to,text)</text>
  <text x="455" y="140" font-family="monospace" font-size="12" fill="#333333">$(patsubst %.c,%.o,$(SRCS))</text>
  <text x="455" y="160" font-family="monospace" font-size="12" fill="#333333">$(filter %.c,$(FILES))</text>
  <text x="455" y="180" font-family="monospace" font-size="12" fill="#333333">$(filter-out %.h,$(FILES))</text>
  <text x="455" y="200" font-family="monospace" font-size="12" fill="#333333">$(sort $(LIST))</text>
  <text x="455" y="220" font-family="monospace" font-size="12" fill="#333333">$(words $(LIST))</text>
  <text x="455" y="240" font-family="monospace" font-size="12" fill="#333333">$(addprefix src/,$(SRCS))</text>
  <text x="455" y="260" font-family="monospace" font-size="12" fill="#333333">$(addsuffix .bak,$(FILES))</text>
  <text x="455" y="280" font-family="monospace" font-size="12" fill="#333333">$(wildcard src/*.c)</text>

  <!-- Conditionals + Include -->
  <rect x="860" y="74" width="390" height="230" rx="5" fill="#fff3e0" filter="url(#shadow)"/>
  <text x="1055" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e65100" text-anchor="middle">Conditionals &amp;amp; Include</text>
  <text x="875" y="120" font-family="monospace" font-size="12" fill="#333333">ifeq ($(CC),gcc)</text>
  <text x="890" y="138" font-family="monospace" font-size="12" fill="#333333">  CFLAGS += -O2</text>
  <text x="875" y="156" font-family="monospace" font-size="12" fill="#333333">else</text>
  <text x="890" y="174" font-family="monospace" font-size="12" fill="#333333">  CFLAGS += -O0</text>
  <text x="875" y="192" font-family="monospace" font-size="12" fill="#333333">endif</text>
  <text x="875" y="216" font-family="monospace" font-size="12" fill="#333333">ifneq ($(DEBUG),)</text>
  <text x="890" y="234" font-family="monospace" font-size="12" fill="#333333">  CFLAGS += -g</text>
  <text x="875" y="252" font-family="monospace" font-size="12" fill="#333333">endif</text>
  <text x="875" y="276" font-family="monospace" font-size="12" fill="#333333">-include config.mk</text>
  <text x="875" y="294" font-family="monospace" font-size="12" fill="#555555"># - silences missing file</text>

  <!-- Parallel builds -->
  <rect x="30" y="322" width="600" height="180" rx="5" fill="#f3e5f5" filter="url(#shadow)"/>
  <text x="330" y="346" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6a1b9a" text-anchor="middle">Parallel Builds  -j</text>
  <text x="45" y="370" font-family="monospace" font-size="12" fill="#333333">make -j4          # 4 parallel jobs</text>
  <text x="45" y="390" font-family="monospace" font-size="12" fill="#333333">make -j$(nproc)   # use all CPUs</text>
  <text x="45" y="410" font-family="monospace" font-size="12" fill="#333333">make -j           # unlimited (risky)</text>
  <text x="45" y="434" font-family="Arial, sans-serif" font-size="12" fill="#333333">Dependency graph determines what can run in parallel</text>
  <text x="45" y="454" font-family="Arial, sans-serif" font-size="12" fill="#333333">Output may interleave; use --output-sync to fix</text>
  <text x="45" y="474" font-family="monospace" font-size="12" fill="#333333">make -j4 --output-sync=recurse</text>
  <text x="45" y="494" font-family="Arial, sans-serif" font-size="12" fill="#555555">.NOTPARALLEL can force serial execution of a target</text>

  <!-- Real example -->
  <rect x="650" y="322" width="600" height="180" rx="5" fill="#fce4ec" filter="url(#shadow)"/>
  <text x="950" y="346" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">Real Pattern: Dependency Files</text>
  <text x="665" y="370" font-family="monospace" font-size="12" fill="#333333">SRCS := $(wildcard src/*.c)</text>
  <text x="665" y="390" font-family="monospace" font-size="12" fill="#333333">OBJS := $(patsubst src/%.c,obj/%.o,$(SRCS))</text>
  <text x="665" y="410" font-family="monospace" font-size="12" fill="#333333">DEPS := $(OBJS:.o=.d)</text>
  <text x="665" y="432" font-family="monospace" font-size="12" fill="#333333">obj/%.o: src/%.c</text>
  <text x="680" y="450" font-family="monospace" font-size="12" fill="#333333">$(CC) -MMD -MP -c $&lt; -o $@</text>
  <text x="665" y="472" font-family="monospace" font-size="12" fill="#333333">-include $(DEPS)</text>
  <text x="665" y="494" font-family="Arial, sans-serif" font-size="11" fill="#555555">-MMD generates .d files; -include rebuilds on header change</text>

  <!-- Bottom tip bar -->
  <rect x="30" y="520" width="1220" height="100" rx="6" fill="#e3f2fd" filter="url(#shadow)"/>
  <text x="640" y="544" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0" text-anchor="middle">Key Tips</text>
  <text x="50" y="566" font-family="Arial, sans-serif" font-size="12" fill="#333333">Use := (immediate) assignment, not = (deferred) to avoid unexpected re-evaluation</text>
  <text x="50" y="586" font-family="Arial, sans-serif" font-size="12" fill="#333333">$(shell cmd) runs shell during Makefile parsing - expensive, cache result in a variable</text>
  <text x="50" y="606" font-family="Arial, sans-serif" font-size="12" fill="#333333">$(eval ...) dynamically generates Makefile rules - useful for repetitive patterns but hard to debug</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- Header -->
  <rect x="30" y="14" width="1220" height="44" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--bg)" text-anchor="middle">GNU Make Advanced Features</text>

  <!-- Pattern Rules -->
  <rect x="30" y="74" width="390" height="230" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="225" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Pattern Rules  %</text>
  <text x="45" y="120" font-family="monospace" font-size="12" fill="var(--text)">%.o: %.c</text>
  <text x="60" y="138" font-family="monospace" font-size="12" fill="var(--text)">$(CC) $(CFLAGS) -c $&lt; -o $@</text>
  <text x="45" y="162" font-family="monospace" font-size="12" fill="var(--text)">%.o: %.cpp</text>
  <text x="60" y="180" font-family="monospace" font-size="12" fill="var(--text)">$(CXX) -c $&lt; -o $@</text>
  <text x="45" y="204" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-accent)">Automatic Variables:</text>
  <text x="45" y="224" font-family="monospace" font-size="12" fill="var(--text)">$@  - target filename</text>
  <text x="45" y="242" font-family="monospace" font-size="12" fill="var(--text)">$&lt;  - first prerequisite</text>
  <text x="45" y="260" font-family="monospace" font-size="12" fill="var(--text)">$^  - all prerequisites</text>
  <text x="45" y="278" font-family="monospace" font-size="12" fill="var(--text)">$*  - stem (matched by %)</text>

  <!-- String Functions -->
  <rect x="440" y="74" width="400" height="230" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">String Functions</text>
  <text x="455" y="120" font-family="monospace" font-size="12" fill="var(--text)">$(subst from,to,text)</text>
  <text x="455" y="140" font-family="monospace" font-size="12" fill="var(--text)">$(patsubst %.c,%.o,$(SRCS))</text>
  <text x="455" y="160" font-family="monospace" font-size="12" fill="var(--text)">$(filter %.c,$(FILES))</text>
  <text x="455" y="180" font-family="monospace" font-size="12" fill="var(--text)">$(filter-out %.h,$(FILES))</text>
  <text x="455" y="200" font-family="monospace" font-size="12" fill="var(--text)">$(sort $(LIST))</text>
  <text x="455" y="220" font-family="monospace" font-size="12" fill="var(--text)">$(words $(LIST))</text>
  <text x="455" y="240" font-family="monospace" font-size="12" fill="var(--text)">$(addprefix src/,$(SRCS))</text>
  <text x="455" y="260" font-family="monospace" font-size="12" fill="var(--text)">$(addsuffix .bak,$(FILES))</text>
  <text x="455" y="280" font-family="monospace" font-size="12" fill="var(--text)">$(wildcard src/*.c)</text>

  <!-- Conditionals + Include -->
  <rect x="860" y="74" width="390" height="230" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1055" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Conditionals &amp;amp; Include</text>
  <text x="875" y="120" font-family="monospace" font-size="12" fill="var(--text)">ifeq ($(CC),gcc)</text>
  <text x="890" y="138" font-family="monospace" font-size="12" fill="var(--text)">  CFLAGS += -O2</text>
  <text x="875" y="156" font-family="monospace" font-size="12" fill="var(--text)">else</text>
  <text x="890" y="174" font-family="monospace" font-size="12" fill="var(--text)">  CFLAGS += -O0</text>
  <text x="875" y="192" font-family="monospace" font-size="12" fill="var(--text)">endif</text>
  <text x="875" y="216" font-family="monospace" font-size="12" fill="var(--text)">ifneq ($(DEBUG),)</text>
  <text x="890" y="234" font-family="monospace" font-size="12" fill="var(--text)">  CFLAGS += -g</text>
  <text x="875" y="252" font-family="monospace" font-size="12" fill="var(--text)">endif</text>
  <text x="875" y="276" font-family="monospace" font-size="12" fill="var(--text)">-include config.mk</text>
  <text x="875" y="294" font-family="monospace" font-size="12" fill="var(--text-muted)"># - silences missing file</text>

  <!-- Parallel builds -->
  <rect x="30" y="322" width="600" height="180" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="330" y="346" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Parallel Builds  -j</text>
  <text x="45" y="370" font-family="monospace" font-size="12" fill="var(--text)">make -j4          # 4 parallel jobs</text>
  <text x="45" y="390" font-family="monospace" font-size="12" fill="var(--text)">make -j$(nproc)   # use all CPUs</text>
  <text x="45" y="410" font-family="monospace" font-size="12" fill="var(--text)">make -j           # unlimited (risky)</text>
  <text x="45" y="434" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Dependency graph determines what can run in parallel</text>
  <text x="45" y="454" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Output may interleave; use --output-sync to fix</text>
  <text x="45" y="474" font-family="monospace" font-size="12" fill="var(--text)">make -j4 --output-sync=recurse</text>
  <text x="45" y="494" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">.NOTPARALLEL can force serial execution of a target</text>

  <!-- Real example -->
  <rect x="650" y="322" width="600" height="180" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="950" y="346" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Real Pattern: Dependency Files</text>
  <text x="665" y="370" font-family="monospace" font-size="12" fill="var(--text)">SRCS := $(wildcard src/*.c)</text>
  <text x="665" y="390" font-family="monospace" font-size="12" fill="var(--text)">OBJS := $(patsubst src/%.c,obj/%.o,$(SRCS))</text>
  <text x="665" y="410" font-family="monospace" font-size="12" fill="var(--text)">DEPS := $(OBJS:.o=.d)</text>
  <text x="665" y="432" font-family="monospace" font-size="12" fill="var(--text)">obj/%.o: src/%.c</text>
  <text x="680" y="450" font-family="monospace" font-size="12" fill="var(--text)">$(CC) -MMD -MP -c $&lt; -o $@</text>
  <text x="665" y="472" font-family="monospace" font-size="12" fill="var(--text)">-include $(DEPS)</text>
  <text x="665" y="494" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">-MMD generates .d files; -include rebuilds on header change</text>

  <!-- Bottom tip bar -->
  <rect x="30" y="520" width="1220" height="100" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="544" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Key Tips</text>
  <text x="50" y="566" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Use := (immediate) assignment, not = (deferred) to avoid unexpected re-evaluation</text>
  <text x="50" y="586" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">$(shell cmd) runs shell during Makefile parsing - expensive, cache result in a variable</text>
  <text x="50" y="606" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">$(eval ...) dynamically generates Makefile rules - useful for repetitive patterns but hard to debug</text>
</svg>

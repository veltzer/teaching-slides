<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Row 1: 3 cols -->
  <rect x="40" y="40" width="390" height="250.196078431372" rx="10.664215404617" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="79.803921568628" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328430809235" font-weight="bold" fill="var(--primary-text)">Pattern Rules</text>
  <text x="60" y="113.921568627451" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">%.o: %.c</text>
  <text x="60" y="142.352941176471" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">  $(CC) -c $&lt; -o $@</text>
  <text x="60" y="182.156862745098" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">$@ target</text>
  <text x="60" y="210.588235294117" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">$&lt; first prereq</text>
  <text x="60" y="239.019607843138" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">$^ all prereqs</text>
  <text x="60" y="267.450980392157" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">$* stem</text>

  <rect x="445" y="40" width="390" height="250.196078431372" rx="10.664215404617" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="79.803921568628" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328430809235" font-weight="bold" fill="var(--ok-text)">String Functions</text>
  <text x="465" y="113.921568627451" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--ok-text)">$(patsubst %.c,%.o,$X)</text>
  <text x="465" y="142.352941176471" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--ok-text)">$(filter %.c,$X)</text>
  <text x="465" y="170.78431372549" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--ok-text)">$(filter-out %.h,$X)</text>
  <text x="465" y="199.21568627451" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--ok-text)">$(sort $X)</text>
  <text x="465" y="227.647058823529" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--ok-text)">$(addprefix src/,$X)</text>
  <text x="465" y="256.07843137255" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--ok-text)">$(wildcard src/*.c)</text>

  <rect x="850" y="40" width="390" height="250.196078431372" rx="10.664215404617" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="79.803921568628" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328430809235" font-weight="bold" fill="var(--warn-text)">Conditionals</text>
  <text x="870" y="113.921568627451" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--warn-text)">ifeq ($(CC),gcc)</text>
  <text x="870" y="142.352941176471" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--warn-text)">  CFLAGS += -O2</text>
  <text x="870" y="170.78431372549" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--warn-text)">else</text>
  <text x="870" y="199.21568627451" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--warn-text)">  CFLAGS += -O0</text>
  <text x="870" y="227.647058823529" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--warn-text)">endif</text>
  <text x="870" y="261.764705882353" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--warn-text)">-include config.mk</text>

  <!-- Row 2 -->
  <rect x="40" y="312.941176470588" width="590" height="204.705882352941" rx="10.664215404617" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="352.745098039216" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328430809235" font-weight="bold" fill="var(--info-text)">Parallel Builds</text>
  <text x="60" y="392.549019607843" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--info-text)">make -j4</text>
  <text x="60" y="420.980392156862" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--info-text)">make -j$(nproc)</text>
  <text x="60" y="455.098039215686" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--info-text)">make -j4 --output-sync</text>
  <text x="60" y="494.901960784314" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--info-text)">.NOTPARALLEL forces serial</text>

  <rect x="650" y="312.941176470588" width="590" height="204.705882352941" rx="10.664215404617" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="352.745098039216" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328430809235" font-weight="bold" fill="var(--danger-text)">Dependency Files</text>
  <text x="670" y="392.549019607843" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--danger-text)">SRCS := $(wildcard src/*.c)</text>
  <text x="670" y="420.980392156862" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--danger-text)">DEPS := $(OBJS:.o=.d)</text>
  <text x="670" y="449.411764705883" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--danger-text)">$(CC) -MMD -MP -c</text>
  <text x="670" y="477.843137254902" font-family="Courier New, monospace" font-size="13.863480026002" fill="var(--danger-text)">-include $(DEPS)</text>
  <text x="670" y="506.274509803922" font-family="Arial, sans-serif" font-size="12.797058485541" fill="var(--danger-text)">header-aware</text>

  <!-- Tips -->
  <rect x="40" y="540.392156862745" width="1200" height="79.607843137255" rx="10.664215404617" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="576.862745098039" font-family="Arial, sans-serif" font-size="15.577132561018" fill="var(--text)">Prefer := over =</text>
  <text x="60" y="603.823529411765" font-family="Arial, sans-serif" font-size="15.577132561018" fill="var(--text-muted)">cache $(shell) output</text>
  <text x="700" y="576.862745098039" font-family="Arial, sans-serif" font-size="15.577132561018" fill="var(--text)">$(eval) = dynamic rules</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- Header -->
  <rect x="68.125" y="52.6875" width="1143.75" height="39.875" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="78.0625" font-family="Arial, sans-serif" font-size="16.5914" font-weight="bold" fill="var(--bg)" text-anchor="middle">GNU Make Advanced Features</text>

  <!-- Pattern Rules -->
  <rect x="68.125" y="107.0625" width="365.625" height="208.4375" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="250.9375" y="128.8125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Pattern Rules  %</text>
  <text x="82.1875" y="148.75" font-family="monospace" font-size="11.0609" fill="var(--text)">%.o: %.c</text>
  <text x="96.25" y="165.0625" font-family="monospace" font-size="11.0609" fill="var(--text)">$(CC) $(CFLAGS) -c $&lt; -o $@</text>
  <text x="82.1875" y="186.8125" font-family="monospace" font-size="11.0609" fill="var(--text)">%.o: %.cpp</text>
  <text x="96.25" y="203.125" font-family="monospace" font-size="11.0609" fill="var(--text)">$(CXX) -c $&lt; -o $@</text>
  <text x="82.1875" y="224.875" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--primary-accent)">Automatic Variables:</text>
  <text x="82.1875" y="243" font-family="monospace" font-size="11.0609" fill="var(--text)">$@  - target filename</text>
  <text x="82.1875" y="259.3125" font-family="monospace" font-size="11.0609" fill="var(--text)">$&lt;  - first prerequisite</text>
  <text x="82.1875" y="275.625" font-family="monospace" font-size="11.0609" fill="var(--text)">$^  - all prerequisites</text>
  <text x="82.1875" y="291.9375" font-family="monospace" font-size="11.0609" fill="var(--text)">$*  - stem (matched by %)</text>

  <!-- String Functions -->
  <rect x="452.5" y="107.0625" width="375" height="208.4375" rx="6" fill="var(--ok-fill)" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="128.8125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">String Functions</text>
  <text x="466.5625" y="148.75" font-family="monospace" font-size="11.0609" fill="var(--text)">$(subst from,to,text)</text>
  <text x="466.5625" y="166.875" font-family="monospace" font-size="11.0609" fill="var(--text)">$(patsubst %.c,%.o,$(SRCS))</text>
  <text x="466.5625" y="185" font-family="monospace" font-size="11.0609" fill="var(--text)">$(filter %.c,$(FILES))</text>
  <text x="466.5625" y="203.125" font-family="monospace" font-size="11.0609" fill="var(--text)">$(filter-out %.h,$(FILES))</text>
  <text x="466.5625" y="221.25" font-family="monospace" font-size="11.0609" fill="var(--text)">$(sort $(LIST))</text>
  <text x="466.5625" y="239.375" font-family="monospace" font-size="11.0609" fill="var(--text)">$(words $(LIST))</text>
  <text x="466.5625" y="257.5" font-family="monospace" font-size="11.0609" fill="var(--text)">$(addprefix src/,$(SRCS))</text>
  <text x="466.5625" y="275.625" font-family="monospace" font-size="11.0609" fill="var(--text)">$(addsuffix .bak,$(FILES))</text>
  <text x="466.5625" y="293.75" font-family="monospace" font-size="11.0609" fill="var(--text)">$(wildcard src/*.c)</text>

  <!-- Conditionals + Include -->
  <rect x="846.25" y="107.0625" width="365.625" height="208.4375" rx="6" fill="var(--warn-fill)" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1029.0625" y="128.8125" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">Conditionals &amp;amp; Include</text>
  <text x="860.3125" y="148.75" font-family="monospace" font-size="11.0609" fill="var(--text)">ifeq ($(CC),gcc)</text>
  <text x="874.375" y="165.0625" font-family="monospace" font-size="11.0609" fill="var(--text)">  CFLAGS += -O2</text>
  <text x="860.3125" y="181.375" font-family="monospace" font-size="11.0609" fill="var(--text)">else</text>
  <text x="874.375" y="197.6875" font-family="monospace" font-size="11.0609" fill="var(--text)">  CFLAGS += -O0</text>
  <text x="860.3125" y="214" font-family="monospace" font-size="11.0609" fill="var(--text)">endif</text>
  <text x="860.3125" y="235.75" font-family="monospace" font-size="11.0609" fill="var(--text)">ifneq ($(DEBUG),)</text>
  <text x="874.375" y="252.0625" font-family="monospace" font-size="11.0609" fill="var(--text)">  CFLAGS += -g</text>
  <text x="860.3125" y="268.375" font-family="monospace" font-size="11.0609" fill="var(--text)">endif</text>
  <text x="860.3125" y="290.125" font-family="monospace" font-size="11.0609" fill="var(--text)">-include config.mk</text>
  <text x="860.3125" y="306.4375" font-family="monospace" font-size="11.0609" fill="var(--text-muted)"># - silences missing file</text>

  <!-- Parallel builds -->
  <rect x="68.125" y="331.8125" width="562.5" height="163.125" rx="6" fill="var(--info-fill)" filter="url(#shadow)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="349.375" y="353.5625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">Parallel Builds  -j</text>
  <text x="82.1875" y="375.3125" font-family="monospace" font-size="11.0609" fill="var(--text)">make -j4          # 4 parallel jobs</text>
  <text x="82.1875" y="393.4375" font-family="monospace" font-size="11.0609" fill="var(--text)">make -j$(nproc)   # use all CPUs</text>
  <text x="82.1875" y="411.5625" font-family="monospace" font-size="11.0609" fill="var(--text)">make -j           # unlimited (risky)</text>
  <text x="82.1875" y="433.3125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Dependency graph determines what can run in parallel</text>
  <text x="82.1875" y="451.4375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Output may interleave; use --output-sync to fix</text>
  <text x="82.1875" y="469.5625" font-family="monospace" font-size="11.0609" fill="var(--text)">make -j4 --output-sync=recurse</text>
  <text x="82.1875" y="487.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text-muted)">.NOTPARALLEL can force serial execution of a target</text>

  <!-- Real example -->
  <rect x="649.375" y="331.8125" width="562.5" height="163.125" rx="6" fill="var(--danger-fill)" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="930.625" y="353.5625" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Real Pattern: Dependency Files</text>
  <text x="663.4375" y="375.3125" font-family="monospace" font-size="11.0609" fill="var(--text)">SRCS := $(wildcard src/*.c)</text>
  <text x="663.4375" y="393.4375" font-family="monospace" font-size="11.0609" fill="var(--text)">OBJS := $(patsubst src/%.c,obj/%.o,$(SRCS))</text>
  <text x="663.4375" y="411.5625" font-family="monospace" font-size="11.0609" fill="var(--text)">DEPS := $(OBJS:.o=.d)</text>
  <text x="663.4375" y="431.5" font-family="monospace" font-size="11.0609" fill="var(--text)">obj/%.o: src/%.c</text>
  <text x="677.5" y="447.8125" font-family="monospace" font-size="11.0609" fill="var(--text)">$(CC) -MMD -MP -c $&lt; -o $@</text>
  <text x="663.4375" y="467.75" font-family="monospace" font-size="11.0609" fill="var(--text)">-include $(DEPS)</text>
  <text x="663.4375" y="487.6875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">-MMD generates .d files; -include rebuilds on header change</text>

  <!-- Bottom tip bar -->
  <rect x="68.125" y="511.25" width="1143.75" height="90.625" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="533" font-family="Arial, sans-serif" font-size="12.9044" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Key Tips</text>
  <text x="86.875" y="552.9375" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Use := (immediate) assignment, not = (deferred) to avoid unexpected re-evaluation</text>
  <text x="86.875" y="571.0625" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">$(shell cmd) runs shell during Makefile parsing - expensive, cache result in a variable</text>
  <text x="86.875" y="589.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">$(eval ...) dynamically generates Makefile rules - useful for repetitive patterns but hard to debug</text>
</svg>

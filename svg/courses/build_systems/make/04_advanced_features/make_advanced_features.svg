<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.699676538728" font-weight="bold" fill="var(--primary-accent)">GNU Make Advanced Features</text>

  <!-- Row 1: 3 cols -->
  <rect x="40" y="82.181818181818" width="390" height="232" rx="10.269106361049" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--primary-text)">Pattern Rules</text>
  <text x="60" y="150.727272727273" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--primary-text)">%.o: %.c</text>
  <text x="60" y="177.090909090909" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--primary-text)">  $(CC) -c $&lt; -o $@</text>
  <text x="60" y="214" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--primary-text)">$@ target</text>
  <text x="60" y="240.363636363636" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--primary-text)">$&lt; first prereq</text>
  <text x="60" y="266.727272727273" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--primary-text)">$^ all prereqs</text>
  <text x="60" y="293.090909090909" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--primary-text)">$* stem</text>

  <rect x="445" y="82.181818181818" width="390" height="232" rx="10.269106361049" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--ok-text)">String Functions</text>
  <text x="465" y="150.727272727273" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--ok-text)">$(patsubst %.c,%.o,$X)</text>
  <text x="465" y="177.090909090909" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--ok-text)">$(filter %.c,$X)</text>
  <text x="465" y="203.454545454545" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--ok-text)">$(filter-out %.h,$X)</text>
  <text x="465" y="229.818181818182" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--ok-text)">$(sort $X)</text>
  <text x="465" y="256.181818181818" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--ok-text)">$(addprefix src/,$X)</text>
  <text x="465" y="282.545454545455" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--ok-text)">$(wildcard src/*.c)</text>

  <rect x="850" y="82.181818181818" width="390" height="232" rx="10.269106361049" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--warn-text)">Conditionals</text>
  <text x="870" y="150.727272727273" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--warn-text)">ifeq ($(CC),gcc)</text>
  <text x="870" y="177.090909090909" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--warn-text)">  CFLAGS += -O2</text>
  <text x="870" y="203.454545454545" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--warn-text)">else</text>
  <text x="870" y="229.818181818182" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--warn-text)">  CFLAGS += -O0</text>
  <text x="870" y="256.181818181818" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--warn-text)">endif</text>
  <text x="870" y="287.818181818182" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--warn-text)">-include config.mk</text>

  <!-- Row 2 -->
  <rect x="40" y="335.272727272727" width="590" height="189.818181818182" rx="10.269106361049" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="372.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--info-text)">Parallel Builds</text>
  <text x="60" y="409.090909090909" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--info-text)">make -j4</text>
  <text x="60" y="435.454545454545" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--info-text)">make -j$(nproc)</text>
  <text x="60" y="467.090909090909" font-family="Courier New, monospace" font-size="14.376748905469" fill="var(--info-text)">make -j4 --output-sync</text>
  <text x="60" y="504" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--info-text)">.NOTPARALLEL forces serial</text>

  <rect x="650" y="335.272727272727" width="590" height="189.818181818182" rx="10.269106361049" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="372.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.538212722099" font-weight="bold" fill="var(--danger-text)">Dependency Files</text>
  <text x="670" y="409.090909090909" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--danger-text)">SRCS := $(wildcard src/*.c)</text>
  <text x="670" y="435.454545454545" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--danger-text)">DEPS := $(OBJS:.o=.d)</text>
  <text x="670" y="461.818181818182" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--danger-text)">$(CC) -MMD -MP -c</text>
  <text x="670" y="488.181818181818" font-family="Courier New, monospace" font-size="13.349838269364" fill="var(--danger-text)">-include $(DEPS)</text>
  <text x="670" y="514.545454545455" font-family="Arial, sans-serif" font-size="12.322927633259" fill="var(--danger-text)">header-aware</text>

  <!-- Tips -->
  <rect x="40" y="546.181818181818" width="1200" height="73.818181818182" rx="10.269106361049" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60" y="580" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">Prefer := over =</text>
  <text x="60" y="605" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">cache $(shell) output</text>
  <text x="700" y="580" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">$(eval) = dynamic rules</text>
</svg>

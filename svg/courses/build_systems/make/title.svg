<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1210"/>
      <stop offset="100%" style="stop-color:#1a2820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#84cc16"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Dependency graph / DAG -->
  <!-- Top level targets -->
  <rect x="340" y="50" width="120" height="35" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>
  <text x="370" y="73" font-family="monospace" font-size="12" fill="#f59e0b" opacity="0.9">make all</text>
  <!-- Second level -->
  <rect x="180" y="130" width="100" height="30" rx="4" fill="#1e293b" stroke="#84cc16" stroke-width="1.5" opacity="0.7"/>
  <text x="200" y="150" font-family="monospace" font-size="10" fill="#84cc16" opacity="0.8">main.o</text>
  <rect x="520" y="130" width="100" height="30" rx="4" fill="#1e293b" stroke="#84cc16" stroke-width="1.5" opacity="0.7"/>
  <text x="542" y="150" font-family="monospace" font-size="10" fill="#84cc16" opacity="0.8">util.o</text>
  <!-- Third level -->
  <rect x="100" y="210" width="90" height="28" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  <text x="115" y="229" font-family="monospace" font-size="10" fill="#f59e0b" opacity="0.7">main.c</text>
  <rect x="260" y="210" width="90" height="28" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  <text x="278" y="229" font-family="monospace" font-size="10" fill="#f59e0b" opacity="0.7">main.h</text>
  <rect x="450" y="210" width="90" height="28" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  <text x="470" y="229" font-family="monospace" font-size="10" fill="#f59e0b" opacity="0.7">util.c</text>
  <rect x="610" y="210" width="90" height="28" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  <text x="630" y="229" font-family="monospace" font-size="10" fill="#f59e0b" opacity="0.7">util.h</text>
  <!-- Dependency arrows -->
  <line x1="400" y1="85" x2="230" y2="130" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
  <line x1="400" y1="85" x2="570" y2="130" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
  <line x1="210" y1="160" x2="145" y2="210" stroke="#84cc16" stroke-width="1" opacity="0.4"/>
  <line x1="250" y1="160" x2="305" y2="210" stroke="#84cc16" stroke-width="1" opacity="0.4"/>
  <line x1="550" y1="160" x2="495" y2="210" stroke="#84cc16" stroke-width="1" opacity="0.4"/>
  <line x1="590" y1="160" x2="655" y2="210" stroke="#84cc16" stroke-width="1" opacity="0.4"/>
  <!-- Makefile representation -->
  <rect x="280" y="280" width="240" height="75" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.7"/>
  <text x="295" y="300" font-family="monospace" font-size="10" fill="#84cc16" opacity="0.7">all:</text>
  <text x="295" y="314" font-family="monospace" font-size="10" fill="#f59e0b" opacity="0.6">	$(CC) -o $@ $^</text>
  <text x="295" y="328" font-family="monospace" font-size="10" fill="#84cc16" opacity="0.7">%.o: %.c</text>
  <text x="295" y="342" font-family="monospace" font-size="10" fill="#f59e0b" opacity="0.6">	$(CC) -c $&lt;</text>
  <!-- Terminal prompt -->
  <text x="120" y="330" font-family="monospace" font-size="16" fill="#84cc16" opacity="0.4">$</text>
  <!-- Decorative dots -->
  <circle cx="80" cy="50" r="2" fill="#f59e0b" opacity="0.3"/>
  <circle cx="720" cy="60" r="3" fill="#84cc16" opacity="0.3"/>
  <circle cx="80" cy="370" r="2" fill="#84cc16" opacity="0.3"/>
  <circle cx="720" cy="370" r="2" fill="#f59e0b" opacity="0.3"/>
  <!-- Bottom accent -->
  <rect x="250" y="380" width="300" height="3" rx="1.5" fill="url(#accent)" opacity="0.6"/>
</svg>

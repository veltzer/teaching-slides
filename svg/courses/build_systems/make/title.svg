<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#212121" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" stop-color="#f39c12" />
      <stop offset="100%" stop-color="#4caf50" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <rect x="483.5556" y="80" width="170.6667" height="56" rx="6" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="2.6667" opacity="0.8" />
  <text x="526.2222" y="115.5556" font-family="monospace" font-size="16" fill="var(--warn-accent)" opacity="0.9">make all</text>
  <rect x="256" y="208" width="142.2222" height="48" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="2.1333" opacity="0.7" />
  <text x="284.4444" y="238.2222" font-family="monospace" font-size="14.2222" fill="var(--ok-accent)" opacity="0.8">main.o</text>
  <rect x="739.5556" y="208" width="142.2222" height="48" rx="6" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="2.1333" opacity="0.7" />
  <text x="770.6667" y="238.2222" font-family="monospace" font-size="14.2222" fill="var(--ok-accent)" opacity="0.8">util.o</text>
  <rect x="142.2222" y="336" width="128" height="44.4444" rx="6" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="1.4222" opacity="0.6" />
  <text x="163.5556" y="365.3333" font-family="monospace" font-size="14.2222" fill="var(--warn-accent)" opacity="0.7">main.c</text>
  <rect x="369.7778" y="336" width="128" height="44.4444" rx="6" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="1.4222" opacity="0.6" />
  <text x="394.6667" y="365.3333" font-family="monospace" font-size="14.2222" fill="var(--warn-accent)" opacity="0.7">main.h</text>
  <rect x="640" y="336" width="128" height="44.4444" rx="6" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="1.4222" opacity="0.6" />
  <text x="668.4444" y="365.3333" font-family="monospace" font-size="14.2222" fill="var(--warn-accent)" opacity="0.7">util.c</text>
  <rect x="867.5556" y="336" width="128" height="44.4444" rx="6" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="1.4222" opacity="0.6" />
  <text x="896" y="365.3333" font-family="monospace" font-size="14.2222" fill="var(--warn-accent)" opacity="0.7">util.h</text>
  <line x1="568.8889" y1="136" x2="327.1111" y2="208" stroke="var(--warn-border)" stroke-width="2" opacity="0.5" />
  <line x1="568.8889" y1="136" x2="810.6667" y2="208" stroke="var(--warn-border)" stroke-width="2" opacity="0.5" />
  <line x1="298.6667" y1="256" x2="206.2222" y2="336" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.4" />
  <line x1="355.5556" y1="256" x2="433.7778" y2="336" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.4" />
  <line x1="782.2222" y1="256" x2="704" y2="336" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.4" />
  <line x1="839.1111" y1="256" x2="931.5556" y2="336" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.4" />
  <rect x="398.2222" y="437.3333" width="341.3333" height="110.2222" rx="6" fill="var(--code-bg)" stroke="var(--warn-border)" stroke-width="2.1333" opacity="0.7" />
  <text x="419.5556" y="467.5556" font-family="monospace" font-size="14.2222" fill="var(--ok-accent)" opacity="0.7">all:</text>
  <text x="419.5556" y="488.8889" font-family="monospace" font-size="14.2222" fill="var(--warn-accent)" opacity="0.6">	$(CC) -o $@ $^</text>
  <text x="419.5556" y="510.2222" font-family="monospace" font-size="14.2222" fill="var(--ok-accent)" opacity="0.7">%.o: %.c</text>
  <text x="419.5556" y="531.5556" font-family="monospace" font-size="14.2222" fill="var(--warn-accent)" opacity="0.6">	$(CC) -c $&lt;</text>
  <rect x="355.5556" y="595.5556" width="426.6667" height="4.4444" rx="6" fill="url(#accent)" opacity="0.6" />
</svg>
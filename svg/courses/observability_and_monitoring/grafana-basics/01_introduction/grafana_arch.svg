<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.628328299751" font-weight="bold" fill="var(--text)">Grafana: Data Sources to Dashboards</text>

  <text x="190" y="102.702702702703" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.046782478411" font-weight="bold" fill="var(--text-muted)">Backends</text>
  <text x="640" y="102.702702702703" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.046782478411" font-weight="bold" fill="var(--text-muted)">Grafana</text>
  <text x="1090" y="102.702702702703" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.046782478411" font-weight="bold" fill="var(--text-muted)">Users</text>

  <rect x="40" y="144.504504504504" width="300" height="62.702702702703" rx="8.465236657072" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="181.081081081081" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.87231873201" font-weight="bold" fill="var(--warn-text)">Metrics store</text>

  <rect x="40" y="228.108108108108" width="300" height="62.702702702703" rx="8.465236657072" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="264.684684684685" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.87231873201" font-weight="bold" fill="var(--warn-text)">Log store</text>

  <rect x="40" y="311.711711711712" width="300" height="62.702702702703" rx="8.465236657072" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="348.288288288288" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.87231873201" font-weight="bold" fill="var(--warn-text)">Trace store</text>

  <rect x="40" y="395.315315315315" width="300" height="62.702702702703" rx="8.465236657072" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="431.891891891892" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.87231873201" font-weight="bold" fill="var(--warn-text)">SQL database</text>

  <rect x="468.571428571428" y="144.504504504504" width="342.857142857143" height="334.414414414414" rx="10.58154582134" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="181.081081081081" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.046782478411" font-weight="bold" fill="var(--primary-text)">Data sources</text>

  <rect x="490" y="207.207207207207" width="300" height="41.801801801802" rx="6.348927492804" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.756009567742" fill="var(--text)">queries → variables → panels</text>

  <text x="640" y="285.585585585586" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.930473314144" font-weight="bold" fill="var(--primary-text)">Panels</text>
  <rect x="490" y="296.036036036036" width="128.571428571429" height="52.252252252252" rx="6.348927492804" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="554.285714285714" y="327.387387387387" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.697854985608" fill="var(--text)">time series</text>

  <rect x="661.428571428571" y="296.036036036036" width="128.571428571429" height="52.252252252252" rx="6.348927492804" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="725.714285714286" y="327.387387387387" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.697854985608" fill="var(--text)">stat / gauge</text>

  <text x="640" y="390.09009009009" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.930473314144" font-weight="bold" fill="var(--primary-text)">Dashboards</text>
  <rect x="490" y="400.540540540541" width="300" height="52.252252252252" rx="6.348927492804" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="431.891891891892" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.697854985608" fill="var(--text)">collections of panels + variables</text>

  <rect x="940" y="144.504504504504" width="300" height="83.603603603604" rx="8.465236657072" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="181.081081081081" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.87231873201" font-weight="bold" fill="var(--info-text)">Browser</text>
  <text x="1090" y="207.207207207207" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.756009567742" fill="var(--info-text)">live charts</text>

  <rect x="940" y="249.009009009009" width="300" height="83.603603603604" rx="8.465236657072" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="285.585585585586" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.87231873201" font-weight="bold" fill="var(--info-text)">On-call</text>
  <text x="1090" y="311.711711711712" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.756009567742" fill="var(--info-text)">alerts → pager</text>

  <rect x="940" y="353.513513513513" width="300" height="83.603603603604" rx="8.465236657072" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="390.09009009009" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.87231873201" font-weight="bold" fill="var(--ok-text)">API consumers</text>
  <text x="1090" y="416.216216216216" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.756009567742" fill="var(--ok-text)">dashboards as code</text>

  <path d="M 340 175.855855855856 L 468.571428571428 217.657657657658" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 340 259.459459459459 L 468.571428571428 228.108108108108" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 340 343.063063063063 L 468.571428571428 238.558558558559" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 340 426.666666666667 L 468.571428571428 249.009009009009" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 811.428571428571 217.657657657658 L 940 186.306306306306" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 811.428571428571 343.063063063063 L 940 290.810810810811" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 811.428571428571 416.216216216216 L 940 395.315315315315" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="640" y="541.621621621622" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.87231873201" font-weight="bold" fill="var(--text)">One UI over many backends — unified observability surface</text>
  <text x="640" y="567.747747747748" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.756009567742" fill="var(--text-muted)">Mix metrics, logs, traces in a single dashboard with shared time range</text>

  <rect x="61.428571428571" y="588.648648648649" width="1157.142857142857" height="31.351351351351" rx="6.348927492804" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="610.594594594595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.756009567742" fill="var(--text-muted)">Dashboards versioned as JSON; provisioned to Grafana on startup</text>
</svg>

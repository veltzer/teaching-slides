<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Grafana Basics</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <rect x="160" y="195" width="960" height="275" rx="10" fill="none" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="180" y="223" text-anchor="start" font-size="16" fill="var(--surface)">Service Dashboard</text>
  <text x="1100" y="223" text-anchor="end" font-size="15" fill="var(--text-faint)">Last 6 hours</text>
  <rect x="180" y="238" width="540" height="217" rx="6" fill="none" stroke="var(--text-muted)" stroke-width="1.5"/>
  <text x="196" y="261" text-anchor="start" font-size="15" fill="var(--text-faint)">Time Series</text>
  <line x1="200" y1="300" x2="700" y2="300" stroke="var(--danger-fill)" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="700" y="292" text-anchor="end" font-size="14" fill="var(--danger-fill)">alert threshold</text>
  <polyline points="200,400 250,380 300,390 350,350 400,365 450,320 500,340 550,312 600,325 650,308 700,318" fill="none" stroke="var(--primary-fill)" stroke-width="3"/>
  <polyline points="200,432 260,426 320,420 380,428 440,410 500,416 560,404 620,412 700,398" fill="none" stroke="var(--ok-fill)" stroke-width="3"/>
  <rect x="740" y="238" width="170" height="107" rx="6" fill="none" stroke="var(--text-muted)" stroke-width="1.5"/>
  <text x="756" y="261" text-anchor="start" font-size="15" fill="var(--text-faint)">Stat</text>
  <text x="825" y="318" font-size="34" font-weight="bold" fill="var(--ok-fill)">99.9%</text>
  <rect x="930" y="238" width="170" height="107" rx="6" fill="none" stroke="var(--text-muted)" stroke-width="1.5"/>
  <text x="946" y="261" text-anchor="start" font-size="15" fill="var(--text-faint)">Gauge</text>
  <path d="M977,330 A38,38 0 0 1 1053,330" fill="none" stroke="var(--text-muted)" stroke-width="10"/>
  <path d="M977,330 A38,38 0 0 1 1037.3,299.3" fill="none" stroke="var(--warn-fill)" stroke-width="10"/>
  <text x="1015" y="328" font-size="16" fill="var(--surface)">72%</text>
  <rect x="740" y="360" width="360" height="95" rx="6" fill="none" stroke="var(--text-muted)" stroke-width="1.5"/>
  <text x="756" y="383" text-anchor="start" font-size="15" fill="var(--text-faint)">Bar Gauge</text>
  <rect x="756" y="394" width="300" height="12" rx="3" fill="var(--ok-fill)"/>
  <rect x="756" y="414" width="210" height="12" rx="3" fill="var(--warn-fill)"/>
  <rect x="756" y="434" width="120" height="12" rx="3" fill="var(--danger-fill)"/>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">data sources • panels &amp; queries • dashboards • alerts • operations</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

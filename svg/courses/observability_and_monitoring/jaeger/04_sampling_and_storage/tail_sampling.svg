<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.495762407505" font-weight="bold" fill="var(--text)">Head vs Tail Sampling</text>

  <rect x="40" y="102.142857142857" width="578.571428571429" height="248.571428571429" rx="10.534200859823" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="329.285714285714" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.068401719647" font-weight="bold" fill="var(--info-text)">Head sampling</text>
  <text x="61.428571428571" y="179.821428571429" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--info-text)">Decide at root span</text>
  <text x="61.428571428571" y="205.714285714286" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--info-text)">Coin flip: keep 1%</text>
  <text x="61.428571428571" y="231.607142857143" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--info-text)">Decision propagates</text>
  <text x="61.428571428571" y="273.035714285714" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--ok-accent)">+ cheap, simple</text>
  <text x="61.428571428571" y="298.928571428571" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--danger-accent)">- misses rare errors</text>
  <text x="61.428571428571" y="324.821428571429" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--danger-accent)">- misses slow traces</text>

  <rect x="661.428571428571" y="102.142857142857" width="578.571428571429" height="248.571428571429" rx="10.534200859823" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="950.714285714286" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.068401719647" font-weight="bold" fill="var(--warn-text)">Tail sampling</text>
  <text x="682.857142857143" y="179.821428571429" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--warn-text)">Buffer whole trace at collector</text>
  <text x="682.857142857143" y="205.714285714286" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--warn-text)">Decide after seeing all spans</text>
  <text x="682.857142857143" y="231.607142857143" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--warn-text)">Keep errors, slow, important</text>
  <text x="682.857142857143" y="273.035714285714" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--ok-accent)">+ keeps interesting</text>
  <text x="682.857142857143" y="298.928571428571" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--ok-accent)">+ low storage</text>
  <text x="682.857142857143" y="324.821428571429" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--danger-accent)">- expensive collectors</text>

  <rect x="40" y="392.142857142857" width="1200" height="227.857142857143" rx="10.534200859823" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="423.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.961561547682" font-weight="bold" fill="var(--primary-text)">Tail sampling rules</text>
  <text x="61.428571428571" y="459.464285714286" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--primary-text)">Always keep: error spans, latency &gt; threshold, specific routes</text>
  <text x="61.428571428571" y="490.535714285714" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--primary-text)">Probabilistic: 1% of normal successful traces</text>
  <text x="61.428571428571" y="521.607142857143" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--primary-text)">Force-sample: app marks "interesting" — debug header, VIP user</text>
  <text x="61.428571428571" y="557.857142857143" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--primary-text)">Result: small storage, high signal</text>
  <text x="61.428571428571" y="588.928571428572" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--primary-text)">Memory cost at collector — needs sizing</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="629.473684210526" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.235882783068" font-weight="bold" fill="var(--text)">Collector Pipeline</text>

  <rect x="40" y="102.142857142857" width="189.473684210526" height="82.857142857143" rx="10.441386708238" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="134.736842105263" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--primary-text)">Apps</text>
  <text x="134.736842105263" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.529664049886" fill="var(--primary-text)">SDK emits spans</text>

  <rect x="271.578947368421" y="102.142857142857" width="189.473684210526" height="82.857142857143" rx="10.441386708238" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="366.315789473684" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--info-text)">Agent / sidecar</text>
  <text x="366.315789473684" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.529664049886" fill="var(--info-text)">local buffer</text>

  <rect x="503.157894736842" y="102.142857142857" width="189.473684210526" height="82.857142857143" rx="10.441386708238" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="597.894736842105" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--warn-text)">Collector tier</text>
  <text x="597.894736842105" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.529664049886" fill="var(--warn-text)">stateless workers</text>

  <rect x="734.736842105263" y="102.142857142857" width="189.473684210526" height="82.857142857143" rx="10.441386708238" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="829.473684210526" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--warn-text)">Sampler / processor</text>
  <text x="829.473684210526" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.529664049886" fill="var(--warn-text)">redact PII, sample</text>

  <rect x="966.315789473684" y="102.142857142857" width="126.315789473684" height="82.857142857143" rx="10.441386708238" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1029.473684210526" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--ok-text)">Storage</text>
  <text x="1029.473684210526" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.529664049886" fill="var(--ok-text)">indexed</text>

  <rect x="1113.684210526316" y="102.142857142857" width="126.315789473684" height="82.857142857143" rx="10.441386708238" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1176.842105263158" y="138.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" font-weight="bold" fill="var(--ok-text)">UI</text>
  <text x="1176.842105263158" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.529664049886" fill="var(--ok-text)">queries</text>

  <path d="M 229.473684210526 143.571428571429 L 271.578947368421 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 461.052631578947 143.571428571429 L 503.157894736842 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 692.631578947368 143.571428571429 L 734.736842105263 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 924.210526315789 143.571428571429 L 966.315789473684 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1092.631578947369 143.571428571429 L 1113.684210526316 143.571428571429" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="257.5" width="568.421052631579" height="186.428571428571" rx="10.441386708238" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="324.210526315789" y="288.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--text)">Sizing</text>
  <text x="61.052631578947" y="319.642857142857" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">Collectors stateless → scale horizontal</text>
  <text x="61.052631578947" y="345.535714285714" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">Storage tier dominates cost</text>
  <text x="61.052631578947" y="371.428571428571" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">Tail sampling adds memory</text>
  <text x="61.052631578947" y="402.5" font-family="Arial, sans-serif" font-size="13.57380272071" font-weight="bold" fill="var(--ok-accent)">Capacity test before launch</text>

  <rect x="650.526315789474" y="257.5" width="568.421052631579" height="186.428571428571" rx="10.441386708238" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="934.736842105263" y="288.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--text)">Monitor metrics</text>
  <text x="671.578947368421" y="319.642857142857" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">Spans received per second</text>
  <text x="671.578947368421" y="345.535714285714" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">Spans dropped (queue full)</text>
  <text x="671.578947368421" y="371.428571428571" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--text-muted)">Storage write latency</text>
  <text x="671.578947368421" y="402.5" font-family="Arial, sans-serif" font-size="13.57380272071" font-weight="bold" fill="var(--danger-accent)">Alert on drop rate</text>

  <rect x="40" y="475" width="1178.947368421052" height="145" rx="10.441386708238" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.473684210526" y="506.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.706218733181" font-weight="bold" fill="var(--primary-text)">Multi-tenancy</text>
  <text x="629.473684210526" y="537.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--primary-text)">Per-tenant ingestion quotas</text>
  <text x="629.473684210526" y="563.035714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.617941391534" fill="var(--primary-text)">Per-tenant retention</text>
  <text x="629.473684210526" y="594.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.57380272071" fill="var(--primary-text)">Audit access to traces</text>
</svg>

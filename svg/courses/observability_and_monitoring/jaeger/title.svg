<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--code-text)">Jaeger</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <line x1="340" y1="205" x2="1140" y2="205" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="340" y1="198" x2="340" y2="212" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="540" y1="198" x2="540" y2="212" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="740" y1="198" x2="740" y2="212" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="940" y1="198" x2="940" y2="212" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="1140" y1="198" x2="1140" y2="212" stroke="var(--text-muted)" stroke-width="2"/>
  <text x="1185" y="210" font-size="15" fill="var(--text-faint)">time</text>
  <text x="150" y="250" font-size="17" text-anchor="start" fill="var(--text-faint)">frontend</text>
  <rect x="340" y="226" width="800" height="34" rx="5" fill="var(--primary-fill)"/>
  <text x="740" y="249" font-size="16" fill="var(--primary-text)">GET /checkout  420 ms</text>
  <text x="165" y="296" font-size="17" text-anchor="start" fill="var(--text-faint)">↳ cart</text>
  <rect x="370" y="272" width="200" height="34" rx="5" fill="var(--ok-fill)"/>
  <text x="470" y="295" font-size="16" fill="var(--ok-text)">get items</text>
  <text x="165" y="342" font-size="17" text-anchor="start" fill="var(--text-faint)">↳ payment</text>
  <rect x="590" y="318" width="440" height="34" rx="5" fill="var(--info-fill)"/>
  <text x="810" y="341" font-size="16" fill="var(--info-text)">charge card</text>
  <text x="190" y="388" font-size="17" text-anchor="start" fill="var(--text-faint)">↳ postgres</text>
  <rect x="620" y="364" width="160" height="34" rx="5" fill="var(--warn-fill)"/>
  <text x="700" y="387" font-size="16" fill="var(--warn-text)">INSERT</text>
  <text x="190" y="434" font-size="17" text-anchor="start" fill="var(--text-faint)">↳ bank API</text>
  <rect x="800" y="410" width="210" height="34" rx="5" fill="var(--danger-fill)"/>
  <text x="905" y="433" font-size="16" fill="var(--danger-text)">error: timeout</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">spans &amp; traces • instrumentation • context propagation • sampling • storage • operations</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--code-text)">Prometheus and Grafana</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Open-source monitoring stack</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <rect x="90" y="225" width="206" height="50" rx="8" fill="var(--ok-fill)"/>
  <text x="193" y="256" font-size="18" fill="var(--ok-text)">Node exporter</text>
  <rect x="90" y="305" width="206" height="50" rx="8" fill="var(--ok-fill)"/>
  <text x="193" y="336" font-size="18" fill="var(--ok-text)">Application</text>
  <rect x="90" y="385" width="206" height="50" rx="8" fill="var(--ok-fill)"/>
  <text x="193" y="416" font-size="18" fill="var(--ok-text)">Database</text>
  <path d="M296,250 H350 M296,330 H350 M296,410 H350 M350,250 V410 M350,330 H400" fill="none" stroke="var(--text-faint)" stroke-width="3"/>
  <polygon points="400,322 414,330 400,338" fill="var(--text-faint)"/>
  <text x="383" y="318" font-size="14" fill="var(--text-faint)">scrape</text>
  <rect x="420" y="270" width="220" height="120" rx="12" fill="var(--danger-fill)"/>
  <text x="530" y="326" font-size="22" font-weight="bold" fill="var(--danger-text)">Prometheus</text>
  <text x="530" y="354" font-size="16" fill="var(--danger-text)">time series database</text>
  <line x1="646" y1="300" x2="764" y2="300" stroke="var(--text-faint)" stroke-width="3"/>
  <polygon points="764,292 778,300 764,308" fill="var(--text-faint)"/>
  <text x="710" y="288" font-size="16" fill="var(--text-faint)">PromQL</text>
  <rect x="780" y="215" width="390" height="170" rx="10" fill="none" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="975" y="245" font-size="18" font-weight="bold" fill="var(--warn-fill)">Grafana dashboard</text>
  <line x1="810" y1="265" x2="810" y2="365" stroke="var(--text-faint)" stroke-width="2"/>
  <line x1="810" y1="365" x2="1145" y2="365" stroke="var(--text-faint)" stroke-width="2"/>
  <polyline points="810,350 850,335 890,342 930,310 970,320 1010,290 1050,300 1090,275 1140,285" fill="none" stroke="var(--warn-fill)" stroke-width="3"/>
  <path d="M560,390 V445 H764" fill="none" stroke="var(--text-faint)" stroke-width="3"/>
  <polygon points="764,437 778,445 764,453" fill="var(--text-faint)"/>
  <text x="665" y="434" font-size="16" fill="var(--text-faint)">alert rules</text>
  <rect x="780" y="420" width="260" height="50" rx="8" fill="var(--info-fill)"/>
  <text x="910" y="451" font-size="18" fill="var(--info-text)">Alertmanager</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">metrics • alerts • dashboards</text>
</svg>

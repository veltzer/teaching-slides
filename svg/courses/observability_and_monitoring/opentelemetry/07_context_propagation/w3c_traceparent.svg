<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.854226236055" font-weight="bold" fill="var(--text)">W3C traceparent Header</text>

  <rect x="40" y="86.194690265487" width="1200" height="123.185840707965" rx="10.305080798591" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--text)">traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01</text>
  <text x="174.48275862069" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--primary-fill)">version</text>
  <text x="495.172413793103" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--ok-fill)">trace-id (16 bytes)</text>
  <text x="857.241379310345" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--warn-fill)">parent-id (8 bytes)</text>
  <text x="1115.862068965517" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--danger-fill)">flags</text>
  <text x="1115.862068965517" y="188.849557522124" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.33558887845" fill="var(--text-muted)">01 = sampled</text>

  <rect x="40" y="240.176991150443" width="227.586206896552" height="102.654867256637" rx="8.244064638873" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.793103448276" y="276.106194690266" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.488129277745" font-weight="bold" fill="var(--info-text)">Service A</text>
  <text x="153.793103448276" y="301.769911504425" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--info-text)">starts root span</text>
  <text x="153.793103448276" y="322.300884955752" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--info-text)">trace-id = T, span = S1</text>

  <path d="M 269.655172413793 291.504424778761 L 371.034482758621 291.504424778761" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="319.310344827586" y="281.238938053097" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.33558887845" fill="var(--text-muted)">HTTP</text>

  <rect x="381.379310344828" y="240.176991150443" width="227.586206896552" height="102.654867256637" rx="8.244064638873" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495.172413793103" y="276.106194690266" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.488129277745" font-weight="bold" fill="var(--info-text)">Service B</text>
  <text x="495.172413793103" y="301.769911504425" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--info-text)">child span</text>
  <text x="495.172413793103" y="322.300884955752" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--info-text)">trace-id = T, span = S2</text>

  <path d="M 611.034482758621 291.504424778761 L 712.413793103448 291.504424778761" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660.689655172414" y="281.238938053097" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.33558887845" fill="var(--text-muted)">gRPC</text>

  <rect x="722.758620689655" y="240.176991150443" width="227.586206896552" height="102.654867256637" rx="8.244064638873" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="836.551724137931" y="276.106194690266" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.488129277745" font-weight="bold" fill="var(--info-text)">Service C</text>
  <text x="836.551724137931" y="301.769911504425" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--info-text)">child span</text>
  <text x="836.551724137931" y="322.300884955752" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--info-text)">trace-id = T, span = S3</text>

  <path d="M 952.413793103448 291.504424778761 L 1053.793103448276 291.504424778761" stroke="var(--text)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="1002.068965517241" y="281.238938053097" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.33558887845" fill="var(--text-muted)">Kafka</text>

  <rect x="1064.137931034483" y="240.176991150443" width="175.862068965517" height="102.654867256637" rx="8.244064638873" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1152.068965517241" y="276.106194690266" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.488129277745" font-weight="bold" fill="var(--warn-text)">Worker D</text>
  <text x="1152.068965517241" y="301.769911504425" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--warn-text)">resumes trace</text>
  <text x="1152.068965517241" y="322.300884955752" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--warn-text)">trace-id = T</text>

  <rect x="40" y="394.159292035398" width="1200" height="225.840707964602" rx="10.305080798591" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="430.088495575221" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--text)">Transports</text>
  <text x="60.689655172414" y="466.017699115044" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--text)">HTTP: traceparent header (W3C standard)</text>
  <text x="60.689655172414" y="491.681415929204" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--text)">gRPC: metadata (auto-instrumented)</text>
  <text x="60.689655172414" y="517.345132743363" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--text)">Kafka / RabbitMQ: message headers</text>
  <text x="60.689655172414" y="543.008849557522" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--text)">DB: comment in SQL (sqlcommenter); cron: explicit start</text>
  <text x="60.689655172414" y="584.070796460177" font-family="Arial, sans-serif" font-size="13.396605038168" font-style="italic" fill="var(--text-muted)">Without context propagation, traces stop at service boundaries</text>
</svg>

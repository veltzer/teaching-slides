<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.727393858384" font-weight="bold" fill="var(--text)">Spans, Traces, Context Propagation</text>

  <text x="60.689655172414" y="90.877192982456" font-family="Arial, sans-serif" font-size="14.363696929192" font-weight="bold" fill="var(--text)">trace_id: 7ef3a...</text>
  <text x="60.689655172414" y="111.228070175439" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--text-muted)">end-to-end request</text>

  <line x1="60.689655172414" y1="131.578947368421" x2="1219.310344827586" y2="131.578947368421" stroke="var(--border)" stroke-width="1"/>

  <rect x="81.379310344828" y="151.929824561404" width="1117.241379310345" height="40.701754385965" rx="6.155870112511" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="178.385964912281" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.363696929192" font-weight="bold" fill="var(--primary-text)">root span: GET /checkout (250 ms)</text>

  <rect x="102.068965517241" y="212.982456140351" width="289.655172413793" height="40.701754385965" rx="6.155870112511" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="246.896551724138" y="239.438596491228" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.337718577107" font-weight="bold" fill="var(--info-text)">auth.verify (40 ms)</text>

  <rect x="412.413793103448" y="212.982456140351" width="517.241379310345" height="40.701754385965" rx="6.155870112511" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="671.034482758621" y="239.438596491228" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.337718577107" font-weight="bold" fill="var(--warn-text)">cart.calculate (160 ms)</text>

  <rect x="950.344827586207" y="212.982456140351" width="227.586206896552" height="40.701754385965" rx="6.155870112511" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1064.137931034483" y="239.438596491228" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.337718577107" font-weight="bold" fill="var(--info-text)">payment.charge (50 ms)</text>

  <rect x="433.103448275862" y="274.035087719298" width="248.275862068966" height="40.701754385965" rx="6.155870112511" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="557.241379310345" y="300.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.337718577107" font-weight="bold" fill="var(--ok-text)">db.SELECT items (60 ms)</text>

  <rect x="702.068965517241" y="274.035087719298" width="206.896551724138" height="40.701754385965" rx="6.155870112511" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805.51724137931" y="300.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.337718577107" font-weight="bold" fill="var(--ok-text)">tax.api (90 ms)</text>

  <text x="60.689655172414" y="355.438596491228" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--text-muted)">time -&gt;. nesting = parent/child.</text>

  <rect x="40" y="391.052631578947" width="600" height="228.947368421053" rx="10.259783520852" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="340" y="421.578947368421" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.415653633362" font-weight="bold" fill="var(--text)">A span has...</text>
  <text x="60.689655172414" y="452.105263157895" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--text)">- name (operation)</text>
  <text x="60.689655172414" y="475.508771929825" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--text)">- start + end timestamps</text>
  <text x="60.689655172414" y="498.912280701754" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--text)">- trace_id and span_id</text>
  <text x="60.689655172414" y="522.315789473684" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--text)">- parent_span_id (root has none)</text>
  <text x="60.689655172414" y="545.719298245614" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--text)">- attributes (http.method, http.status)</text>
  <text x="60.689655172414" y="569.122807017544" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--text)">- events (errors, retries)</text>
  <text x="60.689655172414" y="599.649122807018" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--text)">- status (ok / error)</text>

  <rect x="660.689655172414" y="391.052631578947" width="579.310344827586" height="228.947368421053" rx="10.259783520852" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="421.578947368421" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.415653633362" font-weight="bold" fill="var(--info-text)">Context propagation</text>
  <text x="681.379310344828" y="457.19298245614" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--info-text)">Trace context travels with the request:</text>
  <text x="681.379310344828" y="487.719298245614" font-family="Arial, sans-serif" font-size="14.363696929192" fill="var(--info-text)">traceparent: 00-{trace_id}-{span_id}-01</text>
  <text x="681.379310344828" y="523.333333333333" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--info-text)">- HTTP headers</text>
  <text x="681.379310344828" y="546.736842105263" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--info-text)">- Message metadata (Kafka)</text>
  <text x="681.379310344828" y="570.140350877193" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--info-text)">- gRPC metadata</text>
  <text x="681.379310344828" y="600.666666666667" font-family="Arial, sans-serif" font-size="13.337718577107" font-style="italic" fill="var(--info-text)">Each service joins the same trace</text>
</svg>

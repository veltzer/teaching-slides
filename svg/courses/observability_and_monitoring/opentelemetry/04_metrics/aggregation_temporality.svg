<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Metric Aggregation Temporality</text>
  <rect x="40" y="80" width="600" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Cumulative</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Counter grows since start</text>
  <text x="60" y="195" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Backend computes rates</text>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Survives missing scrapes</text>
  <text x="60" y="265" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Restart resets to zero</text>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Best for:</text>
  <text x="60" y="350" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Prometheus scrape model</text>
  <text x="60" y="380" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Long-running services</text>
  <text x="60" y="410" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Pull-based collection</text>
  <text x="60" y="465" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Backend handles deltas</text>
  <text x="60" y="495" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Resets need detection</text>
  <text x="60" y="540" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--info-text)">Default Prometheus shape</text>
  <rect x="660" y="80" width="580" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Delta</text>
  <text x="680" y="160" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Reset every interval</text>
  <text x="680" y="195" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">SDK computes the delta</text>
  <text x="680" y="230" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Backend stores as-is</text>
  <text x="680" y="265" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">No restart math</text>
  <text x="680" y="320" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Best for:</text>
  <text x="680" y="350" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Short-lived workloads</text>
  <text x="680" y="380" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Lambda and serverless</text>
  <text x="680" y="410" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Push-based collection</text>
  <text x="680" y="465" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Lossy if a push is dropped</text>
  <text x="680" y="495" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Smaller windows</text>
  <text x="680" y="540" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--primary-text)">Common in StatsD style</text>
</svg>

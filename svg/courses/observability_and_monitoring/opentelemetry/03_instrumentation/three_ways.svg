<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Three Ways to Instrument</text>
  <rect x="40" y="80" width="395" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="237" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Auto</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Agent attaches at runtime</text>
  <text x="60" y="195" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Or build-time bytecode patch</text>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">No code changes needed</text>
  <text x="60" y="265" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Coverage of common libs</text>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Strengths:</text>
  <text x="60" y="350" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Fast to roll out</text>
  <text x="60" y="380" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Java, Python, .NET shine</text>
  <text x="60" y="430" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Limits:</text>
  <text x="60" y="460" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">No domain context</text>
  <text x="60" y="510" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--info-text)">Best for getting started</text>
  <rect x="445" y="80" width="395" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="642" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Library</text>
  <text x="465" y="160" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Per-framework packages</text>
  <text x="465" y="195" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Wraps clients and servers</text>
  <text x="465" y="230" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Imported in code</text>
  <text x="465" y="265" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Conforming attributes</text>
  <text x="465" y="320" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Strengths:</text>
  <text x="465" y="350" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Reliable HTTP and DB spans</text>
  <text x="465" y="380" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Cross-language consistent</text>
  <text x="465" y="430" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Limits:</text>
  <text x="465" y="460" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Need versions to match</text>
  <text x="465" y="510" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--primary-text)">Best for steady ground</text>
  <rect x="850" y="80" width="390" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Manual</text>
  <text x="870" y="160" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Hand-written span code</text>
  <text x="870" y="195" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Tied to your domain</text>
  <text x="870" y="230" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Custom attributes</text>
  <text x="870" y="265" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Hot-loop discipline</text>
  <text x="870" y="320" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Strengths:</text>
  <text x="870" y="350" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Carries business meaning</text>
  <text x="870" y="380" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Pinpoint hot paths</text>
  <text x="870" y="430" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Limits:</text>
  <text x="870" y="460" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Effort to maintain</text>
  <text x="870" y="510" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--ok-text)">Best for the core code</text>
</svg>

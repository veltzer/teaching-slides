<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Kafka Topology</text>
  <rect x="40" y="80" width="280" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Producers</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Write records to a topic</text>
  <text x="60" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Choose partition (key)</text>
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Acks: 0 / 1 / all</text>
  <text x="60" y="270" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">Decoupled from consumers</text>

  <rect x="340" y="80" width="600" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Brokers (cluster)</text>
  <rect x="370" y="145" width="540" height="60" rx="6" fill="var(--surface)" stroke="var(--border)"/>
  <text x="640" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Topic: orders</text>
  <text x="640" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Partition 0 | Partition 1 | Partition 2</text>
  <rect x="370" y="215" width="540" height="60" rx="6" fill="var(--surface)" stroke="var(--border)"/>
  <text x="640" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Topic: shipments</text>
  <text x="640" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Partition 0 | Partition 1</text>
  <text x="640" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">Replication factor &gt; 1 = HA</text>
  <text x="640" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Each partition has 1 leader + N followers</text>
  <text x="640" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Records are immutable; retention by time or size</text>

  <rect x="960" y="80" width="280" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Consumer groups</text>
  <text x="980" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Each partition: one</text>
  <text x="980" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">consumer per group</text>
  <text x="980" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Track offset per group</text>
  <text x="980" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Add consumers to scale</text>
  <text x="980" y="295" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">Replay by resetting offset</text>
</svg>

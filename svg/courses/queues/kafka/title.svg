<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>

  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Apache Kafka</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">A distributed commit log</text>

  <!-- Producer -> partitions -> consumers -->
  <rect x="200" y="280" width="160" height="60" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="280" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Producer</text>

  <rect x="500" y="240" width="280" height="40" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="4"/>
  <text x="640" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">partition 0</text>
  <rect x="500" y="290" width="280" height="40" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="4"/>
  <text x="640" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">partition 1</text>
  <rect x="500" y="340" width="280" height="40" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="4"/>
  <text x="640" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">partition 2</text>

  <rect x="920" y="280" width="160" height="60" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="1000" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Consumer</text>

  <line x1="360" y1="310" x2="500" y2="310" stroke="var(--surface)" stroke-width="2"/>
  <line x1="780" y1="310" x2="920" y2="310" stroke="var(--surface)" stroke-width="2"/>

  <text x="640" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-faint)">topic: orders (partitioned, replicated, durable)</text>

  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">producers &#8226; consumers &#8226; configuration &#8226; design</text>
</svg>

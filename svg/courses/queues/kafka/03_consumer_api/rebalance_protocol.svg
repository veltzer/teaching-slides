<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Rebalance Protocol</text>

  <rect x="40" y="80" width="290" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="185" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Triggers</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Member joins group</text>
  <text x="60" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Member leaves cleanly</text>
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Heartbeat times out</text>
  <text x="60" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Topic partition added</text>
  <text x="60" y="310" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">Coordinator drives it</text>

  <rect x="345" y="80" width="290" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="490" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Eager Phase</text>
  <text x="365" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">All revoke partitions</text>
  <text x="365" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Stop the world</text>
  <text x="365" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Sync barrier wait</text>
  <text x="365" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Reassign and resume</text>
  <text x="365" y="310" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--warn-text)">Safe but pauses all</text>

  <rect x="650" y="80" width="290" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="795" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Cooperative</text>
  <text x="670" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Two-phase revoke</text>
  <text x="670" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Keep stable assignments</text>
  <text x="670" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Only move what changes</text>
  <text x="670" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Default in modern clients</text>
  <text x="670" y="310" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">Smaller pause windows</text>

  <rect x="955" y="80" width="285" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1097" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Tuning Knobs</text>
  <text x="975" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">session.timeout.ms</text>
  <text x="975" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">heartbeat.interval.ms</text>
  <text x="975" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">max.poll.interval.ms</text>
  <text x="975" y="250" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">group.instance.id</text>
  <text x="975" y="310" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--primary-text)">Static membership helps</text>
</svg>

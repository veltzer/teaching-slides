<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.378891504872" font-weight="bold" fill="var(--text)">Consumer Groups: Partition Assignment</text>

  <rect x="40" y="87.889908256881" width="517.241379310345" height="255.412844036697" rx="10.49246125174" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="298.620689655172" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--primary-text)">Topic: orders (4 partitions)</text>
  <rect x="60.689655172414" y="151.743119266055" width="103.448275862069" height="63.853211009174" rx="6.295476751044" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="112.413793103448" y="188.990825688073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--ok-text)">P0</text>
  <rect x="184.827586206897" y="151.743119266055" width="103.448275862069" height="63.853211009174" rx="6.295476751044" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="236.551724137931" y="188.990825688073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--ok-text)">P1</text>
  <rect x="308.965517241379" y="151.743119266055" width="103.448275862069" height="63.853211009174" rx="6.295476751044" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="360.689655172414" y="188.990825688073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--warn-text)">P2</text>
  <rect x="433.103448275862" y="151.743119266055" width="103.448275862069" height="63.853211009174" rx="6.295476751044" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="484.827586206897" y="188.990825688073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--warn-text)">P3</text>

  <path d="M 112.413793103448 226.238532110092 L 112.413793103448 279.449541284404" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 236.551724137931 226.238532110092 L 236.551724137931 279.449541284404" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 360.689655172414 226.238532110092 L 360.689655172414 279.449541284404" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 484.827586206897 226.238532110092 L 484.827586206897 279.449541284404" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="290.091743119266" width="248.275862068966" height="53.211009174312" rx="6.295476751044" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="164.137931034483" y="322.018348623853" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--ok-text)">Consumer A (P0,P1)</text>

  <rect x="308.965517241379" y="290.091743119266" width="248.275862068966" height="53.211009174312" rx="6.295476751044" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="433.103448275862" y="322.018348623853" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--warn-text)">Consumer B (P2,P3)</text>

  <text x="298.620689655172" y="369.908256880734" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" font-style="italic" fill="var(--text-muted)">Group "order-processors" -- 2 consumers split 4 partitions</text>

  <rect x="598.620689655172" y="87.889908256881" width="289.655172413793" height="255.412844036697" rx="10.49246125174" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="743.448275862069" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--info-text)">Rules</text>
  <text x="619.310344827586" y="162.385321100917" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">- One partition -&gt; 1 consumer</text>
  <text x="619.310344827586" y="188.990825688073" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">  in same group</text>
  <text x="619.310344827586" y="220.917431192661" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">- Multiple groups read same</text>
  <text x="619.310344827586" y="242.201834862385" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">  topic independently</text>
  <text x="619.310344827586" y="284.770642201835" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">- Add consumer = rebalance</text>
  <text x="619.310344827586" y="316.697247706422" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">- More consumers than</text>
  <text x="619.310344827586" y="337.981651376147" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">  partitions = idle ones</text>

  <rect x="908.965517241379" y="87.889908256881" width="331.034482758621" height="255.412844036697" rx="10.49246125174" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1074.48275862069" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--warn-text)">Offset commit</text>
  <text x="929.655172413793" y="162.385321100917" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">Auto: enable.auto.commit=true</text>
  <text x="929.655172413793" y="188.990825688073" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">  (risk: at-most-once)</text>
  <text x="929.655172413793" y="226.238532110092" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">Manual: commitSync after</text>
  <text x="929.655172413793" y="247.522935779817" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">  processing succeeds</text>
  <text x="929.655172413793" y="279.449541284404" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">  (at-least-once)</text>
  <text x="929.655172413793" y="322.018348623853" font-family="Arial, sans-serif" font-size="13.640199627262" font-style="italic" fill="var(--warn-text)">Idempotent processing wins</text>

  <rect x="40" y="385.871559633028" width="1200" height="234.128440366972" rx="10.49246125174" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="423.119266055046" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--text)">Rebalance triggers</text>
  <text x="60.689655172414" y="455" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">- Consumer joins / leaves</text>
  <text x="60.689655172414" y="485" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">- Partition count grows</text>
  <text x="60.689655172414" y="515" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">- Heartbeat timeout</text>
  <text x="60.689655172414" y="560" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--text)">Cooperative rebalance helps</text>
</svg>

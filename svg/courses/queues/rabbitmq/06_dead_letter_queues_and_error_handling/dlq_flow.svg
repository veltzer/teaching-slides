<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.854226236055" font-weight="bold" fill="var(--text)">Dead Letter Queue Flow</text>

  <rect x="40" y="106.725663716814" width="206.896551724138" height="82.12389380531" rx="8.244064638873" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448275862069" y="142.654867256637" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--info-text)">Producer</text>
  <text x="143.448275862069" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--info-text)">publishes</text>

  <path d="M 248.965517241379 147.787610619469 L 311.034482758621 147.787610619469" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="319.310344827586" y="106.725663716814" width="227.586206896552" height="82.12389380531" rx="8.244064638873" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="433.103448275862" y="142.654867256637" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--ok-text)">orders queue</text>
  <text x="433.103448275862" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--ok-text)">x-dead-letter-exchange</text>

  <path d="M 548.965517241379 147.787610619469 L 611.034482758621 147.787610619469" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="619.310344827586" y="106.725663716814" width="227.586206896552" height="82.12389380531" rx="8.244064638873" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="733.103448275862" y="142.654867256637" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--info-text)">Consumer</text>
  <text x="733.103448275862" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--info-text)">processes</text>

  <path d="M 733.103448275862 209.380530973451 L 733.103448275862 270.973451327434" stroke="var(--danger-border)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="748.620689655172" y="255.575221238938" font-family="Arial, sans-serif" font-size="13.396605038168" font-weight="bold" fill="var(--danger-fill)">nack / reject / TTL / max-length</text>

  <rect x="619.310344827586" y="291.504424778761" width="227.586206896552" height="82.12389380531" rx="8.244064638873" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="733.103448275862" y="327.433628318584" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--warn-text)">DLX (exchange)</text>

  <path d="M 733.103448275862 375.681415929204 L 733.103448275862 414.690265486726" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="619.310344827586" y="424.955752212389" width="227.586206896552" height="82.12389380531" rx="8.244064638873" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="733.103448275862" y="460.884955752212" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--danger-text)">orders.dlq</text>
  <text x="733.103448275862" y="486.548672566372" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--danger-text)">parked here</text>

  <path d="M 848.965517241379 466.017699115044 L 911.034482758621 466.017699115044" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="919.310344827586" y="424.955752212389" width="279.310344827586" height="82.12389380531" rx="8.244064638873" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1058.965517241379" y="460.884955752212" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--primary-text)">Triage / replay tool</text>
  <text x="1058.965517241379" y="486.548672566372" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--primary-text)">manual or scheduled</text>

  <rect x="40" y="537.87610619469" width="1200" height="82.12389380531" rx="8.244064638873" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="568.672566371681" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.457621197886" font-weight="bold" fill="var(--text)">Triggers: rejected, expired, queue full</text>
  <text x="640" y="594.336283185841" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--text-muted)">Headers preserve original reason. Avoid silent loss.</text>
</svg>

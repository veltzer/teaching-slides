<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs/>

  <text x="640" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Publish/Subscribe Pattern</text>

  <rect x="60" y="120" width="200" height="100" rx="8" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Publisher</text>
  <text x="160" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-text)">order_placed event</text>

  <path d="M 262 170 L 392 170" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="400" y="120" width="240" height="100" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Fanout exchange</text>
  <text x="520" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">routing key ignored</text>

  <path d="M 642 145 L 752 100" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 642 170 L 752 170" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 642 195 L 752 240" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 642 220 L 752 320" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="760" y="60" width="220" height="80" rx="8" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">queue.email</text>
  <text x="870" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">send confirmation</text>

  <rect x="760" y="140" width="220" height="80" rx="8" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">queue.warehouse</text>
  <text x="870" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">pick &amp; pack</text>

  <rect x="760" y="220" width="220" height="80" rx="8" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">queue.analytics</text>
  <text x="870" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">track funnel</text>

  <rect x="760" y="300" width="220" height="80" rx="8" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">queue.inventory</text>
  <text x="870" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">decrement stock</text>

  <rect x="60" y="440" width="1160" height="180" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Why pub/sub</text>
  <text x="80" y="510" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Publisher doesn't know who's listening (loose coupling)</text>
  <text x="80" y="540" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Add a new consumer = bind a queue, no publisher change</text>
  <text x="80" y="570" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Each queue is independent: consumer crashing doesn't affect others</text>
  <text x="80" y="600" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--text-muted)">Use topic exchange when consumers want subsets of events</text>
</svg>

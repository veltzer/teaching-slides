<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.378891504872" font-weight="bold" fill="var(--text)">Four Levels of Analytics</text>

  <rect x="40" y="87.889908256881" width="289.655172413793" height="255.412844036697" rx="10.49246125174" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586206897" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--info-text)">Descriptive</text>
  <text x="184.827586206897" y="162.385321100917" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--info-text)">What happened?</text>
  <text x="60.689655172414" y="204.954128440367" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">- Dashboards</text>
  <text x="60.689655172414" y="231.559633027523" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">- Reports</text>
  <text x="60.689655172414" y="258.165137614679" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">- KPIs over time</text>
  <text x="60.689655172414" y="295.412844036697" font-family="Arial, sans-serif" font-size="12.590953502088" font-style="italic" fill="var(--info-text)">"Sales fell 12% in Q3"</text>

  <rect x="350.344827586207" y="87.889908256881" width="289.655172413793" height="255.412844036697" rx="10.49246125174" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495.172413793103" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--primary-text)">Diagnostic</text>
  <text x="495.172413793103" y="162.385321100917" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--primary-text)">Why did it happen?</text>
  <text x="371.034482758621" y="204.954128440367" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">- Drill-downs</text>
  <text x="371.034482758621" y="231.559633027523" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">- Cohort analysis</text>
  <text x="371.034482758621" y="258.165137614679" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">- Root cause</text>
  <text x="371.034482758621" y="295.412844036697" font-family="Arial, sans-serif" font-size="12.590953502088" font-style="italic" fill="var(--primary-text)">"Mobile checkout broke"</text>

  <rect x="660.689655172414" y="87.889908256881" width="289.655172413793" height="255.412844036697" rx="10.49246125174" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805.51724137931" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--warn-text)">Predictive</text>
  <text x="805.51724137931" y="162.385321100917" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--warn-text)">What will happen?</text>
  <text x="681.379310344828" y="204.954128440367" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- Forecasts</text>
  <text x="681.379310344828" y="231.559633027523" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- Churn models</text>
  <text x="681.379310344828" y="258.165137614679" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- Demand prediction</text>
  <text x="681.379310344828" y="295.412844036697" font-family="Arial, sans-serif" font-size="12.590953502088" font-style="italic" fill="var(--warn-text)">"30% churn this user group"</text>

  <rect x="971.034482758621" y="87.889908256881" width="268.965517241379" height="255.412844036697" rx="10.49246125174" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.51724137931" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--ok-text)">Prescriptive</text>
  <text x="1105.51724137931" y="162.385321100917" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--ok-text)">What to do?</text>
  <text x="991.724137931035" y="204.954128440367" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Recommendations</text>
  <text x="991.724137931035" y="231.559633027523" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Optimization</text>
  <text x="991.724137931035" y="258.165137614679" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Actions</text>
  <text x="991.724137931035" y="295.412844036697" font-family="Arial, sans-serif" font-size="12.590953502088" font-style="italic" fill="var(--ok-text)">"Offer 10% to retain"</text>

  <rect x="40" y="407.155963302752" width="1200" height="212.844036697248" rx="10.49246125174" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="444.403669724771" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.787938002784" font-weight="bold" fill="var(--text)">Up the ladder = more value, more difficulty</text>
  <text x="640" y="481.651376146789" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text-muted)">Most orgs live at descriptive. Get good there before climbing.</text>
  <text x="640" y="513.577981651376" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text-muted)">Each level needs the level below as foundation.</text>
  <text x="640" y="556.146788990826" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text-muted)">Ask: which question are we answering with this dashboard?</text>
  <text x="640" y="593.394495412844" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" font-style="italic" fill="var(--text-muted)">Don't build a model to answer a question that needs a query.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/></marker>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AARRR (Pirate Metrics): a funnel for product growth</text>

  <rect x="40" y="100" width="220" height="440" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="150" y="150" text-anchor="middle" font-size="48" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">A</text>
  <text x="150" y="200" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Acquisition</text>
  <text x="150" y="380" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">visitors arrive</text>
  <text x="150" y="410" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">channels</text>

  <rect x="290" y="120" width="200" height="400" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="390" y="170" text-anchor="middle" font-size="40" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">A</text>
  <text x="390" y="210" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Activation</text>
  <text x="390" y="380" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">first value</text>

  <rect x="520" y="140" width="180" height="360" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="610" y="190" text-anchor="middle" font-size="36" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">R</text>
  <text x="610" y="225" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Retention</text>
  <text x="610" y="370" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">return</text>

  <rect x="730" y="160" width="160" height="320" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="810" y="210" text-anchor="middle" font-size="32" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">R</text>
  <text x="810" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Referral</text>
  <text x="810" y="360" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">tell others</text>

  <rect x="920" y="180" width="320" height="280" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1080" y="230" text-anchor="middle" font-size="32" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">R</text>
  <text x="1080" y="265" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Revenue</text>
  <text x="1080" y="350" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">they pay</text>

  <text x="40" y="600" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">funnel narrows: 1000 visitors &#8594; 200 activate &#8594; 50 retain &#8594; 10 refer &#8594; 5 pay</text>
  <text x="40" y="620" font-size="13" fill="var(--text-faint)" font-family="Arial, sans-serif">improving the worst conversion ratio gives the biggest gain</text>
</svg>

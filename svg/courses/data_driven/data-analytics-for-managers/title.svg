<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>

  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Data Analytics for Managers</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Turning data into decisions</text>

  <!-- Stylised bar chart -->
  <rect x="320" y="420" width="60" height="100" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="400" y="380" width="60" height="140" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="480" y="320" width="60" height="200" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="560" y="280" width="60" height="240" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="640" y="340" width="60" height="180" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="720" y="260" width="60" height="260" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="800" y="220" width="60" height="300" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="880" y="180" width="60" height="340" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>

  <line x1="280" y1="520" x2="980" y2="520" stroke="var(--surface)" stroke-width="2"/>
  <line x1="280" y1="180" x2="280" y2="520" stroke="var(--surface)" stroke-width="2"/>

  <text x="640" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">value &#8226; collection &#8226; frameworks &#8226; BI &#8226; tools &#8226; AI &#8226; big data</text>
</svg>

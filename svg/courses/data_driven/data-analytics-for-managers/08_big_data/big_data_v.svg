<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs/>

  <text x="640" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">The "V"s of Big Data</text>

  <rect x="60" y="100" width="370" height="240" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="245" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Volume</text>
  <text x="80" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">A lot of data</text>
  <text x="80" y="200" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Terabytes to exabytes</text>
  <text x="80" y="225" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Beyond one machine</text>
  <text x="80" y="265" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Distributed storage</text>
  <text x="80" y="290" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--primary-text)">Hadoop, S3, GCS</text>

  <rect x="455" y="100" width="370" height="240" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Velocity</text>
  <text x="475" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-text)">Fast incoming</text>
  <text x="475" y="200" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Streams, IoT</text>
  <text x="475" y="225" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Real-time processing</text>
  <text x="475" y="265" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Sub-second decisions</text>
  <text x="475" y="290" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--warn-text)">Kafka, Flink, Spark Streaming</text>

  <rect x="850" y="100" width="370" height="240" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Variety</text>
  <text x="870" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Many shapes</text>
  <text x="870" y="200" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Structured (rows)</text>
  <text x="870" y="225" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Semi (JSON, logs)</text>
  <text x="870" y="265" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Unstructured (text, images)</text>
  <text x="870" y="290" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">Lake stores all</text>

  <rect x="60" y="380" width="560" height="220" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Veracity (and now Value)</text>
  <text x="80" y="450" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Quality matters: dirty data = bad</text>
  <text x="80" y="475" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">decisions at scale</text>
  <text x="80" y="510" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Value: don't store data without a use</text>
  <text x="80" y="540" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">Data swamps are real</text>

  <rect x="660" y="380" width="560" height="220" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="940" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">When you don't need it</text>
  <text x="680" y="450" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Most companies' data fits in Postgres</text>
  <text x="680" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Big data tools have big complexity</text>
  <text x="680" y="510" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Use only when needed</text>
  <text x="680" y="540" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--text-muted)">"Big data" is often medium data</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Where AI Pays Off</text>
  <rect x="40" y="80" width="600" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Good fit</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">High volume of similar decisions</text>
  <text x="60" y="195" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Clear feedback signal</text>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Tolerance for some errors</text>
  <text x="60" y="265" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Plenty of training data</text>
  <text x="60" y="310" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Examples:</text>
  <text x="60" y="345" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Recommendation engines</text>
  <text x="60" y="375" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Fraud scoring</text>
  <text x="60" y="405" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Demand forecasting</text>
  <text x="60" y="435" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Image and text classification</text>
  <text x="60" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Search ranking</text>
  <text x="60" y="525" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--ok-text)">Many decisions, repeated daily</text>
  <rect x="660" y="80" width="580" height="540" rx="10" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Bad fit</text>
  <text x="680" y="160" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">One-off, high-stakes decisions</text>
  <text x="680" y="195" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Tiny dataset, no labels</text>
  <text x="680" y="230" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Errors are catastrophic</text>
  <text x="680" y="265" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">Regulator demands explanation</text>
  <text x="680" y="310" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Examples:</text>
  <text x="680" y="345" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Hiring decisions</text>
  <text x="680" y="375" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Strategic pivots</text>
  <text x="680" y="405" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Mergers and acquisitions</text>
  <text x="680" y="435" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Tiny customer base</text>
  <text x="680" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Black-box where audit needed</text>
  <text x="680" y="525" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--danger-text)">Few decisions, irreversible</text>
</svg>

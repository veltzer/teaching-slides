<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Player presses Fire → Bullet spawns → Bullet hits Enemy → Enemy dies</text>

  <rect x="40" y="120" width="240" height="160" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="160" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Player</text>
  <text x="160" y="210" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">PlayerController.cs</text>
  <text x="160" y="240" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Courier New, monospace">if (Input.GetKey..)</text>

  <rect x="360" y="120" width="240" height="160" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="480" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Turret script</text>
  <text x="480" y="210" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Courier New, monospace">Instantiate(</text>
  <text x="480" y="230" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Courier New, monospace">  bulletPrefab,</text>
  <text x="480" y="250" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Courier New, monospace">  muzzle.pos, rot)</text>

  <rect x="680" y="120" width="240" height="160" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="800" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Bullet (instance)</text>
  <text x="800" y="210" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">Rigidbody + Collider</text>
  <text x="800" y="240" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Courier New, monospace">rb.velocity = ...</text>

  <rect x="1000" y="120" width="240" height="160" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6"/>
  <text x="1120" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Enemy</text>
  <text x="1120" y="210" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">Enemy.cs</text>
  <text x="1120" y="240" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Courier New, monospace">OnCollisionEnter</text>

  <line x1="280" y1="200" x2="360" y2="200" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="190" text-anchor="middle" font-size="12" fill="var(--text-muted)" font-family="Arial, sans-serif">SendMessage</text>

  <line x1="600" y1="200" x2="680" y2="200" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="190" text-anchor="middle" font-size="12" fill="var(--text-muted)" font-family="Arial, sans-serif">Instantiate</text>

  <line x1="920" y1="200" x2="1000" y2="200" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="960" y="190" text-anchor="middle" font-size="12" fill="var(--text-muted)" font-family="Arial, sans-serif">collision</text>

  <rect x="40" y="380" width="1200" height="180" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="640" y="420" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">In code (Enemy.cs)</text>
  <text x="60" y="460" font-size="14" fill="var(--text)" font-family="Courier New, monospace">void OnCollisionEnter(Collision c) {</text>
  <text x="60" y="485" font-size="14" fill="var(--text)" font-family="Courier New, monospace">    if (c.gameObject.CompareTag("Bullet")) {</text>
  <text x="60" y="510" font-size="14" fill="var(--text)" font-family="Courier New, monospace">        Destroy(c.gameObject);   // bullet gone</text>
  <text x="60" y="535" font-size="14" fill="var(--text)" font-family="Courier New, monospace">        Destroy(gameObject);     // enemy gone</text>
  <text x="60" y="555" font-size="14" fill="var(--text)" font-family="Courier New, monospace">    }</text>
  <text x="60" y="580" font-size="14" fill="var(--text)" font-family="Courier New, monospace">}</text>

  <text x="640" y="620" text-anchor="middle" font-size="13" fill="var(--text-faint)" font-family="Arial, sans-serif">small script per object → readable, testable, easy to extend</text>
</svg>

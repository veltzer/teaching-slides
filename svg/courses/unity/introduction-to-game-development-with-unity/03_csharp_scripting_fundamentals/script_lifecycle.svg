<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/></marker>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">MonoBehaviour lifecycle (the methods Unity calls for you)</text>

  <rect x="40" y="100" width="240" height="80" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160" y="135" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Awake</text>
  <text x="160" y="160" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">when GameObject loads</text>

  <rect x="40" y="210" width="240" height="80" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160" y="245" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">OnEnable</text>
  <text x="160" y="270" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">when component enabled</text>

  <rect x="40" y="320" width="240" height="80" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160" y="355" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Start</text>
  <text x="160" y="380" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">before first Update</text>

  <rect x="380" y="100" width="240" height="300" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="500" y="145" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Frame loop</text>
  <text x="500" y="195" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">FixedUpdate</text>
  <text x="500" y="220" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">physics step (~50/s)</text>
  <text x="500" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Update</text>
  <text x="500" y="285" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">every frame</text>
  <text x="500" y="325" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">LateUpdate</text>
  <text x="500" y="350" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">after Update (cameras)</text>
  <text x="500" y="385" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">render &#8594; next frame</text>

  <rect x="720" y="100" width="240" height="80" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="840" y="135" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">OnDisable</text>
  <text x="840" y="160" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">when component disabled</text>

  <rect x="720" y="210" width="240" height="80" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="840" y="245" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">OnDestroy</text>
  <text x="840" y="270" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">when GameObject removed</text>

  <rect x="1020" y="100" width="220" height="300" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1130" y="145" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Event hooks</text>
  <text x="1130" y="190" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">OnCollisionEnter</text>
  <text x="1130" y="215" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">OnTriggerEnter</text>
  <text x="1130" y="240" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">OnMouseDown</text>
  <text x="1130" y="265" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">OnApplicationPause</text>
  <text x="1130" y="290" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">OnApplicationQuit</text>
  <text x="1130" y="340" text-anchor="middle" font-size="12" fill="var(--text-faint)" font-family="Arial, sans-serif">called when conditions match</text>

  <line x1="280" y1="140" x2="380" y2="140" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="250" x2="380" y2="250" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="360" x2="380" y2="360" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="140" x2="720" y2="140" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="250" x2="720" y2="250" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="640" y="500" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">Awake/Start fire once. Frame loop runs forever. OnDisable/OnDestroy fire on cleanup.</text>
  <text x="640" y="620" text-anchor="middle" font-size="13" fill="var(--text-faint)" font-family="Arial, sans-serif">don't put expensive logic in Update; cache references in Awake</text>
</svg>

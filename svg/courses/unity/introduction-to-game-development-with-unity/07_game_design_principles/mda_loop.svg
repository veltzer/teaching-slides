<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/></marker>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">MDA: designer thinks left-to-right, player experiences right-to-left</text>

  <rect x="40" y="160" width="320" height="200" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="200" y="220" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Mechanics</text>
  <text x="200" y="260" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">rules, code, numbers</text>
  <text x="200" y="290" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">jump height, damage</text>
  <text x="200" y="320" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">spawn rate, cost</text>

  <rect x="480" y="160" width="320" height="200" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="640" y="220" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Dynamics</text>
  <text x="640" y="260" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">emergent behaviour</text>
  <text x="640" y="290" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">strategies that arise</text>
  <text x="640" y="320" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">player tactics, exploits</text>

  <rect x="920" y="160" width="320" height="200" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1080" y="220" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Aesthetics</text>
  <text x="1080" y="260" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">how it feels</text>
  <text x="1080" y="290" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">tension, triumph</text>
  <text x="1080" y="320" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">discovery, fellowship</text>

  <line x1="360" y1="240" x2="480" y2="240" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="240" x2="920" y2="240" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="240" y="430" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">designer's view</text>
  <text x="640" y="430" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">emerges in playtest</text>
  <text x="1080" y="430" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">player's view</text>

  <line x1="920" y1="500" x2="360" y2="500" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="640" y="490" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">if aesthetics aren't landing, change the mechanics</text>

  <text x="640" y="600" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">tweak knobs on the left until the feeling on the right is what you wanted</text>
  <text x="640" y="620" text-anchor="middle" font-size="13" fill="var(--text-faint)" font-family="Arial, sans-serif">Hunicke, LeBlanc, Zubek (2004) &#8212; original MDA paper</text>
</svg>

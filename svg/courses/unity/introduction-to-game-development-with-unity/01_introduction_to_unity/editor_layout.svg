<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Default Unity editor layout</text>

  <rect x="40" y="80" width="240" height="500" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160" y="130" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Hierarchy</text>
  <text x="160" y="170" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">tree of every</text>
  <text x="160" y="190" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">GameObject in the</text>
  <text x="160" y="210" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">current scene</text>

  <rect x="300" y="80" width="640" height="380" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="620" y="130" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Scene / Game view</text>
  <text x="620" y="170" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">Scene view: 3D editing viewport</text>
  <text x="620" y="200" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">Game view: what the camera sees</text>
  <text x="620" y="230" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">tabs at the top let you switch between them</text>

  <rect x="960" y="80" width="280" height="500" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1100" y="130" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Inspector</text>
  <text x="1100" y="170" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">components of the</text>
  <text x="1100" y="190" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">selected GameObject</text>

  <rect x="300" y="480" width="640" height="100" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="620" y="525" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Project / Console</text>
  <text x="620" y="555" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">project: assets on disk &#8226; console: log output</text>

  <text x="640" y="620" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">all panels are dockable; layout can be saved and loaded</text>
</svg>

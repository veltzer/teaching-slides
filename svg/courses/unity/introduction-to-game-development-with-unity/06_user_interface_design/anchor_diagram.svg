<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">UI anchors decide how an element behaves when the screen resizes</text>

  <!-- Phone-portrait canvas -->
  <rect x="60" y="80" width="240" height="500" fill="var(--surface)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="180" y="105" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">narrow screen</text>
  <rect x="80" y="120" width="80" height="40" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="120" y="145" text-anchor="middle" font-size="12" fill="var(--text)" font-family="Arial, sans-serif">top-left</text>
  <rect x="200" y="120" width="80" height="40" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="240" y="145" text-anchor="middle" font-size="12" fill="var(--text)" font-family="Arial, sans-serif">top-right</text>
  <rect x="80" y="540" width="200" height="30" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="180" y="560" text-anchor="middle" font-size="12" fill="var(--text)" font-family="Arial, sans-serif">stretched bar</text>

  <!-- Wide screen canvas -->
  <rect x="380" y="120" width="500" height="380" fill="var(--surface)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <text x="630" y="145" text-anchor="middle" font-size="16" fill="var(--text-muted)" font-family="Arial, sans-serif">wide screen</text>
  <rect x="400" y="160" width="80" height="40" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="440" y="185" text-anchor="middle" font-size="12" fill="var(--text)" font-family="Arial, sans-serif">top-left</text>
  <rect x="780" y="160" width="80" height="40" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="820" y="185" text-anchor="middle" font-size="12" fill="var(--text)" font-family="Arial, sans-serif">top-right</text>
  <rect x="400" y="460" width="460" height="30" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="630" y="480" text-anchor="middle" font-size="12" fill="var(--text)" font-family="Arial, sans-serif">stretched bar</text>

  <!-- Legend -->
  <rect x="940" y="120" width="300" height="380" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="1090" y="155" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Anchor types</text>

  <rect x="960" y="190" width="40" height="30" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="1010" y="210" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">corner anchor</text>
  <text x="960" y="240" font-size="12" fill="var(--text-muted)" font-family="Arial, sans-serif">stays at corner, fixed size</text>

  <rect x="960" y="280" width="40" height="30" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="1010" y="300" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">other corner</text>
  <text x="960" y="330" font-size="12" fill="var(--text-muted)" font-family="Arial, sans-serif">same idea, different corner</text>

  <rect x="960" y="370" width="40" height="30" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="4" filter="url(#shadow)"/>
  <text x="1010" y="390" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">stretch anchor</text>
  <text x="960" y="420" font-size="12" fill="var(--text-muted)" font-family="Arial, sans-serif">grows with parent</text>

  <text x="640" y="620" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">set anchors right once; the layout adapts to every screen size</text>
</svg>

[processor.make]
exclude_paths = ["Makefile"]

[processor.spellcheck]
use_words_file = true

[processor.jsonlint]
enabled = false

[processor.ascii_check]
enabled = false

[processor.rumdl]
enabled = false

[processor.pandoc]
# how to I make the pandoc processor only scan the marp folder
scan_dir = ["marp"]
formats = ["pdf", "html", "docx"]

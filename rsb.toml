[processor.make]
exclude_paths = ["Makefile"]

[processor.spellcheck]
use_words_file = true

[processor.jsonlint]
enabled = false

[processor.ascii_check]
enabled = false

[processor.rumdl]
enabled = false

[processor.pandoc]
scan_dir = "marp"
from = "markdown-yaml_metadata_block-tex_math_dollars"
formats = ["pdf", "html", "docx"]
args = ["--pdf-engine=xelatex"]
